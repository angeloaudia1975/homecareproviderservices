# HCPS — Netlify config.
#
# IMPORTANT: once a netlify.toml exists, Netlify stops falling back to the dashboard's
# build/publish settings, so those must be declared here. This site is Eleventy: the
# build command runs eleventy and the compiled site lands in _site (which contains the
# passthrough-copied /admin app). Functions live in the default netlify/functions dir.
[build]
  command = "npm run build"
  publish = "_site"

# Netlify's secret scanner fails the build if the VALUE of any configured env var appears
# anywhere in the repo or build output. "Claude outputs/" is a scratch folder of working
# snapshots, and it contains the Supabase project URL — which is public by design (every
# browser request the portal makes carries it), not a credential. That single match blocked
# nine consecutive production deploys, Sep 6 8:14 PM through Sep 8 10:46 AM, while the site
# kept quietly serving the Sep 6 build.
#
# Scoped to the scratch folder ON PURPOSE. Do NOT widen this to SECRETS_SCAN_OMIT_KEYS for
# ANTHROPIC_API_KEY / ADMIN_PASSWORD / SUPABASE_SERVICE_ROLE and friends: those are real
# credentials, none of them was the thing that matched here, and omitting them would leave a
# genuine leak undetected. Scanning stays fully armed for every key, everywhere except this
# one folder — which is never published (publish dir is _site), so nothing in it reaches the
# web regardless.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "Claude outputs/**"

# Keep the internal admin / rep portal out of search engines — it's staff-only, reached via the
# footer "Rep Login" link, not Google. X-Robots-Tag is authoritative: pages carry noindex even if
# something links to them, so they never appear in search results. Access is unchanged (login still
# works); this only controls indexing.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# HCPS Academy: one canonical host. The learner session cookie (__Host-) belongs to exactly one host, so Academy pages
# are only ever served from www.homecareproviderservices.org — the site's PRIMARY domain (Netlify already sends the bare
# domain to www; a rule pointing www back at the bare domain would loop). Only the netlify.app host needs a rule here
# (security review 10 Oct 2026, S2; canonical host corrected at the A2A merge gate after a live check).
[[redirects]]
  from = "https://homecareproviderservices.netlify.app/academy/*"
  to = "https://www.homecareproviderservices.org/academy/:splat"
  status = 301
  force = true

# HCPS Academy (A2A, 10 Oct 2026). No Academy pages exist yet; these headers apply the moment they do. Kept out of
# search until launch is approved; never framed by another site; no referrer leaves the page; a strict content
# security policy (own scripts only, no inline script, connections only back to this site) so a page cannot leak the
# learner's session or be turned against it. Academy pages are built to this policy: no inline <script>.
[[headers]]
  for = "/academy/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; media-src 'self' https://*.supabase.co; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Automation engine scheduled functions. engine-hourly self-gates to weekday ET business
# hours (returns immediately otherwise) and only DELIVERS inside the configured send
# windows. engine-nightly runs once overnight (06:00 UTC ≈ 1–2am ET) to recompute
# engagement/dormant status and expire stale queued emails. All cadences and thresholds
# live in the app_settings 'automation_config' row, editable in the admin panel.
[functions."engine-hourly"]
  schedule = "0 * * * *"

[functions."engine-nightly"]
  schedule = "0 6 * * *"

# Weekly executive summary + per-rep digests, Mondays ~12:00 UTC (7–8am ET). Gated by
# automation_config.reports_enabled (off by default), so nothing sends until you enable it.
[functions."report-weekly"]
  schedule = "0 12 * * 1"

# Outlook email auto-sync — keeps Dealer 360 email current in the background, hourly.
# Pulls only a short recent window each run (idempotent), so it stays cheap. Does nothing
# until the GRAPH_* env vars + GRAPH_MAILBOXES are set.
[functions."email-sync-cron"]
  schedule = "0 * * * *"

# Manufacturer report capture (MI Inbox Automation, Phase B) — hourly at :20. Registers report attachments into
# Manufacturer Report History; does nothing unless phase2_flags.mi_report_capture is exactly true.
[functions."report-capture-cron"]
  schedule = "20 * * * *"

# MI Phase E — automatic import of registered Strongback order exports. Inert unless phase2_flags.mi_auto_import = true.
[functions."report-import-cron"]
  schedule = "40 * * * *"

# MI operations (2026-10-13): dealer intelligence (import + publish, verified matches only) and Angelo's notifications
# (hourly activity when something happened, daily digest ~07:50 CT, monthly reconciliation on the 15th).
[functions."mi-ops-cron"]
  schedule = "50 * * * *"

# Zoho two-way auto-sync — the outbound (portal→Zoho) engine + inbound pipeline-stage pull.
# Every 15 min it pushes ONLY the dealers / contacts / opportunities whose content changed
# since the last run (per-record hashes in app_settings.zoho_push_hashes), so it's cheap and
# never churns unchanged records. Ownership-safe: pushes profile/pipeline fields, pulls Zoho
# Deal stages back; never touches Zoho-owned engagement/score/campaign fields. Does nothing
# until Zoho is connected (app_settings.zoho_auth).
[functions."zoho-autosync"]
  schedule = "*/15 * * * *"

# Dealer Hub appointment reminders — hourly. Emails the dealer (cc the assigned rep) a day-before and
# a same-day reminder for every SCHEDULED service request, each sent once (tracked in
# service_requests.reminders). Self-gates: does nothing until GRAPH_* is set; turn off with
# SCHEDULE_REMINDERS=off.
# Smart Email Learning retention — daily ~22:17 CT: clears the email text of drafts older than 12 months (owner decision
# 2026-10-30). Does nothing until supabase/email_learning_p1_capture.sql is installed. Never sends or changes an email.
[functions."email-learning-purge-cron"]
  schedule = "17 3 * * *"

[functions."schedule-reminders"]
  schedule = "0 * * * *"

# ── Field rep short links ────────────────────────────────────────────────────
# A rep opens their day on a phone, usually from a text message. "/my-routes" is short
# enough to type, reads like what it is, and does not make a field rep navigate an admin
# path to find where they are driving today. 200 rewrites, so the URL a rep bookmarks or
# installs to their home screen stays clean.
[[redirects]]
  from = "/my-routes"
  to = "/admin/scheduled-routes.html"
  status = 200

[[redirects]]
  from = "/routes"
  to = "/admin/scheduled-routes.html"
  status = 200

# The rep portal home, same reasoning.
[[redirects]]
  from = "/rep"
  to = "/admin/rep-home.html"
  status = 200
