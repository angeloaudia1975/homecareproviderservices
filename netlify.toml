[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin editor: never cache the app shell, and keep it out of search engines.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Let /admin resolve to the app without a trailing slash.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Medge was replaced by ABM Respiratory Care — keep the old URL working.
[[redirects]]
  from = "/manufacturers/medge/*"
  to = "/manufacturers/abm-respiratory-care/"
  status = 301
