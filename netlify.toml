# HCPS — Netlify config. Build/publish come from the site's dashboard settings; this
# file only registers the automation engine's scheduled functions.
#
# engine-hourly runs every hour and self-gates to weekday ET business hours (it returns
# immediately otherwise), so it decides tasks/emails hourly and only DELIVERS inside the
# configured send windows. engine-nightly runs once overnight (06:00 UTC ≈ 1–2am ET) to
# recompute engagement/dormant status and expire stale queued emails. All cadences and
# thresholds live in the app_settings 'automation_config' row, editable in the admin panel.

[functions."engine-hourly"]
  schedule = "0 * * * *"

[functions."engine-nightly"]
  schedule = "0 6 * * *"
