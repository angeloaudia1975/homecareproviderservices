<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS Admin — Sales Call Workspace</title>
<link rel="stylesheet" href="/admin/admin-shell.css">
<style>
 /* ---- worklist ---- */
 .why{display:flex;flex-wrap:wrap;gap:4px}
 .rz{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;border:1px solid transparent}
 .rz.cart{background:#e7f6ec;color:#1f7a44;border-color:#bfe3ca}
 .rz.login{background:#eaf3fb;color:#12466e;border-color:#cfe2fb}
 .rz.intent{background:#e7f6ec;color:#1f7a44;border-color:#bfe3ca}
 .rz.overdue{background:#fdeee0;color:#b45309;border-color:#f6d5ad}
 .rz.dormant{background:#f3eef9;color:#5b3fa0;border-color:#e0d5f5}
 .rz.risk{background:#fdecec;color:#b42323;border-color:#f3c9c9}
 .rz.declining{background:#fdecec;color:#b42323;border-color:#f3c9c9}
 .rz.new{background:#fff7e6;color:#8a6d0f;border-color:#f0dca8}
 .filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
 .seg{display:inline-flex;background:#e3e9f0;border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
 .seg button{background:none;border:0;border-radius:7px;padding:7px 12px;font-weight:700;font-size:12.5px;color:#41576b;cursor:pointer;font-family:inherit}
 .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(16,38,63,.12)}
 .drow{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:9px;overflow:hidden}
 .drow.on{border-color:#9dc8ee;box-shadow:0 6px 20px rgba(22,129,194,.13)}
 .dhead{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer}
 .dhead:hover{background:#f6fafd}
 .dnm{font-size:15px;font-weight:700;color:var(--navy)}
 /* The dealer name opens Dealer 360 in a NEW tab on purpose: the row underneath it may hold
    a half-typed call note, a chosen outcome and an edited script, none of which are saved
    until the rep logs the call. Navigating away in place would throw that work out. */
 .dnm .d360{color:inherit;text-decoration:none}
 .dnm .d360:hover{color:var(--blue);text-decoration:underline}
 .dnm .ext{font-size:11px;color:var(--gray);margin-left:5px;vertical-align:1px}
 .dnm .d360:hover .ext{color:var(--blue)}
 .dsub{font-size:11.5px;color:var(--gray);margin-top:1px}
 .dmid{flex:1;min-width:0}
 .dnum{text-align:right;font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap}
 .dnum small{display:block;font-weight:600;color:var(--gray);font-size:11px}
 .called{font-size:11px;font-weight:700;color:#1f7a44;background:#e7f6ec;border:1px solid #bfe3ca;border-radius:20px;padding:2px 9px;white-space:nowrap}
 @media(max-width:700px){.dhead{flex-wrap:wrap}.dnum{text-align:left}}
 /* ---- brief ---- */
 .brief{border-top:1px solid var(--line);background:#fbfcfd;padding:14px 16px 16px}
 .bsec{margin:0 0 15px}
 .bh{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gray);font-weight:800;margin:0 0 5px;display:flex;align-items:center;gap:7px}
 .bh .n{width:17px;height:17px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:0;flex:none}
 .btext{font-size:14.5px;line-height:1.6;color:var(--ink)}
 .opp{border:1px solid #cfe2fb;background:#f4f9ff;border-radius:11px;padding:12px 14px}
 .opp .hl{font-size:16px;font-weight:800;color:var(--navy);line-height:1.35}
 .angle{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:var(--navy);color:#fff;border-radius:6px;padding:2px 8px;margin-bottom:6px}
 .say{border:1px solid var(--line);border-radius:11px;background:#fff;padding:12px 14px;font-size:14.5px;line-height:1.65;white-space:pre-wrap}
 .scriptbox{width:100%;font:inherit;font-size:14.5px;line-height:1.65;border:1px solid var(--line);border-radius:11px;padding:12px 14px;min-height:190px;resize:vertical;background:#fff}
 .qs{margin:0;padding:0;list-style:none}
 .qs li{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.55;padding:6px 0;border-bottom:1px solid #eef2f6}
 .qs li:last-child{border-bottom:0}
 .qs input{width:17px;height:17px;margin:2px 0 0;flex:none}
 .recs{display:flex;flex-wrap:wrap;gap:8px}
 .rec{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;min-width:180px;flex:1}
 .rec b{font-size:13.5px;color:var(--navy)}
 .rec div{font-size:12.5px;color:#41576b;margin-top:2px;line-height:1.45}
 .obj{border-left:3px solid var(--orange);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px}
 .obj .o{font-size:13.5px;font-weight:700;color:#b45309}
 .obj .a{font-size:13.5px;color:var(--ink);margin-top:3px;line-height:1.55}
 .nextstep{border:1px solid #bfe3ca;background:#f2fbf5;border-radius:11px;padding:11px 14px;font-size:14px;color:#1f5f38}
 .cpy{background:#eef2f6;border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:11px;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit;margin-left:auto;letter-spacing:0;text-transform:none}
 .cpy:hover{background:#e3e9f0}
 /* ---- evidence ---- */
 .ev{border:1px solid var(--line);border-radius:11px;background:#fff;margin:0 0 15px}
 .ev summary{cursor:pointer;padding:9px 13px;font-size:12px;font-weight:700;color:var(--navy);list-style:none}
 .ev summary::-webkit-details-marker{display:none}
 .ev summary:hover{background:#f6fafd}
 .evb{padding:2px 13px 12px;border-top:1px solid var(--line)}
 .evg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
 .evc h4{margin:9px 0 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
 .evc div{font-size:12.5px;color:var(--ink);line-height:1.5}
 .evc .mut{color:var(--gray)}
 /* ---- outcome ---- */
 .oc{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 15px;margin-top:4px}
 .ocb{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 11px}
 .ocb button{border:1px solid var(--line);background:#f7fafd;border-radius:9px;padding:8px 13px;font-weight:700;font-size:13px;color:#41576b;cursor:pointer;font-family:inherit}
 .ocb button:hover{background:#eef3f8}
 .ocb button.on{background:var(--navy);border-color:var(--navy);color:#fff}
 .ocb button.win.on{background:#1f7a44;border-color:#1f7a44}
 .ocb button.no.on{background:#b42323;border-color:#b42323}
 .ocf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
 @media(max-width:700px){.ocf{grid-template-columns:1fr}}
 .fu{border:1px solid #bfe3ca;background:#f2fbf5;border-radius:12px;padding:13px 15px;margin-top:11px}
 .fu h3{margin:0 0 8px;font-size:13px;color:#1f5f38}
 /* ---- insights ---- */
 .ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px}
 .inscard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 15px}
 .inscard h3{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
 .bar{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px}
 .bar .k{flex:1;min-width:0;color:var(--navy);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .bar .n{color:var(--gray);font-size:12px;white-space:nowrap}
 .bar .v{font-weight:800;color:var(--navy);width:44px;text-align:right}
 .bar .v.pending{font-weight:600;color:var(--gray);font-size:11.5px;width:auto}
 .track{height:6px;border-radius:4px;background:#eef2f6;width:90px;overflow:hidden;flex:none}
 .track i{display:block;height:100%;background:var(--blue)}
 .notyet{border:1px dashed var(--line);border-radius:11px;background:#fafbfc;padding:14px;font-size:13.5px;color:#41576b;line-height:1.6;margin-top:12px}
 .spin{display:inline-block;width:13px;height:13px;border:2px solid #cfe2fb;border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
 @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head><body>
<header id="ac-head"></header>
<div class="wrap">
  <div class="top">
    <div><h1>Sales Call Workspace</h1>
      <div class="sub" id="sub">Why am I calling → what do I talk about → what do I ask → what do I do next.</div></div>
    <div class="seg" id="views"></div>
  </div>
  <div id="body"><div class="msg">Loading…</div></div>
</div>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
window.addEventListener("hcps-token",function(e){try{TOKEN=e.detail;}catch(_){}});
let ME=null; try{ME=HCPS.profile()}catch(e){ME=null;}
let TOKEN=HCPS.token(), LIST=[], REPS=[], SCOPE="own";
let FTYPE="all", FREP="all", Q="", VIEW="work";
let OPEN=null;                 // dealer id whose strategy is expanded
const BRIEFS={};               // dealer id -> {state, brief, dossier, brief_id}
const DRAFT={};                // dealer id -> what the rep has typed but not yet logged
const RESULT={};               // dealer id -> the follow-up bundle after logging

const TYPE_LABEL={cart:"🛒 Cart",login:"👤 Login",intent:"🎯 Intent",overdue:"⏰ Overdue",
                  risk:"⚠ At risk",dormant:"💤 Dormant",declining:"▼ Declining",new:"✨ New"};
const OUTCOMES=[
  ["interested","Interested","win"],["quote_requested","Quote requested","win"],
  ["appointment","Appointment set","win"],["send_info","Send information","win"],
  ["follow_up","Follow up",""],["call_later","Call later",""],
  ["no_answer","No answer",""],["not_interested","Not interested","no"],
];

function gate(msg){$("#body").innerHTML=`<div class="gate"><h2>Staff sign-in</h2><p class="hint" style="margin:2px 0 10px">Sign in with your work email and password.</p><input id="lemail" type="email" placeholder="Email" autocomplete="username"><input id="lpass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitTok()"><button class="go" onclick="submitTok()">Sign in</button> <a href="reset.html" style="margin-left:6px;color:#10263f;font-weight:600;font-size:13px">Forgot password?</a><div class="er" id="lerr" style="color:#b42323;margin-top:8px">${msg||""}</div></div>`;setTimeout(()=>{const t=$("#lemail");if(t)t.focus();},50);}
async function submitTok(){
  const email=(($("#lemail")||{}).value||"").trim(), password=(($("#lpass")||{}).value||"");
  const e=$("#lerr"); if(e)e.textContent="Signing in…";
  try{ const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email,password})});
    const j=await r.json().catch(()=>({})); if(!j||!j.ok){ gate((j&&j.message)||"Could not sign in."); return; }
    HCPS.setSession(j); TOKEN=j.token; ME=j.profile; load();
  }catch(err){ gate("Could not reach the server. Try again."); }
}
function lock(){ HCPS.signOut(); TOKEN=null; ME=null; location.reload(); }
function showErr(m){$("#body").innerHTML=`<div class="msg err"><b>Couldn't load.</b><br>${esc(m)}<br><br><button class="go" onclick="load()">Retry</button></div>`;}

async function api(payload){
  const r=await fetch("/.netlify/functions/call-brief-api",{method:"POST",
    headers:{"content-type":"application/json",authorization:"Bearer "+TOKEN},body:JSON.stringify(payload)});
  return {status:r.status, body:await r.json().catch(()=>({}))};
}
function setupMsg(b){
  return `<div class="msg err"><b>One migration to run.</b><br>Run <b>${esc((b&&b.setup)||"supabase/call_workspace.sql")}</b> in Supabase, then reload.
    <div class="hint" style="margin-top:8px">${esc((b&&b.detail)||"")}</div></div>`;
}

async function load(){
  if(!TOKEN){ gate(); return; }
  $("#body").innerHTML=`<div class="msg"><span class="spin"></span>Building the call list…</div>`;
  const r=await api({action:"worklist"});
  if(r.status===401){ gate("Your session ended — sign in again."); return; }
  if(r.status===503){ $("#body").innerHTML=setupMsg(r.body); return; }
  if(!r.body||!r.body.ok){ showErr((r.body&&r.body.error)||("HTTP "+r.status)); return; }
  LIST=r.body.dealers||[]; SCOPE=r.body.scope||"own";
  REPS=[...new Set(LIST.map(x=>x.rep).filter(Boolean))].sort();
  $("#sub").textContent = SCOPE==="all"
    ? "Why am I calling → what do I talk about → what do I ask → what do I do next. Every dealer, all manufacturer lines."
    : "Why am I calling → what do I talk about → what do I ask → what do I do next. Your accounts.";
  renderViews(); render();
}
function renderViews(){
  $("#views").innerHTML=["work","insights"].map(v=>
    `<button class="${VIEW===v?'on':''}" onclick="setView('${v}')">${v==="work"?"Call list":"What's working"}</button>`).join("");
}
function setView(v){ VIEW=v; renderViews(); if(v==="insights") loadInsights(); else render(); }

/* ---------- the worklist ---------- */
function render(){
  if(VIEW!=="work") return;
  const q=Q.trim().toLowerCase();
  const rows=LIST.filter(x=>
    (FTYPE==="all"||x.types.indexOf(FTYPE)>=0) &&
    (FREP==="all"||x.rep===FREP) &&
    (!q || x.dealer.toLowerCase().includes(q) || String(x.city||"").toLowerCase().includes(q)));
  const c={}; for(const x of LIST) for(const t of x.types) c[t]=(c[t]||0)+1;
  const calledWeek=LIST.filter(x=>x.last_call && x.last_call.days_ago<=7).length;
  const kpi=(l,v,cls)=>`<div class="kpi"><div class="l">${l}</div><div class="v ${cls||''}">${v}</div></div>`;
  const kpis=`<div class="kpis">
    ${kpi("To work",LIST.length,"blue")}
    ${kpi("Buying intent",(c.cart||0)+(c.login||0)+(c.intent||0),"")}
    ${kpi("Overdue reorder",c.overdue||0,"orange")}
    ${kpi("At risk / declining",(c.risk||0)+(c.declining||0),"orange")}
    ${kpi("Called this week",calledWeek,"")}
  </div>`;
  const present=Object.keys(TYPE_LABEL).filter(t=>c[t]);
  const seg=(v,l)=>`<button class="${FTYPE===v?'on':''}" onclick="setType('${v}')">${l}</button>`;
  const filt=`<div class="filt">
    <div class="seg">${seg("all","All")}${present.map(t=>seg(t,TYPE_LABEL[t]+" "+c[t])).join("")}</div>
    ${SCOPE==="all"?`<select onchange="setRep(this.value)"><option value="all">All reps</option>${REPS.map(r=>`<option value="${esc(r)}"${FREP===r?" selected":""}>${esc(r)}</option>`).join("")}</select>`:""}
    <input id="q" placeholder="Find a dealer…" value="${esc(Q)}" oninput="setQ(this.value)" style="width:200px">
    <span class="hint" style="margin:0">${rows.length} to work</span>
  </div>`;
  const body = rows.length ? rows.map(rowHtml).join("") : `<div class="msg">Nothing matches this filter. 🎉</div>`;
  $("#body").innerHTML=kpis+filt+body;
  if(OPEN) paintBrief(OPEN);
  const qi=$("#q");
  if(qi && Q && document.activeElement!==qi){ qi.focus(); qi.setSelectionRange(Q.length,Q.length); }
}
function rowHtml(x){
  const open=OPEN===x.id;
  const called=x.last_call?`<span class="called">✓ ${esc(String(x.last_call.outcome).replace(/_/g," "))} · ${x.last_call.days_ago}d ago</span>`:"";
  return `<div class="drow ${open?"on":""}" id="row-${esc(x.id)}">
    <div class="dhead" onclick="toggle('${esc(x.id)}')">
      <div class="dmid">
        <div class="dnm"><a class="d360" href="/admin/dealer.html?id=${encodeURIComponent(x.id)}"
          target="_blank" rel="noopener" title="Open ${esc(x.dealer)} in Dealer 360"
          onclick="event.stopPropagation()">${esc(x.dealer)}<span class="ext">↗</span></a></div>
        <div class="dsub">${esc([x.city,x.state].filter(Boolean).join(", "))}${x.rep?" · "+esc(x.rep):""}${x.last_period?" · last order "+esc(x.last_period):""}</div>
        <div class="why" style="margin-top:6px">${x.reasons.map(r=>`<span class="rz ${esc(r.t)}">${esc(r.label)}</span>`).join("")}</div>
      </div>
      ${called}
      <div class="dnum">${money(x.sales)}<small>lifetime</small></div>
      <div class="dnum" style="width:78px">${open?"Close ▲":"Strategy ▼"}</div>
    </div>
    <div id="brief-${esc(x.id)}"></div>
  </div>`;
}
function setType(t){ FTYPE=t; render(); }
function setRep(r){ FREP=r; render(); }
function setQ(v){ Q=v; render(); }

/* ---------- the call strategy ---------- */
async function toggle(id){
  if(OPEN===id){ OPEN=null; render(); return; }
  OPEN=id; render();
  if(!BRIEFS[id]) await fetchBrief(id,false); else paintBrief(id);
}
async function refresh(id){ await fetchBrief(id,true); }
/* Writing a brief takes 25-30 seconds, which is at or past Netlify's ceiling for a
   synchronous function — the generation finishes and the row is saved, but the HTTP request
   the rep is waiting on gets cut off first. So a request that dies is NOT a failure here:
   we keep polling the cache-only "peek" until the brief lands. peek never generates, so
   polling is free and can't start a second billed run. */
const POLL_EVERY=4000, POLL_FOR=150000;
function setBrief(id, b, extra){
  BRIEFS[id]= b && b.ok!==false && b.brief
    ? {state:"ok", brief:b.brief, dossier:b.dossier, brief_id:b.brief_id,
       cached:b.cached, generated_at:b.generated_at, warning:b.warning}
    : Object.assign({state:"err", message:(b&&(b.message||b.error))||"Couldn't build the strategy.",
                     dossier:b&&b.dossier}, extra||{});
  paintBrief(id);
}
async function fetchBrief(id, force){
  BRIEFS[id]={state:"loading", since:Date.now()}; paintBrief(id);
  let r=null;
  try{ r=await api({action:"brief", dealer_id:id, refresh:!!force}); }
  catch(e){ r=null; }                                  // request cut off — the work may still land
  if(r && r.status===503){ BRIEFS[id]={state:"setup", body:r.body}; paintBrief(id); return; }
  if(r && r.body && r.body.ok && r.body.brief){ setBrief(id, r.body); return; }

  // Either the connection dropped or the server is still writing. Wait for the row.
  const deadline=Date.now()+POLL_FOR;
  while(Date.now()<deadline){
    if(BRIEFS[id] && BRIEFS[id].state!=="loading") return;   // the rep closed it or retried
    await new Promise(s=>setTimeout(s,POLL_EVERY));
    let p=null;
    try{ p=await api({action:"peek", dealer_id:id}); }catch(e){ continue; }
    if(p && p.status===503){ BRIEFS[id]={state:"setup", body:p.body}; paintBrief(id); return; }
    if(p && p.body && p.body.ready){ setBrief(id, p.body); return; }
  }
  // Nothing after two and a half minutes — report what the server last said, if anything.
  setBrief(id, (r&&r.body)||{message:"The strategy is taking longer than expected. Try again — if it was written, it will appear instantly."});
}
function paintBrief(id){
  const el=document.getElementById("brief-"+id); if(!el) return;
  const B=BRIEFS[id];
  if(!B){ el.innerHTML=""; return; }
  if(B.state==="loading"){
    const secs=Math.round((Date.now()-(B.since||Date.now()))/1000);
    el.innerHTML=`<div class="brief"><div class="msg" style="margin:0"><span class="spin"></span>Reading the account and writing the call strategy…
      <div class="hint" style="margin:6px 0 0">This takes about half a minute. ${secs>25?"Still going — it will appear as soon as it's written.":""}</div></div></div>`;
    // keep the elapsed hint honest while we wait
    clearTimeout(B.tick); B.tick=setTimeout(()=>{ if(BRIEFS[id]===B) paintBrief(id); }, 5000);
    return;
  }
  if(B.state==="setup"){ el.innerHTML=`<div class="brief">${setupMsg(B.body)}</div>`; return; }
  if(B.state==="err"){
    el.innerHTML=`<div class="brief"><div class="msg err" style="margin:0 0 12px"><b>No strategy.</b> ${esc(B.message)}
      <div style="margin-top:8px"><button class="go sm" onclick="refresh('${esc(id)}')">Try again</button></div></div>
      ${B.dossier?evidenceHtml(B.dossier):""}</div>`;
    return;
  }
  const b=B.brief, d=B.dossier||{};
  const sec=(n,title,inner,extra)=>`<div class="bsec"><div class="bh"><span class="n">${n}</span>${title}${extra||""}</div>${inner}</div>`;

  el.innerHTML=`<div class="brief">
    <div class="hint" style="margin:-4px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span>${B.cached?"Saved strategy — rebuilt automatically when this account changes.":"Fresh strategy."}${B.generated_at?" Written "+esc(new Date(B.generated_at).toLocaleString())+".":""}</span>
      <button class="cpy" style="margin-left:0" onclick="refresh('${esc(id)}')">↻ Rewrite</button>
      <a class="link" href="/admin/dealer.html?id=${encodeURIComponent(id)}" target="_blank" rel="noopener">Open Dealer 360 ↗</a>
      ${B.warning?`<span style="color:#b45309">${esc(B.warning)}</span>`:""}
    </div>

    ${sec(1,"Reason to call",`<div class="btext">${esc(b.reason)}</div>`)}

    ${sec(2,"Primary sales opportunity",`<div class="opp">
      ${b.opportunity.angle?`<div class="angle">${esc(String(b.opportunity.angle).replace(/_/g," "))}</div>`:""}
      <div class="hl">${esc(b.opportunity.headline)}</div>
      ${b.opportunity.manufacturer?`<div class="hint" style="margin:4px 0 0">${esc(b.opportunity.manufacturer)}</div>`:""}
      ${b.opportunity.detail?`<div class="btext" style="margin-top:7px">${esc(b.opportunity.detail)}</div>`:""}
    </div>`)}

    ${sec(3,"Suggested opening",`<div class="say" id="op-${esc(id)}">${esc(b.opening)}</div>`,
      `<button class="cpy" onclick="copyEl(this,'op-${esc(id)}')">Copy</button>`)}

    ${sec(4,"Phone script",`<textarea class="scriptbox" id="scr-${esc(id)}">${esc(b.script)}</textarea>
      <div class="hint" style="margin:5px 0 0">Edit freely — this is a starting point, not a mandate.</div>`,
      `<button class="cpy" onclick="copyEl(this,'scr-${esc(id)}')">Copy</button>`)}

    ${b.questions.length?sec(5,"Questions to ask",`<ul class="qs">${b.questions.map((q,i)=>
      `<li><input type="checkbox" id="q-${esc(id)}-${i}"><label for="q-${esc(id)}-${i}">${esc(q)}</label></li>`).join("")}</ul>`):""}

    ${b.recommendations.length?sec(6,"Recommended products &amp; manufacturers",`<div class="recs">${b.recommendations.map(r=>
      `<div class="rec"><b>${esc(r.name)}</b><div>${esc(r.why)}</div></div>`).join("")}</div>`):""}

    ${b.objections.length?sec(7,"If they push back",b.objections.map(o=>
      `<div class="obj"><div class="o">“${esc(o.objection)}”</div><div class="a">${esc(o.response)}</div></div>`).join("")):""}

    ${sec(8,"Recommended next step",`<div class="nextstep"><b>${esc(String(b.next_step.action||"").replace(/_/g," "))}</b>${b.next_step.detail?" — "+esc(b.next_step.detail):""}
      <div class="hint" style="margin:3px 0 0;color:#2d7d46">Suggested within ${b.next_step.due_in_days} day${b.next_step.due_in_days===1?"":"s"}.</div></div>`)}

    ${evidenceHtml(d)}
    ${RESULT[id]?followupHtml(id):outcomeHtml(id)}
  </div>`;
}

/* The evidence the strategy was drawn from. A rep who can see WHY trusts it — and can
   catch it when the underlying data is wrong, which matters more than the prose. */
function evidenceHtml(d){
  if(!d||!d.dealer) return "";
  const box=(h,body)=>body?`<div class="evc"><h4>${h}</h4><div>${body}</div></div>`:"";
  const list=(a,f,empty)=>(a&&a.length)?a.map(f).join(""):(empty?`<span class="mut">${empty}</span>`:"");
  return `<details class="ev"><summary>📋 The account facts this was built from — ${(d.lines||[]).length} line(s), ${(d.notes||[]).length} note(s), ${(d.activity||[]).length} touch(es)</summary>
    <div class="evb"><div class="evg">
      ${box("Buying now", list(d.lines,l=>`<div>${esc(l.manufacturer)} — ${money(l.total)}, last ${esc(l.last_period||"?")}${l.cadence_months?`, ~${l.cadence_months}mo cycle`:""}${l.overdue?" <b style='color:#b45309'>overdue</b>":""}</div>`,"No recorded purchases."))}
      ${box("Stopped buying", list(d.lapsed,l=>`<div>${esc(l.manufacturer)} — last ${esc(l.last_period||"?")} (${l.months_since}mo)</div>`,"Nothing lapsed."))}
      ${box("Never bought", (d.available_lines||[]).map(m=>esc(m.name)).join(", ")||`<span class="mut">Buys every line.</span>`)}
      ${box("Set up, never ordered", (d.open_lines||[]).map(m=>esc(m.manufacturer)).join(", ")||`<span class="mut">None — every line set up has been bought.</span>`)}
      ${box("Account numbers on file", (d.accounts||[]).map(a=>`${esc(a.manufacturer)} <span class="mut">#${esc(a.account_ref)}</span>`).join("<br>")||`<span class="mut">No account numbers recorded.</span>`)}
      ${box("Cross-sell engine", list(d.crosssell,c=>`<div>${esc(c.recommend)} <span class="mut">— they buy ${esc(c.because_they_buy)}</span></div>`,"No suggestions yet."))}
      ${box("Nearby dealers buy", list((d.regional||[]).filter(r=>!r.this_dealer_buys).slice(0,4),r=>`<div>${esc(r.manufacturer)} — ${r.peer_dealers} dealer(s), ${money(r.total)}</div>`,"No regional signal."))}
      ${box("Health", [d.health&&d.health.status?`Status ${esc(d.health.status)}`:"",d.health&&d.health.trend?`trend ${esc(d.health.trend)}`:"",d.health&&d.health.score!=null?`score ${d.health.score}`:""].filter(Boolean).join(" · ")||`<span class="mut">Not scored.</span>`)}
      ${box("Intent", (d.intent&&d.intent.score)?`Score ${d.intent.score}${d.intent.top_manufacturer?` · ${esc(d.intent.top_manufacturer)}`:""}${d.intent.top_product?` · viewed ${esc(d.intent.top_product)}`:""}`:`<span class="mut">No recent portal activity.</span>`)}
      ${box("Open cart", d.cart?`${d.cart.items} item(s), ${money(d.cart.value)} — ${esc((d.cart.products||[]).join(", "))}`:`<span class="mut">None.</span>`)}
      ${box("Who to ask for", list(d.contacts,c=>`<div><b>${esc(c.name)}</b>${c.title?` <span class="mut">— ${esc(c.title)}</span>`:""}${c.primary?" <b style='color:#b45309'>main</b>":""}</div>`,"No contacts on file."))}
      ${box("Recent notes", list(d.notes,n=>`<div><b>${esc(n.kind)}</b> ${n.days_ago}d — ${esc(String(n.body).slice(0,180))}</div>`,"No notes."))}
      ${box("Recent touches", list(d.activity,a=>`<div><b>${esc(a.kind)}</b> ${a.days_ago}d — ${esc(a.subject)}</div>`,"Nothing logged."))}
      ${box("Visits", list(d.visits,v=>`<div>${v.days_ago}d ago — ${esc(String(v.summary).slice(0,160))}</div>`,"No visit reports."))}
      ${box("Email", list(d.emails,e=>`<div>${e.direction==="out"?"we wrote":"they wrote"} ${e.days_ago}d — ${esc(e.subject)}</div>`,"No synced email."))}
      ${box("Campaigns sent", list(d.campaigns,c=>`<div>${esc(c.template)} — ${c.days_ago}d ago</div>`,"None."))}
    </div></div></details>`;
}

/* ---------- outcome capture ---------- */
function outcomeHtml(id){
  const D=DRAFT[id]||{};
  return `<div class="oc">
    <div class="bh" style="margin:0"><span class="n">✓</span>After the call</div>
    <div class="ocb">${OUTCOMES.map(([k,l,cls])=>
      `<button class="${cls} ${D.outcome===k?"on":""}" onclick="pick('${esc(id)}','${k}')">${esc(l)}</button>`).join("")}</div>
    <div class="ocf">
      <input id="who-${esc(id)}" placeholder="Who did you speak with?" value="${esc(D.talked_to||"")}">
      <input id="nxt-${esc(id)}" placeholder="Next step (optional — overrides the suggestion)" value="${esc(D.next_step||"")}">
    </div>
    <textarea id="rn-${esc(id)}" rows="3" style="width:100%" placeholder="What did they say? This becomes the CRM note and drives the follow-up.">${esc(D.notes||"")}</textarea>
    <div style="margin-top:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn sm orange" onclick="logCall('${esc(id)}')" ${D.outcome?"":"disabled"}>Log the call &amp; build the follow-up</button>
      <span class="hint" style="margin:0" id="lg-${esc(id)}">${D.outcome?"":"Pick an outcome first."}</span>
    </div></div>`;
}
// Keep whatever the rep has typed when the panel repaints — losing a call's notes is unforgivable.
function stash(id){
  const D=DRAFT[id]||(DRAFT[id]={});
  const g=p=>{const e=document.getElementById(p+"-"+id);return e?e.value:undefined;};
  const w=g("who"), n=g("nxt"), r=g("rn");
  if(w!==undefined) D.talked_to=w; if(n!==undefined) D.next_step=n; if(r!==undefined) D.notes=r;
  return D;
}
function pick(id,k){ const D=stash(id); D.outcome=k; paintBrief(id); }
async function logCall(id){
  const D=stash(id); if(!D.outcome) return;
  const B=BRIEFS[id]||{};
  const msg=document.getElementById("lg-"+id); if(msg) msg.innerHTML=`<span class="spin"></span>Logging and writing the follow-up…`;
  const r=await api({action:"log_outcome", dealer_id:id, brief_id:B.brief_id||null, outcome:D.outcome,
    talked_to:D.talked_to||"", rep_notes:D.notes||"", next_step:D.next_step||"",
    angle:(B.brief&&B.brief.opportunity&&B.brief.opportunity.angle)||null,
    manufacturer:(B.brief&&B.brief.opportunity&&B.brief.opportunity.manufacturer)||null});
  if(r.status===503){ if(msg) msg.innerHTML=`<span style="color:#b42323">Run ${esc((r.body&&r.body.setup)||"supabase/call_workspace.sql")} first.</span>`; return; }
  if(!r.body||!r.body.ok){ if(msg) msg.innerHTML=`<span style="color:#b42323">${esc((r.body&&(r.body.message||r.body.error))||"Couldn't log the call.")}</span>`; return; }
  RESULT[id]=r.body;
  const row=LIST.find(x=>x.id===id); if(row) row.last_call={outcome:D.outcome,days_ago:0};
  paintBrief(id);
}
function followupHtml(id){
  const R=RESULT[id]||{}, f=R.followup||null;
  const dealer=(BRIEFS[id]&&BRIEFS[id].dossier&&BRIEFS[id].dossier.dealer)||{};
  const mailto=f?`mailto:${encodeURIComponent(dealer.email||"")}?subject=${encodeURIComponent(f.email_subject||"")}&body=${encodeURIComponent(f.email_body||"")}`:"#";
  return `<div class="fu">
    <h3>✓ Logged — ${esc(R.outcome||"")}</h3>
    <div class="btext" style="font-size:13.5px">
      ${R.note_id?"CRM note saved. ":""}${R.task_id?"Follow-up task created. ":""}${R.follow_up_on?`Next contact <b>${esc(R.follow_up_on)}</b>.`:"No follow-up scheduled."}
      ${(R.warnings||[]).length?`<div style="color:#b45309;margin-top:5px">${R.warnings.map(w=>esc(w)).join("<br>")}</div>`:""}
    </div>
    ${f?`
      <div class="bsec" style="margin-top:12px"><div class="bh">Follow-up email
        <button class="cpy" onclick="copyEl(this,'fe-${esc(id)}')">Copy</button></div>
        <input id="fs-${esc(id)}" value="${esc(f.email_subject)}" style="width:100%;margin-bottom:6px;font-weight:700">
        <textarea id="fe-${esc(id)}" rows="7" style="width:100%">${esc(f.email_body)}</textarea>
        <div style="margin-top:7px"><a class="btn sm" href="${mailto}">Open in Outlook</a>
          <span class="hint" style="margin-left:8px">Nothing is sent from here — review it, then send.</span></div></div>
      ${f.next_script?`<div class="bsec"><div class="bh">Opening for the next call
        <button class="cpy" onclick="copyEl(this,'ns-${esc(id)}')">Copy</button></div>
        <textarea id="ns-${esc(id)}" rows="4" style="width:100%">${esc(f.next_script)}</textarea></div>`:""}
      ${(f.materials||[]).length?`<div class="bsec" style="margin-bottom:0"><div class="bh">Worth sending</div>
        <div class="recs">${f.materials.map(m=>`<div class="rec"><b>${esc(m)}</b></div>`).join("")}</div></div>`:""}
    `:`<div class="hint" style="margin:8px 0 0">No follow-up email or next script was generated for this outcome.</div>`}
    <div style="margin-top:10px"><button class="btn sm ghost" onclick="reopen('${esc(id)}')">Log another call for this dealer</button></div>
  </div>`;
}
function reopen(id){ delete RESULT[id]; delete DRAFT[id]; paintBrief(id); }

/* ---------- what's working ---------- */
async function loadInsights(){
  $("#body").innerHTML=`<div class="msg"><span class="spin"></span>Reading call history…</div>`;
  const r=await api({action:"insights"});
  if(r.status===503){ $("#body").innerHTML=setupMsg(r.body); return; }
  const j=r.body||{};
  if(!j.ok){ showErr(j.error||("HTTP "+r.status)); return; }
  const kpi=(l,v,cls)=>`<div class="kpi"><div class="l">${l}</div><div class="v ${cls||''}">${v}</div></div>`;
  const head=`<div class="kpis">
    ${kpi("Calls recorded",j.total_calls,"blue")}
    ${kpi("Moved forward",j.win_rate==null?"—":j.win_rate+"%","")}
    ${kpi("Sample floor",j.min_sample+" calls","")}
  </div>`;
  // Said plainly rather than dressed up: a percentage off four calls is not a finding.
  const note=j.readiness==="enough" ? "" :
    `<div class="notyet"><b>Not enough history to draw conclusions yet.</b><br>${esc(j.readiness)}<br>
     The counts below are real; percentages appear on their own once each group has enough calls behind it.</div>`;
  const card=(title,rows,unit)=>{
    if(!rows||!rows.length) return `<div class="inscard"><h3>${esc(title)}</h3><div class="hint" style="margin:0">Nothing recorded yet.</div></div>`;
    const max=Math.max(...rows.map(r=>r.calls))||1;
    return `<div class="inscard"><h3>${esc(title)}</h3>${rows.slice(0,8).map(r=>`
      <div class="bar">
        <span class="k">${esc(String(r.key).replace(/_/g," "))}</span>
        <span class="track"><i style="width:${Math.round((r.calls/max)*100)}%"></i></span>
        <span class="n">${r.calls} ${unit||"call"}${r.calls===1?"":"s"}</span>
        ${r.win_rate==null?`<span class="v pending">${r.enough===undefined?"":"needs "+(j.min_sample-r.calls)+" more"}</span>`:`<span class="v">${r.win_rate}%</span>`}
      </div>`).join("")}</div>`;
  };
  $("#body").innerHTML=head+note+`<div class="ins" style="margin-top:13px">
    ${card("Outcome mix",(j.by_outcome||[]).map(o=>({key:o.label,calls:o.calls,win_rate:null})))}
    ${card("By sales angle",j.by_angle)}
    ${card("By manufacturer line",j.by_manufacturer)}
    ${card("By time of day",j.by_hour)}
    ${(j.by_rep||[]).length?card("By rep",j.by_rep):""}
  </div>
  <div class="hint" style="margin-top:12px">“Moved forward” counts calls that ended in interest, a quote, an appointment or a request for information. Once a group clears ${j.min_sample} calls its rate starts feeding into new call strategies as a mild prior — the account's own facts still decide the angle.</div>`;
}

/* ---------- helpers ---------- */
function copyEl(btn,id){ const e=document.getElementById(id); if(!e)return;
  const txt=("value" in e && e.value!=null)?e.value:e.textContent||"";
  navigator.clipboard.writeText(txt).then(()=>flash(btn)).catch(()=>{}); }
function flash(btn){ const o=btn.textContent; btn.textContent="Copied"; setTimeout(()=>{btn.textContent=o;},1200); }

load();
</script>
</body></html>
