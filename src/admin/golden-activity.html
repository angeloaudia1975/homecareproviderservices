<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS Connect 360 — Golden Activity</title>
<link rel="stylesheet" href="/admin/admin-shell.css">
<style>
 .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin:14px 0}
 .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
 .kpi.g{border-left:4px solid #d8a529}
 .kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);font-weight:700}
 .kpi .v{font-size:23px;font-weight:800;color:var(--navy);font-family:'Barlow Condensed',sans-serif;margin-top:2px}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
 table{width:100%;border-collapse:collapse;font-size:13px}
 th{text-align:left;color:var(--gray);font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;border-bottom:2px solid var(--line)}
 td{padding:6px 8px;border-bottom:1px solid #eef2f6}
 td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .sku{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--navy)}
 .when{color:#8496a8;white-space:nowrap;font-size:12px}
 .pill{display:inline-block;background:#fdf4dc;color:#8a6400;border:1px solid #e6d493;border-radius:20px;padding:1px 9px;font-size:11px;font-weight:700}
</style>
</head><body>
<header id="ac-head"></header>
<div class="wrap">
  <div class="top"><div><h1 style="margin:0">Golden Activity</h1>
    <div class="sub">Live dealer behavior from the Golden ordering platform — logins, product interest, carts &amp; orders (last 30 days). Fed in real time via the federation connector.</div></div>
    <div><button class="btn ghost" onclick="load()">↻ Refresh</button></div></div>
  <div id="body"><div class="msg">Loading…</div></div>
</div>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Math.round(Number(n)||0).toLocaleString();
const num=n=>Number(n||0).toLocaleString();
const when=s=>{ if(!s) return "—"; try{ return new Date(s).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }catch(e){ return String(s).slice(0,16); } };
window.addEventListener("hcps-token",e=>{try{TOKEN=e.detail;}catch(_){}});
let TOKEN=HCPS.token();
let RESOLVE_MSG="";
let ACT_MSG="", ACT_AUD="", ACT_LIST=null;
let DEALER_OPTS=null, LABEL2ID={};
function gate(msg){$("#body").innerHTML=`<div class="gate"><h2>Staff sign-in</h2><p class="hint">Sign in with your work email and password.</p><input id="lemail" type="email" placeholder="Email" autocomplete="username"><input id="lpass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitTok()"><button class="go" onclick="submitTok()">Sign in</button><div id="lerr" style="color:#b42323;margin-top:8px">${msg||""}</div></div>`;setTimeout(()=>{const t=$("#lemail");if(t)t.focus();},50);}
async function submitTok(){ const email=(($("#lemail")||{}).value||"").trim(), password=(($("#lpass")||{}).value||"");
  try{ const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email,password})});
    const j=await r.json().catch(()=>({})); if(!j||!j.ok){ gate((j&&j.message)||"Could not sign in."); return; } HCPS.setSession(j); TOKEN=j.token; load();
  }catch(err){ gate("Could not reach the server."); } }
function lock(){ HCPS.signOut(); TOKEN=null; location.reload(); }

async function api(action, extra){ const r=await fetch("/.netlify/functions/federation-api",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+TOKEN},body:JSON.stringify({action,...(extra||{})})}); if(r.status===401){ throw {gate:true}; } return r.json(); }

// Re-run the matcher over the unmatched queue — attaches anything that now maps to a dealer.
async function reresolve(btn){
  if(!TOKEN) return; if(btn){ btn.disabled=true; btn.textContent="Re-checking…"; }
  try{ const j=await api("resolve_unmatched");
    if(j&&j.ok){ RESOLVE_MSG=`Re-checked ${j.scanned} event(s): ${j.resolved} matched to a dealer, ${j.still_unmatched} still unmatched.`; load(); }
    else { if(btn){ btn.disabled=false; btn.textContent="↻ Re-check unmatched"; } RESOLVE_MSG=(j&&j.error)||"Could not re-check."; load(); }
  }catch(e){ if(e&&e.gate){ gate("Your session ended — sign in again."); return; } if(btn){ btn.disabled=false; btn.textContent="↻ Re-check unmatched"; } RESOLVE_MSG="Could not re-check unmatched."; load(); }
}

// Dealer picker options for the manual-assign control (loaded once, on demand).
function dlabel(d){ return (d.name||"")+(d.acct?" — #"+d.acct:"")+(d.state?" ("+d.state+")":""); }
async function ensureDealers(){
  if(DEALER_OPTS) return;
  try{ const j=await api("dealer_options"); DEALER_OPTS=(j&&j.dealers)||[]; }catch(e){ DEALER_OPTS=[]; }
  LABEL2ID={}; for(const d of DEALER_OPTS){ LABEL2ID[dlabel(d)]=d.id; }
  const dl=document.getElementById("dealerdl");
  if(dl) dl.innerHTML=DEALER_OPTS.map(d=>`<option value="${esc(dlabel(d))}"></option>`).join("");
}
// Manually assign every unmatched event on an account to the chosen dealer (and cache it for next time).
async function assignUnmatched(cust, idx, btn){
  const inp=document.getElementById("asg_"+idx); if(!inp) return;
  const id=LABEL2ID[(inp.value||"").trim()];
  if(!id){ inp.style.borderColor="#b42323"; inp.focus(); return; }
  if(btn){ btn.disabled=true; btn.textContent="Assigning…"; }
  try{ const j=await api("assign_unmatched",{customer_no:cust,dealer_id:id});
    if(j&&j.ok){ RESOLVE_MSG=`Assigned ${j.assigned} event(s) on account ${cust} — future events from it now resolve automatically.`; load(); }
    else { if(btn){ btn.disabled=false; btn.textContent="Assign"; } RESOLVE_MSG=(j&&j.error)||"Could not assign."; load(); }
  }catch(e){ if(e&&e.gate){ gate("Your session ended — sign in again."); return; } if(btn){ btn.disabled=false; btn.textContent="Assign"; } RESOLVE_MSG="Could not assign."; load(); }
}
// Activation audience — Golden-access dealers who have never logged in. preview=true just lists them.
async function activation(preview, btn){
  const old=btn?btn.textContent:""; if(btn){ btn.disabled=true; btn.textContent=preview?"Checking…":"Building…"; }
  try{ const j=await api("activation_audience", preview?{preview:true}:{});
    if(j&&j.ok){
      if(preview){ ACT_LIST=j.dealers||[]; ACT_AUD=""; ACT_MSG=`${j.count} Golden-access dealer(s) have never logged in.`; }
      else if(j.built){ ACT_AUD=j.audience_id||""; ACT_MSG=`Built audience “${j.name}” — ${j.count} dealer(s).`; }
      else { ACT_AUD=""; ACT_MSG=j.message||"No dealers to build."; }
    } else { ACT_MSG=(j&&j.message)||(j&&j.error)||"Could not run."; }
  }catch(e){ if(e&&e.gate){ gate("Your session ended — sign in again."); return; } ACT_MSG="Could not run the activation audience."; }
  load();
}

async function load(){
  if(!TOKEN){ gate(); return; }
  $("#body").innerHTML=`<div class="msg">Loading…</div>`;
  let j; try{ j=await api("dashboard"); }catch(e){ if(e&&e.gate){ gate("Your session ended — sign in again."); return; } $("#body").innerHTML=`<div class="msg err">Couldn't load Golden activity.</div>`; return; }
  if(!j||!j.ok){ $("#body").innerHTML=`<div class="msg err">${esc((j&&j.error)||"Couldn't load.")}</div>`; return; }
  const k=j.kpis||{};
  const kpi=(l,v,g)=>`<div class="kpi${g?" g":""}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  const kpis=`<div class="kpis">
    ${kpi("Logins",num(k.logins),1)}${kpi("Product views",num(k.product_views))}${kpi("Searches",num(k.searches))}
    ${kpi("Cart adds",num(k.cart_adds))}${kpi("Abandoned carts",num(k.carts_abandoned))}${kpi("Orders",num(k.orders),1)}
    ${kpi("Order value",money(k.order_value),1)}${j.rep_scoped?"":kpi("Unmatched",num(k.unmatched))}
  </div>`;
  const tp=(j.top_products||[]).map(p=>{
    const names=p.dealer_names||[];
    const chips=names.length?`<tr><td colspan="5" style="padding:0 8px 9px"><span class="hint" style="margin-right:4px">viewed by:</span>${names.map(n=>`<span style="display:inline-block;background:#eef2f7;border:1px solid #dfe6ee;border-radius:12px;padding:1px 8px;font-size:11.5px;margin:2px 3px 0 0;color:#2b3a4d">${esc(n)}</span>`).join("")}</td></tr>`:"";
    return `<tr><td class="sku">${esc(p.code)}</td><td>${esc(p.line)}</td><td class="n">${num(p.views)}</td><td class="n">${num(p.dealers)}</td><td class="when">${when(p.last)}</td></tr>${chips}`;
  }).join("")||`<tr><td colspan="5" class="hint">No product views yet.</td></tr>`;
  const ro=(j.recent_orders||[]).map(o=>`<tr><td>${esc(o.dealer)}</td><td class="n">${money(o.total)}</td><td class="n">${num(o.lines)}</td><td>${esc(o.status||"")}</td><td class="when">${when(o.at)}</td></tr>`).join("")||`<tr><td colspan="5" class="hint">No orders yet.</td></tr>`;
  const rl=(j.recent_logins||[]).map(o=>`<tr><td>${esc(o.dealer)}</td><td>${esc(o.acct||"")}</td><td class="when">${when(o.at)}</td></tr>`).join("")||`<tr><td colspan="3" class="hint">No logins yet.</td></tr>`;
  const ac=(j.abandoned_carts||[]).map(o=>`<tr><td>${esc(o.dealer)}</td><td class="n">${o.value?money(o.value):"—"}</td><td class="when">${when(o.at)}</td></tr>`).join("")||`<tr><td colspan="3" class="hint">No abandoned carts.</td></tr>`;
  // Unmatched — grouped by account so one assignment links every event from that account at once.
  const um=(j.unmatched||[]);
  const grp={}; for(const u of um){ const key=u.customer_no||"(none)"; const g=grp[key]=grp[key]||{cust:u.customer_no||"",name:u.dealer_name||"",events:0,last:u.occurred_at}; g.events++; if(!g.name&&u.dealer_name)g.name=u.dealer_name; if(u.occurred_at>g.last)g.last=u.occurred_at; }
  const groups=Object.values(grp);
  const umHtml=(!j.rep_scoped&&um.length)?`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Unmatched — needs a dealer</h2><button class="btn ghost" onclick="reresolve(this)">↻ Re-check unmatched</button></div>
      <p class="hint" style="margin:6px 0 8px">Golden events that didn't match an HCPS dealer. <b>Re-check unmatched</b> auto-matches known account numbers; for the rest, pick the right dealer and <b>Assign</b> — it links the account so future events resolve on their own.</p>
      <datalist id="dealerdl"></datalist>
      <table><thead><tr><th>Account</th><th>Name from Golden</th><th class="n">Events</th><th class="n">Latest</th><th>Assign to dealer</th></tr></thead><tbody>${groups.map((g,i)=>`<tr><td><b>${esc(g.cust)}</b></td><td>${esc(g.name)}</td><td class="n">${g.events}</td><td class="when">${when(g.last)}</td><td style="white-space:nowrap"><input id="asg_${i}" list="dealerdl" placeholder="Search dealer…" style="padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;min-width:180px"> <button class="btn ghost sm" onclick="assignUnmatched('${esc(g.cust)}',${i},this)">Assign</button></td></tr>`).join("")}</tbody></table></div>`:"";
  // Activation — Golden-access dealers who have never logged in.
  const actCard=(!j.rep_scoped)?`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Activation — never logged in</h2>
      <div style="display:flex;gap:6px"><button class="btn ghost" onclick="activation(true,this)">Find them</button><button class="btn" onclick="activation(false,this)">Build audience →</button></div></div>
      <p class="hint" style="margin:6px 0 8px">Dealers with Golden portal access who have <b>never signed in</b>. Build a static audience, then launch an activation campaign from Campaign Studio.</p>
      ${ACT_MSG?`<div style="font-weight:600;color:var(--navy);margin-bottom:6px">${esc(ACT_MSG)}${ACT_AUD?` &nbsp;<a class="link" href="/admin/campaigns.html?audience=${encodeURIComponent(ACT_AUD)}">Open in Campaign Studio →</a>`:""}</div>`:""}
      ${(ACT_LIST&&ACT_LIST.length)?`<div style="max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px"><table><thead><tr><th>Dealer</th><th>HCPS acct</th><th>Golden acct #</th><th>State</th></tr></thead><tbody>${ACT_LIST.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.acct||"")}</td><td>${esc(d.golden_acct||"")}</td><td>${esc(d.state||"")}</td></tr>`).join("")}</tbody></table></div><div class="hint" style="margin-top:6px">${ACT_LIST.length} dealer${ACT_LIST.length===1?"":"s"} with a Golden account, never signed in.</div>`:""}
    </div>`:"";
  ACT_MSG=""; ACT_AUD=""; ACT_LIST=null;
  const banner=RESOLVE_MSG?`<div class="card" style="border-left:4px solid #2d7d46;background:#f2faf5;font-weight:600;color:#245a37">${esc(RESOLVE_MSG)}</div>`:""; RESOLVE_MSG="";
  $("#body").innerHTML=banner+kpis
    +`<div class="card"><h2>Top products viewed <span class="pill">by dealers</span></h2>
        <table><thead><tr><th>Product (SKU)</th><th>Line</th><th class="n">Views</th><th class="n">Dealers</th><th class="n">Last</th></tr></thead><tbody>${tp}</tbody></table>
        <div class="hint" style="margin-top:8px">Want to work these? <a class="link" href="/admin/product-interest.html">Build a campaign audience →</a></div></div>
      <div class="grid2">
        <div class="card"><h2>Recent orders</h2><table><thead><tr><th>Dealer</th><th class="n">Total</th><th class="n">Lines</th><th>Status</th><th class="n">When</th></tr></thead><tbody>${ro}</tbody></table></div>
        <div class="card"><h2>Abandoned carts</h2><table><thead><tr><th>Dealer</th><th class="n">Value</th><th class="n">When</th></tr></thead><tbody>${ac}</tbody></table></div>
      </div>
      <div class="card"><h2>Recent logins</h2><table><thead><tr><th>Dealer</th><th>Account</th><th class="n">When</th></tr></thead><tbody>${rl}</tbody></table></div>
      ${actCard}
      ${umHtml}`;
  if(!j.rep_scoped && um.length) ensureDealers();
}
load();
</script>
</body></html>
