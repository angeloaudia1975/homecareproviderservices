<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HCPS Admin — Territory Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
 :root{--ink:#16202e;--blue:#3B599A;--blue-dk:#2B4071;--orange:#F5821F;--bg:#eef2f7;--line:#e3e8ef;--muted:#64707e;--ok:#1f9d55;--warn:#e0850f;--danger:#d64545}
 *{box-sizing:border-box;margin:0;padding:0}
 html,body{height:100%}
 body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
 a{color:inherit;text-decoration:none}
 .adminnav{background:var(--ink);display:flex;align-items:center;gap:4px;padding:10px 22px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.14);flex:none}
 .adminnav .bd{color:#fff;font-weight:800;font-size:15px;margin-right:16px}.adminnav .bd span{color:var(--orange)}
 .adminnav a{color:#aeb9c6;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-radius:7px}
 .adminnav a:hover{color:#fff;background:rgba(255,255,255,.07)}.adminnav a.on{color:#fff;background:var(--blue)}
 .adminnav .navright{margin-left:auto;display:flex;gap:10px;align-items:center}
 .lock{background:transparent;border:1px solid rgba(255,255,255,.22);color:#cdd6e2;border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
 .lock:hover{background:rgba(255,255,255,.08);color:#fff}
 .toolbar{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line)}
 .toolbar h1{font-size:15px;font-weight:800;margin-right:6px}
 .toolbar select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;background:#fff}
 .toolbar .sp{flex:1}
 .btn{border:1px solid var(--blue-dk);background:var(--blue);color:#fff;border-radius:8px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer}
 .btn:hover{background:var(--blue-dk)} .btn:disabled{opacity:.55;cursor:not-allowed}
 .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
 .count{font-size:12.5px;color:var(--muted)}
 .legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted)}
 .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);margin-right:4px;vertical-align:-1px}
 .wrap{flex:1;min-height:0;position:relative}
 #map{position:absolute;inset:0}
 .pin span{display:block;width:15px;height:15px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
 .pin.inroute span{width:19px;height:19px;border-color:#2B4071;box-shadow:0 0 0 2px #2B4071}
 .homepin span{display:flex;align-items:center;justify-content:center;width:27px;height:27px;background:#16202e;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.4);font-size:14px}
 .pop b{font-size:13.5px} .pop .st{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:1px 7px;border-radius:20px;margin-left:4px}
 .pop .row{font-size:12px;color:#333;margin-top:3px}.pop a{color:var(--blue);font-weight:700;font-size:12px}
 .pop .addbtn{margin-top:7px;border:1px solid var(--blue-dk);background:var(--blue);color:#fff;border-radius:7px;padding:5px 10px;font-weight:700;font-size:12px;cursor:pointer}
 .banner{margin:0;padding:10px 18px;background:#fff7ed;border-bottom:1px solid #fed7aa;color:#9a3412;font-size:13px}
 /* route panel */
 .routep{position:absolute;left:14px;bottom:14px;z-index:600;width:296px;max-height:66%;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(16,24,40,.22);overflow:hidden}
 .routep .rhead{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:14px}
 .routep .rhead .m{color:var(--muted);font-size:11.5px;font-weight:600}
 .routep .rx{margin-left:auto;background:none;border:0;color:var(--danger);font-weight:700;font-size:12px;cursor:pointer}
 .rtrow{padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px;background:#f8fafc}
 .rtrow label{display:flex;gap:7px;align-items:center;cursor:pointer}
 .routep ol{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
 .routep li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;font-size:12.5px}
 .routep li:hover{background:#f5f7fa} .routep li.homeli{color:var(--muted)}
 .routep li .n{width:20px;height:20px;flex:none;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
 .routep li .nm{flex:1;line-height:1.25}.routep li .nm small{color:var(--muted)}
 .routep li .del{background:none;border:0;color:#b0b8c2;cursor:pointer;font-size:14px;font-weight:800}
 .routep li .del:hover{color:var(--danger)}
 .routep .ractions{display:flex;gap:7px;padding:11px;border-top:1px solid var(--line);flex-wrap:wrap}
 .routep .ractions .btn{flex:1;justify-content:center;text-align:center;padding:9px 8px;font-size:12.5px}
 /* home editor overlay */
 .homeov{position:fixed;inset:0;z-index:1100;background:rgba(16,24,40,.45);display:grid;place-items:center;padding:20px}
 .homecard{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:430px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
 .homecard b{font-size:15px}.homecard p{color:var(--muted);font-size:12.5px;margin:4px 0 12px}
 .homecard input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit}
 .homecard input:focus{outline:2px solid rgba(59,89,154,.35);border-color:var(--blue)}
 .homecard .ha{display:flex;gap:8px;margin-top:12px}.homecard .er{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:15px}
 /* gate */
 .gate{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#16202e,#2B4071);display:grid;place-items:center;padding:20px}
 .gate-card{background:#fff;border-radius:16px;padding:30px;width:100%;max-width:370px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
 .gate-card .brand{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--orange);font-weight:800}
 .gate-card h2{margin:6px 0 3px;font-size:22px}.gate-card p{color:var(--muted);font-size:13px;margin:0 0 16px}
 .gate-card input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit}
 .gate-card input:focus{outline:2px solid rgba(59,89,154,.35);border-color:var(--blue)}
 .gate-card button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;cursor:pointer}
 .gate-card .er{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px}
</style></head><body>

<nav class="adminnav">
  <div class="bd">HCPS <span>Admin</span></div>
  <a href="/admin/">Home</a>
  <a href="/admin/analytics.html">Analytics</a>
  <a href="/admin/dealers.html">Dealer Manager</a>
  <a href="/admin/map.html" class="on">Map</a>
  <a href="/admin/images.html">Images</a>
  <a href="/admin/featured.html">Featured</a>
  <a href="/admin/catalog.html">Catalog</a>
  <a href="/admin/home-editor.html">Portal Home</a>
  <a href="/admin/website.html">Website</a>
  <div class="navright"><button class="lock" onclick="lock()">Lock</button></div>
</nav>

<div id="banner"></div>

<div class="toolbar">
  <h1>Territory Map</h1>
  <select id="fState" onchange="draw()"><option value="">All states</option></select>
  <select id="fStatus" onchange="draw()">
    <option value="">All statuses</option>
    <option value="active">Active</option>
    <option value="prospect">Prospect</option>
    <option value="review">Review</option>
  </select>
  <span class="legend"><span><i style="background:#1f9d55"></i>Active</span><span><i style="background:#F5821F"></i>Prospect</span><span><i style="background:#d64545"></i>Review</span><span><i style="background:#3B599A"></i>Other</span></span>
  <span class="sp"></span>
  <span class="count" id="count"></span>
  <button class="btn ghost" id="homeBtn" onclick="editHome()">🏠 Set home base</button>
  <button class="btn" id="geoBtn" onclick="geocodeAll()">Geocode addresses</button>
</div>

<div class="wrap">
  <div id="map"></div>
  <div class="routep" id="routep" hidden>
    <div class="rhead"><b>Route plan</b> <span class="m" id="rmeta"></span><button class="rx" onclick="clearRoute()">Clear</button></div>
    <div class="rtrow" id="rtRow" style="display:none"><label><input type="checkbox" id="rtChk" checked onchange="toggleRT(this.checked)"> Round trip — start &amp; end at home base</label></div>
    <ol id="rlist"></ol>
    <div class="ractions">
      <button class="btn ghost" onclick="optimize()">Optimize order</button>
      <button class="btn" onclick="openGmaps()">Google Maps →</button>
    </div>
  </div>
</div>

<div id="gate"></div>
<div id="homeEdit"></div>

<div class="verbadge" style="position:fixed;bottom:6px;right:9px;z-index:1200;font:600 11px/1 system-ui,sans-serif;color:#8a949c;background:rgba(255,255,255,.85);border:1px solid #dde3e8;border-radius:6px;padding:3px 7px;pointer-events:none">VER 2.0</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const TKEY="hcps_staff_token", PKEY="hcps_staff_profile";
let TOKEN=sessionStorage.getItem(TKEY)||null;
let ME=null; try{ME=JSON.parse(sessionStorage.getItem(PKEY)||"null")}catch(e){ME=null;}
let MAP=null, CLUSTER=null, POINTS=[], BOOTED=false, ROUTE=[], ROUTELINE=null;
let HOMEMARKER=null, ROUNDTRIP=true;
const DEFAULT_HOME="1003 Wilkinson Pl, Cottontown, TN 37048";
let HOME=null; try{ HOME=JSON.parse(localStorage.getItem("hcps_home_base")||"null"); }catch(e){ HOME=null; }

const API="/.netlify/functions/geocode-api";
async function api(method,body){
  const h={"content-type":"application/json"}; if(TOKEN)h["authorization"]="Bearer "+TOKEN;
  const r=await fetch(API,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(r.status===401){ sessionStorage.removeItem(TKEY); sessionStorage.removeItem(PKEY); TOKEN=null; ME=null; showGate("Your session ended — please sign in again."); throw new Error("unauthorized"); }
  return r.json();
}
function showGate(msg){
  $("#gate").innerHTML=`<div class="gate"><div class="gate-card">
    <div class="brand">HomeCare Provider Services</div><h2>Staff sign-in</h2>
    <p>Sign in with your work email and password.</p>
    <input id="lemail" type="email" placeholder="Email" autocomplete="username" style="margin-bottom:8px">
    <input id="lpass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitTok()">
    <button onclick="submitTok()">Sign in</button><div class="er" id="lerr">${msg||""}</div></div></div>`;
  setTimeout(()=>{const t=$("#lemail"); if(t)t.focus();},50);
}
async function submitTok(){
  const email=(($("#lemail")||{}).value||"").trim(), password=(($("#lpass")||{}).value||"");
  const e=$("#lerr"); if(e)e.textContent="Signing in\u2026";
  try{ const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email,password})});
    const j=await r.json().catch(()=>({})); if(!j||!j.ok){ showGate((j&&j.message)||"Could not sign in."); return; }
    TOKEN=j.token; ME=j.profile; sessionStorage.setItem(TKEY,TOKEN); sessionStorage.setItem(PKEY,JSON.stringify(ME)); $("#gate").innerHTML=""; boot();
  }catch(err){ showGate("Could not reach the server. Try again."); }
}
function lock(){ sessionStorage.removeItem(TKEY); sessionStorage.removeItem(PKEY); location.reload(); }

const COLORS={active:"#1f9d55",prospect:"#F5821F",review:"#d64545"};
const colorOf=s=>COLORS[String(s||"").toLowerCase()]||"#3B599A";
function icon(color,inroute){ return L.divIcon({className:"pin"+(inroute?" inroute":""),html:`<span style="background:${color}"></span>`,iconSize:[16,16],iconAnchor:[8,8]}); }
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function initMap(){
  MAP=L.map("map",{zoomControl:true}).setView([39.5,-98.35],4);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(MAP);
  CLUSTER=L.markerClusterGroup({maxClusterRadius:45}); MAP.addLayer(CLUSTER);
}
function fillStateFilter(){
  const sel=$("#fState"); const cur=sel.value; const states=[...new Set(POINTS.map(p=>p.state).filter(Boolean))].sort();
  sel.innerHTML=`<option value="">All states</option>`+states.map(s=>`<option value="${esc(s)}"${s===cur?" selected":""}>${esc(s)}</option>`).join("");
}
function inRoute(p){ return ROUTE.some(s=>s._i===p._i); }
function draw(){
  if(!CLUSTER)return; CLUSTER.clearLayers();
  const fs=$("#fState").value, ft=$("#fStatus").value;
  const shown=POINTS.filter(p=>(!fs||p.state===fs)&&(!ft||String(p.status).toLowerCase()===ft));
  const markers=shown.map(p=>{
    const m=L.marker([p.lat,p.lng],{icon:icon(colorOf(p.status),inRoute(p))});
    const c=colorOf(p.status);
    m.bindPopup(`<div class="pop"><b>${esc(p.name)}</b>${p.status?`<span class="st" style="background:${c}22;color:${c}">${esc(p.status)}</span>`:""}
      ${p.label?`<div class="row">${esc(p.label)}</div>`:""}
      <div class="row">${esc([p.city,p.state].filter(Boolean).join(", "))}</div>
      ${p.email?`<div class="row">${esc(p.email)}</div>`:""}
      <button class="addbtn" onclick="addStop(${p._i})">${inRoute(p)?"✓ In route":"＋ Add to route"}</button>
      <div class="row" style="margin-top:5px"><a href="/admin/dealers.html">Open in Dealer Manager →</a></div></div>`);
    return m;
  });
  CLUSTER.addLayers(markers);
  $("#count").textContent=`${shown.length.toLocaleString()} of ${POINTS.length.toLocaleString()} locations`;
  if(shown.length && !ROUTE.length){ try{ MAP.fitBounds(L.latLngBounds(shown.map(p=>[p.lat,p.lng])).pad(0.15)); }catch(e){} }
}

/* ---------- home base ---------- */
function homeIcon(){ return L.divIcon({className:"homepin",html:`<span>🏠</span>`,iconSize:[27,27],iconAnchor:[13,13]}); }
function refreshHomeBtn(){ const b=$("#homeBtn"); if(!b)return; b.textContent = HOME ? ("🏠 "+(HOME.short||"Home base")) : "🏠 Set home base"; }
function drawHome(){
  if(HOMEMARKER){ MAP.removeLayer(HOMEMARKER); HOMEMARKER=null; }
  if(HOME && HOME.lat!=null && MAP){
    HOMEMARKER=L.marker([HOME.lat,HOME.lng],{icon:homeIcon(),zIndexOffset:1000})
      .bindPopup(`<div class="pop"><b>🏠 Home base</b><div class="row">${esc(HOME.q||"")}</div><div class="row" style="color:#777">Start &amp; end of your routes</div></div>`).addTo(MAP);
  }
  refreshHomeBtn();
}
function editHome(){
  const cur = HOME ? (HOME.q||"") : DEFAULT_HOME;
  $("#homeEdit").innerHTML=`<div class="homeov"><div class="homecard">
    <b>Route home base</b>
    <p>Every route can start and end here. Enter a full street address (city &amp; state required).</p>
    <input id="homeq" value="${esc(cur)}" placeholder="123 Main St, City, ST 00000">
    <div class="ha"><button class="btn" onclick="saveHome()">Save home base</button>
      ${HOME?'<button class="btn ghost" onclick="clearHome()">Remove</button>':''}
      <button class="btn ghost" onclick="closeHome()">Cancel</button></div>
    <div class="er" id="homeErr"></div></div></div>`;
  setTimeout(()=>{const i=$("#homeq"); if(i){i.focus();i.select();}},40);
}
function closeHome(){ $("#homeEdit").innerHTML=""; }
async function saveHome(){
  const q=($("#homeq").value||"").trim(); if(!q){ $("#homeErr").textContent="Enter an address."; return; }
  $("#homeErr").textContent="Locating…";
  try{
    const r=await api("POST",{action:"geocode_one",q});
    if(!r||!r.ok){ $("#homeErr").textContent="Couldn't find that address — include the city and state (e.g. …, Cottontown, TN 37048)."; return; }
    const short=q.split(",").slice(-2).join(",").trim()||q;
    HOME={q,lat:r.lat,lng:r.lng,short};
    localStorage.setItem("hcps_home_base",JSON.stringify(HOME));
    closeHome(); drawHome(); renderRoute();
    if(MAP) MAP.setView([HOME.lat,HOME.lng], Math.max(MAP.getZoom(),6));
  }catch(e){ $("#homeErr").textContent="Something went wrong — try again."; }
}
function clearHome(){ HOME=null; localStorage.removeItem("hcps_home_base"); closeHome(); drawHome(); renderRoute(); }
function toggleRT(v){ ROUNDTRIP=v; renderRoute(); }

/* ---------- route planning ---------- */
function hav(a,b){ const R=3958.8,tr=x=>x*Math.PI/180; const dLat=tr(b.lat-a.lat),dLng=tr(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(tr(a.lat))*Math.cos(tr(b.lat))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function effectiveRoute(){
  if(HOME && ROUNDTRIP && ROUTE.length){ const h={name:"Home base",lat:HOME.lat,lng:HOME.lng,_home:true}; return [h,...ROUTE,h]; }
  return ROUTE.slice();
}
function routeMiles(){ const R=effectiveRoute(); let m=0; for(let i=1;i<R.length;i++) m+=hav(R[i-1],R[i]); return m; }
function addStop(i){ const p=POINTS[i]; if(!p)return; if(inRoute(p)){ ROUTE=ROUTE.filter(s=>s._i!==p._i); } else { if(ROUTE.length>=25){ alert("That's a lot of stops — keep a route under 25 for a workable day."); return; } ROUTE.push(p); } renderRoute(); draw(); if(MAP)MAP.closePopup(); }
function removeStop(i){ ROUTE.splice(i,1); renderRoute(); draw(); }
function clearRoute(){ ROUTE=[]; renderRoute(); draw(); }
function optimize(){
  if(ROUTE.length<2){ renderRoute(); return; }
  const pool=ROUTE.slice(); const ordered=[];
  let cur;
  if(HOME && ROUNDTRIP){ cur={lat:HOME.lat,lng:HOME.lng}; }          // nearest-neighbour from home
  else { ordered.push(pool.shift()); cur=ordered[0]; }               // keep first stop fixed
  while(pool.length){ let bi=0,bd=Infinity; for(let i=0;i<pool.length;i++){const d=hav(cur,pool[i]); if(d<bd){bd=d;bi=i;}} cur=pool.splice(bi,1)[0]; ordered.push(cur); }
  ROUTE=ordered; renderRoute();
}
function renderRoute(){
  const panel=$("#routep"); panel.hidden = ROUTE.length===0;
  $("#rtRow").style.display = HOME ? "block" : "none";
  const cb=$("#rtChk"); if(cb) cb.checked=ROUNDTRIP;
  const list=$("#rlist");
  if(!ROUTE.length){ list.innerHTML=""; if(ROUTELINE){MAP.removeLayer(ROUTELINE);ROUTELINE=null;} return; }
  const useHome = HOME && ROUNDTRIP;
  const start = useHome?`<li class="homeli"><span class="n" style="background:#16202e">🏠</span><span class="nm"><b>Start — Home base</b><br><small>${esc(HOME.short||HOME.q||"")}</small></span></li>`:"";
  const end   = useHome?`<li class="homeli"><span class="n" style="background:#16202e">🏠</span><span class="nm"><b>End — Home base</b><br><small>return</small></span></li>`:"";
  list.innerHTML=start+ROUTE.map((s,i)=>`<li><span class="n">${i+1}</span><span class="nm">${esc(s.name)}<br><small>${esc([s.city,s.state].filter(Boolean).join(", "))}</small></span><button class="del" title="Remove" onclick="removeStop(${i})">✕</button></li>`).join("")+end;
  $("#rmeta").textContent=`${ROUTE.length} stops · ~${Math.round(routeMiles())} mi${useHome?" round trip":""}`;
  if(ROUTELINE){ MAP.removeLayer(ROUTELINE); ROUTELINE=null; }
  const R=effectiveRoute();
  if(R.length>=2){ ROUTELINE=L.polyline(R.map(s=>[s.lat,s.lng]),{color:"#2B4071",weight:3,opacity:.65,dashArray:"7,7"}).addTo(MAP); }
}
function openGmaps(){
  const R=effectiveRoute(); if(!R.length)return;
  let stops=R;
  if(stops.length>10){ alert("Google Maps links support about 10 points (home counts as 2). Opening the first 10 — split longer trips into two days."); stops=stops.slice(0,10); }
  const url="https://www.google.com/maps/dir/"+stops.map(s=>`${s.lat},${s.lng}`).join("/");
  window.open(url,"_blank");
}

async function refreshGeoBtn(){
  try{
    const s=await api("POST",{action:"status"});
    const btn=$("#geoBtn");
    if(s&&s.ok){ btn.textContent = s.remaining>0 ? `Geocode addresses (${s.remaining} left)` : `All ${s.total} geocoded ✓`; btn.disabled=s.remaining===0; }
    else if(s&&s.error==="tables_missing"){ banner(s.message); btn.disabled=true; }
  }catch(e){}
}
async function geocodeAll(){
  const btn=$("#geoBtn"); btn.disabled=true;
  try{
    for(let guard=0; guard<200; guard++){
      const r=await api("POST",{action:"run",limit:25});
      if(!r||!r.ok){ if(r&&r.message)banner(r.message); break; }
      btn.textContent=`Geocoding… ${r.remaining} left`;
      if(r.remaining<=0) break;
    }
    await loadPoints(); await refreshGeoBtn();
  }catch(e){ btn.disabled=false; }
}
function banner(msg){ $("#banner").innerHTML = msg?`<div class="banner">${esc(msg)}</div>`:""; }
async function loadPoints(){
  const j=await api("GET");
  if(j&&j.error==="tables_missing"){ banner(j.message); POINTS=[]; }
  else { banner(""); POINTS=(j&&j.points)||[]; }
  POINTS.forEach((p,i)=>p._i=i);
  if(ROUTE.length){ ROUTE=ROUTE.map(s=>POINTS.find(p=>p.name===s.name&&p.lat===s.lat&&p.lng===s.lng)).filter(Boolean); }
  fillStateFilter(); draw(); renderRoute();
}
async function boot(){
  if(!TOKEN){ showGate(); return; }
  if(TOKEN && !ME){ try{ const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+TOKEN},body:JSON.stringify({action:"me"})}); const j=await r.json().catch(()=>({})); if(j&&j.ok){ME=j.profile; sessionStorage.setItem(PKEY,JSON.stringify(ME));} else { TOKEN=null; sessionStorage.removeItem(TKEY); showGate(); return; } }catch(e){} }
  const canMap = !ME || ME.role==="president" || ME.can_travel;
  if(!canMap){ const tb=document.querySelector(".toolbar"); if(tb)tb.style.display="none"; const mp=$("#map"); if(mp)mp.style.display="none"; banner("The Map & route planner are set up for travelling reps. Ask the President to enable travel access if you need them."); return; }
  try{
    if(!BOOTED){ initMap(); BOOTED=true; }
    drawHome();
    await loadPoints();
    const pres = !ME || ME.role==="president";
    const g=$("#geoBtn"); if(g) g.style.display = pres ? "" : "none";
    if(pres) await refreshGeoBtn();
    if(!POINTS.length){ banner(pres ? "No mapped locations yet — click Geocode addresses to plot your dealers. (If it says a table is missing, run geocode.sql in Supabase first.)" : "No mapped locations in your book yet."); }
  }catch(e){}
}
refreshHomeBtn();
if(TOKEN) boot(); else showGate();
</script>
</body></html>
