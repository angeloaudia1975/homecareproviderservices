<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HCPS Admin — Territory Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
 :root{--ink:#16202e;--blue:#3B599A;--blue-dk:#2B4071;--orange:#F5821F;--bg:#eef2f7;--line:#e3e8ef;--muted:#64707e;--ok:#1f9d55;--warn:#e0850f;--danger:#d64545}
 *{box-sizing:border-box;margin:0;padding:0}
 html,body{height:100%}
 body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
 a{color:inherit;text-decoration:none}
 .adminnav{background:var(--ink);display:flex;align-items:center;gap:4px;padding:10px 22px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.14);flex:none}
 .adminnav .bd{color:#fff;font-weight:800;font-size:15px;margin-right:16px}.adminnav .bd span{color:var(--orange)}
 .adminnav a{color:#aeb9c6;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-radius:7px}
 .adminnav a:hover{color:#fff;background:rgba(255,255,255,.07)}.adminnav a.on{color:#fff;background:var(--blue)}
 .adminnav .navright{margin-left:auto;display:flex;gap:10px;align-items:center}
 .lock{background:transparent;border:1px solid rgba(255,255,255,.22);color:#cdd6e2;border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
 .lock:hover{background:rgba(255,255,255,.08);color:#fff}
 .toolbar{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line)}
 .toolbar h1{font-size:15px;font-weight:800;margin-right:6px}
 .toolbar select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;background:#fff}
 .toolbar .sp{flex:1}
 .btn{border:1px solid var(--blue-dk);background:var(--blue);color:#fff;border-radius:8px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer}
 .btn:hover{background:var(--blue-dk)} .btn:disabled{opacity:.55;cursor:not-allowed}
 .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
 .count{font-size:12.5px;color:var(--muted)}
 .legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted)}
 .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);margin-right:4px;vertical-align:-1px}
 .wrap{flex:1;min-height:0;position:relative}
 #map{position:absolute;inset:0}
 .pin span{display:block;width:15px;height:15px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
 .pin.inroute span{width:19px;height:19px;border-color:#2B4071;box-shadow:0 0 0 2px #2B4071}
 .pin.approx span{border-style:dashed;border-color:#e6a23c;opacity:.75}
 .unmap{position:absolute;right:14px;top:14px;z-index:650;width:312px;max-height:74%;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(16,24,40,.22);overflow:hidden}
 .unmap .uhead{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:14px}
 .unmap .uhead .m{color:var(--muted);font-size:11.5px;font-weight:600}
 .unmap .uhead .rx{margin-left:auto;background:none;border:0;color:var(--blue);font-weight:700;font-size:12px;cursor:pointer}
 .unmap #ulist{overflow:auto;padding:4px 6px 8px}
 .unmap .ustate{padding:8px 9px 3px;font-weight:800;color:var(--muted);font-size:11px;letter-spacing:.3px}
 .unmap .uitem{padding:8px 9px;border-radius:8px;border-bottom:1px solid #f0f2f5}
 .unmap .uitem:hover{background:#f7f9fb}
 .unmap .uitem .un{font-weight:700;font-size:12.5px}
 .unmap .uitem .ua{color:var(--muted);font-size:11.5px;margin:1px 0 3px}
 .unmap .uitem a{color:var(--blue);font-weight:700;text-decoration:none;font-size:11.5px}
 .homepin span{display:flex;align-items:center;justify-content:center;width:27px;height:27px;background:#16202e;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.4);font-size:14px}
 .pop b{font-size:13.5px} .pop .st{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:1px 7px;border-radius:20px;margin-left:4px}
 .pop .row{font-size:12px;color:#333;margin-top:3px}.pop a{color:var(--blue);font-weight:700;font-size:12px}
 .pop .addbtn{margin-top:7px;border:1px solid var(--blue-dk);background:var(--blue);color:#fff;border-radius:7px;padding:5px 10px;font-weight:700;font-size:12px;cursor:pointer}
 .banner{margin:0;padding:10px 18px;background:#fff7ed;border-bottom:1px solid #fed7aa;color:#9a3412;font-size:13px}
 /* route panel */
 .routep{position:absolute;left:14px;bottom:14px;z-index:600;width:296px;max-height:66%;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(16,24,40,.22);overflow:hidden}
 .routep .rhead{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:14px}
 .routep .rhead .m{color:var(--muted);font-size:11.5px;font-weight:600}
 .routep .rx{margin-left:auto;background:none;border:0;color:var(--danger);font-weight:700;font-size:12px;cursor:pointer}
 .rtrow{padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px;background:#f8fafc}
 .rtrow label{display:flex;gap:7px;align-items:center;cursor:pointer}
 .routep ol{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
 .routep li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;font-size:12.5px}
 .routep li:hover{background:#f5f7fa} .routep li.homeli{color:var(--muted)}
 .routep li .n{width:20px;height:20px;flex:none;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
 .routep li .nm{flex:1;line-height:1.25}.routep li .nm small{color:var(--muted)}
 .routep li .del{background:none;border:0;color:#b0b8c2;cursor:pointer;font-size:14px;font-weight:800}
 .routep li .del:hover{color:var(--danger)}
 .routep .ractions{display:flex;gap:7px;padding:11px;border-top:1px solid var(--line);flex-wrap:wrap}
 .routep .ractions .btn{flex:1;justify-content:center;text-align:center;padding:9px 8px;font-size:12.5px}
 /* home editor overlay */
 .homeov{position:fixed;inset:0;z-index:1100;background:rgba(16,24,40,.45);display:grid;place-items:center;padding:20px}
 .homecard{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:430px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
 .homecard b{font-size:15px}.homecard p{color:var(--muted);font-size:12.5px;margin:4px 0 12px}
 .homecard input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit}
 .homecard input:focus{outline:2px solid rgba(59,89,154,.35);border-color:var(--blue)}
 .homecard .ha{display:flex;gap:8px;margin-top:12px}.homecard .er{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:15px}
 /* gate */
 .gate{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#16202e,#2B4071);display:grid;place-items:center;padding:20px}
 .gate-card{background:#fff;border-radius:16px;padding:30px;width:100%;max-width:370px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
 .gate-card .brand{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--orange);font-weight:800}
 .gate-card h2{margin:6px 0 3px;font-size:22px}.gate-card p{color:var(--muted);font-size:13px;margin:0 0 16px}
 .gate-card input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit}
 .gate-card input:focus{outline:2px solid rgba(59,89,154,.35);border-color:var(--blue)}
 .gate-card button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;cursor:pointer}
 .gate-card .er{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px}
</style><link rel="stylesheet" href="/admin/admin-shell.css"></head><body>

<header id="ac-head"></header>

<div id="banner"></div>

<div class="toolbar">
  <h1>Territory Map</h1>
  <select id="fState" onchange="draw()"><option value="">All states</option></select>
  <select id="fStatus" onchange="draw()">
    <option value="">All accounts</option>
    <option value="active">Active customers</option>
    <option value="lapsed">Lapsed (3 mo+)</option>
    <option value="prospect">Prospects</option>
  </select>
  <span class="legend"><span><i style="background:#1f9d55"></i>Active</span><span><i style="background:#E8971E"></i>Lapsed 3mo+</span><span><i style="background:#2f73b8"></i>Prospect</span></span>
  <label style="font-size:12px;display:inline-flex;align-items:center;gap:4px;color:#5b6672"><input type="checkbox" id="fDue" onchange="draw()"> Due for visit (90d+)</label>
  <span class="sp"></span>
  <span class="count" id="count"></span>
  <button class="btn ghost" id="homeBtn" onclick="editHome()">🏠 Set home base</button>
  <button class="btn" id="geoBtn" onclick="geocodeAll()">Geocode addresses</button>
  <button class="btn ghost" id="clusterBtn" onclick="togglePins()">Show all pins</button>
  <button class="btn ghost" id="unmapBtn" onclick="toggleUnmapped()">Not on map</button>
  <button class="btn ghost" id="savedBtn" onclick="toggleSaved()">Saved routes</button>
  <button class="btn ghost" id="scoreBtn" onclick="toggleScore()">Scorecard</button>
  <button class="btn ghost" id="weekBtn" onclick="toggleWeek()">This week</button>
</div>

<div class="wrap">
  <div id="map"></div>
  <div class="routep" id="routep" hidden>
    <div class="rhead"><b>Route plan</b> <span class="m" id="rmeta"></span><button class="rx" onclick="clearRoute()">Clear</button></div>
    <div class="rtrow" id="rtRow" style="display:none"><label><input type="checkbox" id="rtChk" checked onchange="toggleRT(this.checked)"> Round trip — start &amp; end at home base</label></div>
    <div class="rtrow"><label style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">Depart <input type="time" id="startTime" value="08:00" style="width:auto" onchange="renderRoute()"> · Visit <input type="number" id="visitMin" value="30" min="0" step="5" style="width:56px" onchange="renderRoute()"> min each</label></div>
    <ol id="rlist"></ol>
    <div class="ractions">
      <button class="btn" onclick="optimize()">Optimize order</button>
      <button class="btn" onclick="saveRouteDialog()">Save route</button>
      <button class="btn ghost" onclick="printRoute()">Print sheet</button>
      <button class="btn ghost" onclick="printPacket()">Business case</button>
      <button class="btn ghost" onclick="openGmaps()">Google Maps →</button>
    </div>
  </div>
  <div class="unmap" id="savedPanel" hidden></div>
  <div class="unmap" id="scorePanel" hidden></div>
  <div class="unmap" id="weekPanel" hidden></div>
  <div class="unmap" id="unmapPanel" hidden>
    <div class="uhead"><b>Not on map</b> <span class="m" id="umeta"></span><button class="rx" onclick="toggleUnmapped()">Close</button></div>
    <div id="ulist"></div>
  </div>
</div>

<div id="gate"></div>
<div id="homeEdit"></div>

<div class="verbadge" style="position:fixed;bottom:6px;right:9px;z-index:1200;font:600 11px/1 system-ui,sans-serif;color:#8a949c;background:rgba(255,255,255,.85);border:1px solid #dde3e8;border-radius:6px;padding:3px 7px;pointer-events:none">VER 2.0</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script>
const $=s=>document.querySelector(s);
const TKEY="hcps_staff_token", PKEY="hcps_staff_profile";
window.addEventListener("hcps-token",function(e){try{TOKEN=e.detail;}catch(_){}});
let TOKEN=HCPS.token();
let ME=null; try{ME=HCPS.profile()}catch(e){ME=null;}
let MAP=null, CLUSTER=null, PLAIN=null, LAYER=null, POINTS=[], UNMAPPED=[], BOOTED=false, ROUTE=[], ROUTELINE=null;
let HOMEMARKER=null, ROUNDTRIP=true;
let ROUTEGEO=null, CURRENT_ROUTE_ID=null, _routeT=null;
let LASTROUTE={distance_m:0,duration_s:0,geometry:null};
const jesc=s=>String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
const fmtUsd=n=>"$"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
// Dealer leave-behind: edit these to change what the customer-facing handout announces.
const ORDERING_URL="https://hcpsonlineordering.netlify.app";
const HANDOUT_UPDATES=[
  "New online ordering platform — browse your lines, see your pricing, and place orders 24/7.",
  "New manufacturer lines added to our catalog — ask your rep what's now available in your territory.",
  "Freight programs & volume pricing on select lines — we'll help you reach free-freight thresholds."
];
// Live handout config (loaded from app_settings; President can edit without a code push).
let HANDOUT={ordering_url:ORDERING_URL, updates:HANDOUT_UPDATES.slice()};
const MFRNAMES={access4u:"Access4U","airavant-bongorx":"AIRAVANT / BongoRx",corsicana:"Corsicana Healthcare","climbing-steps":"Climbing Steps",bemis:"BEMIS Assurance",pedifix:"PediFix",gce:"Ohio Medical / GCE","strongback-mobility":"Strongback Mobility","ovation-medical":"Ovation Medical"};
const mfrLabelSlug=s=>MFRNAMES[s]||String(s||"").split("-").map(w=>w?w[0].toUpperCase()+w.slice(1):w).join(" ");
function isDue(p){ if(!p||!p.last_visit) return true; return (Date.now()-new Date(p.last_visit).getTime())>90*864e5; }
async function markVisited(id,i){
  try{ const r=await api2({action:"log_visit",dealer_id:id}); if(r&&r.ok){ if(POINTS[i])POINTS[i].last_visit=r.visited_at; banner("Visit logged ✓"); MAP&&MAP.closePopup(); draw(); } }catch(e){ banner("Couldn't log visit."); }
}
async function loadSettings(){
  try{ const r=await api2({action:"get_settings",key:"handout"}); if(r&&r.ok&&r.value){ HANDOUT={ordering_url:r.value.ordering_url||ORDERING_URL, updates:Array.isArray(r.value.updates)&&r.value.updates.length?r.value.updates:HANDOUT_UPDATES.slice()}; } }catch(e){}
}
/* ---------- territory scorecard ---------- */
function toggleScore(){ const p=$("#scorePanel"); if(!p.hidden){p.hidden=true;return;} p.hidden=false; p.innerHTML=scorecardHtml(); }
function scorecardHtml(){
  const P=POINTS||[];
  const cust=P.filter(p=>p.klass==="active").length, opp=P.filter(p=>p.klass==="lapsed").length, pros=P.filter(p=>p.klass==="prospect").length;
  const sales=P.reduce((a,p)=>a+(Number(p.sales)||0),0);
  const oppLines=P.reduce((a,p)=>a+(Number(p.opps_count)||0),0);
  const dueN=P.filter(isDue).length, neverN=P.filter(p=>!p.last_visit).length;
  const lc={}; P.forEach(p=>(p.opps||[]).forEach(s=>{lc[s]=(lc[s]||0)+1;}));
  const top=Object.entries(lc).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([slug,c])=>`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #eef1f4"><span>${esc(mfrLabelSlug(slug))}</span><b>${c} account${c===1?"":"s"}</b></div>`).join("");
  const box=(l,v,c)=>`<div style="background:#f4f7fb;border:1px solid #e2e8f1;border-radius:8px;padding:8px 10px"><div style="font-size:18px;font-weight:800;color:${c||"#1b2733"}">${v}</div><div style="font-size:11px;color:#6b7683">${l}</div></div>`;
  const pres=(ME&&ME.role==="president");
  return `<div class="uhead"><b>Territory scorecard</b><button class="rx" onclick="toggleScore()">Close</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0">
      ${box("Accounts",P.length)}${box("Territory sales",fmtUsd(sales),"#1f9d55")}
      ${box("Active customers",cust,"#1f9d55")}${box("Lapsed 3mo+",opp,"#E8971E")}
      ${box("Prospects",pros,"#2f73b8")}${box("Open opp. lines",oppLines,"#2f73b8")}
      ${box("Due for visit",dueN,"#b26b00")}${box("Never visited",neverN,"#b26b00")}
    </div>
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#5b6672;margin:6px 0 4px">Most common un-pitched lines</div>
    <div>${top||'<div class="dim">No open opportunities.</div>'}</div>
    ${pres?`<button class="btn ghost" style="margin-top:12px;width:100%" onclick="editHandout()">Edit dealer-handout “What's new” →</button>`:""}`;
}
function editHandout(){
  if(!(ME&&ME.role==="president")) return;
  $("#homeEdit").innerHTML=`<div class="homeov"><div class="homecard">
    <b>Edit “What's new” (dealer handout)</b>
    <p>One item per line. This is the customer-facing news on the handout you print for dealers.</p>
    <textarea id="hupd" style="width:100%;height:120px;font:13px Arial">${esc((HANDOUT.updates||[]).join("\n"))}</textarea>
    <input id="hurl" style="width:100%;margin-top:8px" value="${esc(HANDOUT.ordering_url||ORDERING_URL)}" placeholder="Ordering URL">
    <div class="ha"><button class="btn" onclick="saveHandout()">Save</button><button class="btn ghost" onclick="closeHome()">Cancel</button></div>
    <div class="er" id="herr"></div></div></div>`;
  setTimeout(()=>{const t=$("#hupd"); if(t)t.focus();},40);
}
async function saveHandout(){
  const updates=(($("#hupd")||{}).value||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const url=(($("#hurl")||{}).value||"").trim()||ORDERING_URL;
  const e=$("#herr"); if(e)e.textContent="Saving…";
  try{ const r=await api2({action:"set_settings",key:"handout",value:{ordering_url:url,updates}}); if(r&&r.ok){ HANDOUT={ordering_url:url,updates}; closeHome(); banner("Handout news updated ✓"); } else { if(e)e.textContent=(r&&r.error)||"Couldn't save."; } }catch(err){ if(e)e.textContent="Couldn't save."; }
}
/* ---------- weekly schedule ---------- */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function mondayOf(d){ const x=new Date(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); x.setHours(0,0,0,0); return x; }
let WEEKSTART=mondayOf(new Date());
function toggleWeek(){ const p=$("#weekPanel"); if(!p.hidden){p.hidden=true;return;} p.hidden=false; refreshWeek(); }
function shiftWeek(n){ WEEKSTART=new Date(WEEKSTART.getTime()+n*7*864e5); refreshWeek(); }
async function refreshWeek(){
  const p=$("#weekPanel");
  p.innerHTML=`<div class="uhead"><b>Weekly schedule</b><button class="rx" onclick="toggleWeek()">Close</button></div><div id="weekBody">Loading…</div>`;
  let routes=[]; try{ const r=await api2({action:"list_routes"}); routes=(r&&r.routes)||[]; }catch(e){}
  const byDate={}, unscheduled=[];
  routes.forEach(rt=>{ if(rt.scheduled_date){ (byDate[rt.scheduled_date]||(byDate[rt.scheduled_date]=[])).push(rt); } else unscheduled.push(rt); });
  const dayName=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const todayS=ymd(new Date()); let totStops=0,totSec=0;
  const days=[]; for(let i=0;i<7;i++) days.push(new Date(WEEKSTART.getTime()+i*864e5));
  const wkLabel=`${WEEKSTART.toLocaleDateString(undefined,{month:"short",day:"numeric"})} – ${days[6].toLocaleDateString(undefined,{month:"short",day:"numeric"})}`;
  const rtRow=rt=>`<div style="display:flex;align-items:center;gap:6px;padding:3px 0"><div style="flex:1;min-width:0"><b>${esc(rt.name)}</b><br><small style="color:#6b7683">${rt.stops_count} stop${rt.stops_count===1?"":"s"}${rt.duration_s?" · "+fmtDur(rt.duration_s):""}</small></div><button class="btn" style="padding:3px 8px;font-size:11px" onclick="loadSaved('${rt.id}')">Open</button><button class="btn ghost" style="padding:3px 8px;font-size:11px" onclick="printSaved('${rt.id}')">Sheet</button></div>`;
  const dayHtml=days.map((d,i)=>{
    const ds=ymd(d); const list=byDate[ds]||[]; list.forEach(rt=>{ totStops+=rt.stops_count||0; totSec+=rt.duration_s||0; });
    const today=ds===todayS;
    const inner=list.length?list.map(rtRow).join(""):`<div style="color:#9aa4ae;font-size:11px;padding:3px 0">—</div>`;
    return `<div style="border:1px solid ${today?"#2B4071":"#eef1f4"};background:${today?"#f4f7fb":"#fff"};border-radius:8px;padding:6px 9px;margin:5px 0">
      <div style="font-weight:700;font-size:12px;color:#2B4071;margin-bottom:2px">${dayName[i]} <span style="color:#9aa4ae;font-weight:400">${d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span></div>${inner}</div>`;
  }).join("");
  const uns=unscheduled.length?`<div style="margin-top:10px"><div style="font-weight:700;font-size:12px;color:#6b7683">Unscheduled</div>${unscheduled.map(rtRow).join("")}</div>`:"";
  $("#weekBody").innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin:6px 0">
      <button class="btn ghost" style="padding:4px 10px" onclick="shiftWeek(-1)">‹</button>
      <b style="flex:1;text-align:center">${wkLabel}</b>
      <button class="btn ghost" style="padding:4px 10px" onclick="shiftWeek(1)">›</button>
    </div>${dayHtml}

/* ---------- route planning ---------- */
function hav(a,b){ const R=3958.8,tr=x=>x*Math.PI/180; const dLat=tr(b.lat-a.lat),dLng=tr(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(tr(a.lat))*Math.cos(tr(b.lat))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function effectiveRoute(){
  if(HOME && ROUNDTRIP && ROUTE.length){ const h={name:"Home base",lat:HOME.lat,lng:HOME.lng,_home:true}; return [h,...ROUTE,h]; }
  return ROUTE.slice();
}
function routeMiles(){ const R=effectiveRoute(); let m=0; for(let i=1;i<R.length;i++) m+=hav(R[i-1],R[i]); return m; }
function addStop(i){ const p=POINTS[i]; if(!p)return; if(inRoute(p)){ ROUTE=ROUTE.filter(s=>s._i!==p._i); } else { if(ROUTE.length>=25){ alert("That's a lot of stops — keep a route under 25 for a workable day."); return; } ROUTE.push(p); } renderRoute(); draw(); if(MAP)MAP.closePopup(); }
function removeStop(i){ ROUTE.splice(i,1); renderRoute(); draw(); }
function clearRoute(){ ROUTE=[]; CURRENT_ROUTE_ID=null; renderRoute(); draw(); }
async function optimize(){
  if(ROUTE.length<2){ renderRoute(); return; }
  const home=(HOME&&ROUNDTRIP)?{lat:HOME.lat,lng:HOME.lng}:null;
  try{
    const r=await api2({action:"optimize",home,stops:ROUTE.map(s=>({lat:s.lat,lng:s.lng})),round_trip:!!(HOME&&ROUNDTRIP)});
    if(r&&r.ok&&Array.isArray(r.order)&&r.order.length===ROUTE.length){ ROUTE=r.order.map(i=>ROUTE[i]); renderRoute(); draw(); return; }
    if(r&&r.need_key){ banner(r.message); }
  }catch(e){}
  optimizeLocal();   // fallback: nearest-neighbour by straight-line distance
}
function optimizeLocal(){
  if(ROUTE.length<2){ renderRoute(); return; }
  const pool=ROUTE.slice(); const ordered=[];
  let cur;
  if(HOME && ROUNDTRIP){ cur={lat:HOME.lat,lng:HOME.lng}; }          // nearest-neighbour from home
  else { ordered.push(pool.shift()); cur=ordered[0]; }               // keep first stop fixed
  while(pool.length){ let bi=0,bd=Infinity; for(let i=0;i<pool.length;i++){const d=hav(cur,pool[i]); if(d<bd){bd=d;bi=i;}} cur=pool.splice(bi,1)[0]; ordered.push(cur); }
  ROUTE=ordered; renderRoute();
}
function renderRoute(){
  const panel=$("#routep"); panel.hidden = ROUTE.length===0;
  $("#rtRow").style.display = HOME ? "block" : "none";
  const cb=$("#rtChk"); if(cb) cb.checked=ROUNDTRIP;
  const list=$("#rlist");
  if(!ROUTE.length){ list.innerHTML=""; if(ROUTELINE){MAP.removeLayer(ROUTELINE);ROUTELINE=null;} if(ROUTEGEO){MAP.removeLayer(ROUTEGEO);ROUTEGEO=null;} LASTROUTE={distance_m:0,duration_s:0,geometry:null}; CURRENT_ROUTE_ID=null; return; }
  const useHome = HOME && ROUNDTRIP;
  const start = useHome?`<li class="homeli"><span class="n" style="background:#16202e">🏠</span><span class="nm"><b>Start — Home base</b><br><small>${esc(HOME.short||HOME.q||"")}</small></span></li>`:"";
  const end   = useHome?`<li class="homeli"><span class="n" style="background:#16202e">🏠</span><span class="nm"><b>End — Home base</b><br><small>return</small></span></li>`:"";
  list.innerHTML=start+ROUTE.map((s,i)=>`<li><span class="n">${i+1}</span><span class="nm">${esc(s.name)}<br><small>${esc([s.city,s.state].filter(Boolean).join(", "))}</small></span><button class="del" title="Remove" onclick="removeStop(${i})">✕</button></li>`).join("")+end;
  updateRouteMeta();
  if(ROUTELINE){ MAP.removeLayer(ROUTELINE); ROUTELINE=null; }
  const R=effectiveRoute();
  if(R.length>=2){ ROUTELINE=L.polyline(R.map(s=>[s.lat,s.lng]),{color:"#93a2bb",weight:3,opacity:.55,dashArray:"6,8"}).addTo(MAP); }  // instant straight-line preview

}
function fmtDur(s){ s=Math.round(s||0); const h=Math.floor(s/3600),m=Math.round((s%3600)/60); return h?`${h}h ${m}m`:`${m}m`; }
function fmtMi(m){ return Math.round((m||0)/1609.34); }
function updateRouteMeta(){
  const useHome=HOME&&ROUNDTRIP;
  const drive = LASTROUTE.duration_s ? ` · ${fmtMi(LASTROUTE.distance_m)} mi · ${fmtDur(LASTROUTE.duration_s)} drive` : ` · ~${Math.round(routeMiles())} mi (as the crow flies)`;
  const el=$("#rmeta"); if(el) el.textContent=`${ROUTE.length} stops${drive}${useHome?" · round trip":""}`;
}
function scheduleRoute(){ if(_routeT) clearTimeout(_routeT); _routeT=setTimeout(routeIt,600); }
async function routeIt(){
  const R=effectiveRoute();
  if(R.length<2){ if(ROUTEGEO){MAP.removeLayer(ROUTEGEO);ROUTEGEO=null;} LASTROUTE={distance_m:0,duration_s:0,geometry:null}; updateRouteMeta(); return; }
  const coords=R.map(s=>[s.lng,s.lat]);
  try{
    const r=await api2({action:"directions",coords});
    if(r&&r.ok&&r.geometry&&r.geometry.length){
      if(ROUTEGEO){MAP.removeLayer(ROUTEGEO);ROUTEGEO=null;}
      if(ROUTELINE){MAP.removeLayer(ROUTELINE);ROUTELINE=null;}
      ROUTEGEO=L.polyline(r.geometry.map(c=>[c[1],c[0]]),{color:"#2B4071",weight:5,opacity:.85}).addTo(MAP);
      LASTROUTE={distance_m:r.distance_m,duration_s:r.duration_s,geometry:r.geometry,legs:r.legs||[]};
      updateRouteMeta();
    } else if(r&&r.need_key){ banner(r.message||"Add your OpenRouteService key (ORS_API_KEY) in Netlify to enable live routing."); }
    else if(r&&r.message){ banner("Routing: "+r.message); }
  }catch(e){}
}

function parseTimeMin(v){ const m=/^(\d{1,2}):(\d{2})$/.exec(String(v||"").trim()); if(!m)return 8*60; return (+m[1])*60+(+m[2]); }
function fmtClock(min){ min=Math.round(((min%1440)+1440)%1440); let h=Math.floor(min/60),m=min%60; const ap=h<12?"AM":"PM"; let hh=h%12; if(hh===0)hh=12; return `${hh}:${String(m).padStart(2,"0")} ${ap}`; }
function nowStamp(){ const d=new Date(); return d.toLocaleDateString(undefined,{weekday:"short",year:"numeric",month:"short",day:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function routeSheetHtml(title){
  const R=effectiveRoute();
  const legs=(LASTROUTE.legs||[]);
  const start=parseTimeMin((($("#startTime")||{}).value));
  const dwell=Math.max(0, parseInt((($("#visitMin")||{}).value),10)||0);
  const hasLegs = R.length>=2 && legs.length>=R.length-1;
  let cum=start; const rows=[]; let stopNo=0;
  for(let i=0;i<R.length;i++){
    const node=R[i];
    if(i>0 && hasLegs){ cum += (legs[i-1].duration_s||0)/60; }
    const arrive=cum;
    const legNext = (i<R.length-1 && hasLegs) ? legs[i] : null;
    const nextMi = legNext? Math.round((legNext.distance_m||0)/1609.34) : null;

  if(TOKEN && !ME){ try{ const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+TOKEN},body:JSON.stringify({action:"me"})}); const j=await r.json().catch(()=>({})); if(j&&j.ok){ME=j.profile; HCPS.setSession({profile:ME});} else { HCPS.signOut(); TOKEN=null; showGate(); return; } }catch(e){} }
  const canMap = !ME || ME.role==="president" || ME.can_travel;
  if(!canMap){ const tb=document.querySelector(".toolbar"); if(tb)tb.style.display="none"; const mp=$("#map"); if(mp)mp.style.display="none"; banner("The Map & route planner are set up for travelling reps. Ask the President to enable travel access if you need them."); return; }
  try{
    if(!BOOTED){ initMap(); BOOTED=true; }
    drawHome();
    loadSettings();
    await loadPoints();
    const pres = !ME || ME.role==="president";
    const g=$("#geoBtn"); if(g) g.style.display = pres ? "" : "none";
    if(pres) await refreshGeoBtn();
    if(!POINTS.length){ banner(pres ? "No mapped locations yet — click Geocode addresses to plot your dealers. (If it says a table is missing, run geocode.sql in Supabase first.)" : "No mapped locations in your book yet."); }
  }catch(e){}
}
refreshHomeBtn();
if(TOKEN) boot(); else showGate();
</script>
