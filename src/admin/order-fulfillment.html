<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS Admin — Order Fulfillment</title>
<link rel="stylesheet" href="/admin/admin-shell.css">
<style>
 .filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
 .seg{display:inline-flex;background:#e3e9f0;border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
 .seg button{background:none;border:0;border-radius:7px;padding:7px 12px;font-weight:700;font-size:12.5px;color:#41576b;cursor:pointer;font-family:inherit}
 .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(16,38,63,.12)}
 .st{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:6px;padding:2px 8px;white-space:nowrap}
 .st.pending_account_setup{background:#fdecea;color:#9b1c1c}.st.submitted{background:#eaf3fb;color:#12466e}.st.placed{background:#fff7e6;color:#8a5a00}.st.confirmed{background:#f3eef9;color:#5b3fa0}.st.shipped{background:#fdeee0;color:#b45309}.st.completed{background:#e7f6ec;color:#1f7a44}.st.cancelled{background:#eef2f6;color:#8a94a1}
 .exp{background:#f7fafd;border-top:1px solid #eef2f6}
 .exp td{padding:12px 14px}
 .itbl{width:100%;font-size:12.5px;margin-top:4px}
 .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
 .caret{cursor:pointer;color:var(--gray);font-weight:700;user-select:none}
.acctnote{display:inline-block;margin:4px 0 0;padding:3px 8px;border-radius:6px;background:#fff7e6;border:1px solid #f1d9a6;color:#8a5a00;font-size:12px;font-weight:700}
</style>
</head><body>
<header id="ac-head"></header>
<div class="wrap">
  <div class="top"><div><h1>Order Review &amp; Fulfillment</h1><div class="sub">Dealer orders submitted on the ordering portal — confirm, ship, and complete them here.</div></div></div>
  <div id="body"><div class="msg">Loading orders…</div></div>
</div>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const TKEY="hcps_staff_token", PKEY="hcps_staff_profile";
window.addEventListener("hcps-token",function(e){try{TOKEN=e.detail;}catch(_){}});
let ME=null; try{ME=HCPS.profile()}catch(e){ME=null;}
let TOKEN=HCPS.token(), ORDERS=[], STATS={}, MANAGE=false, FILT="open", OPEN=new Set();
const ST=["pending_account_setup","submitted","placed","confirmed","shipped","completed","cancelled"];
const LBL={pending_account_setup:"Pending Manufacturer Account Setup",submitted:"Received by HCPS",placed:"Placed with manufacturer",confirmed:"Confirmed by manufacturer",shipped:"Shipped",completed:"Completed",cancelled:"Cancelled"};

function gate(msg){$("#body").innerHTML=`<div class="gate"><h2>Staff sign-in</h2><p class="hint" style="margin:2px 0 10px">Sign in with your work email and password.</p><input id="lemail" type="email" placeholder="Email" autocomplete="username"><input id="lpass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitTok()"><button class="go" onclick="submitTok()">Sign in</button><div class="er" id="lerr" style="color:#b42323;margin-top:8px">${msg||""}</div></div>`;setTimeout(()=>{const t=$("#lemail");if(t)t.focus();},50);}
async function submitTok(){
  const email=(($("#lemail")||{}).value||"").trim(), password=(($("#lpass")||{}).value||"");
  const e=$("#lerr"); if(e)e.textContent="Signing in…";
  try{ const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email,password})});
    const j=await r.json().catch(()=>({})); if(!j||!j.ok){ gate((j&&j.message)||"Could not sign in."); return; }
    HCPS.setSession(j); TOKEN=j.token; ME=j.profile; load();
  }catch(err){ gate("Could not reach the server. Try again."); }
}
function lock(){ HCPS.signOut(); TOKEN=null; ME=null; location.reload(); }
async function api(payload){ const r=await fetch("/.netlify/functions/orders-admin",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+TOKEN},body:JSON.stringify(payload)}); return {status:r.status,body:await r.json().catch(()=>({}))}; }

async function load(){
  if(!TOKEN){ gate(); return; }
  const r=await api({action:"list"});
  if(r.status===401){ gate("Your session ended — sign in again."); return; }
  const j=r.body;
  if(j&&j.error==="tables_missing"){ $("#body").innerHTML=`<div class="msg">No orders yet. The order queue fills in as dealers submit orders on the portal.</div>`; return; }
  if(!j||!j.ok){ $("#body").innerHTML=`<div class="msg err">${esc((j&&(j.message||j.error))||"Couldn't load.")}</div>`; return; }
  ORDERS=j.orders||[]; STATS=j.stats||{}; MANAGE=!!j.manage;
  render();
}

function render(){
  const openStatuses=new Set(["pending_account_setup","submitted","placed","confirmed","shipped"]);
  let rows = FILT==="open" ? ORDERS.filter(o=>openStatuses.has(o.status)) : (FILT==="all"?ORDERS:ORDERS.filter(o=>o.status===FILT));
  const kpi=(l,v,cls)=>`<div class="kpi"><div class="l">${l}</div><div class="v ${cls||''}">${v}</div></div>`;
  const kpis=`<div class="kpis" style="margin-bottom:14px">
    ${kpi("Account setup",STATS.pending_account_setup||0,"orange")}${kpi("Received",STATS.submitted||0,"blue")}${kpi("Placed",STATS.placed||0,"")}${kpi("Confirmed",STATS.confirmed||0,"")}${kpi("Shipped",STATS.shipped||0,"orange")}${kpi("Completed",STATS.completed||0,"")}${kpi("Cancelled",STATS.cancelled||0,"")}
  </div>`;
  const seg=(v,l)=>`<button class="${FILT===v?'on':''}" onclick="setFilt('${v}')">${l}</button>`;
  const filt=`<div class="filt"><div class="seg">${seg("open","Open")}${seg("pending_account_setup","Account setup")}${seg("submitted","Received")}${seg("placed","Placed")}${seg("confirmed","Confirmed")}${seg("shipped","Shipped")}${seg("completed","Completed")}${seg("cancelled","Cancelled")}${seg("all","All")}</div><span class="hint" style="margin:0">${rows.length} order${rows.length===1?"":"s"}</span></div>`;
  let body;
  if(!rows.length){ body=`<div class="msg">No orders in this view${ORDERS.length?"":" yet — the queue fills as dealers submit orders on the portal"}.</div>`; }
  else{
    const trs=rows.map(o=>{
      const open=OPEN.has(o.id);
      const acts=MANAGE?actions(o):`<span class="hint" style="margin:0">${esc(o.tracking||"")}</span>`;
      const main=`<tr>
        <td><span class="caret" onclick="toggle('${o.id}')">${open?"▾":"▸"}</span></td>
        <td class="lbl"><a class="link" href="/admin/dealer.html?id=${encodeURIComponent(o.dealer_id||"")}">${esc(o.dealer)}</a>
          <div class="hint" style="margin:0">${esc(o.manufacturer)}${o.po?" · PO "+esc(o.po):""}${o.rep?" · "+esc(o.rep):""}</div>
          ${o.account_notice?`<div class="acctnote">⚠ ${esc(o.account_notice)}</div>`:""}
          ${/email failed|resubmitted/i.test(o.admin_notes||"")?`<div class="acctnote">⚠ ${esc(/email failed/i.test(o.admin_notes)?"HCPS order email failed — confirm by hand":"Dealer resubmitted this order — recorded once; confirm the HCPS order email arrived")}</div>`:""}</td>
        <td class="num">${o.item_count}</td>
        <td class="num">${money(o.subtotal)}${o.estimated_total!=null&&o.freight_fee>0?`<div class="hint" style="margin:0">+ ${money(o.freight_fee)} freight = ${money(o.estimated_total)}</div>`:""}</td>
        <td>${o.submitted_at?new Date(o.submitted_at).toLocaleDateString():""}</td>
        <td><span class="st ${o.status}">${LBL[o.status]||o.status}</span>${o.tracking?`<div class="hint" style="margin:0">📦 ${esc(o.tracking)}</div>`:""}</td>
        <td><div class="acts">${acts}</div></td></tr>`;
      const exp=open?`<tr class="exp"><td></td><td colspan="6">
        <div class="hint" style="margin:0 0 6px">Ship to: ${esc(o.ship||"—")} · ${esc(o.contact.name||"")} ${o.contact.phone?"· ☎ "+esc(o.contact.phone):""} ${o.contact.email?"· "+esc(o.contact.email):""}</div>
        <table class="itbl"><thead><tr><th>Code</th><th>Item</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Line</th></tr></thead>
        <tbody>${(o.items||[]).map(i=>`<tr><td>${esc(i.code||"")}</td><td>${esc(i.name||"")}</td><td class="num">${i.qty}</td><td class="num">${money(i.unit)}</td><td class="num">${money(i.line)}</td></tr>`).join("")||`<tr><td colspan="5" class="hint">No line items recorded.</td></tr>`}</tbody></table>
        ${o.notes?`<div class="hint" style="margin:6px 0 0">Dealer note: ${esc(o.notes)}</div>`:""}${o.admin_notes?`<div class="hint" style="margin:2px 0 0">Admin note: ${esc(o.admin_notes)}</div>`:""}</td></tr>`:"";
      return main+exp;
    }).join("");
    body=`<div class="card" style="padding:6px 10px"><table>
      <thead><tr><th></th><th>Dealer / line</th><th class="num">Items</th><th class="num">Subtotal</th><th>Submitted</th><th>Status</th><th></th></tr></thead>
      <tbody>${trs}</tbody></table></div>`;
  }
  $("#body").innerHTML=kpis+filt+body;
}
function actions(o){
  const btn=(l,s,cls)=>`<button class="btn sm ${cls||''}" onclick="setStatus('${o.id}','${s}')">${l}</button>`;
  if(o.status==="pending_account_setup") return `<button class="btn sm blue" onclick="releaseHold('${o.id}')">Release — account is set up</button>`+btn("Cancel","cancelled","ghost");
  if(o.status==="submitted") return btn("Mark placed with manufacturer","placed","blue")+btn("Cancel","cancelled","ghost")+`<button class="btn sm ghost" onclick="printOrder('${o.id}')">Print</button>`;
  if(o.status==="placed") return btn("Record manufacturer confirmation","confirmed","blue")+btn("Cancel","cancelled","ghost")+`<button class="btn sm ghost" onclick="printOrder('${o.id}')">Print</button>`;
  if(o.status==="confirmed") return btn("Ship","shipped","orange")+btn("Cancel","cancelled","ghost");
  if(o.status==="shipped")   return btn("Complete","completed","");
  return `<span class="hint" style="margin:0">${esc(o.tracking||"—")}</span>`;
}
/* Release a held order once the dealer's manufacturer account is recorded in Dealer 360. Prices and freight are re-checked on the
   server; a change needs the dealer's confirmation of exactly the figures shown (sent back, so anything that moves again is
   refused), and a line the order record can't re-price (price family / upgrade) needs a by-hand check. Nothing goes to the
   manufacturer here. */
async function releaseHold(id,extra){
  const payload=Object.assign({action:"release_account_hold",id},extra||{});
  const r=await api(payload); const j=r&&r.body;
  if(j&&j.ok) return load();
  if(j&&j.error==="manual_price_check"){
    const kept=(j.lines||[]).filter(l=>l.kept).map(l=>`${l.code}: ${money(l.old_unit)} (recorded at checkout)`).join("\n");
    const note=window.prompt("These lines were ordered with a price family or upgrade the order record doesn't keep, so their price can't be re-checked automatically:\n"+kept+"\n\nCheck them by hand. What did you check? (leave empty to stop)","");
    if(note&&note.trim()) return releaseHold(id,Object.assign({},extra,{kept_prices_checked:true,note:[extra&&extra.note,note.trim()].filter(Boolean).join(" · ")})); return; }
  if(j&&j.error==="prices_changed"){
    const lines=(j.lines||[]).filter(l=>!l.kept&&l.new_unit!=null&&Math.abs(l.new_unit-l.old_unit)>=0.005).map(l=>`${l.code}: ${money(l.old_unit)} → ${money(l.new_unit)}`);
    const fr=j.freight&&j.proposal&&j.proposal.freight!=null?[`Freight: ${money(j.freight.old)} → ${money(j.freight.new)}`]:[];
    const note=window.prompt("Prices changed since the dealer ordered:\n"+lines.concat(fr).join("\n")+"\n\nConfirm exactly these figures with the dealer first. Who confirmed, and how? (leave empty to stop)","");
    if(note&&note.trim()) return releaseHold(id,Object.assign({},extra,{dealer_confirmed:true,confirmed:j.proposal,note:[extra&&extra.note,note.trim()].filter(Boolean).join(" · ")})); return; }
  alert((j&&(j.message||j.error))||"Could not release this order.");
}
function toggle(id){ if(OPEN.has(id))OPEN.delete(id); else OPEN.add(id); render(); }
function setFilt(v){ FILT=v; render(); }
async function setStatus(id,status){
  let tracking;
  if(status==="shipped"){ tracking=window.prompt("Tracking number (optional):",""); if(tracking===null) return; }
  const payload={action:"set_status",id,status}; if(tracking) payload.tracking_number=tracking;
  if(status==="confirmed"){
    const conf=window.prompt("Manufacturer confirmation # (from the manufacturer's order confirmation):",""); if(conf===null) return;
    const fr=window.prompt("Actual freight on the manufacturer's confirmation, in dollars (leave blank if it has none yet):",""); if(fr===null) return;
    payload.mfr_confirmation=conf; if(String(fr).trim()!=="") payload.actual_freight=Number(String(fr).replace(/[$,\s]/g,""));
  }
  if(status==="cancelled" && !window.confirm("Cancel this order?")) return;
  const r=await api(payload);
  if(r.body&&r.body.ok){ const o=ORDERS.find(x=>x.id===id); if(o){ o.status=status; if(tracking)o.tracking=tracking; if(r.body.freight_fee!=null)o.freight_fee=Number(r.body.freight_fee); if(r.body.estimated_total!=null)o.estimated_total=Number(r.body.estimated_total); if(r.body.admin_notes!=null)o.admin_notes=r.body.admin_notes; } recomputeStats(); render(); }
  else alert("Couldn't update: "+((r.body&&(r.body.error||r.body.message))||r.status));
}
/* A clean printable order sheet for placing the order with the manufacturer (HCPS does that itself). */
function printOrder(id){
  const o=ORDERS.find(x=>x.id===id); if(!o) return;
  const rows=(o.items||[]).map(i=>`<tr><td>${esc(i.code||"")}</td><td>${esc(i.name||"")}</td><td style="text-align:center">${i.qty}</td><td style="text-align:right">${money(i.unit)}</td><td style="text-align:right">${money(i.line)}</td></tr>`).join("");
  const w=window.open("","_blank"); if(!w) return;
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Order ${esc(o.po||o.id)}</title><style>body{font:13px Arial,sans-serif;color:#10263f;margin:28px}h1{font-size:18px;margin:0 0 4px}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left}.k{color:#6b7280;width:150px}</style></head><body>
  <h1>${esc(o.manufacturer)} — dealer order received by HCPS</h1><div class="k">Not yet placed with the manufacturer unless marked below.</div>
  <table><tr><td class="k">Dealer</td><td>${esc(o.dealer)}</td></tr><tr><td class="k">PO</td><td>${esc(o.po||"—")}</td></tr>${o.account_notice?`<tr><td class="k">Account</td><td><b>${esc(o.account_notice)}</b></td></tr>`:""}<tr><td class="k">Ship to</td><td>${esc(o.ship||"—")}</td></tr>
  <tr><td class="k">Contact</td><td>${esc([o.contact.name,o.contact.phone,o.contact.email].filter(Boolean).join(" · "))}</td></tr><tr><td class="k">Submitted</td><td>${o.submitted_at?new Date(o.submitted_at).toLocaleString():""}</td></tr><tr><td class="k">Status</td><td>${esc(LBL[o.status]||o.status)}</td></tr></table>
  <table><thead><tr><th>Item #</th><th>Description</th><th style="text-align:center">Qty</th><th style="text-align:right">Unit</th><th style="text-align:right">Line</th></tr></thead><tbody>${rows}</tbody></table>
  <p style="text-align:right"><b>Merchandise subtotal: ${money(o.subtotal)}</b>${o.freight_fee>0?`<br>Freight: ${money(o.freight_fee)}<br><b>Total: ${money(o.estimated_total)}</b>`:""}</p>
  ${o.notes?`<p><b>Dealer note:</b> ${esc(o.notes)}</p>`:""}<script>window.print()<\/script></body></html>`);
  w.document.close();
}
function recomputeStats(){ const s={}; for(const k of ST)s[k]=0; for(const o of ORDERS)s[o.status]=(s[o.status]||0)+1; STATS=s; }

load();
</script>
</body></html>
