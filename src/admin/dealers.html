<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS — Dealer Master &amp; Merge</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#eef2f6;color:#10263f}
.wrap{max-width:min(1720px,98vw);margin:0 auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #ef6a1f;padding-bottom:12px;flex-wrap:wrap;gap:10px}
.top h1{margin:0;font-size:22px}.top .sub{color:#5b7085;font-size:13px;margin-top:3px}
.kpis{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.kpi{background:#fff;border:1px solid #dbe4ec;border-radius:11px;padding:10px 16px;min-width:120px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#5b7085}
.kpi .v{font-size:22px;font-weight:800;margin-top:3px}.kpi .v.orange{color:#ef6a1f}.kpi .v.warn{color:#b4651a}
.tabs{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}
.tab{background:#dde6ee;border:0;border-radius:8px 8px 0 0;padding:9px 15px;font-weight:700;font-size:13px;color:#41576b;cursor:pointer}
.tab.on{background:#10263f;color:#fff}
.card{background:#fff;border:1px solid #dbe4ec;border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:#1681c2}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:7px 8px;border-bottom:1px solid #eef2f6;vertical-align:middle}
th{text-align:left;font-size:10.5px;text-transform:uppercase;color:#5b7085;padding:6px 8px;border-bottom:2px solid #e2e9f0}
.lbl{font-weight:600}.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.dim{color:#8496a8}
.chip{display:inline-block;background:#eaf3fb;color:#12466e;border:1px solid #cfe2fb;border-radius:20px;padding:1px 9px;font-size:11px;margin:1px 3px 1px 0;white-space:nowrap}
.chip.al{background:#f4f0fb;color:#5b3fa0;border-color:#e0d5f5}
.chip.acc{background:#e9f7ef;color:#1c7a44;border-color:#bfe6cd}
.chip.rev{background:#fff3e0;color:#a5590f;border-color:#f2d9b0}
.link{color:#1681c2;cursor:pointer;font-weight:600}.link:hover{text-decoration:underline}
.warn{color:#b4651a;font-weight:700}.ok{color:#1c7a44;font-weight:700}
button.go{background:#10263f;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
button.go.orange{background:#ef6a1f}button.go.blue{background:#1681c2}button.go[disabled]{opacity:.4;cursor:not-allowed}
button.sm{padding:6px 12px;font-size:12px}
input,select{font:inherit;padding:8px 10px;border:1px solid #cdd8e3;border-radius:8px;background:#fff}
.drow:hover{background:#f4f9fe}
.mergebar{position:sticky;top:0;z-index:5;background:#10263f;color:#fff;border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.mergebar .sel{font-weight:700}
.hint{font-size:12px;color:#5b7085;margin:-2px 0 10px}
.gate{max-width:360px;margin:60px auto}.gate input{width:100%;margin:10px 0}
.msg{background:#fff;border:1px solid #dbe4ec;border-radius:12px;padding:22px;text-align:center;color:#5b7085}
.msg.err{background:#fdecec;border-color:#f3c0c0;color:#b42323}
.backbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;min-width:0}.fld label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#5b7085}
.fld input{width:100%;min-width:0}
.fld .val,.acctline{overflow-wrap:anywhere}
.accgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.accitem{min-width:0}.accitem input[type=checkbox]{flex:none}
/* All-dealers table: fills the (now wider) card; short columns stay on one line so
   names/links don't shatter vertically. Horizontal scroll only as a last resort. */
.dtable{overflow-x:auto}
.dtable table{width:100%}
td.rep,td.mng,th.rep,th.mng{white-space:nowrap}
td.rep{max-width:170px}
td.mng{text-align:right}
th.buys,td.buys{max-width:230px}
.accitem{display:flex;align-items:center;gap:7px;border:1px solid #e2e9f0;border-radius:8px;padding:7px 10px;font-size:13px}
.accitem.on{background:#e9f7ef;border-color:#bfe6cd}
.dlg{position:fixed;inset:0;background:rgba(16,38,63,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:#fff;border-radius:14px;padding:20px 22px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlgbox h3{margin:0 0 8px}.pick{display:block;padding:8px 10px;border:1px solid #e2e9f0;border-radius:8px;margin:5px 0;cursor:pointer}
.pick.on{background:#eaf3fb;border-color:#9dc8ee}
.st{font-size:12px;margin-left:8px}
.adminnav{background:#1b2733;display:flex;align-items:center;gap:6px;padding:10px 22px;flex-wrap:wrap}
.adminnav .bd{color:#fff;font-weight:800;font-size:15px;margin-right:16px;letter-spacing:.3px}
.adminnav .bd span{color:#F5821F}
.adminnav a{color:#aeb9c6;text-decoration:none;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-radius:7px}
.adminnav a:hover{color:#fff}.adminnav a.on{color:#fff;background:#3B599A}
</style></head>
<body>
<nav class="adminnav"><div class="bd">HCPS <span>Admin</span></div>
 <a href="/admin/">Home</a><a href="/admin/analytics.html">Analytics</a><a href="/admin/dealers.html" class="on">Dealer Manager</a>
 <a href="/admin/images.html">Images</a><a href="/admin/featured.html">Featured</a><a href="/admin/home-editor.html">Portal Home</a><a href="/admin/website.html">Website</a></nav>
<div class="wrap">
<div class="top"><div><h1>HomeCare Provider Services</h1><div class="sub">Dealer master — merge duplicates &amp; manage accounts</div></div>
  <div><input type="search" id="q" placeholder="Search dealer or alias…" oninput="render()" style="width:280px"></div></div>
<div id="body"><div class="msg">Loading…</div></div>
<div id="dlg"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const money=n=>"$"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jesc=s=>String(s).replace(/'/g,"\\'").replace(/"/g,"&quot;");
let DATA=null,TOKEN=null,TAB=(location.hash==="#logins"?"logins":"all"),SEL=new Set(),SELP=new Set(),DETAIL=null,SORT={key:"sales",dir:-1};
const SUF=/\b(inc|incorporated|llc|corp|corporation|co|company|ltd|lp|pllc|plc|dba|the)\b/gi;
function jnorm(n){return String(n||"").toUpperCase().replace(/HEALTH ?CARE/g,"HEALTHCARE").replace(/[.,'&/#-]/g," ").replace(SUF," ").replace(/\s+/g," ").trim();}
const COMMON=new Set(["MEDICAL","SUPPLY","SUPPLIES","PHARMACY","HOME","HEALTHCARE","HEALTH","CARE","EQUIPMENT","EQUIP","MOBILITY","DRUG","DRUGS","STORE","CENTER","SERVICES","MART","MED","OF","AND","DME","PLUS","GA","TN","KY","IN"]);

async function load(){
  try{
    const h={}; if(TOKEN)h["x-analytics-token"]=TOKEN;
    const r=await fetch("/.netlify/functions/dealers-api",{headers:h});
    if(r.status===401){gate();return;}
    const j=await r.json(); if(j.error){showErr(j.error);return;}
    DATA=j; render();
  }catch(e){showErr(String(e));}
}
function gate(){$("#body").innerHTML=`<div class="gate card"><h2>Enter access code</h2><input id="tok" type="password" placeholder="Admin passcode" onkeydown="if(event.key==='Enter')submitTok()"><button class="go" onclick="submitTok()">Open dealer master</button></div>`;}
function submitTok(){TOKEN=$("#tok").value.trim();load();}
function showErr(m){$("#body").innerHTML=`<div class="msg err"><b>Couldn't load.</b><br>${esc(m)}<br><br><button class="go" onclick="load()">Retry</button></div>`;}
function setTab(t){TAB=t;DETAIL=null;render();}

function reviewList(){return DATA.dealers.filter(d=>d.status==="review");}
function suggestedPairs(){
  const ds=DATA.dealers, toks=d=>new Set(jnorm(d.name).split(" ").filter(w=>w&&!COMMON.has(w)));
  const NM=new Set(DATA.nomerge||[]);
  const T=ds.map(toks), out=[], seen=new Set();
  for(let i=0;i<ds.length;i++)for(let j=i+1;j<ds.length;j++){
    const a=T[i],b=T[j]; if(a.size<1||b.size<1)continue;
    const [sm,bg]=a.size<=b.size?[a,b]:[b,a];
    let inter=0; sm.forEach(w=>{if(bg.has(w))inter++;});
    const uni=new Set([...a,...b]).size, jac=inter/uni;
    const subset = inter===sm.size;                          // all significant words of the smaller appear in the larger
    const na=jnorm(ds[i].name), nb=jnorm(ds[j].name);
    const prefix = na.slice(0,8)===nb.slice(0,8) && na.length>7;
    // subset match, OR strong overlap (Jaccard) — the Jaccard bar drops "same chain,
    // different city" pairs (e.g. VAMC Decatur vs VAMC Lexington = 0.5) as non-dupes.
    if((subset&&inter>=1)||(inter>=2&&jac>=0.55)||(prefix&&inter>=1)){
      const k=[ds[i].id,ds[j].id].sort().join("|"); if(seen.has(k)||NM.has(k))continue; seen.add(k);
      out.push({a:ds[i],b:ds[j],score:inter+(subset?1:0)+(prefix?1:0)+jac});
    }
  }
  return out.sort((x,y)=>y.score-x.score||(y.a.sales+y.b.sales)-(x.a.sales+x.b.sales));
}
function filtered(){const q=($("#q")?.value||"").toLowerCase();
  let ds=DATA.dealers;
  if(q) ds=ds.filter(d=>d.name.toLowerCase().includes(q)||d.aliases.some(a=>a.toLowerCase().includes(q))
      ||(d.email||"").toLowerCase().includes(q)||(d.city||"").toLowerCase().includes(q)||(d.state||"").toLowerCase().includes(q)||(d.address||"").toLowerCase().includes(q));
  return sortDealers(ds);
}
const SORTDEF={sales:-1,name:1,state:1,email:-1,updated:1};
const SORTLBL={sales:"Revenue (high→low)",name:"Name (A→Z)",state:"State",email:"Has email first",updated:"Recently ordered"};
function setSort(k){ if(SORT.key===k) SORT.dir*=-1; else {SORT.key=k;SORT.dir=SORTDEF[k]||1;} render(); }
function sortDealers(list){
  const cmp={
    name:(a,b)=>a.name.localeCompare(b.name),
    sales:(a,b)=>a.sales-b.sales,
    state:(a,b)=>(a.state||"~").localeCompare(b.state||"~")||(a.city||"").localeCompare(b.city||"")||a.name.localeCompare(b.name),
    email:(a,b)=>((a.email?1:0)-(b.email?1:0))||a.name.localeCompare(b.name),
    updated:(a,b)=>((a.monthsSince==null?999:a.monthsSince)-(b.monthsSince==null?999:b.monthsSince))||b.sales-a.sales,
  }[SORT.key]||((a,b)=>a.sales-b.sales);
  return list.slice().sort((a,b)=>SORT.dir*cmp(a,b));
}
function render(){
  if(!DATA)return;
  if(DETAIL) return renderDetail();
  const rev=reviewList().length, dup=suggestedPairs().length;
  const N=DATA.dealers.length||1;
  const withEmail=DATA.dealers.filter(d=>d.email).length, withAddr=DATA.dealers.filter(d=>d.address||d.city).length;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="l">Dealers</div><div class="v">${DATA.dealers.length}</div></div>
    <div class="kpi"><div class="l">Emails on file</div><div class="v ${withEmail<N?'warn':''}">${withEmail}<span style="font-size:12px;color:var(--gray)">/${DATA.dealers.length}</span></div></div>
    <div class="kpi"><div class="l">Addresses on file</div><div class="v ${withAddr<N?'warn':''}">${withAddr}<span style="font-size:12px;color:var(--gray)">/${DATA.dealers.length}</span></div></div>
    <div class="kpi"><div class="l">Review queue</div><div class="v warn">${rev}</div></div>
    <div class="kpi"><div class="l">Suggested dupes</div><div class="v orange">${dup}</div></div></div>`;
  const plog=(DATA.logins||[]).filter(l=>l.status==="pending").length;
  const tabs=`<div class="tabs">
    <button class="tab ${TAB==='all'?'on':''}" onclick="setTab('all')">All dealers</button>
    <button class="tab ${TAB==='review'?'on':''}" onclick="setTab('review')">Review queue${rev?` (${rev})`:""}</button>
    <button class="tab ${TAB==='dupes'?'on':''}" onclick="setTab('dupes')">Suggested duplicates${dup?` (${dup})`:""}</button>
    <button class="tab ${TAB==='logins'?'on':''}" onclick="setTab('logins')">Pending logins${plog?` (${plog})`:""}</button>
    <button class="tab ${TAB==='import'?'on':''}" onclick="setTab('import')">Import contacts</button></div>`;
  $("#body").innerHTML=kpis+tabs+mergeBar()+`<div id="app"></div>`;
  ({all:renderAll,review:renderReview,dupes:renderDupes,logins:renderLogins,import:renderImport}[TAB])();
}
function mergeBar(){
  if(SEL.size<1) return "";
  const names=[...SEL].map(id=>DATA.dealers.find(d=>d.id===id)?.name).filter(Boolean);
  const shown=names.slice(0,6).map(n=>esc(n)).join(" · ")+(names.length>6?` · +${names.length-6} more`:"");
  const action = SEL.size>=2
    ? `<button class="go orange sm" onclick="openMerge()">Merge ${SEL.size} selected →</button> <button class="go blue sm" onclick="clearSel()">Clear</button>`
    : `<span class="hint" style="margin-right:10px">Tick one more account to merge</span><button class="go blue sm" onclick="clearSel()">Clear</button>`;
  return `<div class="mergebar" style="position:sticky;top:0;z-index:8"><div><span class="sel">${SEL.size} selected</span> · ${shown}</div><div>${action}</div></div>`;
}
function toggleSel(id){SEL.has(id)?SEL.delete(id):SEL.add(id);render();}
function clearSel(){SEL.clear();render();}
function visibleIds(){return (TAB==='review'?reviewList():filtered()).map(d=>d.id);}
function allSelected(){const v=visibleIds();return v.length>0&&v.every(id=>SEL.has(id));}
function toggleAll(el){const v=visibleIds();el.checked?v.forEach(id=>SEL.add(id)):v.forEach(id=>SEL.delete(id));render();}
function sortArrow(k){return SORT.key===k?(SORT.dir>0?" ▲":" ▼"):"";}
function renderAll(){
  const ds=filtered();
  const sortSel=Object.keys(SORTLBL).map(k=>`<option value="${k}" ${SORT.key===k?"selected":""}>${SORTLBL[k]}${SORT.key===k?(SORT.dir>0?" ▲":" ▼"):""}</option>`).join("");
  let h=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h2 style="margin:0">All dealers <span class="hint" style="text-transform:none">(${ds.length} shown — tick 2+ (or “Select all”) then “Merge selected”, or click a dealer to manage)</span></h2>
      <label class="hint" style="text-transform:none">Sort: <select onchange="setSort(this.value)">${sortSel}</select></label></div>
    <div class="dtable"><table style="margin-top:8px"><thead><tr><th><input type="checkbox" ${allSelected()?"checked":""} onclick="toggleAll(this)" title="Select all shown"></th>
      <th class="link" onclick="setSort('name')" style="cursor:pointer">Dealer${sortArrow('name')}</th>
      <th>Address / email</th><th class="buys">Buys</th>
      <th class="num link" onclick="setSort('sales')" style="cursor:pointer">Sales${sortArrow('sales')}</th>
      <th class="rep">Rep</th><th class="rep">Access</th><th class="mng"></th></tr></thead><tbody>`;
  for(const d of ds){
    const loc=[d.city,d.state].filter(Boolean).join(", ");
    const contact=`<div class="hint" style="text-transform:none;line-height:1.5">
        ${d.address?`${esc(d.address)}${loc?", "+esc(loc):""}`:(loc?`📍 ${esc(loc)}`:`<span class="chip rev">no address</span>`)}<br>
        ${d.email?`✉ <a href="mailto:${esc(d.email)}" style="color:var(--blue)">${esc(d.email)}</a>`:`<span class="chip rev">no email</span>`}${d.phone?` · ${esc(d.phone)}`:""}</div>`;
    h+=`<tr class="drow"><td><input type="checkbox" ${SEL.has(d.id)?"checked":""} onclick="toggleSel('${d.id}')"></td>
      <td class="lbl">${esc(d.name)} ${d.status==="review"?`<span class="chip rev">review</span>`:""}${d.status==="prospect"?`<span class="chip al">prospect</span>`:""}
        ${d.aliases.filter(a=>a!==d.name).slice(0,3).map(a=>`<span class="chip al">${esc(a)}</span>`).join("")}
        ${(d.accounts&&d.accounts.length)?`<div class="hint" style="margin:2px 0 0">acct: ${d.accounts.slice(0,6).map(esc).join(", ")}</div>`:""}</td>
      <td>${contact}</td>
      <td class="buys">${d.buysLines.map(l=>`<span class="chip">${esc(DATA.mfrName[l]||l)}</span>`).join("")||`<span class="dim">—</span>`}</td>
      <td class="num">${money(d.sales)}</td>
      <td class="rep">${d.rep?esc(d.rep):`<span class="dim">—</span>`}</td>
      <td class="rep">${d.access.length?`<span class="chip acc">${d.access.length} line${d.access.length>1?"s":""}</span>`:`<span class="dim">none</span>`}</td>
      <td class="mng link" onclick="openDetail('${d.id}')">Manage →</td></tr>`;
  }
  h+=`</tbody></table></div></div>`; $("#app").innerHTML=h;
}
function renderReview(){
  const ds=reviewList();
  if(!ds.length){$("#app").innerHTML=`<div class="card"><div class="ok">✓ Review queue is empty.</div><div class="hint" style="margin-top:6px">New dealer names from future report loads land here for you to confirm or merge.</div></div>`;return;}
  let h=`<div class="card"><h2>Review queue — new names from recent loads</h2><div class="hint">Each is a name a report used that didn't match a known dealer. Confirm it's genuinely new, or merge it into the right existing dealer (tick it plus the real dealer on the All-dealers tab).</div>
    <table><thead><tr><th><input type="checkbox" ${allSelected()?"checked":""} onclick="toggleAll(this)" title="Select all shown"></th><th>New dealer name</th><th>Line(s)</th><th class="num">Sales</th><th></th></tr></thead><tbody>`;
  for(const d of ds){
    h+=`<tr><td><input type="checkbox" ${SEL.has(d.id)?"checked":""} onclick="toggleSel('${d.id}')"></td>
      <td class="lbl">${esc(d.name)}</td><td>${d.buysLines.map(l=>`<span class="chip">${esc(DATA.mfrName[l]||l)}</span>`).join("")}</td>
      <td class="num">${money(d.sales)}</td>
      <td><button class="go blue sm" onclick="confirmNew('${d.id}')">Confirm as new</button> <button class="go sm" onclick="openDetail('${d.id}')">Manage</button></td></tr>`;
  }
  h+=`</tbody></table></div>`; $("#app").innerHTML=h;
}
function pairKey(p){return [p.a.id,p.b.id].sort().join("|");}
function togglePair(k){SELP.has(k)?SELP.delete(k):SELP.add(k);render();}
function allPairsSel(){const ps=suggestedPairs();return ps.length>0&&ps.every(p=>SELP.has(pairKey(p)));}
function toggleAllPairs(el){const ps=suggestedPairs();el.checked?ps.forEach(p=>SELP.add(pairKey(p))):ps.forEach(p=>SELP.delete(pairKey(p)));render();}
function pairsBar(){
  if(SELP.size<1) return "";
  return `<div class="mergebar" style="position:sticky;top:0;z-index:8"><div><span class="sel">${SELP.size} pair${SELP.size>1?"s":""} selected</span> · each folds the smaller account into the larger</div>
    <div><button class="go orange sm" onclick="askMergePairs()">Merge ${SELP.size} pair${SELP.size>1?"s":""} →</button> <button class="go blue sm" onclick="SELP.clear();render()">Clear</button></div></div>`;
}
function askMergePairs(){
  const ps=suggestedPairs().filter(p=>SELP.has(pairKey(p)));
  if(!ps.length)return;
  const lines=ps.map(p=>{const s=p.a.sales>=p.b.sales?p.a:p.b,l=s===p.a?p.b:p.a;return `<div>• fold <b>${esc(l.name)}</b> → <b>${esc(s.name)}</b></div>`;}).join("");
  showDlg(`<h3>Merge ${ps.length} suggested pair${ps.length>1?"s":""}?</h3><div class="hint">Each pair keeps the bigger account; the other's sales history + aliases fold in and its name becomes an alias. This can't be auto-undone (use Manage → Split if needed).</div>
    <div style="margin:10px 0;max-height:220px;overflow:auto;font-size:13px">${lines}</div>
    <div style="text-align:right"><button class="go blue sm" onclick="closeDlg()">Cancel</button>
    <button class="go orange sm" onclick="closeDlg();doMergePairs()">Merge all</button></div>`);
}
async function doMergePairs(){
  const ps=suggestedPairs().filter(p=>SELP.has(pairKey(p)));
  let done=0;
  for(const p of ps){ const s=p.a.sales>=p.b.sales?p.a:p.b, l=s===p.a?p.b:p.a;
    try{ await post({action:"merge",survivor_id:s.id,loser_ids:[l.id]},null); done++; }catch(e){} }
  SELP.clear(); await load(); alertDlg(`Merged ${done} pair${done===1?"":"s"}.`);
}
function renderDupes(){
  const pairs=suggestedPairs();
  if(!pairs.length){$("#app").innerHTML=`<div class="card"><div class="ok">✓ No likely duplicates detected.</div></div>`;return;}
  let h=pairsBar()+`<div class="card"><h2>Suggested duplicates <span class="hint" style="text-transform:none">(${pairs.length} — tick the pairs you agree with, then “Merge selected pairs”; each keeps the bigger account and folds the other's history + aliases in)</span></h2>
    <table><thead><tr><th><input type="checkbox" ${allPairsSel()?"checked":""} onclick="toggleAllPairs(this)" title="Select all pairs"></th><th>Likely same dealer</th><th class="num">Sales A / B</th><th>Merge into</th><th></th></tr></thead><tbody>`;
  for(const p of pairs){
    const surv=p.a.sales>=p.b.sales?p.a:p.b, loser=surv===p.a?p.b:p.a, k=pairKey(p);
    h+=`<tr><td><input type="checkbox" ${SELP.has(k)?"checked":""} onclick="togglePair('${k}')"></td>

const IMPORT_LINES=[
  ["complete-medical-supplies","Complete Medical Account","Complete Account Number"],
  ["golden-technologies","Golden Account","Golden Account Number"],
  ["access4u","Access4u Account","Access4u Account Number"],
  ["pedifix","Pedifix Account","Pedifix Account Number"],
  ["gce","GCE Account","GCE Account Number"],

  ["strongback-mobility","Strongback Account",null],

];

// RFC-4180-ish CSV parser: quotes, escaped quotes, embedded commas + newlines.
function parseCSV(text){
  const rows=[]; let field="",row=[],q=false,i=0; const n=text.length;
  const pf=()=>{row.push(field);field="";}, pr=()=>{pf();rows.push(row);row=[];};
  if(text.charCodeAt(0)===0xFEFF) i=1;                       // strip BOM
  for(;i<n;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
    else { if(c==='"')q=true; else if(c===",")pf(); else if(c==="\r"){} else if(c==="\n")pr(); else field+=c; }
  }
  if(field.length||row.length)pr();
  return rows;
}
function importFromText(text,fname){
  const grid=parseCSV(text); if(grid.length<2){alertDlg("That file has no data rows.");return;}
  const head=grid[0].map(h=>String(h||"").trim());
  const col=name=>head.indexOf(name);
  const need=col("Company Name"); if(need<0){alertDlg("Couldn't find a 'Company Name' column — is this the HCPS master list?");return;}
  const get=(r,name)=>{const k=col(name);return k>=0?String(r[k]||"").trim():"";};
  // group EVERY row by company so we capture all contacts/emails (not just the first)
  const groups=new Map(), order=[];
  for(let ri=1;ri<grid.length;ri++){ const r=grid[ri]; const company=get(r,"Company Name"); if(!company)continue;
    const key=jnorm(company); if(!groups.has(key)){groups.set(key,{first:r,rows:[]});order.push(key);} groups.get(key).rows.push(r); }
  const splitEmails=s=>String(s||"").split(/[;,|\s]+/).map(x=>x.trim()).filter(x=>/@/.test(x));
  const out=order.map(key=>{ const g=groups.get(key), r=g.first, company=get(r,"Company Name");
    const addr=[get(r,"Address 1"),get(r,"Address 2")].filter(Boolean).join(", ");
    const contact=[get(r,"Contact First"),get(r,"Contact Last")].filter(Boolean).join(" ");
    const lines=[]; for(const [slug,flag,num] of IMPORT_LINES){ const yes=get(r,flag).toLowerCase()==="yes"; const acct=num?get(r,num):""; if(yes||acct)lines.push({slug,account:acct}); }
    const contacts=[], seenE=new Set();
    for(const rr of g.rows){ const nm=[get(rr,"Contact First"),get(rr,"Contact Last")].filter(Boolean).join(" ");
      const title=get(rr,"Contact Title"), role=get(rr,"Contact Role"), ph=get(rr,"Contact Phones")||get(rr,"Office Phones");
      for(const em of splitEmails(get(rr,"Contact Emails"))){ const lo=em.toLowerCase(); if(seenE.has(lo))continue; seenE.add(lo); contacts.push({email:em,name:nm,title,role,phone:ph}); } }
    // every distinct address across this company's rows (label = the source company name)
    const addresses=[], seenA=new Set();
    for(const rr of g.rows){ const a1=[get(rr,"Address 1"),get(rr,"Address 2")].filter(Boolean).join(", ");
      if(!a1)continue; const ak=`${a1}|${get(rr,"City")}|${get(rr,"State")}`.toLowerCase().trim(); if(seenA.has(ak))continue; seenA.add(ak);
      addresses.push({address:a1,city:get(rr,"City"),state:get(rr,"State"),zip:get(rr,"ZIP"),label:company}); }
    return {company,address:addr,city:get(r,"City"),state:get(r,"State"),zip:get(r,"ZIP"),
      contact,email:(contacts[0]&&contacts[0].email)||get(r,"Contact Emails"),phone:get(r,"Office Phones"),lines,contacts,addresses};
  });
  IMPORT={rows:out,create:true,replace:true,busy:false,result:null,fname};
  render();
}
function onImportFile(inp){ const f=inp.files&&inp.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>importFromText(String(rd.result||""),f.name); rd.readAsText(f); }
function importPreview(){
  const known=new Set(); for(const d of (DATA?.dealers||[])){ known.add(jnorm(d.name)); (d.aliases||[]).forEach(a=>known.add(jnorm(a))); }
  let match=0; const lc={};
  for(const r of IMPORT.rows){ if(known.has(jnorm(r.company)))match++; for(const l of (r.lines||[]))lc[l.slug]=(lc[l.slug]||0)+1; }
  return {total:IMPORT.rows.length,match,create:IMPORT.rows.length-match,lc};
}
async function applyImport(){
  if(!IMPORT.rows||IMPORT.busy)return; IMPORT.busy=true; render();
  try{
    const h={"content-type":"application/json"}; if(TOKEN)h["x-analytics-token"]=TOKEN;
    const r=await fetch("/.netlify/functions/dealers-api",{method:"POST",headers:h,body:JSON.stringify({action:"import_contacts",rows:IMPORT.rows,create:IMPORT.create,replace:IMPORT.replace!==false})});
    const j=await r.json().catch(()=>({}));
    IMPORT.result = j.result || {};
    if(j.error && j.result && j.result.message) IMPORT.result.topError=j.result.message;
    else if(j.error) IMPORT.result.topError=String(j.error);
    IMPORT.busy=false; await load(); TAB="import"; IMPORT_KEEP(); render();
  }catch(e){ IMPORT.busy=false; IMPORT.result={topError:String(e.message||e)}; render(); }
}
async function runDiag(){
  const out=$("#diagOut"); if(out)out.innerHTML=`<div class="muted" style="margin-top:10px">Checking…</div>`;
  try{
    const h={"content-type":"application/json"}; if(TOKEN)h["x-analytics-token"]=TOKEN;
    const r=await fetch("/.netlify/functions/dealers-api",{method:"POST",headers:h,body:JSON.stringify({action:"diag"})});
    const j=await r.json().catch(()=>({}));
    if(!(r.ok&&j.ok)){ const m=(j.error||("HTTP "+r.status));
      out.innerHTML=`<div class="msg" style="text-align:left;margin-top:10px;background:#fdecec;border-color:#f3c0c0;color:#b42323"><b>The updated dealers-api function is NOT live yet.</b><br>The server said: <code>${esc(String(m))}</code><br>Deploy <b>netlify/functions/dealers-api.js</b> to homecareproviderservices (commit it + redeploy), then click Check setup again.</div>`; return; }
    const c=j.dealer_contacts||{}, a=j.dealer_addresses||{};
    const line=(nm,x)=> x.exists?`✅ <b>${nm}</b>: exists — <b>${x.count==null?"?":x.count}</b> row(s) stored`:`❌ <b>${nm}</b>: MISSING — run <b>create_tables.sql</b> in Supabase`;
    const allGood=c.exists&&a.exists;
    out.innerHTML=`<div class="msg" style="text-align:left;margin-top:10px;${allGood?'':'background:#fff3e0;border-color:#f2d9b0;color:#8a4b0d'}">
      Live function: <b>${esc(j.build||"unknown")}</b><br>${line("dealer_contacts",c)}<br>${line("dealer_addresses",a)}
      ${allGood?`<br><span class="ok">Setup looks correct — upload your CSV above and Apply import; the counts should climb.</span>`:`<br>Fix the ❌ item above, then re-import.`}</div>`;
  }catch(e){ out.innerHTML=`<div class="msg" style="text-align:left;margin-top:10px;background:#fdecec;border-color:#f3c0c0;color:#b42323">${esc(String(e.message||e))}</div>`; }
}
let _IMPRES=null; function IMPORT_KEEP(){_IMPRES=IMPORT.result;}   // survive load()'s render reset
function renderImport(){
  const app=$("#app"); if(!app)return;
  if(_IMPRES && !IMPORT.result){IMPORT.result=_IMPRES;_IMPRES=null;}
  if(!IMPORT.rows){
    app.innerHTML=`<div class="card" style="padding:18px">
      <h3 style="margin:0 0 6px">Import dealer contacts &amp; addresses</h3>
      <p class="muted" style="margin:0 0 12px">Upload your master list (CSV). Each company is matched to an existing dealer by name/alias; unmatched companies are created so <b>every dealer is loaded</b>. Addresses, primary contact, phone, and per-line account numbers are filled in, and line access is turned on wherever an account exists.</p>
      <input type="file" accept=".csv,text/csv" onchange="onImportFile(this)">
      <p class="muted" style="margin:12px 0 0;font-size:12px">Expected columns: Company Name, Address 1/2, City, State, ZIP, Office Phones, Contact First/Last, Contact Emails, and the per-line “… Account / … Account Number” columns.</p>
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid #eef2f6">
        <button class="go blue sm" onclick="runDiag()">🔎 Check setup</button>
        <span class="muted" style="font-size:12px;margin-left:8px">Not saving contacts/addresses? Click this — it tells you whether the tables exist and whether the updated function is live.</span>
        <div id="diagOut"></div>
      </div>
    </div>`; return;
  }
  const p=importPreview();
  const mfrName=Object.fromEntries((DATA.manufacturers||[]).map(m=>[m.slug,m.name]));
  const lineRows=IMPORT_LINES.filter(([s])=>p.lc[s]).map(([s])=>`<tr><td>${esc(mfrName[s]||s)}</td><td class="r">${p.lc[s]}</td></tr>`).join("");
  const res=IMPORT.result;
  const resHtml=(()=>{ if(!res)return "";
    if(res.topError){ return `<div class="msg" style="margin-top:14px;background:#fdecec;border-color:#f3c0c0;color:#b42323"><b>Import couldn't store contacts/addresses.</b><br>${esc(res.topError)}</div>`; }
    const errs=(res.errors&&res.errors.length)?`<br><span style="color:#b42323">Some writes failed: ${res.errors.map(esc).join("; ")}</span>`:"";
    const warn=(res.contacts===0&&!(res.errors&&res.errors.length))?`<br><span style="color:#b42323">0 contacts stored — make sure the two tables exist (run <b>create_tables.sql</b>), then re-import.</span>`:"";
    return `<div class="msg ok" style="margin-top:14px"><b>Import complete.</b><br>
      Matched existing: <b>${res.matched||0}</b> · Created new: <b>${res.created||0}</b> · Dealers updated: <b>${res.updated||0}</b> · Line-access rows set: <b>${res.entitlements||0}</b><br>
      <b>${res.contacts||0}</b> contact email${res.contacts===1?"":"s"} stored · <b>${res.addresses||0}</b> address${res.addresses===1?"":"es"} stored${warn}${errs}
      ${(res.unmatched&&res.unmatched.length)?`<br>Skipped (not created): ${res.unmatched.length}`:""}</div>`;
  })();
  app.innerHTML=`<div class="card" style="padding:18px">
    <h3 style="margin:0 0 4px">Review import — ${esc(IMPORT.fname)}</h3>
    <p class="muted" style="margin:0 0 12px">${p.total} companies found.</p>
    <div class="kpis" style="margin:0 0 12px">
      <div class="kpi"><div class="l">Will match existing</div><div class="v">${p.match}</div></div>
      <div class="kpi"><div class="l">Will be created</div><div class="v orange">${p.create}</div></div>
      <div class="kpi"><div class="l">Total dealers after</div><div class="v">${(DATA.dealers.length)+p.create}</div></div>
    </div>
    <table class="tbl" style="max-width:360px"><thead><tr><th>Line access to set</th><th class="r">Dealers</th></tr></thead><tbody>${lineRows||'<tr><td colspan=2 class="muted">none</td></tr>'}</tbody></table>
    <label style="display:flex;gap:8px;align-items:center;margin:14px 0 6px;font-size:14px">
      <input type="checkbox" ${IMPORT.create?"checked":""} onchange="IMPORT.create=this.checked"> Create dealers for unmatched companies (recommended — loads all dealers)</label>
    <label style="display:flex;gap:8px;align-items:center;margin:2px 0 6px;font-size:14px">
      <input type="checkbox" ${IMPORT.replace!==false?"checked":""} onchange="IMPORT.replace=this.checked"> Replace existing contacts &amp; addresses first (recommended — clean re-import onto the correct dealers)</label>
    <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
      <button class="go orange" ${IMPORT.busy?"disabled":""} onclick="applyImport()">${IMPORT.busy?"Importing…":"Apply import"}</button>
      <button class="go blue sm" onclick="IMPORT={rows:null,create:true,busy:false,result:null,fname:''};render()">Choose a different file</button>
    </div>
    ${resHtml}
  </div>`;
}
load();
</script></body></html>
