<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS Admin — Email Learning</title>
<link rel="stylesheet" href="/admin/admin-shell.css">
<style>
 .hint{font-size:12px;color:var(--gray);margin:4px 0 0}
 .note{background:#f5f8fc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--navy2);margin-bottom:12px}
 .empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--gray);font-size:13px;background:#fafbfc}
 .el-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
 .el-kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
 .el-kpi .l{font-size:10.5px;text-transform:uppercase;color:var(--gray);font-weight:700;letter-spacing:.3px}.el-kpi .v{font-size:22px;font-weight:800;color:var(--navy)}
 .el-flt{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;align-items:center}
 .el-flt select{padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;min-height:40px;background:#fff}
 .el-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;cursor:pointer;min-height:44px;box-sizing:border-box;
   display:block;width:100%;text-align:left;font-family:inherit;color:inherit}
 .el-row:hover,.el-row:focus-visible{border-color:var(--navy)}
 .el-row .r1{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;font-size:13px}
 .el-row .subj{font-weight:700;color:var(--navy);overflow-wrap:anywhere}
 .el-tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;white-space:nowrap}
 .t-edited{background:#fff4e0;color:#8a5300}.t-same{background:#e9f7ef;color:#1f7a44}.t-draft{background:#f0f2f5;color:#55606c}.t-purged{background:#f0f2f5;color:#9aa4ae}
 .el-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:10px}
 .el-box{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;min-width:0}
 .el-box h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--gray)}
 .el-box pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 inherit;font-family:inherit;margin:0}
 .el-diff{font:13px/1.5 inherit;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 0;margin-top:10px}
 .el-diff div{padding:1px 12px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.3em}
 .el-diff .add{background:#e9f7ef}.el-diff .add::before{content:"+ ";color:#1f7a44;font-weight:800}
 .el-diff .del{background:#fdecec;text-decoration:line-through;color:#7a2a2a}.el-diff .del::before{content:"− ";color:#b42323;font-weight:800;text-decoration:none;display:inline-block}
 .el-diff .same::before{content:"  "}
 button.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
 button.go{min-height:40px}
 @media(max-width:760px){ .wrap{padding:14px 14px 50px} .el-cols{grid-template-columns:minmax(0,1fr)} button.go,.el-flt select{min-height:44px;font-size:16px} }
</style>
</head><body>
<header id="ac-head"></header>
<div class="wrap">
  <div class="top"><div><h1 style="margin:0">Email Learning</h1>
    <div class="sub">What HCPS drafted, next to what you actually sent. Owner only. Phase 1 keeps the two versions — nothing is learned or changed yet.</div></div></div>
  <div id="body"><div class="msg">Loading…</div></div>
</div>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script src="/admin/email-learning.js"></script>
</body></html>
