<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS Admin — Catalog</title>
<style>
 :root{--ink:#1b2733;--blue:#3B599A;--blue-dk:#2B4071;--orange:#F5821F;--silver:#D8DEE4;--light:#F3F6FA;--gray:#5b6672;--green:#1A7A4A;--red:#B91C1C}
 *{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--ink)}
 .adminnav{background:var(--ink);display:flex;align-items:center;gap:6px;padding:10px 22px;flex-wrap:wrap}
 .adminnav .bd{color:#fff;font-weight:800;font-size:15px;margin-right:16px}.adminnav .bd span{color:var(--orange)}
 .adminnav a{color:#aeb9c6;text-decoration:none;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-radius:7px}
 .adminnav a:hover{color:#fff}.adminnav a.on{color:#fff;background:var(--blue)}
 .wrap{max-width:1120px;margin:22px auto;padding:0 20px}
 h1{font-size:22px;margin:0 0 3px}.sub{color:var(--gray);font-size:13px;margin:0 0 16px}
 .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
 select,input[type=text],input[type=number],textarea{padding:9px 11px;border:1px solid var(--silver);border-radius:8px;font-size:13px;background:#fff;font-family:inherit}
 textarea{resize:vertical;min-height:52px;width:100%}
 .card{background:#fff;border:1px solid var(--silver);border-radius:14px;padding:18px;margin-bottom:18px}
 .card h2{font-size:16px;margin:0 0 4px;color:var(--blue-dk)}.card .hint{font-size:12px;color:var(--gray);margin:0 0 14px;line-height:1.5}
 label.fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);font-weight:700;margin:10px 0 4px}
 .imgrow{display:flex;gap:12px;align-items:center;margin-top:6px}
 .thumb{width:120px;height:70px;border-radius:8px;background:#eef2f7 center/contain no-repeat;border:1px solid var(--silver);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#9aa6b2;font-size:11px}
 .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px}
 .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--silver)}.btn.sm{padding:6px 11px;font-size:12px}.btn.orange{background:var(--orange)}.btn.red{background:var(--red)}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.grid2{grid-template-columns:1fr}}
 table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
 td,th{padding:7px 8px;border-bottom:1px solid #eef2f6;text-align:left;vertical-align:middle}
 th{font-size:10.5px;text-transform:uppercase;color:var(--gray)}
 .prow{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #eef2f6;flex-wrap:wrap}
 .prow:first-of-type{border-top:none}
 .prow .pn{flex:1;min-width:160px}.prow .pn b{font-size:13px}.prow .pn .c{font-size:11px;color:var(--gray)}
 .prow input[type=text]{min-width:150px}
 .haslink{color:var(--green);font-weight:700;font-size:12px}
 .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
 .chip{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:5px;padding:1px 6px;margin-left:4px}
 .chip.cst{background:#eef2fb;color:#3b599a}.chip.ed{background:#fff3e6;color:#b4651a}.chip.ft{background:#fffaf0;color:#b4820f;border:1px solid #f0dca8}
 .chip.pub{background:#eaf6ef;color:#136c40}.chip.pend{background:#eef2fb;color:#3b599a}
 .chip.dup{background:#fdecec;color:#b42323}.chip.mrg{background:#f2eefb;color:#5b3fa0}
 .chip.dis{background:#eef1f4;color:#5b6672}.chip.dnl{background:#f4f0e8;color:#7a6432}
 .chip.rev{background:#fff6e0;color:#8a5a08}
 .dupbar{border:1px solid #f0c7c7;background:#fdf5f5;border-radius:12px;padding:13px 16px;margin-bottom:16px}
 .dupbar b{color:#b42323}
 .dupg{border:1px solid var(--silver);border-radius:12px;background:#fff;padding:13px 15px;margin-bottom:12px}
 .dupg h4{font-size:13.5px;margin:0 0 3px;color:var(--blue-dk)}
 .dupwhy{font-size:12px;color:var(--gray);margin:0 0 10px;line-height:1.55}
 .dupm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .dupm.one{grid-template-columns:1fr}
 @media(max-width:700px){.dupm{grid-template-columns:1fr}}
 .dupfacts .mut,/* Bulk product actions: the bar only appears once something is selected. */
.prodbulk{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  margin:0 0 10px;padding:10px 14px;background:#fff6f2;border:1px solid #f0d2c2;border-radius:10px}
.prodbulk .pbl{font-size:12.5px;color:#4a5666}
.prodbulk .pbr{display:flex;gap:7px;flex-wrap:wrap}
td.pickcell,th.pickcell{width:26px;padding-right:0}
td.pickcell input,th.pickcell input{margin:0}
tr.picked{background:#fffaf6}
/* Bulk consolidate: the bar sits above the list and the picked cards say so plainly. */
.dupbulk{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  margin:12px 0 14px;padding:11px 14px;background:#f7f9fc;border:1px solid var(--line);border-radius:10px}
.dupbulk .dbl{font-size:12.5px;color:#4a5666;max-width:60ch}
.dupbulk .dbr{display:flex;gap:7px;flex-wrap:wrap}
.dupbulk button[disabled]{opacity:.45;cursor:not-allowed}
.duppick{display:inline-flex;gap:7px;align-items:baseline;cursor:pointer}
.duppick input{margin:0;transform:translateY(1px)}
.dupc.picked{outline:2px solid var(--orange);outline-offset:1px;background:#fffaf6}
.dupc .mut{color:var(--gray);font-weight:400}
 .dupc{border:1px solid var(--silver);border-radius:10px;padding:11px 13px;background:#fcfdfe}
 .dupc.win{border-color:#b6d8c1;background:#f4faf6}
 .dupc.master{border-color:#b8791b;background:#fffaf1;box-shadow:0 2px 10px rgba(184,121,27,.14)}
 .mtag{font-size:9.5px;font-weight:800;letter-spacing:.5px;background:#b8791b;color:#fff;border-radius:5px;padding:2px 6px;margin-left:5px;vertical-align:middle}
 .dupfacts{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px}
 .dupfacts th{text-align:left;font-weight:700;color:var(--gray);width:118px;padding:3px 8px 3px 0;vertical-align:top;white-space:nowrap}
 .dupfacts td{padding:3px 0;color:var(--ink);vertical-align:top}
 .dupfacts tr.hl td{background:#fff6e0;font-weight:700}
 .dupwarn{margin-top:6px;padding:6px 9px;border-radius:7px;font-size:11.5px;line-height:1.45;background:#f2f6fa;border:1px solid #dde5ee;color:#44515f}
 .dupwarn.hi{background:#fdf5f5;border-color:#f0c7c7;color:#8a2f2f;font-weight:600}
 .dupc .cn{font-weight:800;font-size:13px}
 .dupc .cc{font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums}
 .dupc ul{margin:8px 0 0 16px;padding:0;font-size:11.5px;color:var(--gray);line-height:1.7}
 .dupc ul li b{color:var(--ink)}
 .guide{border:1px solid var(--silver);border-radius:14px;background:#fff;margin-bottom:18px;overflow:hidden}
 .guide summary{cursor:pointer;padding:13px 18px;font-weight:800;font-size:14px;color:var(--blue-dk);list-style:none}
 .guide summary::-webkit-details-marker{display:none}
 .guide summary::before{content:"\25B8 ";color:var(--gray)}
 .guide[open] summary::before{content:"\25BE "}
 .guide .gbody{padding:0 18px 16px;font-size:12.5px;line-height:1.65;color:var(--ink)}
 .guide .gbody h5{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);margin:14px 0 5px}
 .guide .gbody p{margin:0 0 7px}
 .guide .gbody code{background:#eef2f7;padding:1px 5px;border-radius:4px;font-size:11.5px}
 .guide .gbody .k{display:inline-block;min-width:132px;font-weight:800}
 .star{border:1px solid var(--silver);background:#fff;border-radius:7px;width:30px;height:28px;cursor:pointer;font-size:15px;line-height:1;color:#c7ccd2;vertical-align:middle}
 .star.on{color:#e4a11b;border-color:#e4a11b;background:#fffaf0}
 .gate,.msg{background:#fff;border:1px solid var(--silver);border-radius:12px;padding:24px;max-width:420px;margin:30px auto;text-align:center}
 .go{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
 .err{color:var(--red)}.ok{color:var(--green)}
 .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
</style><link rel="stylesheet" href="/admin/admin-shell.css"></head><body>
<header id="ac-head"></header>
<div class="wrap" id="wrap"><div class="msg">Loading…</div></div>
<div class="toast" id="toast"></div>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const API="/.netlify/functions/catalog-api";
const TKEY="hcps_staff_token", PKEY="hcps_staff_profile";
window.addEventListener("hcps-token",function(e){try{TOKEN=e.detail;}catch(_){}});
let ME=null; try{ME=HCPS.profile()}catch(e){ME=null;}
let TOKEN=HCPS.token(), MFRS=[], SLUG="", DETAIL=null, PQ="";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
async function api(qs,opts){const h={"content-type":"application/json"};if(TOKEN)h["authorization"]="Bearer "+TOKEN;
  const r=await fetch(API+(qs||""),{...(opts||{}),headers:{...h,...((opts&&opts.headers)||{})}});
  if(r.status===401){gate();throw new Error("unauthorized");}
  if(r.status===403){$("#wrap").innerHTML='<div class="msg err">President only — this tool is limited to President accounts. <button class="go" onclick="lock()">Sign in as a different user</button></div>';throw new Error("unauthorized");}
  const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||("HTTP "+r.status));return j;}
/* Same request, but the response is handed back whole. api() throws on a non-2xx and keeps
   only the error string, which is exactly wrong for a 409: the collision payload names the
   record that was hit, and that is what lets the screen offer a merge instead of a dead end. */
async function apiRaw(qs,opts){
  const h={"content-type":"application/json"}; if(TOKEN)h["authorization"]="Bearer "+TOKEN;
  const r=await fetch(API+(qs||""),{...(opts||{}),headers:{...h,...((opts&&opts.headers)||{})}});
  if(r.status===401){gate();throw new Error("unauthorized");}
  const j=await r.json().catch(()=>({}));
  return {status:r.status, ok:r.ok&&!j.error, body:j};
}
function gate(msg){$("#wrap").innerHTML=`<div class="gate"><h2>Staff sign-in</h2><p style="margin:2px 0 12px;color:#607089;font-size:13px">Sign in with your work email and password.</p><input id="lemail" type="email" placeholder="Email" autocomplete="username" style="margin:0 0 8px;width:100%"><input id="lpass" type="password" placeholder="Password" autocomplete="current-password" style="margin:0 0 12px;width:100%" onkeydown="if(event.key==='Enter')submitTok()"><br><button class="go" onclick="submitTok()">Sign in</button> <a href="reset.html" style="display:inline-block;margin-left:6px;color:#10263f;font-size:13px;font-weight:600">Forgot password?</a><div id="lerr" style="color:#b42323;margin-top:8px">${msg||""}</div></div>`;setTimeout(()=>{var t=$("#lemail");if(t)t.focus();},50);}
async function submitTok(){
  var email=(($("#lemail")||{}).value||"").trim(), password=(($("#lpass")||{}).value||"");
  var e=$("#lerr"); if(e)e.textContent="Signing in…";
  try{ const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email,password})});
    const j=await r.json().catch(()=>({})); if(!j||!j.ok){ gate((j&&j.message)||"Could not sign in."); return; }
    HCPS.setSession(j); TOKEN=j.token; ME=j.profile; boot();
  }catch(err){ gate("Could not reach the server. Try again."); }
}
function lock(){ HCPS.signOut(); TOKEN=null; ME=null; location.reload(); }
async function boot(){
  try{const j=await api("",{method:"GET"}); MFRS=j.manufacturers||[];
    if(!MFRS.length){$("#wrap").innerHTML='<div class="msg">No manufacturers found.</div>';return;}
    if(!SLUG) SLUG=(MFRS.find(m=>m.hasData)||MFRS[0]).slug;
    await loadMfr();
  }catch(e){if(String(e.message)!=="unauthorized")$("#wrap").innerHTML=`<div class="msg err">Couldn't load: ${esc(e.message)}</div>`;}
}
let DUPS=null, DUPBUSY=false, ENRICH=null, GUIDEOPEN=false, DETAILS=null, DETAILMASTER=null;
let LINKAUDIT=null, LINKBUSY=false;
/* The status vocabulary. Deletion is deliberately not in this list — it lives behind a
   check that the record has nothing attached to it at all. */
const PA_STATE={ disabled:"Disabled", discontinued:"Discontinued", do_not_list:"Do Not List",
  not_offered:"Not offered by HCPS", archived:"Archived", possible_duplicate:"Possible duplicate", ignore:"Ignored" };
async function loadMfr(){ DETAIL=await api("?manufacturer="+encodeURIComponent(SLUG),{method:"GET"});
  DUPS=null; ENRICH=null; DETAILS=null; DETAILMASTER=null; LINKAUDIT=null; render(); loadSideSignals(); }

/* Two signals the catalog can't see on its own: which SKUs the enrichment tool is still
   working on, and which products look like duplicates of each other. Both are fetched
   after the page has already painted, so a slow scan never delays the catalog. */
async function loadSideSignals(){
  const slug=SLUG;
  try{
    const r=await api("",{method:"POST",body:JSON.stringify({action:"duplicate_scan",manufacturer:slug})});
    if(slug===SLUG && r && r.ok!==false){
      const skip=dismissed();
      DUPS=(r.groups||[]).filter(g=>skip.indexOf(g.key)<0); render();
      /* Now the expensive half: full provenance for the records actually in the queue.
         Fetched after the list paints, so the page is usable immediately. */
      const codes=[...new Set(DUPS.flatMap(g=>g.members.map(m=>m.code)))].slice(0,60);
      if(codes.length){
        try{ const d=await api("",{method:"POST",body:JSON.stringify({action:"record_detail",manufacturer:slug,codes})});
          if(slug===SLUG && d && d.ok!==false){
            DETAILS={}; (d.records||[]).forEach(x=>{ DETAILS[x.code]=x; });
            DETAILMASTER=d.master_code||null; render(); }
        }catch(e){}
      }
    }
  }catch(e){ if(slug===SLUG) DUPS=[]; }
  try{
    const h={"content-type":"application/json"}; if(TOKEN) h["authorization"]="Bearer "+TOKEN;
    const res=await fetch("/.netlify/functions/product-content?manufacturer="+encodeURIComponent(slug)+"&action=list",{headers:h});
    if(res.ok){ const j=await res.json().catch(()=>null);
      const rows=(j&&(j.products||j.rows))||[];
      const map={};
      rows.forEach(pr=>{ const st=String(pr.status||"").trim();
        (Array.isArray(pr.skus)?pr.skus:[]).forEach(sk=>{ const c=String((sk&&(sk.sku||sk.code))||"").trim(); if(c) map[c]=st; }); });
      if(slug===SLUG){ ENRICH=map; render(); } }
  }catch(e){ if(slug===SLUG) ENRICH={}; }
}

/* ── The one status a product has ────────────────────────────────────────────
   Seven states, evaluated in precedence order, because a product can technically be
   several at once and only the most consequential one belongs on the row. Merged and
   Do Not List come first: both are recorded decisions, and a decision outranks an
   observation. Duplicate Suspected outranks Published because publishing a product
   that is secretly a second copy of another is the problem worth surfacing. */
const STATUS_META={
  merged:      {label:"Merged",             cls:"mrg",  why:"Retired into another product. Its price, links and images moved there; its order history stayed put."},
  do_not_list: {label:"Do Not List",        cls:"dnl",  why:"A recorded decision that HCPS will not sell this. It is kept for reference and never shown to dealers."},
  disabled:    {label:"Disabled",           cls:"dis",  why:"Hidden from Partner 360. Nothing is lost — it can be restored at any time."},
  duplicate:   {label:"Duplicate Suspected",cls:"dup",  why:"Another record in this catalog looks like the same product. Review before editing either one."},
  needs_review:{label:"Needs Review",       cls:"rev",  why:"Something about this record is incomplete or contradictory."},
  pending:     {label:"Pending Enrichment", cls:"pend", why:"The enrichment tool is still building this product's content."},
  published:   {label:"Published",          cls:"pub",  why:"Live on Partner 360 with a price dealers can order at."},
};
function dupCodeSet(){
  const set=new Set();
  (DUPS||[]).forEach(g=>g.members.forEach(m=>set.add(String(m.code))));
  return set;
}
function statusOf(p,dupSet){
  const o=(DETAIL.overrides||{})[p.code]||{};
  if(o.merged_into) return "merged";
  if(o.disposition==="do_not_list"||o.disposition==="not_offered") return "do_not_list";
  if(o.disposition==="discontinued") return "disabled";
  if(p.active===false) return "disabled";
  if(dupSet && dupSet.has(String(p.code))) return "duplicate";
  const est=ENRICH?ENRICH[p.code]:undefined;
  if(est && est!=="published" && est!=="approved" && est!=="complete") return "pending";
  if(p.base_price==null||p.base_price===""||Number(p.base_price)<=0) return "needs_review";
  return "published";
}
function statusChip(st){ const m=STATUS_META[st]||STATUS_META.published;
  return `<span class="chip ${m.cls}" title="${esc(m.why)}">${esc(m.label)}</span>`; }
function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});}
async function upload(slot,file,maxMB,cb){
  if(!file)return; if(file.size>(maxMB||6)*1024*1024){toast("File too large (max "+(maxMB||6)+"MB)");return;}
  toast("Uploading…");
  try{const data=await fileToB64(file);
    const j=await api("",{method:"POST",body:JSON.stringify({action:"upload",slot,filename:file.name,contentType:file.type||"application/octet-stream",data})});
    cb(j.url);toast("Uploaded ✓");
  }catch(e){toast("Upload failed: "+e.message);}
}
function curMfr(){return MFRS.find(m=>m.slug===SLUG)||{};}

/* ---- logo ---- */
let LOGODRAFT="";
async function saveLogo(){ await api("",{method:"POST",body:JSON.stringify({action:"save_logo",slug:SLUG,url:LOGODRAFT||curMfr().logo_url||""})});
  const m=curMfr(); m.logo_url=LOGODRAFT||m.logo_url; toast("Logo saved ✓"); render(); }
async function clearLogo(){ if(!confirm("Remove this manufacturer's logo?"))return; await api("",{method:"POST",body:JSON.stringify({action:"clear_logo",slug:SLUG})}); curMfr().logo_url=""; LOGODRAFT=""; toast("Logo removed"); render(); }

/* ---- products (edit ANY product: catalog via overrides, or custom) ---- */
let PDRAFT=null, PRODQ="", PCAT="", PSTAT="", PSORT="name", PLIMIT=60;
// full filter + sort + paginate pipeline over the effective product list
function filteredSortedProducts(){
  let arr=effProducts();
  const q=PRODQ.toLowerCase().trim();
  if(q) arr=arr.filter(p=>(`${p.code} ${p.name} ${p.category||""}`.toLowerCase().includes(q)));
  if(PCAT) arr=arr.filter(p=>(p.category||"")===PCAT);
  if(PSTAT==="shown") arr=arr.filter(p=>p.active!==false);
  else if(PSTAT==="hidden") arr=arr.filter(p=>p.active===false);
  else if(PSTAT==="featured") arr=arr.filter(p=>isFeat(p.code));
  else if(PSTAT==="added") arr=arr.filter(p=>p.kind==="custom");
  else if(PSTAT==="edited") arr=arr.filter(p=>p.edited);
  else if(PSTAT&&STATUS_META[PSTAT]){ const ds=dupCodeSet(); arr=arr.filter(p=>statusOf(p,ds)===PSTAT); }
  const price=p=>(p.base_price!=null&&p.base_price!=="")?Number(p.base_price):Infinity;
  const nm=(a,b)=>String(a.name||"").localeCompare(String(b.name||""),"en",{sensitivity:"base"});
  const cmp={ name:nm, code:(a,b)=>String(a.code||"").localeCompare(String(b.code||""),"en",{sensitivity:"base"}),
    category:(a,b)=>String(a.category||"~").localeCompare(String(b.category||"~"),"en",{sensitivity:"base"})||nm(a,b),
    price_asc:(a,b)=>price(a)-price(b), price_desc:(a,b)=>price(b)-price(a),
    status:(a,b)=>((a.active===false?1:0)-(b.active===false?1:0))||nm(a,b) }[PSORT]||nm;
  return arr.slice().sort(cmp);
}
function setFilter(k,v){ if(k==="cat")PCAT=v; else if(k==="stat")PSTAT=v; else if(k==="sort")PSORT=v; else if(k==="q")PRODQ=v; PLIMIT=60; render(); }
// effective product list = catalog (with any override applied) + custom products
function effProducts(){
  const over=DETAIL.overrides||{};
  const cat=(DETAIL.products||[]).map(p=>{const o=over[p.code]||{}; return {...p,...o,kind:"catalog",edited:!!over[p.code]};});
  const map=new Map(); cat.forEach(p=>map.set(p.code,p));
  /* An added product's overrides were dropped here, so anything stored on that layer for a
     custom row — its group, most of all, since custom_products has no column for one — was
     invisible in the admin while the portal was honouring it. Same merge for both kinds. */
  (DETAIL.custom||[]).forEach(p=>{ const o=over[p.code]||{};
    map.set(p.code,{...p,...o,kind:"custom",edited:!!over[p.code]}); });
  return [...map.values()];
}
function tiersOf(p){ return Array.isArray(p&&p.tiers)?p.tiers.map(t=>({min_qty:t.min_qty??t.minQty??1,price:t.price})):[]; }

/* ── What a part number is actually related to ───────────────────────────────
   The list shows one row per SKU, which hides two things a person needs before they
   start renumbering anything:

     · the same code can exist in BOTH layers — the deployed catalog file and the added
       table — which is one product, not two, and is fixed by consolidating rather than
       by editing a number;
     · a trailing letter suffix is usually a real VARIANT, not a typo. 1007 and 1007AB
       are different products ("with AB"), and renumbering one onto the other would
       destroy a distinction the manufacturer makes.

   Both are read off data the page already has, so this costs nothing and is never stale. */
const skuStem=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/[A-Z]+$/,"");
function skuKin(code){
  const c=String(code);
  const inBase=(DETAIL.products||[]).some(x=>String(x.code)===c);
  const inAdded=(DETAIL.custom||[]).some(x=>String(x.code)===c);
  const all=effProducts().map(x=>String(x.code));
  const stem=skuStem(c), bare=String(c).toUpperCase().replace(/[^A-Z0-9]/g,"");
  let variantOf=null, variants=[];
  if(stem && stem!==bare) variantOf=all.find(x=>String(x).toUpperCase().replace(/[^A-Z0-9]/g,"")===stem)||null;
  if(stem===bare) variants=all.filter(x=>x!==c && skuStem(x)===bare);
  return {twoLayers:inBase&&inAdded, inBase, inAdded, variantOf, variants};
}
function orderingBase(){ return (DETAIL&&DETAIL.ordering_base)||"https://hcpsonlineordering.netlify.app"; }
function previewUrl(code){ return orderingBase()+"/?product="+encodeURIComponent(code)+"&mfr="+encodeURIComponent(SLUG); }
function isFeat(code){ return (DETAIL.featured||[]).includes(code); }
function catList(){ return [...new Set(effProducts().map(p=>p.category).filter(Boolean))].sort(); }
/* Existing groups, offered as suggestions — the fastest way to fix a stray SKU is to pick
   the group its siblings already use rather than retyping a string that must match exactly. */
function groupList(){ return [...new Set(effProducts().map(p=>String(p.group||"").trim()).filter(Boolean))].sort(); }
function subList(){ return [...new Set(effProducts().map(p=>String(p.subcategory||"").trim()).filter(Boolean))].sort(); }

    DETAIL.featured=[...(DETAIL.featured||[]),code]; toast("Added to Featured ★"); }
  render();
}

    image:p.image||"",description:p.description||"",price_note:p.price_note||"",active:true,tiers:tiersOf(p),edited:false};

  PDRAFT={kind:p.kind,code:p.code,orig_code:p.code,name:p.name||"",category:p.category||"",subcategory:p.subcategory||"",group:p.group||"",base_price:p.base_price??"",msrp:p.msrp??"",

const normSku=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");

/* The collision, explained, with the two things that actually resolve it. A variant suffix
   is called out on its own because merging those two records would be the WRONG answer —
   1007 and 1007AB are different products, and the number is not the mistake. */
async function offerMergeInstead(oldCode,newCode,hit,conn){
  const kin=skuKin(oldCode);
  const sameStem = skuStem(oldCode)===skuStem(hit.code) && skuStem(oldCode)!=="";
  const suffixVariant = sameStem && normSku(oldCode)!==normSku(hit.code);
  const c=conn||{};
  const risk=[];
  if(c.orders) risk.push(c.orders+" order line(s) — kept either way, never rewritten");
  if(c.media) risk.push(c.media+" image/document(s)");
  if(c.links) risk.push(c.links+" More Information link");
  if(c.featured) risk.push("on the Featured list");

  if(suffixVariant && !confirm(
      "Careful — these look like different products, not duplicates.\n\n"
      +"“"+oldCode+"” and “"+hit.code+"” share a part number stem but differ by a letter suffix, "
      +"which manufacturers use for a real variant (a different back, brake or frame).\n\n"
      +"Merging them would collapse two products into one and lose that distinction.\n\n"
      +"Continue anyway?")) { toast("Nothing changed"); return; }

  const go=confirm(
    "SKU “"+newCode+"” already belongs to:\n\n"
    +"   "+(hit.name||hit.code)+"  ("+hit.code+")\n\n"
    +(risk.length?"That record has: "+risk.join(" · ")+"\n\n":"")
    +"If that is the same item, merge this one into it — the number stops being the problem.\n\n"
    +"OK  — merge “"+oldCode+"” into “"+hit.code+"” (that record survives and keeps its approved title)\n"
    +"Cancel — leave both alone and go back to editing");
  if(!go){ toast("Nothing changed"); return; }
  await mergeInto(hit.code, oldCode);
  PDRAFT=null; render();
}

async function saveProduct(){
  if(!PDRAFT.code||!String(PDRAFT.name).trim()){toast("Code and name are required");return;}
  const tiers=(PDRAFT.tiers||[]).filter(t=>t.price!==""&&t.price!=null).map(t=>({min_qty:parseInt(t.min_qty||1,10)||1,price:Number(t.price)}));
  // SKU change on an existing product = a rename: fork to the new code, carry price/featured/
  // link/images across, retire the old code. New/duplicated drafts (orig_code=null) skip this.
  const newCode=String(PDRAFT.code).trim(), oldCode=PDRAFT.orig_code;
  if(oldCode && newCode!==oldCode){
    /* A COLLISION IS NOT A DEAD END. Renumbering a part onto a code that already exists
       almost always means "these two records are the same item" — so instead of refusing
       and leaving two records with no way forward, the collision is shown for what it is
       and the merge is offered right here. The old refusal ("pick a unique one") asked for
       the one thing that would NOT fix the problem: a third number. */
    const hit=effProducts().find(p=>p.code!==oldCode && normSku(p.code)===normSku(newCode));
    if(hit) return offerMergeInstead(oldCode,newCode,hit);
    if(!confirm("Change SKU from “"+oldCode+"” to “"+newCode+"”?\n\nThe product’s price, featured status, More-Information link and images move to the new SKU, and the old SKU is retired from the portal.")) return;
    const r=await apiRaw("",{method:"POST",body:JSON.stringify({action:"rename_code",manufacturer:SLUG,old_code:oldCode,new_code:newCode,was_custom:PDRAFT.kind==="custom",
      product:{code:newCode,name:PDRAFT.name,category:PDRAFT.category,description:PDRAFT.description,price_note:PDRAFT.price_note,
        base_price:PDRAFT.base_price===""?null:Number(PDRAFT.base_price),msrp:PDRAFT.msrp===""?null:Number(PDRAFT.msrp),image:PDRAFT.image||null,tiers,active:PDRAFT.active!==false}})});
    /* The server checks both layers, so it can still find a collision the page could not —
       a code that exists only in the deployed catalog file. Same offer, same wording. */
    if(r.status===409 && r.body && r.body.error==="sku_in_use"){
      const ex=r.body.existing||{};
      return offerMergeInstead(oldCode,newCode,{code:ex.code,name:ex.name,kind:ex.kind==="added"?"custom":"catalog"},r.body.connections);
    }
    if(!r.ok){ toast((r.body&&(r.body.message||r.body.error))||"Couldn't change that SKU",true); return; }
    PDRAFT=null; await loadMfr(); toast("SKU changed ✓ — live on the portal"); return;
  }
  if(PDRAFT.kind==="custom"){
    const r=await apiRaw("",{method:"POST",body:JSON.stringify({action:"save_product",manufacturer:SLUG,product:{...PDRAFT,tiers}})});
    if(r.status===409 && r.body && r.body.error==="duplicate_sku"){
      const ex=r.body.existing||{};
      return offerMergeInstead(PDRAFT.code, PDRAFT.code,
        {code:ex.code,name:ex.name,kind:ex.kind==="added"?"custom":"catalog"}, r.body.connections);
    }
    if(!r.ok){ toast((r.body&&(r.body.message||r.body.error))||"Couldn't save that product",true); return; }
    /* An added product's group lives on the override layer — custom_products has no column
       for it — so it is saved separately rather than being silently dropped. */
    if(PDRAFT.group!=null) await api("",{method:"POST",body:JSON.stringify(
      {action:"save_override",manufacturer:SLUG,code:PDRAFT.code,patch:{group:String(PDRAFT.group||"")}})}).catch(()=>{});
  }else{
    const patch={name:PDRAFT.name,category:PDRAFT.category,description:PDRAFT.description,price_note:PDRAFT.price_note,
      group:PDRAFT.group||"", subcategory:PDRAFT.subcategory||"",
      base_price:PDRAFT.base_price===""?null:Number(PDRAFT.base_price),msrp:PDRAFT.msrp===""?null:Number(PDRAFT.msrp),
      tiers,active:PDRAFT.active!==false};
    if(PDRAFT.image) patch.image=PDRAFT.image;
    await api("",{method:"POST",body:JSON.stringify({action:"save_override",manufacturer:SLUG,code:PDRAFT.code,patch})});
  }
  PDRAFT=null; await loadMfr(); toast("Product saved ✓ — live on the portal");
}

function searchProducts(v){ PRODQ=v; PLIMIT=60; var el=document.getElementById('prodlistwrap'); if(el) el.innerHTML=prodListHtml(); }
/* ── Link audit ───────────────────────────────────────────────────────────────
   WHICH PRODUCTS ARE ACTUALLY CONNECTED TO AN ENRICHMENT RECORD.
   A product reaches Partner 360 through a published enrichment page, and it does so because
   that page NAMES its SKU. When nothing names it, an edit made in enrichment cannot reach it —
   which is exactly how a subcategory change appeared to do nothing. This is read-only on
   purpose: the fix belongs in Product Content Enrichment & Review, where the record lives, so
   each row links straight to it rather than offering a second place to edit the same thing. */
/* RESOLVING A ROW. Two different verbs, because they are two different decisions.
   Retire stops a SKU being offered and keeps everything about it — that is the right answer for
   almost every row here, since a SKU no record claims is usually one that should not be sold
   rather than one that should be erased. Delete only appears where the audit has already proved
   the record is holding nothing: no orders, no images, no links, no Featured slot, and it is an
   added product rather than one the deployed catalog file would rebuild on the next release. */
/* ONE button, three honest outcomes — because a "delete" that quietly did something else would
   be worse than no button. A SKU from the deployed catalog file CANNOT be deleted: the next
   release rebuilds it, so removing it from the line is the only thing that actually holds. An
   added record with nothing attached is deleted outright. An added record with orders, images,
   links or a Featured slot shows what breaks and lets the decision be made with that in view. */
async function removeSku(code){
  const u=((LINKAUDIT&&LINKAUDIT.unlinked)||[]).find(x=>x.code===code)||{};
  const held=[];
  if(u.orders) held.push(u.orders+" order line(s)");
  if(u.media) held.push(u.media+" image/document(s)");
  if(u.links) held.push("a More Information link");
  if(u.featured) held.push("a Featured placement");

  if(!u.added){
    return retireSku(code,
      "“"+code+"” comes from the manufacturer catalog file, so it cannot be deleted — the next "
      +"catalog release would simply recreate it.\n\nRemoving it from the line is the change that "
      +"actually holds: dealers stop seeing it, and it can be restored at any time.");
  }
  if(u.safe_delete) return deleteSku(code);

  const go=confirm("“"+code+"” still has "+held.join(", ")+".\n\n"
    +"OK  — DELETE it permanently and drop "+held.join(", ")+". This cannot be undone.\n"
    +"Cancel — go back (use Remove again and choose nothing, or Open to attach it to a record).\n\n"
    +"If you are unsure, cancel: retiring it hides it from dealers and keeps all of the above.");
  if(!go){
    if(confirm("Retire “"+code+"” instead?\n\nDealers stop seeing it and everything attached is kept.")) return retireSku(code,null,true);
    return;
  }
  try{
    const r=await apiRaw("",{method:"POST",body:JSON.stringify({action:"delete_product",manufacturer:SLUG,code,force:true})});
    if(!r.ok){ toast("Couldn't delete "+code,true); return; }
    toast(code+" deleted permanently");
    await loadMfr(); await loadLinkAudit();
  }catch(e){ toast("Couldn't delete "+code,true); }
}

async function retireSku(code,message,skipConfirm){
  const u=((LINKAUDIT&&LINKAUDIT.unlinked)||[]).find(x=>x.code===code)||{};
  const held=[];
  if(u.orders) held.push(u.orders+" order line(s)");
  if(u.media) held.push(u.media+" image/document(s)");
  if(u.links) held.push("a More Information link");
  if(u.featured) held.push("a Featured placement");
  if(!skipConfirm && !confirm(message || ("Remove "+code+" from this line?\n\n"
    +"• Dealers stop seeing it on Partner 360\n"
    +"• Its price, images, links"+(u.orders?", and its "+u.orders+" order line(s)":"")+" stay exactly as they are\n"
    +"• It stays in the Product Catalog and can be restored at any time\n"
    +(held.length?"\nThis record is currently holding: "+held.join(", ")+"\n":"")
    +"\nIf this product should be sold, attach its SKU to an enrichment record instead — that is what Open does."))) return;
  try{
    await api("",{method:"POST",body:JSON.stringify({action:"retire_sku",manufacturer:SLUG,code,reviewer:"president"})});
    toast(code+" retired — restore it from the Products list any time");
    await loadMfr(); await loadLinkAudit();
  }catch(e){ toast("Couldn't retire "+code,true); }
}
async function deleteSku(code){
  const u=((LINKAUDIT&&LINKAUDIT.unlinked)||[]).find(x=>x.code===code)||{};
  if(!u.safe_delete){ toast("That record still has something attached — retire it instead",true); return; }
  if(!confirm("Delete "+code+" permanently?\n\n"
    +"The audit confirms this record has no orders, no images, no links and no Featured placement,\n"
    +"and it was added here rather than coming from the manufacturer catalog file.\n\n"
    +"This one cannot be undone. Retire is the reversible option.")) return;
  try{
    const r=await apiRaw("",{method:"POST",body:JSON.stringify({action:"delete_product",manufacturer:SLUG,code})});
    if(r.status===409 && r.body && r.body.error==="in_use"){
      toast((r.body.message||"That SKU is still in use"),true); await loadLinkAudit(); return;
    }
    if(!r.ok){ toast("Couldn't delete "+code,true); return; }
    toast(code+" deleted");
    await loadMfr(); await loadLinkAudit();
  }catch(e){ toast("Couldn't delete "+code,true); }
}

async function loadLinkAudit(){
  if(LINKBUSY) return; LINKBUSY=true; LINKAUDIT="loading"; render();
  try{
    LINKAUDIT=await api("",{method:"POST",body:JSON.stringify({action:"link_audit",manufacturer:SLUG})});
  }catch(e){ LINKAUDIT={error:String(e.message||e)}; }
  LINKBUSY=false; render();
}
function enrichHref(find){
  return "/admin/product-content-review.html?manufacturer="+encodeURIComponent(SLUG)
       + (find?("&find="+encodeURIComponent(find)):"");
}

        ${un.slice(0,120).map(u=>{

/* ── Duplicate Review ────────────────────────────────────────────────────────
   Nothing here acts on its own. The queue shows each suspected pair, why the system
   thinks they are the same product, and exactly what is connected to each side, so the
   choice between merge / keep separate / disable is made on evidence rather than on a
   guess about which row is safe to delete. */
function dupPanelHtml(){
  if(DUPS===null) return `<div class="card"><h2>Duplicate review</h2><p class="hint">Checking this catalog for duplicates…</p></div>`;

  const conn=c=>{ if(!c) return "<li>checking connections…</li>";

        <tr><th>Pricing</th><td>catalog ${money(d.layer_prices&&d.layer_prices.catalog)} · added ${money(d.layer_prices&&d.layer_prices.added)}${

    const other=(g.members.find(x=>x.code!==m.code)||{}).code||"";
    return `<div class="dupc${isMaster?" master":(m.kind==="added"?" win":"")}" id="dupc-${esc(m.code)}">

      <div class="cc">${esc(m.code)} · ${esc((d&&d.source)||(m.kind==="added"?"added by enrichment":"standard catalog product"))}</div>

  /* ONE SKU IN TWO LAYERS. When both members carry the same code there is only one product

     what each layer holds and offers the one action that actually applies. */
  const layerCard=(g)=>{
    const code=g.code||g.members[0].code;
    const d=(DETAILS||{})[code]||null;
    const lt=(d&&d.layer_titles)||{}, lp=(d&&d.layer_prices)||{};

    const rows=layers.map(([lab,t,pr,isApp])=>`<tr class="${isApp?"hl":""}"><th>${esc(lab)}</th>
      <td>${t?esc(t):'<span class="mut">—</span>'}${pr!=null?` <span class="mut">· ${money(pr)}</span>`:""}</td></tr>`).join("");
    return `<div class="dupc master${DUPSEL.has(code)?" picked":""}" id="dupc-${esc(code)}">

      <div class="cc">${esc(code)} · one SKU, stored in ${g.members.length} layers</div>
      <table class="dupfacts">${rows}
        ${d?`<tr><th>Partner 360</th><td>${d.partner360_visible
          ? '<b style="color:#1a7f4b">Visible to dealers now</b>' : '<span class="mut">Not visible</span>'}</td></tr>
        <tr><th>Order history</th><td>${d.has_orders?`<b>${d.order_lines}</b> order line${d.order_lines===1?"":"s"}`:'<span class="mut">none</span>'}</td></tr>
        <tr><th>Attached</th><td>${d.images} image/doc · ${d.links} link${d.featured?" · Featured":""}</td></tr>`:""}
      </table>
      ${(d&&d.warnings||[]).map(w=>`<div class="dupwarn ${w.level==="high"?"hi":""}">${esc(w.text)}</div>`).join("")}
      <div class="dupwarn">Nothing here is a second product. Consolidating keeps the approved title${
        approved?` — <b>${esc(approved)}</b>`:""} and fills anything it is missing from the older layers.

      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn sm" onclick="mergeLayers('${esc(code)}')">Consolidate into one record</button>

        <button class="btn ghost sm" onclick="editProduct('${esc(code)}')">Open</button>

  /* The heading names the product the way the person approved it, not by concatenating

  const groupTitle=g=>{
    const codes=[...new Set(g.members.map(m=>m.code))];
    const app=codes.map(c=>((DETAILS||{})[c]||{}).enriched_title).filter(Boolean);
    if(app.length) return [...new Set(app)].join("  ·  ");
    const cur=codes.map(c=>((DETAILS||{})[c]||{}).current_title).filter(Boolean);
    if(cur.length) return [...new Set(cur)].join("  ·  ");

  };
  return `<div class="card" id="dupreview">
    <h2>Duplicate review${high?` — ${high} to resolve`:""}</h2>

    <div class="dupbar"><b>Why this happens.</b> The catalog stores <code>MP-P09</code> and <code>mp-p09</code> as two different SKUs,
      so publishing an enriched product under a differently-typed code created a second copy instead of improving the first.
      That route is now closed — publishing a SKU that already exists enriches the existing record instead.</div>
    ${dupBulkBarHtml()}
    ${DUPS.map(g=>`<div class="dupg">
      <h4>${esc(groupTitle(g))}</h4>
      <p class="dupwhy"><b>Why flagged:</b> ${esc(g.reasons.join(" · "))}.
        ${g.same_code
          ? "This is one SKU held in two layers — the deployed catalog file and the added record — not two products. Consolidate it."
          : g.confidence==="high"
          ? "These are the same SKU — merging is almost certainly right."
          : "The SKUs are different, so this may be a genuine model or size variant. Keep them separate unless you know otherwise."}</p>
      <div class="dupm${g.same_code?" one":""}">${g.same_code?layerCard(g):g.members.map(m=>card(m,g)).join("")}</div>

             <span class="hint" style="margin:0">or disable the one you don't sell from its Edit screen.</span>`}

/* ── Working on many products at once ─────────────────────────────────────────
   Selection follows the filters: "select all" means everything the list is currently
   showing, so narrowing to a category or a status and selecting all is the fast, safe way
   to act on a run of products rather than scrolling for checkboxes.

   Delete is permanent and it is the one Angelo asked for. Two limits are worth knowing
   before using it, and both come from the catalog itself rather than from caution:
     · Only ADDED products can be deleted. A standard catalog product lives in the deployed
       file, so the most it can be is hidden — there is nothing here to remove.
     · A product carrying order history, images, links, a Featured placement or saved edits
       is refused, because deleting it would leave those pointing at nothing. Order lines
       are the serious one: they are what commission and sales reporting are built from.
   Nothing is forced past those. Whatever is refused comes back named, with Hide offered
   for the same selection — which is what actually takes a discontinued item off the
   dealer platform. */
let PSEL=new Set();
function prodPick(code,on){ if(on) PSEL.add(code); else PSEL.delete(code); render(); }
function allPicked(shown){ return shown.length>0 && shown.every(p=>PSEL.has(p.code)); }
function prodPickAll(on){
  const shown=lastShown||[];
  if(on) shown.forEach(p=>PSEL.add(p.code)); else shown.forEach(p=>PSEL.delete(p.code));
  render();
}
let lastShown=[];
function prodBulkBarHtml(allP,shownP){
  lastShown=shownP;
  const n=PSEL.size; if(!n) return '';
  const picked=effProducts().filter(p=>PSEL.has(p.code));
  const added=picked.filter(p=>p.kind==="custom").length;
  const standard=picked.length-added;
  return `<div class="prodbulk">
    <div class="pbl"><b>${n}</b> selected — <b>${added}</b> added${standard?`, <b>${standard}</b> standard catalog (these can be hidden, not deleted)`:""}</div>
    <div class="pbr">
      <button class="btn ghost sm" onclick="PSEL=new Set();render()">Clear</button>
      <button class="btn ghost sm" onclick="prodBulkHide()">Hide ${n} from platform</button>
      <button class="btn sm" style="background:var(--red,#b42323);border-color:var(--red,#b42323);color:#fff" onclick="prodBulkDelete()">Delete ${added||0} added</button>
    </div></div>`;
}
async function prodBulkHide(){
  const codes=[...PSEL]; if(!codes.length) return;
  if(!confirm("Hide "+codes.length+" product"+(codes.length===1?"":"s")+" from Partner 360?\n\n"
    +"Dealers stop seeing and ordering them. Prices, images and order history are kept, and you can show them again at any time.")) return;
  let ok=0, bad=0;
  for(const code of codes){
    try{ const r=await api("",{method:"POST",body:JSON.stringify({action:"save_override",manufacturer:SLUG,code,patch:{active:false}})});
      if(r&&r.ok!==false) ok++; else bad++; }catch(e){ bad++; }
  }
  PSEL=new Set(); toast(ok+" hidden"+(bad?" · "+bad+" failed":""),!!bad); await loadMfr();
}
async function prodBulkDelete(){
  const picked=effProducts().filter(p=>PSEL.has(p.code));
  const codes=picked.filter(p=>p.kind==="custom").map(p=>p.code);
  if(!codes.length){ toast("None of the selected products are added products — a standard catalog product can only be hidden",true); return; }
  if(!confirm("Permanently delete "+codes.length+" added product"+(codes.length===1?"":"s")+" from "+(curMfr().name||SLUG)+"?\n\n"
    +"This cannot be undone from here — you would have to add them again.\n\n"
    +"Anything still carrying order history, images, links, a Featured placement or saved catalog edits will be REFUSED and listed, "
    +"because deleting it would leave those pointing at nothing. Use Hide for those.")) return;
  const CHUNK=100; const gone=[], refused=[]; let failedChunks=0;
  for(let i=0;i<codes.length;i+=CHUNK){
    const part=codes.slice(i,i+CHUNK);
    toast("Deleting "+(i+1)+"–"+Math.min(i+CHUNK,codes.length)+" of "+codes.length+"…");
    let r=null;
    try{ r=await api("",{method:"POST",body:JSON.stringify({action:"delete_products_bulk",manufacturer:SLUG,codes:part})}); }catch(e){ r=null; }
    if(r&&r.ok!==false){ gone.push(...(r.deleted||[])); refused.push(...(r.refused||[])); }
    else failedChunks++;
  }
  PSEL=new Set();
  toast(gone.length+" deleted"+(refused.length?" · "+refused.length+" refused":"")+(failedChunks?" · "+failedChunks+" batch(es) failed":""), !!(refused.length||failedChunks));
  if(refused.length){
    console.warn("Refused:",refused);
    alert(refused.length+" product(s) were NOT deleted because something still points at them:\n\n"
      +refused.slice(0,15).map(r=>"• "+r.code+" — "+r.reason).join("\n")
      +(refused.length>15?"\n… and "+(refused.length-15)+" more":"")
      +"\n\nSelect them again and use Hide from platform instead — that takes them off the dealer platform and keeps the history intact.");
  }
  await loadMfr();
}

/* ── Consolidating in bulk ─────────────────────────────────────────────────────
   237 of these is not 237 decisions. A same-code group is one SKU the catalog happens to
   hold in two layers; consolidating it keeps the approved title, fills the gaps from the
   older layer, leaves both layers in place and can be undone. That is the same answer every
   time, so it should be answerable once.

   Only same-code groups are selectable. A group of two DIFFERENT codes is a judgement —
   the pressure relief pad and the post-op shoe with a pad differ by three digits and share
   every word of the shorter name, and merging them would have destroyed one. Those keep
   their one-at-a-time review, and no "select all" can sweep them up by accident. */
let DUPSEL=new Set();
function dupSelectable(){ return (DUPS||[]).filter(g=>g.same_code).map(g=>g.code||g.members[0].code); }
function dupPick(code,on){ if(on) DUPSEL.add(code); else DUPSEL.delete(code); dupBulkSync(); }
function dupPickAll(on){
  DUPSEL = on ? new Set(dupSelectable()) : new Set();
  render();
}
function dupBulkSync(){
  const bar=document.getElementById("dupbulk"); if(bar) bar.outerHTML=dupBulkBarHtml();
  document.querySelectorAll(".dupc.master").forEach(el=>{
    const c=(el.id||"").replace(/^dupc-/,""); el.classList.toggle("picked",DUPSEL.has(c)); });
}
function dupBulkBarHtml(){
  const all=dupSelectable(), n=DUPSEL.size;
  if(!all.length) return '<div id="dupbulk"></div>';
  const other=(DUPS||[]).length-all.length;
  return `<div id="dupbulk" class="dupbulk">
    <div class="dbl"><b>${all.length}</b> of these are one SKU held in two layers — the same answer every time.
      ${other?`The other <b>${other}</b> ${other===1?"is a pair of different SKUs and stays":"are pairs of different SKUs and stay"} a one-at-a-time decision.`:""}</div>
    <div class="dbr">
      <button class="btn ghost sm" onclick="dupPickAll(true)">Select all ${all.length}</button>
      <button class="btn ghost sm" onclick="dupPickAll(false)"${n?"":" disabled"}>Clear</button>
      <button class="btn sm" onclick="dupBulkGo()"${n?"":" disabled"}>Consolidate ${n||""} selected</button>
    </div></div>`;
}
async function dupBulkGo(){
  const codes=[...DUPSEL]; if(!codes.length) return;
  if(!confirm("Consolidate "+codes.length+" record"+(codes.length===1?"":"s")+" in "+(curMfr().name||SLUG)+"?\n\n"
    +"Each one is a single SKU the catalog holds in two layers. Consolidating keeps the approved title, "
    +"fills anything missing from the older layer, and leaves both layers in place.\n\n"
    +"Nothing is deleted, no order history is rewritten, and each one can be undone.")) return;
  const CHUNK=100, done=[], skipped=[]; let failedChunks=0;
  for(let i=0;i<codes.length;i+=CHUNK){
    const part=codes.slice(i,i+CHUNK);
    toast("Consolidating "+(i+1)+"–"+Math.min(i+CHUNK,codes.length)+" of "+codes.length+"…");
    let r=null;
    try{ r=await api("",{method:"POST",body:JSON.stringify({action:"merge_layers_bulk",
      manufacturer:SLUG, codes:part, reviewer:(window.REVIEWER||"admin")})}); }catch(e){ r=null; }
    if(r&&r.ok!==false){ done.push(...(r.codes||[])); skipped.push(...(r.skipped||[])); }
    else failedChunks++;
  }
  DUPSEL=new Set();
  const bits=[done.length+" consolidated"];
  if(skipped.length) bits.push(skipped.length+" skipped");
  if(failedChunks) bits.push(failedChunks+" batch"+(failedChunks===1?"":"es")+" failed");
  toast(bits.join(" · "), !!failedChunks);
  if(skipped.length) console.warn("Not consolidated:", skipped);
  await loadMfr();
}

/* Put a questionable record into a state instead of deleting it. Every one of these is
   reversible and none loses pricing, orders, images or published content — which is the
   point: deletion is the last resort, not the first move. */
async function setRecordState(code,state){
  const d=(DETAILS||{})[code]||{};
  const label=state?(PA_STATE[state]||state):"Active";
  let warn="";
  if(d.partner360_visible && state && state!=="possible_duplicate")
    warn="\n\nThis product is visible to dealers in Partner 360 right now — this removes it from what they can order.";
  if(d.has_orders) warn+="\n\nIt has "+d.order_lines+" historical order line(s). Those are kept either way.";
  if(!confirm('Set "'+(d.enriched_title||d.current_title||code)+'" to '+label+'?'+warn+"\n\nReversible — you can set it back at any time.")) return;
  try{
    const r=await api("",{method:"POST",body:JSON.stringify({action:"save_override",manufacturer:SLUG,code,patch:{disposition:state||""}})});
    if(r&&r.ok!==false){ toast(code+" → "+label); await loadMfr(); }
    else toast((r&&r.error)||"Couldn't set that status",true);
  }catch(e){ toast("Couldn't set that status",true); }
}

async function mergeInto(winner,loser){
  if(!winner||!loser) return;
  const eff=effProducts(); const w=eff.find(x=>x.code===winner)||{}, l=eff.find(x=>x.code===loser)||{};
  const lConn=((DUPS||[]).flatMap(g=>g.members).find(m=>m.code===loser)||{}).connections||{};
  const warn=lConn.orders?`\n\n${lConn.orders} order line(s) reference ${loser}. Those records stay exactly as they are — order history is never rewritten.`:"";
  const dw=(DETAILS||{})[winner]||{}, dl=(DETAILS||{})[loser]||{};
  const title=dw.enriched_title||dw.current_title||w.name||winner;
  if(!confirm(`Keep "${title}" (${winner}) and merge "${dl.current_title||l.name||loser}" (${loser}) into it?\n\n`
    +(dw.enriched_title?`• The kept record will carry its APPROVED title: "${dw.enriched_title}"\n`:"")
    +`• ${loser}'s price, MSRP, links, images and Featured placement move to ${winner}\n`
    +`• Nothing already set on ${winner} is overwritten by older data\n`
    +`• ${loser} is ARCHIVED, not deleted, and this can be undone${warn}`)) return;
  if(DUPBUSY) return; DUPBUSY=true;
  try{
    const r=await api("",{method:"POST",body:JSON.stringify({action:"merge_products",manufacturer:SLUG,winner,loser,reviewer:"president"})});
    if(r&&r.ok!==false){
      const c=(r.carried||[]).length;
      toast(`Merged ${loser} into ${winner}${c?` · carried ${r.carried.join(", ")}`:""}`);
      await loadMfr();
    } else if(r&&r.error==="same_code"){ toast(r.message||"That is one SKU in two layers — consolidate it instead.",true); }
    else toast((r&&r.error)||"Merge failed",true);
  }catch(e){ toast("Merge failed",true); }
  DUPBUSY=false;
}
/* Consolidating one SKU's layers. Deliberately NOT mergeInto: there is no loser here, so
   nothing is archived and nothing goes off Partner 360. It writes the approved title and
   whatever the record is missing onto the winning layer and stops the pair being flagged. */
async function mergeLayers(code){
  if(!code) return;
  const d=(DETAILS||{})[code]||{};
  const lt=d.layer_titles||{};
  const approved=d.enriched_title||lt.approved||null;
  const others=[["Added record",lt.added],["Catalog file",lt.catalog],["Saved catalog edit",lt.override]]
    .filter(([,t])=>t&&t!==approved).map(([l,t])=>`   ${l}: "${t}"`);
  if(!confirm(`Consolidate ${code} into one record?\n\n`
    +(approved?`• It keeps your approved title: "${approved}"\n`:`• It keeps its current title: "${d.current_title||code}"\n`)
    +(others.length?`• These older titles stop being used:\n${others.join("\n")}\n`:"")
    +`• Missing price, image, description or category are filled in from the older layers\n`
    +`• Nothing is deleted or archived, the product stays visible to dealers, and this can be undone`)) return;
  if(DUPBUSY) return; DUPBUSY=true;
  try{
    const r=await api("",{method:"POST",body:JSON.stringify({action:"merge_layers",manufacturer:SLUG,code,reviewer:"president"})});
    if(r&&r.ok!==false){
      toast(`${code} consolidated${r.title?` · now titled "${r.title}"`:""}`);
      await loadMfr();
    } else toast((r&&(r.message||r.error))||"Couldn't consolidate that record",true);
  }catch(e){ toast("Couldn't consolidate that record",true); }
  DUPBUSY=false;
}

/* "Keep separate" is a decision too, so it is remembered — otherwise the same pair is
   re-flagged on every load and the queue never empties. Stored per browser; it hides the
   pair from the queue and changes nothing about either product. */
function dismissedKey(){ return "hcps_dupok_"+SLUG; }
function dismissed(){ try{ return JSON.parse(localStorage.getItem(dismissedKey())||"[]")||[]; }catch(e){ return []; } }
function dupKeepSeparate(key){
  if(!confirm("Mark these as genuinely different products?\n\nNothing changes on either record — they just stop appearing in this queue.")) return;
  try{ const d=dismissed(); if(d.indexOf(key)<0) d.push(key); localStorage.setItem(dismissedKey(),JSON.stringify(d)); }catch(e){}
  DUPS=(DUPS||[]).filter(g=>g.key!==key); toast("Kept separate"); render();
}

       <span style="flex:1"></span>
       ${PDRAFT.kind==="custom"
          ? (DETAIL.custom&&DETAIL.custom.some(x=>x.code===PDRAFT.code)?`<button class="btn red" onclick="delProduct('${esc(PDRAFT.code)}')">Delete product</button>`:"")
          : (PDRAFT.active===false?`<button class="btn ghost" onclick="restoreProduct('${esc(PDRAFT.code)}')">Restore to portal</button>`:`<button class="btn red" onclick="removeProduct('${esc(PDRAFT.code)}')">Remove from portal</button>`)}</div>
   </div>` : "";

  $("#wrap").innerHTML=`
    <h1>Catalog</h1>
    <p class="sub">Manufacturer logos, extra products, and "More Information" brochures/links — all publish instantly to the portal, no site rebuild.</p>
    <div class="bar"><label class="fl" style="margin:0">Manufacturer</label>
      <select onchange="SLUG=this.value;LOGODRAFT='';PDRAFT=null;PQ='';PRODQ='';PCAT='';PSTAT='';PSORT='name';PLIMIT=60;loadMfr()">${mfrOpts}</select></div>

    <div class="card">
      <h2>Manufacturer logo</h2>
      <p class="hint">Shows below the manufacturer name on the dealer home cards and at the top of this line's catalog page.</p>
      <div class="imgrow">
        <div class="thumb" style="${logoUrl?`background-image:url('${esc(logoUrl)}')`:""}">${logoUrl?"":"no logo"}</div>
        <div><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="upload('logo-${esc(SLUG)}',this.files[0],4,u=>{LOGODRAFT=u;render();})">
          <div style="margin-top:8px"><button class="btn orange sm" onclick="saveLogo()">Save logo</button>
            ${m.logo_url?`<button class="btn ghost sm" onclick="clearLogo()">Remove</button>`:""}</div>
          <div class="hint" style="margin-top:6px">PNG with transparent background looks best.</div></div>
      </div>
    </div>

    ${pform}
    ${guideHtml()}
    ${linkAuditHtml()}
    ${dupPanelHtml()}
    <div class="card">
      <h2>Products</h2>
      ${(()=>{ const on=!!(m&&m.enriched_only);
        return `<div class="dupbar" style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
          <label style="display:flex;gap:7px;align-items:flex-start;cursor:pointer;flex:1;min-width:280px">
            <input type="checkbox" ${on?"checked":""} onchange="setListingMode(this.checked)" style="margin-top:2px">
            <span><b>List only enriched products on Partner 360.</b>
            ${on
              ? `On. Dealers see one card per published enrichment page, and a SKU no page lists is not offered — it stays here, priced and intact, and reappears as soon as a page lists it.`
              : `Off. Every priced SKU on this line is listed, whether or not it has been enriched. Turn this on once this line's enrichment is finished.`}</span>
          </label></div>`; })()}
      ${(()=>{
        const stored=(m&&Array.isArray(m.category_order))?m.category_order:null;
        const present=catList();
        /* Stored order first, then anything new that has not been placed yet — so a category
           added later always shows up here to be positioned, rather than silently sorting last
           on the portal forever. */
        const placed=(stored||[]).filter(c=>present.includes(c));
        const unplaced=present.filter(c=>!placed.includes(c));
        const rows=placed.concat(unplaced);
        if(rows.length<2) return "";
        return `<div class="dupbar">
          <b>Category order on Partner 360.</b> This one list drives the shop's category filter
          <i>and</i> the order sections scroll down the page, so the two always agree.
          ${unplaced.length?`<span style="color:#8a5a12"> ${unplaced.length} new categor${unplaced.length===1?"y is":"ies are"} unplaced at the end.</span>`:""}
          <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px;max-width:520px">
            ${rows.map((c,i)=>`<div style="display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--silver);border-radius:8px;padding:5px 8px">
              <span style="width:20px;color:var(--gray);font-variant-numeric:tabular-nums">${i+1}</span>
              <span style="flex:1;font-weight:600${(stored&&!placed.includes(c))?";color:#8a5a12":""}">${esc(c)}</span>
              <span class="hint" style="margin:0">${effProducts().filter(p=>p.category===c).length}</span>
              <button class="btn ghost sm" ${i===0?"disabled":""} onclick="moveCat(${i},-1)" title="Move up">↑</button>
              <button class="btn ghost sm" ${i===rows.length-1?"disabled":""} onclick="moveCat(${i},1)" title="Move down">↓</button>
            </div>`).join("")}
          </div>
          <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn ghost sm" onclick="resetCatOrder()">Reset to A–Z</button>
          </div></div>`;
      })()}
      <p class="hint">Filter, sort, and page through the whole line. Click <b>Edit</b> to manage everything about a product in one place — details, pricing, category, image, its More Information link/brochure, status &amp; featured. Standard catalog edits save as an override (no redeploy); added products are yours to add or delete.</p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <button class="btn sm" onclick="newProduct()">+ Add product</button>
        <input type="text" placeholder="Search name, code / SKU, category…" value="${esc(PRODQ)}" id="prodsearch" oninput="searchProducts(this.value)" style="flex:1;min-width:200px">
        <select onchange="setFilter('cat',this.value)" title="Filter by category"><option value="">All categories</option>${catList().map(c=>`<option value="${esc(c)}" ${PCAT===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
        <select onchange="setFilter('stat',this.value)" title="Filter by status"><option value="" ${PSTAT===""?"selected":""}>All statuses</option><option value="shown" ${PSTAT==="shown"?"selected":""}>Shown</option><option value="hidden" ${PSTAT==="hidden"?"selected":""}>Hidden</option><option value="featured" ${PSTAT==="featured"?"selected":""}>Featured</option><option value="added" ${PSTAT==="added"?"selected":""}>Added</option><option value="edited" ${PSTAT==="edited"?"selected":""}>Edited</option>
          <optgroup label="Status">${Object.keys(STATUS_META).map(k=>`<option value="${k}" ${PSTAT===k?"selected":""}>${esc(STATUS_META[k].label)}</option>`).join("")}</optgroup></select>
        <select onchange="setFilter('sort',this.value)" title="Sort">
          <option value="name" ${PSORT==="name"?"selected":""}>Sort: Name A–Z</option>
          <option value="code" ${PSORT==="code"?"selected":""}>Code / SKU</option>
          <option value="category" ${PSORT==="category"?"selected":""}>Category</option>
          <option value="price_asc" ${PSORT==="price_asc"?"selected":""}>Price low→high</option>
          <option value="price_desc" ${PSORT==="price_desc"?"selected":""}>Price high→low</option>
          <option value="status" ${PSORT==="status"?"selected":""}>Status</option>
        </select>
      </div>
      <div id="prodlistwrap">${prodListHtml()}</div>
    </div>`;
}
/* masthead provides Lock */
if(TOKEN)boot();else gate();
</script>
</body></html>
