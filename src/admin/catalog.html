<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS Admin — Catalog</title>
<style>
 :root{--ink:#1b2733;--blue:#3B599A;--blue-dk:#2B4071;--orange:#F5821F;--silver:#D8DEE4;--light:#F3F6FA;--gray:#5b6672;--green:#1A7A4A;--red:#B91C1C}
 *{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--ink)}
 .adminnav{background:var(--ink);display:flex;align-items:center;gap:6px;padding:10px 22px;flex-wrap:wrap}
 .adminnav .bd{color:#fff;font-weight:800;font-size:15px;margin-right:16px}.adminnav .bd span{color:var(--orange)}
 .adminnav a{color:#aeb9c6;text-decoration:none;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-radius:7px}
 .adminnav a:hover{color:#fff}.adminnav a.on{color:#fff;background:var(--blue)}
 .wrap{max-width:1120px;margin:22px auto;padding:0 20px}
 h1{font-size:22px;margin:0 0 3px}.sub{color:var(--gray);font-size:13px;margin:0 0 16px}
 .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
 select,input[type=text],input[type=number],textarea{padding:9px 11px;border:1px solid var(--silver);border-radius:8px;font-size:13px;background:#fff;font-family:inherit}
 textarea{resize:vertical;min-height:52px;width:100%}
 .card{background:#fff;border:1px solid var(--silver);border-radius:14px;padding:18px;margin-bottom:18px}
 .card h2{font-size:16px;margin:0 0 4px;color:var(--blue-dk)}.card .hint{font-size:12px;color:var(--gray);margin:0 0 14px;line-height:1.5}
 label.fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);font-weight:700;margin:10px 0 4px}
 .imgrow{display:flex;gap:12px;align-items:center;margin-top:6px}
 .thumb{width:120px;height:70px;border-radius:8px;background:#eef2f7 center/contain no-repeat;border:1px solid var(--silver);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#9aa6b2;font-size:11px}
 .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px}
 .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--silver)}.btn.sm{padding:6px 11px;font-size:12px}.btn.orange{background:var(--orange)}.btn.red{background:var(--red)}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.grid2{grid-template-columns:1fr}}
 table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
 td,th{padding:7px 8px;border-bottom:1px solid #eef2f6;text-align:left;vertical-align:middle}
 th{font-size:10.5px;text-transform:uppercase;color:var(--gray)}
 .prow{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #eef2f6;flex-wrap:wrap}
 .prow:first-of-type{border-top:none}
 .prow .pn{flex:1;min-width:160px}.prow .pn b{font-size:13px}.prow .pn .c{font-size:11px;color:var(--gray)}
 .prow input[type=text]{min-width:150px}
 .haslink{color:var(--green);font-weight:700;font-size:12px}
 .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
 .chip{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:5px;padding:1px 6px;margin-left:4px}
 .chip.cst{background:#eef2fb;color:#3b599a}.chip.ed{background:#fff3e6;color:#b4651a}.chip.ft{background:#fffaf0;color:#b4820f;border:1px solid #f0dca8}
 .star{border:1px solid var(--silver);background:#fff;border-radius:7px;width:30px;height:28px;cursor:pointer;font-size:15px;line-height:1;color:#c7ccd2;vertical-align:middle}
 .star.on{color:#e4a11b;border-color:#e4a11b;background:#fffaf0}
 .gate,.msg{background:#fff;border:1px solid var(--silver);border-radius:12px;padding:24px;max-width:420px;margin:30px auto;text-align:center}
 .go{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
 .err{color:var(--red)}.ok{color:var(--green)}
 .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
</style><link rel="stylesheet" href="/admin/admin-shell.css"></head><body>
<header id="ac-head"></header>
<div class="wrap" id="wrap"><div class="msg">Loading…</div></div>
<div class="toast" id="toast"></div>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const API="/.netlify/functions/catalog-api";
const TKEY="hcps_staff_token", PKEY="hcps_staff_profile";
window.addEventListener("hcps-token",function(e){try{TOKEN=e.detail;}catch(_){}});
let ME=null; try{ME=HCPS.profile()}catch(e){ME=null;}
let TOKEN=HCPS.token(), MFRS=[], SLUG="", DETAIL=null, PQ="";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
async function api(qs,opts){const h={"content-type":"application/json"};if(TOKEN)h["authorization"]="Bearer "+TOKEN;
  const r=await fetch(API+(qs||""),{...(opts||{}),headers:{...h,...((opts&&opts.headers)||{})}});
  if(r.status===401){gate();throw new Error("unauthorized");}
  if(r.status===403){$("#wrap").innerHTML='<div class="msg err">President only — this tool is limited to President accounts. <button class="go" onclick="lock()">Sign in as a different user</button></div>';throw new Error("unauthorized");}
  const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||("HTTP "+r.status));return j;}
function gate(msg){$("#wrap").innerHTML=`<div class="gate"><h2>Staff sign-in</h2><p style="margin:2px 0 12px;color:#607089;font-size:13px">Sign in with your work email and password.</p><input id="lemail" type="email" placeholder="Email" autocomplete="username" style="margin:0 0 8px;width:100%"><input id="lpass" type="password" placeholder="Password" autocomplete="current-password" style="margin:0 0 12px;width:100%" onkeydown="if(event.key==='Enter')submitTok()"><br><button class="go" onclick="submitTok()">Sign in</button> <a href="reset.html" style="display:inline-block;margin-left:6px;color:#10263f;font-size:13px;font-weight:600">Forgot password?</a><div id="lerr" style="color:#b42323;margin-top:8px">${msg||""}</div></div>`;setTimeout(()=>{var t=$("#lemail");if(t)t.focus();},50);}
async function submitTok(){
  var email=(($("#lemail")||{}).value||"").trim(), password=(($("#lpass")||{}).value||"");
  var e=$("#lerr"); if(e)e.textContent="Signing in…";
  try{ const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email,password})});
    const j=await r.json().catch(()=>({})); if(!j||!j.ok){ gate((j&&j.message)||"Could not sign in."); return; }
    HCPS.setSession(j); TOKEN=j.token; ME=j.profile; boot();
  }catch(err){ gate("Could not reach the server. Try again."); }
}
function lock(){ HCPS.signOut(); TOKEN=null; ME=null; location.reload(); }
async function boot(){
  try{const j=await api("",{method:"GET"}); MFRS=j.manufacturers||[];
    if(!MFRS.length){$("#wrap").innerHTML='<div class="msg">No manufacturers found.</div>';return;}
    if(!SLUG) SLUG=(MFRS.find(m=>m.hasData)||MFRS[0]).slug;
    await loadMfr();
  }catch(e){if(String(e.message)!=="unauthorized")$("#wrap").innerHTML=`<div class="msg err">Couldn't load: ${esc(e.message)}</div>`;}
}
async function loadMfr(){ DETAIL=await api("?manufacturer="+encodeURIComponent(SLUG),{method:"GET"}); render(); }
function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});}
async function upload(slot,file,maxMB,cb){
  if(!file)return; if(file.size>(maxMB||6)*1024*1024){toast("File too large (max "+(maxMB||6)+"MB)");return;}
  toast("Uploading…");
  try{const data=await fileToB64(file);
    const j=await api("",{method:"POST",body:JSON.stringify({action:"upload",slot,filename:file.name,contentType:file.type||"application/octet-stream",data})});
    cb(j.url);toast("Uploaded ✓");
  }catch(e){toast("Upload failed: "+e.message);}
}
function curMfr(){return MFRS.find(m=>m.slug===SLUG)||{};}

/* ---- logo ---- */
let LOGODRAFT="";
async function saveLogo(){ await api("",{method:"POST",body:JSON.stringify({action:"save_logo",slug:SLUG,url:LOGODRAFT||curMfr().logo_url||""})});
  const m=curMfr(); m.logo_url=LOGODRAFT||m.logo_url; toast("Logo saved ✓"); render(); }
async function clearLogo(){ if(!confirm("Remove this manufacturer's logo?"))return; await api("",{method:"POST",body:JSON.stringify({action:"clear_logo",slug:SLUG})}); curMfr().logo_url=""; LOGODRAFT=""; toast("Logo removed"); render(); }

/* ---- products (edit ANY product: catalog via overrides, or custom) ---- */
let PDRAFT=null, PRODQ="", PCAT="", PSTAT="", PSORT="name", PLIMIT=60;
// full filter + sort + paginate pipeline over the effective product list
function filteredSortedProducts(){
  let arr=effProducts();
  const q=PRODQ.toLowerCase().trim();
  if(q) arr=arr.filter(p=>(`${p.code} ${p.name} ${p.category||""}`.toLowerCase().includes(q)));
  if(PCAT) arr=arr.filter(p=>(p.category||"")===PCAT);
  if(PSTAT==="shown") arr=arr.filter(p=>p.active!==false);
  else if(PSTAT==="hidden") arr=arr.filter(p=>p.active===false);
  else if(PSTAT==="featured") arr=arr.filter(p=>isFeat(p.code));
  else if(PSTAT==="added") arr=arr.filter(p=>p.kind==="custom");
  else if(PSTAT==="edited") arr=arr.filter(p=>p.edited);
  const price=p=>(p.base_price!=null&&p.base_price!=="")?Number(p.base_price):Infinity;
  const nm=(a,b)=>String(a.name||"").localeCompare(String(b.name||""),"en",{sensitivity:"base"});
  const cmp={ name:nm, code:(a,b)=>String(a.code||"").localeCompare(String(b.code||""),"en",{sensitivity:"base"}),
    category:(a,b)=>String(a.category||"~").localeCompare(String(b.category||"~"),"en",{sensitivity:"base"})||nm(a,b),
    price_asc:(a,b)=>price(a)-price(b), price_desc:(a,b)=>price(b)-price(a),
    status:(a,b)=>((a.active===false?1:0)-(b.active===false?1:0))||nm(a,b) }[PSORT]||nm;
  return arr.slice().sort(cmp);
}
function setFilter(k,v){ if(k==="cat")PCAT=v; else if(k==="stat")PSTAT=v; else if(k==="sort")PSORT=v; else if(k==="q")PRODQ=v; PLIMIT=60; render(); }
// effective product list = catalog (with any override applied) + custom products
function effProducts(){
  const over=DETAIL.overrides||{};
  const cat=(DETAIL.products||[]).map(p=>{const o=over[p.code]||{}; return {...p,...o,kind:"catalog",edited:!!over[p.code]};});
  const map=new Map(); cat.forEach(p=>map.set(p.code,p));
  (DETAIL.custom||[]).forEach(p=>map.set(p.code,{...p,kind:"custom"}));
  return [...map.values()];
}
function tiersOf(p){ return Array.isArray(p&&p.tiers)?p.tiers.map(t=>({min_qty:t.min_qty??t.minQty??1,price:t.price})):[]; }
function isFeat(code){ return (DETAIL.featured||[]).includes(code); }
function catList(){ return [...new Set(effProducts().map(p=>p.category).filter(Boolean))].sort(); }
async function toggleFeatured(code){
  const p=effProducts().find(x=>x.code===code); if(!p)return;
  if(isFeat(code)){ await api("",{method:"POST",body:JSON.stringify({action:"unset_featured",manufacturer:SLUG,code})});
    DETAIL.featured=(DETAIL.featured||[]).filter(c=>c!==code); toast("Removed from Featured"); }
  else{ await api("",{method:"POST",body:JSON.stringify({action:"set_featured",manufacturer:SLUG,code,name:p.name})});
    DETAIL.featured=[...(DETAIL.featured||[]),code]; toast("Added to Featured ★"); }
  render();
}
function duplicateProduct(code){
  const p=effProducts().find(x=>x.code===code); if(!p)return;
  PDRAFT={kind:"custom",code:p.code+"-COPY",orig_code:null,name:(p.name||"")+" (copy)",category:p.category||"",base_price:p.base_price??"",msrp:p.msrp??"",
    image:p.image||"",description:p.description||"",price_note:p.price_note||"",active:true,tiers:tiersOf(p),edited:false};
  toast("Duplicated — edit the code/name and save"); render();
}
function newProduct(){PDRAFT={kind:"custom",code:"",orig_code:null,name:"",category:"",base_price:"",msrp:"",image:"",description:"",price_note:"",active:true,tiers:[]};render();}
// orig_code = the SKU this draft was opened under; if the code field is changed before saving,
// saveProduct treats it as a rename (see rename_code). New/duplicate drafts have orig_code=null.
function editProduct(code){ const p=effProducts().find(x=>x.code===code); if(!p)return;
  PDRAFT={kind:p.kind,code:p.code,orig_code:p.code,name:p.name||"",category:p.category||"",base_price:p.base_price??"",msrp:p.msrp??"",
    image:p.image||"",description:p.description||"",price_note:p.price_note||"",active:p.active!==false,tiers:tiersOf(p),edited:!!p.edited};
  render(); }
function setP(k,v){PDRAFT[k]=v;}
function addTier(){PDRAFT.tiers.push({min_qty:"",price:""});render();}
function rmTier(i){PDRAFT.tiers.splice(i,1);render();}
function setTier(i,k,v){PDRAFT.tiers[i][k]=v;}
async function saveProduct(){
  if(!PDRAFT.code||!String(PDRAFT.name).trim()){toast("Code and name are required");return;}
  const tiers=(PDRAFT.tiers||[]).filter(t=>t.price!==""&&t.price!=null).map(t=>({min_qty:parseInt(t.min_qty||1,10)||1,price:Number(t.price)}));
  // SKU change on an existing product = a rename: fork to the new code, carry price/featured/
  // link/images across, retire the old code. New/duplicated drafts (orig_code=null) skip this.
  const newCode=String(PDRAFT.code).trim(), oldCode=PDRAFT.orig_code;
  if(oldCode && newCode!==oldCode){
    if(effProducts().some(p=>p.code===newCode && p.code!==oldCode)){ toast("That SKU is already used by another product — pick a unique one"); return; }
    if(!confirm("Change SKU from “"+oldCode+"” to “"+newCode+"”?\n\nThe product’s price, featured status, More-Information link and images move to the new SKU, and the old SKU is retired from the portal.")) return;
    await api("",{method:"POST",body:JSON.stringify({action:"rename_code",manufacturer:SLUG,old_code:oldCode,new_code:newCode,was_custom:PDRAFT.kind==="custom",
      product:{code:newCode,name:PDRAFT.name,category:PDRAFT.category,description:PDRAFT.description,price_note:PDRAFT.price_note,
        base_price:PDRAFT.base_price===""?null:Number(PDRAFT.base_price),msrp:PDRAFT.msrp===""?null:Number(PDRAFT.msrp),image:PDRAFT.image||null,tiers,active:PDRAFT.active!==false}})});
    PDRAFT=null; await loadMfr(); toast("SKU changed ✓ — live on the portal"); return;
  }
  if(PDRAFT.kind==="custom"){
    await api("",{method:"POST",body:JSON.stringify({action:"save_product",manufacturer:SLUG,product:{...PDRAFT,tiers}})});
  }else{
    const patch={name:PDRAFT.name,category:PDRAFT.category,description:PDRAFT.description,price_note:PDRAFT.price_note,
      base_price:PDRAFT.base_price===""?null:Number(PDRAFT.base_price),msrp:PDRAFT.msrp===""?null:Number(PDRAFT.msrp),
      tiers,active:PDRAFT.active!==false};
    if(PDRAFT.image) patch.image=PDRAFT.image;
    await api("",{method:"POST",body:JSON.stringify({action:"save_override",manufacturer:SLUG,code:PDRAFT.code,patch})});
  }
  PDRAFT=null; await loadMfr(); toast("Product saved ✓ — live on the portal");
}
async function delProduct(code){ if(!confirm("Delete added product "+code+"? This removes it completely."))return; await api("",{method:"POST",body:JSON.stringify({action:"delete_product",manufacturer:SLUG,code})}); PDRAFT=null; await loadMfr(); toast("Product deleted"); }
async function resetOverride(code){ if(!confirm("Reset this product to the standard catalog values? Your edits (name, price, tiers…) will be removed."))return;
  await api("",{method:"POST",body:JSON.stringify({action:"clear_override",manufacturer:SLUG,code})}); PDRAFT=null; await loadMfr(); toast("Reset to catalog"); }
// Delete any product: custom products are removed outright; standard catalog products are
// hidden from the portal (kept so you can restore them) since they live in the deployed data.
async function removeProduct(code){
  const p=effProducts().find(x=>x.code===code); if(!p)return;
  if(p.kind==="custom") return delProduct(code);
  if(!confirm("Remove “"+p.name+"” from the ordering portal? Dealers will no longer see or be able to order it. You can restore it anytime."))return;
  const cur=(DETAIL.overrides||{})[code]||{};
  await api("",{method:"POST",body:JSON.stringify({action:"save_override",manufacturer:SLUG,code,patch:{...cur,active:false}})});
  PDRAFT=null; await loadMfr(); toast("Removed from portal");
}
async function restoreProduct(code){
  const cur=(DETAIL.overrides||{})[code]||{};
  const rest=Object.assign({},cur); delete rest.active;
  if(Object.keys(rest).length){ await api("",{method:"POST",body:JSON.stringify({action:"save_override",manufacturer:SLUG,code,patch:{...rest,active:true}})}); }
  else { await api("",{method:"POST",body:JSON.stringify({action:"clear_override",manufacturer:SLUG,code})}); }
  await loadMfr(); toast("Restored to portal");
}

/* ---- links ---- */
function allProducts(){ const cat=(DETAIL.products||[]).map(p=>({code:p.code,name:p.name})); const cust=(DETAIL.custom||[]).map(p=>({code:p.code,name:p.name+" (custom)"}));
  const seen=new Set(); const out=[]; for(const p of cust.concat(cat)){ if(seen.has(p.code))continue; seen.add(p.code); out.push(p);} return out; }
async function saveLink(code){
  const label=($("#lbl_"+cssid(code))?.value||"More Information").trim();
  const url=($("#url_"+cssid(code))?.value||"").trim();
  if(!url){toast("Enter a URL, or upload a PDF first");return;}
  await api("",{method:"POST",body:JSON.stringify({action:"save_link",manufacturer:SLUG,code,label,url})});
  DETAIL.links[code]={label:label||"More Information",url}; toast("Link saved ✓"); render();
}
async function clearLink(code){ await api("",{method:"POST",body:JSON.stringify({action:"clear_link",manufacturer:SLUG,code})}); delete DETAIL.links[code]; toast("Link removed"); render(); }
function cssid(s){return String(s).replace(/[^A-Za-z0-9_-]/g,"_");}

/* ---- media gallery (multiple images / videos / brochures / links per product) ---- */
function mediaOf(code){ return (DETAIL.media||{})[code]||[]; }
async function addMedia(kind,url,title){
  url=String(url||"").trim(); if(!url){toast("Provide a URL or upload a file first");return;}
  if(!PDRAFT||!PDRAFT.code){toast("Save the product first");return;}
  const j=await api("",{method:"POST",body:JSON.stringify({action:"add_media",manufacturer:SLUG,code:PDRAFT.code,kind,url,title:title||null})});
  DETAIL.media=DETAIL.media||{}; (DETAIL.media[PDRAFT.code]=DETAIL.media[PDRAFT.code]||[]).push((j&&j.item)||{id:null,kind,url,title:title||"",sort:999});
  toast(kind.charAt(0).toUpperCase()+kind.slice(1)+" added ✓"); render();
}
async function delMedia(id){ if(!id)return; await api("",{method:"POST",body:JSON.stringify({action:"delete_media",id})});
  DETAIL.media[PDRAFT.code]=mediaOf(PDRAFT.code).filter(m=>m.id!==id); toast("Removed"); render(); }
async function moveMedia(id,dir){ const arr=mediaOf(PDRAFT.code); const i=arr.findIndex(m=>m.id===id); const j=i+dir;
  if(i<0||j<0||j>=arr.length)return; const t=arr[i];arr[i]=arr[j];arr[j]=t;
  await api("",{method:"POST",body:JSON.stringify({action:"reorder_media",ids:arr.map(m=>m.id).filter(Boolean)})}); render(); }
async function saveMediaTitle(id,val){ if(!id)return; try{ await api("",{method:"POST",body:JSON.stringify({action:"update_media",id,title:val})}); const m=mediaOf(PDRAFT.code).find(x=>x.id===id); if(m)m.title=val; }catch(e){} }
function mediaIcon(m){ return m.kind==="image"
  ? `<div class="thumb" style="width:74px;height:74px;margin:0;background-image:url('${esc(m.url)}')">${m.url?"":"img"}</div>`
  : `<div class="thumb" style="width:74px;height:74px;margin:0;display:flex;align-items:center;justify-content:center;font-size:24px">${m.kind==="video"?"▶":m.kind==="brochure"?"📄":"🔗"}</div>`; }

// Product list markup only — recomputed on every keystroke without re-rendering the
// whole page, so the search box keeps focus. Reads PRODQ/PLIMIT/filters live.
function prodListHtml(){
  const eff=effProducts();
  const allP=filteredSortedProducts();
  const shownP=allP.slice(0,PLIMIT);
  const prodRows=shownP.map(p=>{const tn=(p.tiers&&p.tiers.length)||0;const ft=isFeat(p.code);
    return `<tr>
     <td><b>${esc(p.name)}</b> ${p.kind==="custom"?'<span class="chip cst">added</span>':(p.edited?'<span class="chip ed">edited</span>':"")}${ft?'<span class="chip ft">★ featured</span>':''}
        <div style="font-size:11px;color:var(--gray)">${esc(p.code)}${p.category?" · "+esc(p.category):""}</div></td>
     <td class="num">${p.base_price!=null&&p.base_price!==""?"$"+Number(p.base_price).toFixed(2):"—"}</td>
     <td class="num">${tn?tn+" tier"+(tn>1?"s":""):"—"}</td>
     <td>${p.active===false?'<span style="color:var(--gray)">hidden</span>':'<span class="ok">shown</span>'}</td>
     <td style="white-space:nowrap"><button class="star ${ft?"on":""}" title="${ft?"Featured — click to remove":"Add to Featured"}" onclick="toggleFeatured('${esc(p.code)}')">${ft?"★":"☆"}</button>
       <button class="btn ghost sm" onclick="editProduct('${esc(p.code)}')">Edit</button>
       <button class="btn ghost sm" onclick="duplicateProduct('${esc(p.code)}')">Duplicate</button>
       ${p.kind==="custom"
          ? `<button class="btn ghost sm" style="color:var(--red);border-color:#f0c8c8" onclick="delProduct('${esc(p.code)}')">Delete</button>`
          : (p.active===false
              ? `<button class="btn ghost sm" onclick="restoreProduct('${esc(p.code)}')">Restore</button>`
              : `<button class="btn ghost sm" style="color:var(--red);border-color:#f0c8c8" onclick="removeProduct('${esc(p.code)}')">Remove</button>`)
        }
       ${p.kind==="catalog"&&p.edited?`<button class="btn ghost sm" onclick="resetOverride('${esc(p.code)}')">Reset</button>`:""}</td></tr>`;}).join("")
     ||`<tr><td colspan="5" class="hint">No products match.</td></tr>`;
  return `      <table><thead><tr><th>Product</th><th class="num">Dealer price</th><th class="num">Tiers</th><th>Status</th><th></th></tr></thead><tbody>${prodRows}</tbody></table>
      <div class="hint" style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span>Showing <b>${shownP.length}</b> of <b>${allP.length}</b>${allP.length!==eff.length?` (filtered from ${eff.length})`:""}</span>
        ${allP.length>shownP.length?`<button class="btn ghost sm" onclick="PLIMIT+=60;render()">Load more</button><button class="btn ghost sm" onclick="PLIMIT=999999;render()">Show all</button>`:""}
      </div>`;
}
// Live search: update PRODQ and swap only the list, leaving the focused input in place.
function searchProducts(v){ PRODQ=v; PLIMIT=60; var el=document.getElementById('prodlistwrap'); if(el) el.innerHTML=prodListHtml(); }
function render(){
  const m=curMfr();
  const mfrOpts=MFRS.map(x=>`<option value="${esc(x.slug)}" ${x.slug===SLUG?"selected":""}>${esc(x.name)}${x.hasData?"":" (no catalog)"}</option>`).join("");
  const logoUrl=LOGODRAFT||m.logo_url||"";

  const tierEditor = PDRAFT ? `<label class="fl">Quantity price tiers <span style="text-transform:none;color:var(--gray);font-weight:400">— unit price at each minimum quantity (highest qualifying tier wins; leave empty for flat price)</span></label>
     <div>${(PDRAFT.tiers||[]).map((t,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <span class="hint" style="width:70px">min qty</span><input type="number" min="1" step="1" value="${esc(t.min_qty)}" style="width:90px" oninput="setTier(${i},'min_qty',this.value)">
        <span class="hint" style="width:60px;text-align:right">unit $</span><input type="number" step="0.01" value="${esc(t.price)}" style="width:110px" oninput="setTier(${i},'price',this.value)">
        <button class="btn ghost sm" onclick="rmTier(${i})">✕</button></div>`).join("")}
       <button class="btn ghost sm" onclick="addTier()">+ Add tier</button></div>` : "";

  const pform = PDRAFT ? `<div class="card" style="border-color:var(--blue)">
     <h2>${PDRAFT.kind==="custom"?(DETAIL.custom&&DETAIL.custom.some(x=>x.code===PDRAFT.code)?"Edit added product":"New product"):"Edit catalog product"} <span class="hint" style="text-transform:none">${PDRAFT.kind==="catalog"?"— your changes save as an override on top of the standard catalog; nothing is redeployed":""}</span></h2>
     <div class="grid2">
       <div><label class="fl">Product code / SKU ${PDRAFT.kind==="custom"?"*":""}</label><input type="text" value="${esc(PDRAFT.code)}" oninput="setP('code',this.value)">${PDRAFT.orig_code?`<div class="hint" style="margin-top:3px;text-transform:none">Changing this renames the product to a new SKU — its price, featured status, link &amp; images move with it.</div>`:""}</div>
       <div><label class="fl">Name *</label><input type="text" value="${esc(PDRAFT.name)}" oninput="setP('name',this.value)"></div>
       <div><label class="fl">Category</label><input type="text" list="catopts" value="${esc(PDRAFT.category)}" placeholder="pick or type a new one" oninput="setP('category',this.value)"><datalist id="catopts">${catList().map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
       <div><label class="fl">Dealer price ($)</label><input type="number" step="0.01" value="${esc(PDRAFT.base_price)}" oninput="setP('base_price',this.value)"></div>
       <div><label class="fl">MSRP ($, optional)</label><input type="number" step="0.01" value="${esc(PDRAFT.msrp)}" oninput="setP('msrp',this.value)"></div>
       <div><label class="fl">Show on portal</label><select onchange="setP('active',this.value==='yes')"><option value="yes" ${PDRAFT.active!==false?"selected":""}>Shown</option><option value="no" ${PDRAFT.active===false?"selected":""}>Hidden</option></select></div>
     </div>
     <label class="fl">Price note (optional) <span style="text-transform:none;color:var(--gray);font-weight:400">— small line under the price, e.g. "per case"</span></label><input type="text" value="${esc(PDRAFT.price_note)}" oninput="setP('price_note',this.value)">
     ${tierEditor}
     <label class="fl">Description</label><textarea oninput="setP('description',this.value)">${esc(PDRAFT.description)}</textarea>
     <label class="fl">Product image ${PDRAFT.kind==="catalog"?'<span style="text-transform:none;color:var(--gray);font-weight:400">— optional; overrides the catalog photo</span>':""}</label>
     <div class="imgrow"><div class="thumb" style="${PDRAFT.image?`background-image:url('${esc(PDRAFT.image)}')`:""}">${PDRAFT.image?"":"no image"}</div>
       <input type="file" accept="image/*" onchange="upload('prod',this.files[0],6,u=>{PDRAFT.image=u;render();})"></div>
     ${(PDRAFT.kind==="catalog"||(DETAIL.custom&&DETAIL.custom.some(x=>x.code===PDRAFT.code))) ? (function(){ const L=(DETAIL.links||{})[PDRAFT.code]||{}; const id=cssid(PDRAFT.code); return `
     <label class="fl" style="margin-top:14px">More Information / Brochure <span style="text-transform:none;color:var(--gray);font-weight:400">— a web link or an uploaded PDF; shows as a button on the product card</span></label>
     <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
       <input type="text" id="lbl_${id}" value="${esc(L.label||"More Information")}" placeholder="Button label" style="max-width:170px">
       <input type="text" id="url_${id}" value="${esc(L.url||"")}" placeholder="https://… or upload a PDF →" style="flex:1;min-width:200px">
       <input type="file" accept="application/pdf,image/*" title="Upload a brochure (PDF)" onchange="upload('doc',this.files[0],20,u=>{document.getElementById('url_${id}').value=u;})">
       <button class="btn sm" onclick="saveLink('${esc(PDRAFT.code)}')">Save link</button>
       ${L.url?`<button class="btn ghost sm" onclick="clearLink('${esc(PDRAFT.code)}')">Remove</button>`:""}
     </div>`; })() : `<div class="hint" style="margin-top:12px">Save the product first, then you can attach a More Information link or brochure.</div>`}
     ${(PDRAFT.kind==="catalog"||(DETAIL.custom&&DETAIL.custom.some(x=>x.code===PDRAFT.code))) ? (function(){ const media=mediaOf(PDRAFT.code); return `
     <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
       <label class="fl" style="margin:0">Media gallery <span style="text-transform:none;color:var(--gray);font-weight:400">— extra images, videos &amp; documents shown on the product page (the primary photo above stays the card image)</span></label>
       <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
         <div><span class="hint">Add image</span><input type="file" accept="image/*" onchange="upload('media',this.files[0],8,u=>addMedia('image',u))" style="display:block;margin-top:3px">
           <div style="display:flex;gap:6px;margin-top:5px"><input type="text" id="mi_img" placeholder="…or paste an image URL" style="flex:1"><button class="btn ghost sm" onclick="addMedia('image',document.getElementById('mi_img').value);document.getElementById('mi_img').value=''">Add</button></div></div>
         <div><span class="hint">Add video (YouTube / Vimeo / Drive URL)</span>
           <div style="display:flex;gap:6px;margin-top:3px"><input type="text" id="mi_vid" placeholder="https://youtu.be/…" style="flex:1"><button class="btn ghost sm" onclick="addMedia('video',document.getElementById('mi_vid').value);document.getElementById('mi_vid').value=''">Add</button></div></div>
         <div><span class="hint">Add brochure (PDF)</span><input type="text" id="mi_br" placeholder="Brochure label (optional)" style="width:100%;margin:3px 0">
           <input type="file" accept="application/pdf" onchange="upload('doc',this.files[0],20,u=>{addMedia('brochure',u,(document.getElementById('mi_br').value||'Brochure'));document.getElementById('mi_br').value='';})"></div>
         <div><span class="hint">Add link</span><input type="text" id="mi_ll" placeholder="Link label" style="width:100%;margin:3px 0">
           <div style="display:flex;gap:6px"><input type="text" id="mi_lu" placeholder="https://…" style="flex:1"><button class="btn ghost sm" onclick="addMedia('link',document.getElementById('mi_lu').value,(document.getElementById('mi_ll').value||'Link'));document.getElementById('mi_lu').value=''">Add</button></div></div>
       </div>
       <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px">
         ${media.map(m=>`<div style="border:1px solid var(--line);border-radius:10px;padding:8px;width:158px">
            ${mediaIcon(m)}
            <input type="text" value="${esc(m.title||"")}" placeholder="${esc(m.kind)} title" style="width:100%;margin-top:6px;font-size:11px" onchange="saveMediaTitle('${esc(m.id||"")}',this.value)">
            <div class="hint" style="font-size:10px;word-break:break-all;margin:3px 0">${esc(String(m.url||"").slice(0,44))}</div>
            <div style="display:flex;gap:4px">${m.id?`<button class="btn ghost sm" title="Up" onclick="moveMedia('${esc(m.id)}',-1)">↑</button><button class="btn ghost sm" title="Down" onclick="moveMedia('${esc(m.id)}',1)">↓</button><button class="btn ghost sm" style="color:var(--red)" title="Remove" onclick="delMedia('${esc(m.id)}')">✕</button>`:`<span class="hint">saving…</span>`}</div>
          </div>`).join("")||`<div class="hint">No extra media yet — add images, a video, or documents above.</div>`}
       </div>
     </div>`; })() : `<div class="hint" style="margin-top:12px">Save the product first, then you can build its media gallery.</div>`}
     ${(PDRAFT.kind==="catalog"||(DETAIL.custom&&DETAIL.custom.some(x=>x.code===PDRAFT.code)))?`<label class="ck" style="margin-top:14px;display:flex;gap:7px;align-items:center;font-size:13px"><input type="checkbox" ${isFeat(PDRAFT.code)?"checked":""} onchange="toggleFeatured('${esc(PDRAFT.code)}')"> ★ Show this product in the dealer home "Featured" strip</label>`:`<div class="hint" style="margin-top:10px">Save the product first, then you can feature it.</div>`}
     <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn orange" onclick="saveProduct()">Save product</button>
       <button class="btn ghost" onclick="PDRAFT=null;render()">Cancel</button>
       ${PDRAFT.kind==="catalog"&&PDRAFT.edited?`<button class="btn ghost" onclick="resetOverride('${esc(PDRAFT.code)}')">Reset to catalog</button>`:""}
       <span style="flex:1"></span>
       ${PDRAFT.kind==="custom"
          ? (DETAIL.custom&&DETAIL.custom.some(x=>x.code===PDRAFT.code)?`<button class="btn red" onclick="delProduct('${esc(PDRAFT.code)}')">Delete product</button>`:"")
          : (PDRAFT.active===false?`<button class="btn ghost" onclick="restoreProduct('${esc(PDRAFT.code)}')">Restore to portal</button>`:`<button class="btn red" onclick="removeProduct('${esc(PDRAFT.code)}')">Remove from portal</button>`)}</div>
   </div>` : "";

  $("#wrap").innerHTML=`
    <h1>Catalog</h1>
    <p class="sub">Manufacturer logos, extra products, and "More Information" brochures/links — all publish instantly to the portal, no site rebuild.</p>
    <div class="bar"><label class="fl" style="margin:0">Manufacturer</label>
      <select onchange="SLUG=this.value;LOGODRAFT='';PDRAFT=null;PQ='';PRODQ='';PCAT='';PSTAT='';PSORT='name';PLIMIT=60;loadMfr()">${mfrOpts}</select></div>

    <div class="card">
      <h2>Manufacturer logo</h2>
      <p class="hint">Shows below the manufacturer name on the dealer home cards and at the top of this line's catalog page.</p>
      <div class="imgrow">
        <div class="thumb" style="${logoUrl?`background-image:url('${esc(logoUrl)}')`:""}">${logoUrl?"":"no logo"}</div>
        <div><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="upload('logo-${esc(SLUG)}',this.files[0],4,u=>{LOGODRAFT=u;render();})">
          <div style="margin-top:8px"><button class="btn orange sm" onclick="saveLogo()">Save logo</button>
            ${m.logo_url?`<button class="btn ghost sm" onclick="clearLogo()">Remove</button>`:""}</div>
          <div class="hint" style="margin-top:6px">PNG with transparent background looks best.</div></div>
      </div>
    </div>

    ${pform}
    <div class="card">
      <h2>Products</h2>
      <p class="hint">Filter, sort, and page through the whole line. Click <b>Edit</b> to manage everything about a product in one place — details, pricing, category, image, its More Information link/brochure, status &amp; featured. Standard catalog edits save as an override (no redeploy); added products are yours to add or delete.</p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <button class="btn sm" onclick="newProduct()">+ Add product</button>
        <input type="text" placeholder="Search name, code / SKU, category…" value="${esc(PRODQ)}" id="prodsearch" oninput="searchProducts(this.value)" style="flex:1;min-width:200px">
        <select onchange="setFilter('cat',this.value)" title="Filter by category"><option value="">All categories</option>${catList().map(c=>`<option value="${esc(c)}" ${PCAT===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
        <select onchange="setFilter('stat',this.value)" title="Filter by status"><option value="" ${PSTAT===""?"selected":""}>All statuses</option><option value="shown" ${PSTAT==="shown"?"selected":""}>Shown</option><option value="hidden" ${PSTAT==="hidden"?"selected":""}>Hidden</option><option value="featured" ${PSTAT==="featured"?"selected":""}>Featured</option><option value="added" ${PSTAT==="added"?"selected":""}>Added</option><option value="edited" ${PSTAT==="edited"?"selected":""}>Edited</option></select>
        <select onchange="setFilter('sort',this.value)" title="Sort">
          <option value="name" ${PSORT==="name"?"selected":""}>Sort: Name A–Z</option>
          <option value="code" ${PSORT==="code"?"selected":""}>Code / SKU</option>
          <option value="category" ${PSORT==="category"?"selected":""}>Category</option>
          <option value="price_asc" ${PSORT==="price_asc"?"selected":""}>Price low→high</option>
          <option value="price_desc" ${PSORT==="price_desc"?"selected":""}>Price high→low</option>
          <option value="status" ${PSORT==="status"?"selected":""}>Status</option>
        </select>
      </div>
      <div id="prodlistwrap">${prodListHtml()}</div>
    </div>`;
}
/* masthead provides Lock */
if(TOKEN)boot();else gate();
</script>
</body></html>
