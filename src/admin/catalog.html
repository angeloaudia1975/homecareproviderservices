<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS Admin — Catalog</title>
<style>
 :root{--ink:#1b2733;--blue:#3B599A;--blue-dk:#2B4071;--orange:#F5821F;--silver:#D8DEE4;--light:#F3F6FA;--gray:#5b6672;--green:#1A7A4A;--red:#B91C1C}
 *{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--ink)}
 .adminnav{background:var(--ink);display:flex;align-items:center;gap:6px;padding:10px 22px;flex-wrap:wrap}
 .adminnav .bd{color:#fff;font-weight:800;font-size:15px;margin-right:16px}.adminnav .bd span{color:var(--orange)}
 .adminnav a{color:#aeb9c6;text-decoration:none;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-radius:7px}
 .adminnav a:hover{color:#fff}.adminnav a.on{color:#fff;background:var(--blue)}
 .wrap{max-width:1120px;margin:22px auto;padding:0 20px}
 h1{font-size:22px;margin:0 0 3px}.sub{color:var(--gray);font-size:13px;margin:0 0 16px}
 .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
 select,input[type=text],input[type=number],textarea{padding:9px 11px;border:1px solid var(--silver);border-radius:8px;font-size:13px;background:#fff;font-family:inherit}
 textarea{resize:vertical;min-height:52px;width:100%}
 .card{background:#fff;border:1px solid var(--silver);border-radius:14px;padding:18px;margin-bottom:18px}
 .card h2{font-size:16px;margin:0 0 4px;color:var(--blue-dk)}.card .hint{font-size:12px;color:var(--gray);margin:0 0 14px;line-height:1.5}
 label.fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);font-weight:700;margin:10px 0 4px}
 .imgrow{display:flex;gap:12px;align-items:center;margin-top:6px}
 .thumb{width:120px;height:70px;border-radius:8px;background:#eef2f7 center/contain no-repeat;border:1px solid var(--silver);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#9aa6b2;font-size:11px}
 .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px}
 .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--silver)}.btn.sm{padding:6px 11px;font-size:12px}.btn.orange{background:var(--orange)}.btn.red{background:var(--red)}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.grid2{grid-template-columns:1fr}}
 table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
 td,th{padding:7px 8px;border-bottom:1px solid #eef2f6;text-align:left;vertical-align:middle}
 th{font-size:10.5px;text-transform:uppercase;color:var(--gray)}
 .prow{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #eef2f6;flex-wrap:wrap}
 .prow:first-of-type{border-top:none}
 .prow .pn{flex:1;min-width:160px}.prow .pn b{font-size:13px}.prow .pn .c{font-size:11px;color:var(--gray)}
 .prow input[type=text]{min-width:150px}
 .haslink{color:var(--green);font-weight:700;font-size:12px}
 .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
 .chip{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:5px;padding:1px 6px;margin-left:4px}
 .chip.cst{background:#eef2fb;color:#3b599a}.chip.ed{background:#fff3e6;color:#b4651a}
 .gate,.msg{background:#fff;border:1px solid var(--silver);border-radius:12px;padding:24px;max-width:420px;margin:30px auto;text-align:center}
 .go{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
 .err{color:var(--red)}.ok{color:var(--green)}
 .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<nav class="adminnav"><div class="bd">HCPS <span>Admin</span></div>
 <a href="/admin/">Home</a><a href="/admin/analytics.html">Analytics</a><a href="/admin/dealers.html">Dealer Manager</a>
 <a href="/admin/images.html">Images</a><a href="/admin/featured.html">Featured</a><a href="/admin/catalog.html" class="on">Catalog</a>
 <a href="/admin/home-editor.html">Portal Home</a><a href="/admin/website.html">Website</a></nav>
<div class="wrap" id="wrap"><div class="msg">Loading…</div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const API="/.netlify/functions/catalog-api";
let TOKEN=null, MFRS=[], SLUG="", DETAIL=null, PQ="";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
async function api(qs,opts){const h={"content-type":"application/json"};if(TOKEN)h["x-analytics-token"]=TOKEN;
  const r=await fetch(API+(qs||""),{...(opts||{}),headers:{...h,...((opts&&opts.headers)||{})}});
  if(r.status===401){gate();throw new Error("unauthorized");}
  const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||("HTTP "+r.status));return j;}
function gate(){$("#wrap").innerHTML=`<div class="gate"><h2>Enter access code</h2><input id="tok" type="password" placeholder="Admin passcode" style="margin:12px 0;width:100%" onkeydown="if(event.key==='Enter')submitTok()"><br><button class="go" onclick="submitTok()">Open Catalog</button></div>`;}
function submitTok(){TOKEN=$("#tok").value.trim();boot();}
async function boot(){
  try{const j=await api("",{method:"GET"}); MFRS=j.manufacturers||[];
    if(!MFRS.length){$("#wrap").innerHTML='<div class="msg">No manufacturers found.</div>';return;}
    if(!SLUG) SLUG=(MFRS.find(m=>m.hasData)||MFRS[0]).slug;
    await loadMfr();
  }catch(e){if(String(e.message)!=="unauthorized")$("#wrap").innerHTML=`<div class="msg err">Couldn't load: ${esc(e.message)}</div>`;}
}
async function loadMfr(){ DETAIL=await api("?manufacturer="+encodeURIComponent(SLUG),{method:"GET"}); render(); }
function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});}
async function upload(slot,file,maxMB,cb){
  if(!file)return; if(file.size>(maxMB||6)*1024*1024){toast("File too large (max "+(maxMB||6)+"MB)");return;}
  toast("Uploading…");
  try{const data=await fileToB64(file);
    const j=await api("",{method:"POST",body:JSON.stringify({action:"upload",slot,filename:file.name,contentType:file.type||"application/octet-stream",data})});
    cb(j.url);toast("Uploaded ✓");
  }catch(e){toast("Upload failed: "+e.message);}
}
function curMfr(){return MFRS.find(m=>m.slug===SLUG)||{};}

/* ---- logo ---- */
let LOGODRAFT="";
async function saveLogo(){ await api("",{method:"POST",body:JSON.stringify({action:"save_logo",slug:SLUG,url:LOGODRAFT||curMfr().logo_url||""})});
  const m=curMfr(); m.logo_url=LOGODRAFT||m.logo_url; toast("Logo saved ✓"); render(); }
async function clearLogo(){ if(!confirm("Remove this manufacturer's logo?"))return; await api("",{method:"POST",body:JSON.stringify({action:"clear_logo",slug:SLUG})}); curMfr().logo_url=""; LOGODRAFT=""; toast("Logo removed"); render(); }

/* ---- products (edit ANY product: catalog via overrides, or custom) ---- */
let PDRAFT=null, PRODQ="";
// effective product list = catalog (with any override applied) + custom products
function effProducts(){
  const over=DETAIL.overrides||{};
  const cat=(DETAIL.products||[]).map(p=>{const o=over[p.code]||{}; return {...p,...o,kind:"catalog",edited:!!over[p.code]};});
  const map=new Map(); cat.forEach(p=>map.set(p.code,p));
  (DETAIL.custom||[]).forEach(p=>map.set(p.code,{...p,kind:"custom"}));
  return [...map.values()];
}
function tiersOf(p){ return Array.isArray(p&&p.tiers)?p.tiers.map(t=>({min_qty:t.min_qty??t.minQty??1,price:t.price})):[]; }
function newProduct(){PDRAFT={kind:"custom",code:"",name:"",category:"",base_price:"",msrp:"",image:"",description:"",price_note:"",active:true,tiers:[]};render();}
function editProduct(code){ const p=effProducts().find(x=>x.code===code); if(!p)return;
  PDRAFT={kind:p.kind,code:p.code,name:p.name||"",category:p.category||"",base_price:p.base_price??"",msrp:p.msrp??"",
    image:p.image||"",description:p.description||"",price_note:p.price_note||"",active:p.active!==false,tiers:tiersOf(p),edited:!!p.edited};
  render(); }
function setP(k,v){PDRAFT[k]=v;}
function addTier(){PDRAFT.tiers.push({min_qty:"",price:""});render();}
function rmTier(i){PDRAFT.tiers.splice(i,1);render();}
function setTier(i,k,v){PDRAFT.tiers[i][k]=v;}
async function saveProduct(){
  if(!PDRAFT.code||!String(PDRAFT.name).trim()){toast("Code and name are required");return;}
  const tiers=(PDRAFT.tiers||[]).filter(t=>t.price!==""&&t.price!=null).map(t=>({min_qty:parseInt(t.min_qty||1,10)||1,price:Number(t.price)}));
  if(PDRAFT.kind==="custom"){
    await api("",{method:"POST",body:JSON.stringify({action:"save_product",manufacturer:SLUG,product:{...PDRAFT,tiers}})});
  }else{
    const patch={name:PDRAFT.name,category:PDRAFT.category,description:PDRAFT.description,price_note:PDRAFT.price_note,
      base_price:PDRAFT.base_price===""?null:Number(PDRAFT.base_price),msrp:PDRAFT.msrp===""?null:Number(PDRAFT.msrp),
      tiers,active:PDRAFT.active!==false};
    if(PDRAFT.image) patch.image=PDRAFT.image;
    await api("",{method:"POST",body:JSON.stringify({action:"save_override",manufacturer:SLUG,code:PDRAFT.code,patch})});
  }
  PDRAFT=null; await loadMfr(); toast("Product saved ✓ — live on the portal");
}
async function delProduct(code){ if(!confirm("Delete custom product "+code+"?"))return; await api("",{method:"POST",body:JSON.stringify({action:"delete_product",manufacturer:SLUG,code})}); await loadMfr(); toast("Deleted"); }
async function resetOverride(code){ if(!confirm("Reset this product to the standard catalog values? Your edits (name, price, tiers…) will be removed."))return;
  await api("",{method:"POST",body:JSON.stringify({action:"clear_override",manufacturer:SLUG,code})}); PDRAFT=null; await loadMfr(); toast("Reset to catalog"); }

/* ---- links ---- */
function allProducts(){ const cat=(DETAIL.products||[]).map(p=>({code:p.code,name:p.name})); const cust=(DETAIL.custom||[]).map(p=>({code:p.code,name:p.name+" (custom)"}));
  const seen=new Set(); const out=[]; for(const p of cust.concat(cat)){ if(seen.has(p.code))continue; seen.add(p.code); out.push(p);} return out; }
async function saveLink(code){
  const label=($("#lbl_"+cssid(code))?.value||"More Information").trim();
  const url=($("#url_"+cssid(code))?.value||"").trim();
  if(!url){toast("Enter a URL, or upload a PDF first");return;}
  await api("",{method:"POST",body:JSON.stringify({action:"save_link",manufacturer:SLUG,code,label,url})});
  DETAIL.links[code]={label:label||"More Information",url}; toast("Link saved ✓"); render();
}
async function clearLink(code){ await api("",{method:"POST",body:JSON.stringify({action:"clear_link",manufacturer:SLUG,code})}); delete DETAIL.links[code]; toast("Link removed"); render(); }
function cssid(s){return String(s).replace(/[^A-Za-z0-9_-]/g,"_");}

function render(){
  const m=curMfr();
  const mfrOpts=MFRS.map(x=>`<option value="${esc(x.slug)}" ${x.slug===SLUG?"selected":""}>${esc(x.name)}${x.hasData?"":" (no catalog)"}</option>`).join("");
  const logoUrl=LOGODRAFT||m.logo_url||"";

  // full product list (catalog + custom), searchable
  const pq=PRODQ.toLowerCase();
  const eff=effProducts();
  const shownP = pq ? eff.filter(p=>(`${p.code} ${p.name} ${p.category||""}`.toLowerCase().includes(pq))) : eff.slice(0,60);
  const prodRows=shownP.map(p=>{const tn=(p.tiers&&p.tiers.length)||0;
    return `<tr>
     <td><b>${esc(p.name)}</b> ${p.kind==="custom"?'<span class="chip cst">custom</span>':(p.edited?'<span class="chip ed">edited</span>':"")}
        <div style="font-size:11px;color:var(--gray)">${esc(p.code)}${p.category?" · "+esc(p.category):""}</div></td>
     <td class="num">${p.base_price!=null&&p.base_price!==""?"$"+Number(p.base_price).toFixed(2):"—"}</td>
     <td class="num">${tn?tn+" tier"+(tn>1?"s":""):"—"}</td>
     <td>${p.active===false?'<span style="color:var(--gray)">hidden</span>':'<span class="ok">shown</span>'}</td>
     <td style="white-space:nowrap"><button class="btn ghost sm" onclick="editProduct('${esc(p.code)}')">Edit</button>
       ${p.kind==="custom"?`<button class="btn ghost sm" onclick="delProduct('${esc(p.code)}')">Delete</button>`:(p.edited?`<button class="btn ghost sm" onclick="resetOverride('${esc(p.code)}')">Reset</button>`:"")}</td></tr>`;}).join("")
     ||`<tr><td colspan="5" class="hint">No products match.</td></tr>`;

  const tierEditor = PDRAFT ? `<label class="fl">Quantity price tiers <span style="text-transform:none;color:var(--gray);font-weight:400">— unit price at each minimum quantity (highest qualifying tier wins; leave empty for flat price)</span></label>
     <div>${(PDRAFT.tiers||[]).map((t,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <span class="hint" style="width:70px">min qty</span><input type="number" min="1" step="1" value="${esc(t.min_qty)}" style="width:90px" oninput="setTier(${i},'min_qty',this.value)">
        <span class="hint" style="width:60px;text-align:right">unit $</span><input type="number" step="0.01" value="${esc(t.price)}" style="width:110px" oninput="setTier(${i},'price',this.value)">
        <button class="btn ghost sm" onclick="rmTier(${i})">✕</button></div>`).join("")}
       <button class="btn ghost sm" onclick="addTier()">+ Add tier</button></div>` : "";

  const pform = PDRAFT ? `<div class="card" style="border-color:var(--blue)">
     <h2>${PDRAFT.kind==="custom"?(DETAIL.custom&&DETAIL.custom.some(x=>x.code===PDRAFT.code)?"Edit custom product":"New product"):"Edit catalog product"} <span class="hint" style="text-transform:none">${PDRAFT.kind==="catalog"?"— your changes save as an override on top of the standard catalog; nothing is redeployed":""}</span></h2>
     <div class="grid2">
       <div><label class="fl">Product code / SKU ${PDRAFT.kind==="custom"?"*":""}</label><input type="text" value="${esc(PDRAFT.code)}" ${PDRAFT.kind==="catalog"?"readonly":""} oninput="setP('code',this.value)"></div>
       <div><label class="fl">Name *</label><input type="text" value="${esc(PDRAFT.name)}" oninput="setP('name',this.value)"></div>
       <div><label class="fl">Category</label><input type="text" value="${esc(PDRAFT.category)}" oninput="setP('category',this.value)"></div>
       <div><label class="fl">Dealer price ($)</label><input type="number" step="0.01" value="${esc(PDRAFT.base_price)}" oninput="setP('base_price',this.value)"></div>
       <div><label class="fl">MSRP ($, optional)</label><input type="number" step="0.01" value="${esc(PDRAFT.msrp)}" oninput="setP('msrp',this.value)"></div>
       <div><label class="fl">Show on portal</label><select onchange="setP('active',this.value==='yes')"><option value="yes" ${PDRAFT.active!==false?"selected":""}>Shown</option><option value="no" ${PDRAFT.active===false?"selected":""}>Hidden</option></select></div>
     </div>
     <label class="fl">Price note (optional) <span style="text-transform:none;color:var(--gray);font-weight:400">— small line under the price, e.g. "per case"</span></label><input type="text" value="${esc(PDRAFT.price_note)}" oninput="setP('price_note',this.value)">
     ${tierEditor}
     <label class="fl">Description</label><textarea oninput="setP('description',this.value)">${esc(PDRAFT.description)}</textarea>
     <label class="fl">Product image ${PDRAFT.kind==="catalog"?'<span style="text-transform:none;color:var(--gray);font-weight:400">— optional; overrides the catalog photo</span>':""}</label>
     <div class="imgrow"><div class="thumb" style="${PDRAFT.image?`background-image:url('${esc(PDRAFT.image)}')`:""}">${PDRAFT.image?"":"no image"}</div>
       <input type="file" accept="image/*" onchange="upload('prod',this.files[0],6,u=>{PDRAFT.image=u;render();})"></div>
     <div style="margin-top:14px"><button class="btn orange" onclick="saveProduct()">Save product</button>
       <button class="btn ghost" onclick="PDRAFT=null;render()">Cancel</button>
       ${PDRAFT.kind==="catalog"&&PDRAFT.edited?`<button class="btn ghost" style="margin-left:8px" onclick="resetOverride('${esc(PDRAFT.code)}')">Reset to catalog</button>`:""}</div>
   </div>` : "";

  // links list — products that already have a link, plus a search to add more
  const q=PQ.toLowerCase();
  const withLinks=Object.keys(DETAIL.links||{});
  const pool=allProducts();
  const matches = q ? pool.filter(p=>(`${p.code} ${p.name}`.toLowerCase().includes(q))).slice(0,40) : [];
  const shown = new Map();
  withLinks.forEach(code=>{const p=pool.find(x=>x.code===code)||{code,name:code}; shown.set(code,p);});
  matches.forEach(p=>{ if(!shown.has(p.code)) shown.set(p.code,p); });
  const linkRows=[...shown.values()].map(p=>{const L=(DETAIL.links||{})[p.code]||{};const id=cssid(p.code);
    return `<div class="prow">
      <div class="pn"><b>${esc(p.name)}</b> <span class="c">${esc(p.code)}</span> ${L.url?'<span class="haslink">● linked</span>':''}</div>
      <input type="text" id="lbl_${id}" value="${esc(L.label||"More Information")}" style="max-width:150px" placeholder="Button label">
      <input type="text" id="url_${id}" value="${esc(L.url||"")}" placeholder="https://… or upload a PDF →">
      <input type="file" accept="application/pdf,image/*" title="Upload a brochure" onchange="upload('doc',this.files[0],20,u=>{document.getElementById('url_${id}').value=u;})">
      <button class="btn sm" onclick="saveLink('${esc(p.code)}')">Save</button>
      ${L.url?`<button class="btn ghost sm" onclick="clearLink('${esc(p.code)}')">Remove</button>`:""}
    </div>`;}).join("")||`<div class="hint">Search a product above to attach a brochure or link.</div>`;

  $("#wrap").innerHTML=`
    <h1>Catalog</h1>
    <p class="sub">Manufacturer logos, extra products, and "More Information" brochures/links — all publish instantly to the portal, no site rebuild.</p>
    <div class="bar"><label class="fl" style="margin:0">Manufacturer</label>
      <select onchange="SLUG=this.value;LOGODRAFT='';PDRAFT=null;PQ='';PRODQ='';loadMfr()">${mfrOpts}</select></div>

    <div class="card">
      <h2>Manufacturer logo</h2>
      <p class="hint">Shows below the manufacturer name on the dealer home cards and at the top of this line's catalog page.</p>
      <div class="imgrow">
        <div class="thumb" style="${logoUrl?`background-image:url('${esc(logoUrl)}')`:""}">${logoUrl?"":"no logo"}</div>
        <div><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="upload('logo-${esc(SLUG)}',this.files[0],4,u=>{LOGODRAFT=u;render();})">
          <div style="margin-top:8px"><button class="btn orange sm" onclick="saveLogo()">Save logo</button>
            ${m.logo_url?`<button class="btn ghost sm" onclick="clearLogo()">Remove</button>`:""}</div>
          <div class="hint" style="margin-top:6px">PNG with transparent background looks best.</div></div>
      </div>
    </div>

    ${pform}
    <div class="card">
      <h2>Products</h2>
      <p class="hint">Edit <b>any</b> product on this line — name, category, description, price, MSRP, and quantity pricing tiers — or add a brand-new one. Standard catalog edits save as an override (no redeploy); custom products are yours to add or delete.</p>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <button class="btn sm" onclick="newProduct()">+ Add product</button>
        <input type="text" placeholder="Search products by name or code…" value="${esc(PRODQ)}" oninput="PRODQ=this.value;render()" style="flex:1;min-width:220px">
      </div>
      <table><thead><tr><th>Product</th><th class="num">Dealer price</th><th class="num">Tiers</th><th>Status</th><th></th></tr></thead><tbody>${prodRows}</tbody></table>
      ${!PRODQ&&eff.length>60?`<div class="hint" style="margin-top:8px">Showing first 60 of ${eff.length} — search to find any product.</div>`:""}
    </div>

    <div class="card">
      <h2>"More Information" links &amp; brochures</h2>
      <p class="hint">Attach a brochure (PDF upload) or a web link to any product. It shows as a "More Information" button on that product's card.</p>
      <input type="text" placeholder="Search a product by name or code…" value="${esc(PQ)}" oninput="PQ=this.value;render()" style="width:100%;max-width:420px">
      <div style="margin-top:10px">${linkRows}</div>
    </div>`;
}
gate();
</script>
</body></html>
