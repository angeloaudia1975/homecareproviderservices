<style>

  header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0)) 14px 10px}

  .sheet h3{margin:0 0 8px;color:var(--navy)}
  /* Recipient rows. Tall enough to hit with a thumb in a van, and the whole row is the target —
     a 14px checkbox is not something to aim at one-handed. */

  /* ── Visit mode (Phase 1): one big thumb target per step, 16px fields so iOS never zooms ── */

  input.in,textarea.in,select.in{font-size:16px}

  .vmode .vtimer{display:flex;align-items:baseline;justify-content:space-between;background:#fff1e3;border:1px solid #f6c79a;border-radius:12px;padding:10px 14px;color:#8a4b0a;font-weight:700}

  textarea.vnotes{min-height:110px}
  .chip.fu-pending{background:#fff1e3;color:#b45309}.chip.fu-complete{background:#e7f6ee;color:var(--ok)}.chip.fu-none{background:#eef2f6;color:#5b6672}
  .modal.full{align-items:stretch}
  .sheet.full{max-height:none;height:100%;border-radius:0;padding:0 14px 14px;-webkit-overflow-scrolling:touch}
  .sheethd{position:sticky;top:0;z-index:2;background:#fff;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0)) 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px;color:var(--navy)}
  .sheethd b{font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rvnote{background:#fff6ec;border:1px solid #f3d6ae;color:#8a5a08;border-radius:10px;padding:9px 11px;font-size:13px;margin:0 0 10px}
  .rvnote.ok{background:#eef5fc;border-color:#cfe0f2;color:#2b4a6f}
  .rv-sec{margin:0 0 14px}

  details.rv-sec>summary{cursor:pointer;list-style:none;padding:4px 0}
  details.rv-sec>summary::-webkit-details-marker{display:none}
  .rv-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;margin:0 0 8px}
  .rv-card.opp{border-color:#f6c79a;background:#fffaf4}
  .rv-card.off{opacity:.45}
  .rv-top{display:flex;gap:8px;align-items:flex-start}
  .rv-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .rv-row>*{flex:1 1 130px;min-width:0}
  .rv-row>.btn{flex:0 1 auto}

  .rv-chk input{width:22px;height:22px;flex:0 0 auto;margin:0}

  .rv-add>.in{flex:1 1 160px;min-width:0}

</style>

<header>
  <div class="row"><span class="b">HCPS Field</span><h1>Scheduled Routes</h1><span id="netstat" onclick="openSyncPanel()" style="font-size:11px;font-weight:700;color:#9fd6b0;cursor:pointer"></span><a class="full" href="/admin/hub.html?cat=sales">Full portal</a></div>
</header>
<div class="wrap"><div id="app"><div class="msg">Loading…</div></div></div>

<script src="/admin/staff-session.js"></script>
<script src="/admin/dealer-handout.js"></script>
<script src="/admin/route-clock.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jesc=s=>String(s==null?"":s).replace(/'/g,"\\'").replace(/"/g,"&quot;");
window.addEventListener("hcps-token",e=>{try{TOKEN=e.detail;}catch(_){}});
let TOKEN=HCPS.token(), ME=null; try{ME=HCPS.profile()}catch(e){ME=null;}
let ROUTES=null, DAY=null, HANDOUT={ordering_url:DealerHandout.ORDERING_URL,updates:DealerHandout.UPDATES.slice()};
let VSTRUCT={}, VTX={}, REC={};
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(ds){ if(!ds) return "Unscheduled"; const d=new Date(ds+"T00:00:00"); return d.toLocaleDateString([], {weekday:"long",month:"long",day:"numeric",year:"numeric"}); }
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function qparam(k){ try{ return new URLSearchParams(location.search).get(k); }catch(e){ return null; } }

async function rapi(body){ const h={"content-type":"application/json"}; if(TOKEN)h["authorization"]="Bearer "+TOKEN;
  const r=await fetch("/.netlify/functions/routes-api",{method:"POST",headers:h,body:JSON.stringify(body)});
  if(r.status===401){ TOKEN=null; gate("Session ended — sign in again."); throw new Error("401"); }
  return r.json().catch(()=>({})); }
async function esapi(body){ const h={"content-type":"application/json"}; if(TOKEN)h["authorization"]="Bearer "+TOKEN;
  const r=await fetch("/.netlify/functions/email-sync-api",{method:"POST",headers:h,body:JSON.stringify(body)}); return r.json().catch(()=>({})); }
async function voiceApi(body){ const h={"content-type":"application/json"}; if(TOKEN)h["authorization"]="Bearer "+TOKEN;
  const r=await fetch("/.netlify/functions/visit-voice-api",{method:"POST",headers:h,body:JSON.stringify(body)}); return r.json().catch(()=>({})); }

function gate(msg){ $("#app").innerHTML=`<div class="gate"><h3 style="margin:0 0 4px;color:var(--navy)">Sign in</h3><p class="hint" style="margin:0 0 12px">Your HCPS work email and password.</p>
  <input id="lemail" type="email" placeholder="Email" autocomplete="username">
  <input id="lpass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitTok()">
  <button class="btn pri wide" onclick="submitTok()">Sign in</button>
  <div id="lerr" style="color:#b42323;margin-top:8px;font-size:13px">${msg||""}</div></div>`;
  setTimeout(()=>{const t=$("#lemail");if(t)t.focus();},60); }
async function submitTok(){ const email=(($("#lemail")||{}).value||"").trim(), password=(($("#lpass")||{}).value||"");
  const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email,password})});
  const j=await r.json().catch(()=>({})); if(!j||!j.ok){ gate((j&&j.message)||"Could not sign in."); return; }
  HCPS.setSession(j); TOKEN=j.token; ME=j.profile; boot(); }

// ---- Offline cache + write outbox (localStorage) ----
/* OUTBOX:BEGIN — the field write queue (Phase 0G). test/phase0-outbox.test.js runs this block.
   · Everything is kept PER PERSON (keyed by the signed-in email), so a second rep on the same
     phone never sees — or sends under their own login — the first rep's cached routes or
     unsynced visits.
   · Sync goes in order and stops at the first item the server could not take right now (offline,
     5xx, timeout), so a later save can never overtake an earlier one.
   · An item the server REFUSES (a 4xx: not your dealer, bad input…) will never succeed by being
     resent, so it leaves the queue for a review list — "need review" in the header — where it
     can be retried or discarded. It no longer blocks, or silently re-sends, forever.
   · A lapsed session stops the sync and keeps the queue until you sign in again. */
function obUser(){ return String((ME&&ME.email)||"").trim().toLowerCase(); }
function obKey(kind){ const u=obUser(); return u ? `sr_${kind}_${u}` : `sr_${kind}__noone`; }
function obRead(kind){ try{ const a=JSON.parse(localStorage.getItem(obKey(kind))||"null"); return a==null?null:a; }catch(e){ return null; } }
function obWrite(kind,v){ try{ localStorage.setItem(obKey(kind),JSON.stringify(v)); }catch(e){} }
function cacheDay(id,j){ obWrite("day_"+id,j); }
function loadCachedDay(id){ return obRead("day_"+id); }
function cacheRoutes(j){ obWrite("routes",j); }
function loadCachedRoutes(){ return obRead("routes"); }
function outbox(){ const a=obRead("outbox"); return Array.isArray(a)?a:[]; }
function setOutbox(a){ obWrite("outbox",a); updateStatus(); }
function quarantine(){ const a=obRead("quarantine"); return Array.isArray(a)?a:[]; }
function setQuarantine(a){ obWrite("quarantine",a); updateStatus(); }
function obId(){ return Date.now()+"_"+Math.random().toString(36).slice(2,7); }
function enqueue(body){ const a=outbox(); a.push({id:obId(),body,queued_at:new Date().toISOString(),tries:0}); setOutbox(a); }
/* Queues saved before this change ("sr_outbox", one for everyone on the device) — and anything
   queued while no one was identified — can't be attributed to a person, so they are never sent
   automatically: they move to THIS person's review list, where Retry sends them as you. */
function adoptLegacyOutbox(){
  if(!obUser()) return;
  const q=quarantine(); let moved=0;
  for(const key of ["sr_outbox","sr_outbox__noone"]){
    let old=[]; try{ old=JSON.parse(localStorage.getItem(key)||"[]"); }catch(e){ old=[]; }
    if(Array.isArray(old)) for(const it of old){ if(!it||!it.body) continue; moved++;
      q.push({id:it.id||obId(),body:it.body,error:"Saved on this device before sign-ins were kept apart — check it is yours, then Retry or Discard.",legacy:true,at:new Date().toISOString()}); }
    try{ localStorage.removeItem(key); }catch(e){}
  }
  if(moved) setQuarantine(q);
}
// One raw send. kind: "ok" | "rejected" (4xx, or a 200 that says no) | "auth" (401) | "retry" (offline/5xx/408/429).
async function obSend(body){
  let r; try{ const h={"content-type":"application/json"}; if(TOKEN) h["authorization"]="Bearer "+TOKEN;
    r=await fetch("/.netlify/functions/routes-api",{method:"POST",headers:h,body:JSON.stringify(body)}); }
  catch(e){ return {kind:"retry",status:0,j:null}; }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(r.status===401) return {kind:"auth",status:401,j};
  if(r.status>=500||r.status===408||r.status===429) return {kind:"retry",status:r.status,j};
  if(r.status>=400) return {kind:"rejected",status:r.status,j};
  if(j&&j.ok) return {kind:"ok",status:r.status,j};
  return {kind:"rejected",status:r.status,j};
}
function obErrorText(res){ return String((res.j&&(res.j.error||res.j.message))||("HTTP "+res.status)).slice(0,200); }
function obSignedOut(){ TOKEN=null; gate("Session ended — sign in again. Your unsynced changes are kept on this device."); }
let OB_FLUSHING=false;
async function flushOutbox(){
  if(!navigator.onLine||OB_FLUSHING||!TOKEN){ updateStatus(); return; }
  OB_FLUSHING=true;
  try{
    const seen=new Set();                       // never send one item twice in a pass (e.g. storage full)
    while(true){
      const a=outbox(); if(!a.length) break;
      const item=a[0]; if(seen.has(item.id)) break; seen.add(item.id); setStatusText("↻ Syncing…");
      const res=await obSend(item.body);
      if(res.kind==="ok"){ setOutbox(outbox().filter(x=>x.id!==item.id)); continue; }
      if(res.kind==="rejected"){
        const q=quarantine(); q.push({id:item.id,body:item.body,error:obErrorText(res),status:res.status,at:new Date().toISOString()});
        setQuarantine(q); setOutbox(outbox().filter(x=>x.id!==item.id)); continue; }
      if(res.kind==="auth"){ obSignedOut(); break; }
      const cur=outbox(); const k=cur.findIndex(x=>x.id===item.id);           // retry later, order kept
      if(k>=0){ cur[k].tries=(cur[k].tries||0)+1; cur[k].last_error=res.status?("HTTP "+res.status):"no connection"; setOutbox(cur); }
      break;
    }
  } finally { OB_FLUSHING=false; updateStatus(); }
}
// Send now if possible. {sent} | {queued} | {rejected, error} — a refusal is shown, never queued.
async function tryOrQueue(body){
  if(!navigator.onLine){ enqueue(body); return {sent:false,queued:true}; }
  if(outbox().length){                                     // earlier items first — keep the order
    enqueue(body); const id=outbox().slice(-1)[0].id; await flushOutbox();
    if(outbox().some(x=>x.id===id)) return {sent:false,queued:true};
    const bad=quarantine().find(x=>x.id===id); if(bad) return {sent:false,rejected:true,error:bad.error};
    return {sent:true,j:null}; }
  const res=await obSend(body);
  if(res.kind==="ok") return {sent:true,j:res.j};
  if(res.kind==="rejected") return {sent:false,rejected:true,error:obErrorText(res)};
  enqueue(body); if(res.kind==="auth") obSignedOut();
  return {sent:false,queued:true};
}
function retryQuarantined(id){ const q=quarantine(); const it=q.find(x=>x.id===id); if(!it) return;
  setQuarantine(q.filter(x=>x.id!==id)); const a=outbox(); a.push({id:it.id,body:it.body,queued_at:new Date().toISOString(),tries:0}); setOutbox(a);
  return flushOutbox().then(()=>{ if(typeof renderSyncPanel==="function") renderSyncPanel(); }); }
function discardQuarantined(id){ setQuarantine(quarantine().filter(x=>x.id!==id)); if(typeof renderSyncPanel==="function") renderSyncPanel(); }
function setStatusText(t,c){ const el=$("#netstat"); if(el){ el.textContent=t; el.style.color=c||"#ffd7b0"; } }
function updateStatus(){ const n=outbox().length, nq=quarantine().length, rv=nq?` · ⚠ ${nq} need review`:"";
  if(!navigator.onLine) setStatusText("● Offline"+(n?` · ${n} to sync`:"")+rv,"#ffd7b0");
  else if(n) setStatusText(`↻ ${n} to sync`+rv,"#ffd7b0");
  else if(nq) setStatusText(`⚠ ${nq} need review`,"#ffd7b0");
  else setStatusText("● Online","#9fd6b0"); }
/* OUTBOX:END */
// The review list behind "need review": what each refused item was, why, Retry / Discard.
const OB_LABELS={visit_checkin:"Visit start",visit_end:"Visit end",visit_approve:"Approved visit summary",visit_followup_set:"Follow-up status",visit_email_save:"Follow-up email draft"};
function obLabel(b){ const a=b&&b.action; if(a==="visit_email_save"&&b.sent) return "Follow-up email (sent)";
  return a==="visit_report_save"?(b.status==="completed"?"Completed visit":"Visit notes"):(OB_LABELS[a]||String(a||"Change")); }
function obDealer(b){ const id=b&&b.dealer_id; const st=DAY&&DAY.stops&&DAY.stops.find(x=>String(x.dealer_id)===String(id)); return (st&&(st.name||st.business_name))||"a dealer"; }
function openSyncPanel(){ if(!quarantine().length && !outbox().length) return; renderSyncPanel(true); }
function renderSyncPanel(open){
  let p=document.getElementById("syncpanel");
  if(!p){ if(!open) return; p=document.createElement("div"); p.id="syncpanel"; document.body.appendChild(p); }
  const q=quarantine(), a=outbox();
  if(!q.length && !a.length){ p.remove(); return; }
  p.setAttribute("style","position:fixed;left:12px;right:12px;bottom:12px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;z-index:70;box-shadow:0 6px 24px rgba(0,0,0,.25)");
  p.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b style="color:var(--navy)">Unsynced changes</b><span style="flex:1"></span><button class="btn" onclick="document.getElementById('syncpanel').remove()">Close</button></div>
    ${a.length?`<p class="hint" style="margin:0 0 10px">${a.length} waiting to send — they go automatically when you're back online.</p>`:""}
    ${q.map(it=>`<div style="border-top:1px solid var(--line);padding:10px 0">
      <div style="font-weight:700">${esc(obLabel(it.body))} · ${esc(obDealer(it.body))}</div>
      <div class="hint" style="margin:2px 0 8px;color:#b42323">${esc(it.error||"Refused")}</div>
      <button class="btn pri" onclick="retryQuarantined('${jesc(it.id)}')">Retry</button> <button class="btn" onclick="discardQuarantined('${jesc(it.id)}')">Discard</button></div>`).join("")}`;
}

// ---- Boot: deep-link ?route=<id> opens a route; otherwise show the route list ----
function boot(){ if(!TOKEN){ gate(); return; }
  const rid=qparam("route");
  // The profile decides what this person may do (assign / set a start point), so it is
  // loaded before either view renders — including when a route link is opened directly.
  loadMyHome().then(()=>{ adoptLegacyOutbox(); if(rid){ openRoute(rid); } else { showList(); } });
}

async function showList(){
  if(!TOKEN){ gate(); return; }
  $("#app").innerHTML=`<div class="msg">Loading your routes…</div>`;
  let j=null;
  try{ j=await rapi({action:"list_routes"}); }catch(e){ if(!TOKEN) return; j=null; }
  if(j&&j.ok){ ROUTES=j.routes||[]; cacheRoutes(ROUTES); if(j.me){ ME=j.me; MYHOME=j.me.home_base||null; } }
  else { const c=loadCachedRoutes(); if(c){ ROUTES=c; setStatusText("● Offline (cached)","#ffd7b0"); } }
  if(!ROUTES){ $("#app").innerHTML=`<div class="msg">Couldn't load your routes${navigator.onLine?"":" — you're offline"}.</div>`; updateStatus(); return; }
  renderList();
  if(navigator.onLine){ updateStatus(); flushOutbox().then(updateStatus); }
}
function renderList(){
  const today=todayStr();
  const rs=(ROUTES||[]).slice();
  /* Three buckets, because a rep standing in a parking lot is asking one question:
     where am I going now. Today comes first and alone; dated routes ahead of today are
     next; undated saved routes last. */
  const todayR=rs.filter(r=>r.scheduled_date===today);
  const upcoming=rs.filter(r=>r.scheduled_date&&r.scheduled_date>today).sort((a,b)=>String(a.scheduled_date).localeCompare(String(b.scheduled_date)));
  const saved=rs.filter(r=>!r.scheduled_date).sort((a,b)=>String(b.updated_at||"").localeCompare(String(a.updated_at||"")));
  const past=rs.filter(r=>r.scheduled_date&&r.scheduled_date<today).sort((a,b)=>String(b.scheduled_date).localeCompare(String(a.scheduled_date)));
  const card=(r,big)=>{ const done=r.visited||0, n=r.stops_count||0; const prog=n?`${done}/${n}`:"—";
    const drive=r.duration_s?` · ${Math.round(r.duration_s/60)} min`:"";
    const miles=r.distance_m?` · ${Math.round(r.distance_m/1609)} mi`:"";
    return `<div class="stop clk${big?" todayr":""}" onclick="openRoute('${jesc(r.id)}')"><div class="sh">
      <div class="ord cal">${big?"🚗":"📅"}</div>
      <div class="mid"><div class="nm">${esc(r.name||"Route")}</div>
        <div class="sub">${esc(fmtDate(r.scheduled_date))} · ${n} stop${n===1?"":"s"}${drive}${miles}</div>
        ${r.planned_by?`<div class="sub" style="color:#9db4d0">Planned for you by ${esc(r.planned_by)}</div>`:""}</div>
      <div class="eta"><div class="t">${prog}</div><div class="l">visited</div></div>
    </div></div>`; };
  const phone=`<div class="phone">
    <div class="t">📲 Add to your phone</div>
    <div class="u" id="mlink">${esc(location.origin)}/my-routes</div>
    <button class="btn sm" onclick="emailLink(this)">✉️ Email me the link</button>
    <button class="btn sm" onclick="toggleInstall()">How to install</button>
    <div id="installBox" hidden>
      <div class="steps"><b>iPhone (Safari):</b> open the link in Safari → tap the <b>Share</b> button → <b>Add to Home Screen</b>.</div>
      <div class="steps"><b>Android (Chrome):</b> open the link in Chrome → tap the <b>⋮</b> menu → <b>Add to Home screen</b> / <b>Install app</b>.</div>
    </div>
    <div id="linkmsg" class="hint" style="color:#9db4d0;margin-top:8px"></div>
  </div>`;
  let h=homeBaseBanner();
  h+=`<div class="grouplbl">Today</div>`+(todayR.length?todayR.map(r=>card(r,true)).join("")
      :`<div class="card hint">Nothing scheduled for today.</div>`);
  h+=`<div class="grouplbl" style="margin-top:14px">Upcoming</div>`+(upcoming.length?upcoming.map(r=>card(r)).join("")
      :`<div class="card hint">No upcoming routes yet.</div>`);
  if(saved.length) h+=`<div class="grouplbl" style="margin-top:14px">Saved routes</div>`+saved.map(r=>card(r)).join("");
  if(past.length) h+=`<div class="grouplbl" style="margin-top:14px">Earlier</div>`+past.map(r=>card(r)).join("");
  h+=phone;
  $("#app").innerHTML=h;
  updateStatus();
}
/* ── This rep's own start location ───────────────────────────────────────────
   A rep's route must never begin at whoever planned it. If they have no default of
   their own, the app asks — once, at the top of their list — rather than quietly using
   an address that isn't theirs. */
let MYHOME=null;
async function loadMyHome(){
  try{ const j=await rapi({action:"my_settings"}); if(j&&j.ok){ MYHOME=j.home_base||null; ME=j.me||ME; } }catch(e){}
}
function homeBaseBanner(){
  if(MYHOME) return "";
  return `<div class="card hint" id="hbbanner" style="border-left:4px solid var(--orange)">
    <b style="color:var(--navy);font-size:14px">Set your starting point</b><br>
    Your routes start and end wherever you begin your day. Set it once and every route you open uses it.
    <div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm" onclick="useMyLocation(this)">📍 Use my current location</button>
      <button class="btn sm" onclick="typeMyHome()">Type an address</button>
    </div>
    <div id="hbmsg" style="margin-top:7px"></div></div>`;
}
async function saveMyHome(hb,msgEl){
  try{ const j=await rapi({action:"save_home_base",home_base:hb});
    if(j&&j.ok){ MYHOME=j.home_base; if(msgEl) msgEl.textContent="✓ Saved."; showList(); return true; }
    if(msgEl) msgEl.textContent=(j&&j.error)||"Couldn't save that."; }
  catch(e){ if(msgEl) msgEl.textContent="Couldn't save — check your signal."; }
  return false;
}
function useMyLocation(btn){
  const m=$("#hbmsg");
  if(!navigator.geolocation){ if(m) m.textContent="This phone won't share its location — type an address instead."; return; }
  if(btn) btn.disabled=true; if(m) m.textContent="Getting your location…";
  navigator.geolocation.getCurrentPosition(async pos=>{
    await saveMyHome({label:"My start",address:"",lat:pos.coords.latitude,lng:pos.coords.longitude},m);
    if(btn) btn.disabled=false;
  },err=>{ if(m) m.textContent="Couldn't get your location ("+(err&&err.message||"denied")+"). Type an address instead.";
    if(btn) btn.disabled=false; },{enableHighAccuracy:true,timeout:12000});
}
async function typeMyHome(){
  const a=window.prompt("What address should your routes start from?\n(Street, city, state)");
  if(!a||!a.trim()) return;
  const m=$("#hbmsg"); if(m) m.textContent="Looking that up…";
  let g=null; try{ g=await rapi({action:"geocode",q:a.trim()}); }catch(e){}
  const hit=g&&g.ok&&(g.result||(g.results&&g.results[0]));
  if(hit&&isFinite(hit.lat)&&isFinite(hit.lng)){ await saveMyHome({label:"My start",address:a.trim(),lat:hit.lat,lng:hit.lng},m); return; }
  if(m) m.textContent="Couldn't find that address. Try including the city and state, or use your current location.";
}

function toggleInstall(){ const b=$("#installBox"); if(b) b.hidden=!b.hidden; }
async function emailLink(btn){
  const m=$("#linkmsg"); if(m)m.textContent="Sending…"; if(btn)btn.disabled=true;
  let j; try{ j=await rapi({action:"email_mobile_link"}); }catch(e){ j=null; }
  if(m) m.textContent = (j&&j.ok)?("✓ Sent to "+(j.to||"your email")+" — open it on your phone."):((j&&j.message)||"Couldn't send — try again.");
  if(btn)btn.disabled=false;
}

async function openRoute(id){
  if(!TOKEN){ gate(); return; }
  $("#app").innerHTML=`<div class="msg">Loading route…</div>`;
  let j=null, offline=false;
  try{ j=await rapi({action:"route_day",route_id:id}); }catch(e){ if(!TOKEN) return; j=null; }
  if(j&&j.ok){ cacheDay(id,j); }
  else { const c=loadCachedDay(id); if(c){ j=c; offline=true; } }
  if(!j){ $("#app").innerHTML=`<div class="msg">Couldn't load this route${navigator.onLine?"":" — you're offline"}, and no cached copy.</div><div style="text-align:center"><button class="btn" onclick="showList()">‹ All routes</button></div>`; return; }
  DAY=j;
  if(!j.route){ $("#app").innerHTML=`<div class="msg">This route is empty.</div><div style="text-align:center"><button class="btn" onclick="showList()">‹ All routes</button></div>`; return; }
  renderDay();
  if(offline) setStatusText("● Offline (showing cached)","#ffd7b0"); else updateStatus();
  if(navigator.onLine){ computeEtas(); flushOutbox().then(updateStatus); }
}

/* ── VISIT MODE (Phase 1) ─────────────────────────────────────────────────────────────────
   Start Visit → on-site timer, quick notes, dictation → End Visit → Review the AI summary →
   approve attendees, follow-ups and opportunities → draft the follow-up email → Done.
   Built for a phone in one hand: one big button per step, nothing to fill in that the notes
   already say. Every write goes through the outbox, so it works with no signal, and the server
   makes a replay a no-op (Phase 0F + 1): a double tap or a resend never duplicates a record. */
const FU_LABEL={pending:"Follow-up pending",complete:"Follow-up complete",none:"No follow-up required"};
function statusOf(s){ const v=s.visit; if(v&&(v.approved_at||v.completed_at)) return "done"; if(v&&v.ended_at) return "ended"; if(v&&(v.status==="checked_in"||v.checkin_at)) return "here"; return "plan"; }
function vkey(s){ return String((DAY&&DAY.route&&DAY.route.id)||"")+"_"+String(s.dealer_id||""); }
function fuChip(v){ const f=v&&v.followup_status; return f?`<span class="chip fu-${esc(f)}">${esc(FU_LABEL[f]||f)}</span>`:""; }
function hms(ms){ ms=Math.max(0,ms|0); const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60); return (h?h+":"+String(m).padStart(2,"0"):String(m))+":"+String(s%60).padStart(2,"0"); }
function minsBetween(a,b){ const x=Date.parse(a), y=Date.parse(b); return (isFinite(x)&&isFinite(y))?Math.max(0,Math.round((y-x)/60000)):null; }
let VTIMER=null;
function tickTimers(){ document.querySelectorAll(".vtimer[data-start]").forEach(el=>{ const st=Date.parse(el.getAttribute("data-start")); if(isFinite(st)) el.querySelector("b").textContent=hms(Date.now()-st); }); }
function startTimers(){ if(VTIMER) clearInterval(VTIMER); tickTimers(); VTIMER=setInterval(tickTimers,1000); }

function renderDay(){
  const r=DAY.route, stops=DAY.stops||[];
  const drive=r.duration_s?` · ${Math.round(r.duration_s/60)} min drive`:"";
  const done=stops.filter(s=>statusOf(s)==="done").length;
  const miles=r.distance_m?` · ${Math.round(r.distance_m/1609)} mi`:"";
  let h=`<div style="margin:0 0 10px"><button class="btn sm" onclick="showList()">‹ All routes</button> <a class="btn sm" href="/admin/command-center-rep.html">📋 Command Center</a></div>`;
  h+=`<div class="card"><div class="rsum"><span class="nm">${esc(r.name||"Route")}</span><span class="mt">${esc(fmtDate(r.scheduled_date))}</span></div>
    <div class="mt" style="margin:4px 0 10px;color:var(--gray)">${stops.length} stop${stops.length===1?"":"s"}${drive}${miles} · ${done}/${stops.length} visited</div>
    ${r.planned_by?`<div class="mt" style="margin:-6px 0 10px;color:var(--gray)">Planned for you by ${esc(r.planned_by)}</div>`:""}
    ${r.needs_home_base?`<div class="mt" style="margin:-4px 0 10px;padding:9px 11px;border-radius:10px;background:#fff6ec;border:1px solid #f3d6ae;color:#8a5a08">
      <b>No starting point set.</b> Drive times below are between stops only.
      <button class="btn sm" style="margin-top:7px" onclick="showList()">Set my starting point</button></div>`:""}
    ${assignBarHtml(r)}
    <button class="btn sm" onclick="syncCalendar()">📆 Sync to Outlook</button>
    <button class="btn sm" onclick="addToCalendar()">⬇︎ .ics file</button></div>`;
  h+=stops.map((s,i)=>stopCard(s,i)).join("");
  $("#app").innerHTML=h;
  // The stop you are at opens by itself, so the timer and the notes are one glance away.
  stops.forEach((s,i)=>{ if(statusOf(s)==="here") openBody(i); });
  startTimers();
}
function stopCard(s,i){
  const st=statusOf(s), v=s.visit||{};
  const cls=st==="done"?"done":(st==="here"||st==="ended"?"here":"");
  const chip=st==="done"?`<span class="chip done">visited</span> ${fuChip(v)}`
    :st==="ended"?`<span class="chip here">summary due</span>`
    :st==="here"?`<span class="chip here">on site</span>`:`<span class="chip plan">planned</span>`;
  const loc=[s.city,s.state].filter(Boolean).join(", ");
  const addr=[s.address,[s.city,s.state].filter(Boolean).join(", "),s.zip].filter(Boolean).join(" · ");
  const navQ=(isFinite(s.lat)&&isFinite(s.lng))?`${s.lat},${s.lng}`:encodeURIComponent([s.address,s.city,s.state,s.zip].filter(Boolean).join(", "));
  const navUrl=`https://www.google.com/maps/dir/?api=1&destination=${navQ}`;
  const main = st==="plan" ? `<button class="btn go xl wide" onclick="checkIn(${i})">▶ Start visit</button>`
    : st==="here" ? `<button class="btn pri wide" onclick="toggleBody(${i})">⏱ Visit in progress</button>`
    : st==="ended" ? `<button class="btn go xl wide" onclick="openReview(${i})">Review summary →</button>`
    : `<button class="btn wide" onclick="openSummary(${i})">View summary</button>`;
  return `<div class="stop ${cls}" id="stop_${i}">
    <div class="sh" onclick="toggleBody(${i})">
      <div class="ord">${i+1}</div>
      <div class="mid"><div class="nm">${esc(s.name)} ${chip}</div>
        ${addr?`<div class="sub addr">${esc(addr)}</div>`:(loc?`<div class="sub">${esc(loc)}</div>`:"")}
        <div class="sub">${s.contact_name?esc(s.contact_name):""}${s.contact_phone?`${s.contact_name?" · ":""}${esc(s.contact_phone)}`:""}${
          s.visit_min?` · ${esc(String(s.visit_min))} min visit`:""}${v.duration_min!=null&&st!=="plan"&&st!=="here"?` · on site ${esc(String(v.duration_min))} min`:""}</div></div>
      <div class="eta"><div class="t" id="eta_${i}">—</div><div class="l" id="etal_${i}">ETA</div></div>
    </div>
    <div class="acts">
      <a class="btn" href="${navUrl}" target="_blank" rel="noopener">🧭 Navigate</a>
      ${s.contact_phone?`<a class="btn" href="tel:${esc(String(s.contact_phone).replace(/[^0-9+]/g,''))}">📞 Call</a>`:""}
      <button class="btn" onclick="openHandout('${jesc(s.dealer_id)}')">📄 Visit package</button>
      ${st==="plan"?`<button class="btn" onclick="headsUp(${i})">📣 Heads-up</button>`:""}
      <a class="btn" href="/admin/dealer.html?id=${encodeURIComponent(s.dealer_id)}">📇 Dealer 360</a>
      ${main}
    </div>
    <div class="body" id="body_${i}"></div>
  </div>`;
}
function openBody(i){ const b=$("#body_"+i); if(!b) return; b.classList.add("open"); if(!b.dataset.loaded) loadStopBody(i); }
function toggleBody(i){ const b=$("#body_"+i); if(!b) return; if(b.classList.contains("open")){ b.classList.remove("open"); return; } openBody(i); }
function loadStopBody(i){
  const s=DAY.stops[i], b=$("#body_"+i), st=statusOf(s); b.dataset.loaded="1";
  if(st==="here") return visitPanel(i);
  if(st==="ended"){ b.innerHTML=`<div class="hint">Visit ended${s.visit&&s.visit.duration_min!=null?` after ${esc(String(s.visit.duration_min))} min`:""}. Review the summary to save it.</div>
    <button class="btn go xl wide" style="margin-top:10px" onclick="openReview(${i})">Review summary →</button>`; return; }
  if(st==="done"){ b.innerHTML=`<button class="btn wide" onclick="openSummary(${i})">View summary</button>`; return; }
  b.innerHTML=`<div class="hint">Tap <b>Start visit</b> when you walk in — the timer starts and your notes are kept with the visit.</div>`;
}
function visitPanel(i){
  const s=DAY.stops[i], b=$("#body_"+i), k=vkey(s);
  const notes=obRead("vnote_"+k)||"", tx=obRead("vtx_"+k)||"";
  b.innerHTML=`<div class="vmode">
    <div class="vtimer" data-start="${esc((s.visit&&s.visit.checkin_at)||new Date().toISOString())}">On site <b>0:00</b></div>
    <label class="fl" for="vn_${i}">Quick notes</label>
    <textarea class="in vnotes" id="vn_${i}" placeholder="Who you met, what you covered, what you promised…" oninput="keepNotes(${i})">${esc(notes)}</textarea>
    <div class="voice" id="voice_${i}">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="btn go" id="rec_${i}" onclick="toggleRec(${i})">🎤 Dictate</button>
        <span id="recmsg_${i}" class="hint">Talk through the meeting — it becomes the summary you review after.</span>
      </div>
      <textarea class="in" id="vt_${i}" placeholder="Dictation appears here" style="margin-top:8px;${tx?"":"display:none"}" oninput="keepNotes(${i})">${esc(tx)}</textarea>
    </div>
    <button class="btn go xl wide" style="margin-top:12px" onclick="endVisit(${i})">■ End visit</button>
    <div id="vmsg_${i}" class="hint" style="margin-top:8px"></div></div>`;
  startTimers();
}
function keepNotes(i){ const s=DAY.stops[i], k=vkey(s);
  obWrite("vnote_"+k,(($("#vn_"+i)||{}).value||"")); obWrite("vtx_"+k,(($("#vt_"+i)||{}).value||"")); }

// ---- Voice: the words only (the summary is built at review time) ----
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).replace(/^data:[^,]*,/,"")); r.onerror=rej; r.readAsDataURL(blob); }); }
function toggleRec(i){ const r=REC[i]; if(r&&r.mr&&r.mr.state==="recording"){ stopRec(i); } else { startRec(i); } }
async function startRec(i){
  const btn=$("#rec_"+i), msg=$("#recmsg_"+i);
  if(!navigator.onLine){ if(msg)msg.textContent="Dictation needs a connection — type quick notes for now; they're kept."; return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){ if(msg)msg.textContent="This device can't record here — type your notes."; return; }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ if(msg)msg.textContent="Microphone blocked — allow mic access, or type your notes."; return; }
  const mime=(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported("audio/webm"))?"audio/webm":((MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported("audio/mp4"))?"audio/mp4":"");
  let mr; try{ mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); }catch(e){ mr=new MediaRecorder(stream); }
  const chunks=[]; mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} const blob=new Blob(chunks,{type:mr.mimeType||mime||"audio/webm"}); await processAudio(i,blob); };
  const t0=Date.now(); const timer=setInterval(()=>{ const sec=Math.floor((Date.now()-t0)/1000); const m=$("#recmsg_"+i); if(m)m.textContent="● Recording "+Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")+" — tap Stop"; if(sec>=240) stopRec(i); },500);
  REC[i]={mr,stream,timer}; mr.start();
  if(btn){ btn.textContent="■ Stop"; btn.classList.remove("go"); btn.classList.add("pri"); }
}
function stopRec(i){ const r=REC[i]; if(!r) return; if(r.timer) clearInterval(r.timer); try{ r.mr.stop(); }catch(e){}
  const btn=$("#rec_"+i); if(btn){ btn.textContent="🎤 Dictate"; btn.classList.add("go"); btn.classList.remove("pri"); }
  const msg=$("#recmsg_"+i); if(msg) msg.textContent="Transcribing…"; }
async function processAudio(i,blob){
  const s=DAY.stops[i], msg=$("#recmsg_"+i);
  if(!blob||!blob.size){ if(msg)msg.textContent="Nothing recorded — try again."; return; }
  if(blob.size>9*1024*1024){ if(msg)msg.textContent="That recording's too long — keep it under ~4 minutes."; return; }
  let b64; try{ b64=await blobToB64(blob); }catch(e){ if(msg)msg.textContent="Couldn't read the recording."; return; }
  let j; try{ j=await voiceApi({action:"transcribe",raw:true,dealer_id:s.dealer_id,audio_base64:b64,mime:blob.type||"audio/webm"}); }catch(e){ j=null; }
  if(!j||j.ok===false||!j.transcript){ if(msg)msg.textContent=(j&&j.message)||"Couldn't transcribe — type your notes."; return; }
  const ta=$("#vt_"+i); if(ta){ ta.style.display="block"; ta.value=(ta.value.trim()?ta.value.trim()+"\n\n":"")+j.transcript; keepNotes(i); }
  if(msg) msg.textContent="✓ Added to your dictation — record again to add more.";
}

/* ---- Review: the AI's suggestions, the rep's decisions ---- */
let REV=null;
const LISTS=[["products_discussed","Products discussed"],["dealer_interests","Dealer interests"],["dealer_concerns","Dealer concerns"],["objections","Objections"],
  ["competitors","Competitors mentioned"],["pricing_requests","Pricing requests"],["samples_requested","Samples requested"],["literature_requested","Literature requested"],["training_requested","Training requested"]];
function emptySuggestion(notes){ const s={meeting_summary:String(notes||"").slice(0,1500),rep_commitments:[],dealer_commitments:[],attendees:[],follow_ups:[],opportunities:[],
  suggested_next_action:{text:"",due_date:""},interest_slugs:[]}; LISTS.forEach(([k])=>s[k]=[]); return s; }
function fullSheet(title){

  body.innerHTML=`<div class="msg">✨ Summarizing your notes…<div class="hint" style="margin-top:6px">Suggestions only — nothing is saved until you approve.</div></div>`;
  let j=null;
  try{ j=await rapi({action:"visit_analyze",route_id:DAY.route.id,dealer_id:s.dealer_id,notes:notes||undefined,transcript:tx||undefined,local_date:todayStr()}); }catch(e){ j=null; }
  if(!REV) return;

  if(j&&j.ok&&j.suggestion){ REV.sug=j.suggestion; if(j.suggestion.partial) partialNote(); }
  else { REV.manual=true; REV.err=(j&&j.error)||"no_connection"; REV.sug=emptySuggestion(notes||tx);
    REV.msg=(j&&j.message)||"Couldn't reach the AI. Your notes are saved — try the AI again, or fill in the summary yourself."; }

/* Try the AI again without leaving the review. The notes it reads are the ones kept on this phone
   (and already saved on the visit). Anything the rep added by hand — attendees, follow-ups, deals,
   a summary they rewrote — is carried over into the new suggestion rather than thrown away. */
function canRetryAi(){ return REV && (REV.manual||REV.partial) && !["ai_unavailable","no_notes"].includes(REV.err); }
/* The summary came back but the follow-ups/deals half didn't: show what we have and say so. */
function partialNote(){ REV.partial=true; REV.msg="The summary is in, but the AI didn't finish the follow-ups and deals. Add them below, or try the AI again — nothing you type is lost."; }
async function tryAiAgain(btn){
  if(!REV) return; const s=DAY.stops[REV.i], k=vkey(s), m=$("#rv_aimsg");
  if(!navigator.onLine){ if(m) m.textContent="Still offline — the AI needs a connection."; return; }
  const notes=obRead("vnote_"+k)||"", tx=obRead("vtx_"+k)||"";
  const before=collectReview(), fallback=emptySuggestion(notes||tx).meeting_summary;
  if(btn){ btn.disabled=true; btn.textContent="✨ Summarizing…"; } if(m) m.textContent="";
  let j=null; try{ j=await rapi({action:"visit_analyze",route_id:DAY.route.id,dealer_id:s.dealer_id,notes:notes||undefined,transcript:tx||undefined,local_date:todayStr(),refresh:true}); }catch(e){ j=null; }
  if(!REV) return;
  if(j){ REV.contacts=j.contacts||REV.contacts; REV.mfrs=j.manufacturers||REV.mfrs; REV.report_id=j.report_id||REV.report_id; }
  if(!(j&&j.ok&&j.suggestion)){
    REV.err=(j&&j.error)||"no_connection";
    if(btn){ btn.disabled=false; btn.textContent="✨ Try AI again"; }
    if(m) m.textContent=(j&&j.message)||"Couldn't reach the AI. Your notes and anything typed below are kept.";
    return;
  }
  const g=j.suggestion;
  if(before.summary.meeting_summary && before.summary.meeting_summary!==String(fallback||"").trim()) g.meeting_summary=before.summary.meeting_summary;
  for(const p of before.participants) if(/^at_m_/.test(p.key)) g.attendees.push({key:p.key,name:p.name,title:p.title,contact_id:p.contact_id,email:p.email||""});
  for(const t of before.tasks) if(/^fu_m_/.test(t.key)) g.follow_ups.push({key:t.key,title:t.title,due_date:t.due_date||"",priority:t.priority,from:"other"});
  for(const o of before.opportunities) if(/^op_m_/.test(o.key)) g.opportunities.push(Object.assign({},o));
  REV.sug=g; REV.manual=false; REV.partial=false; REV.msg=null; REV.err=null; REV.retried=true;
  if(g.partial) partialNote();
  renderReview();
}

/* WHO A VISIT FOLLOW-UP GOES TO (Phase 1). Pure — tested.
   · A saved draft keeps the address it was going to.
   · One attendee with an email → that person, ticked.
   · Several attendees with emails → all listed first, none ticked: the rep chooses.
   · Nobody who attended has an email → the account's main contact, as before.
   Attendees are listed first and never twice; attendees with no email are named so the rep knows. */
function pickVisitRecipients(rows,attendees,savedTo){
  const low=x=>String(x||"").trim().toLowerCase();
  const att=(attendees||[]).filter(a=>a&&a.name);
  const attRows=att.filter(a=>RCPT_RE.test(String(a.email||"").trim())).map(a=>({name:a.name,email:String(a.email).trim(),title:a.title||"",source:"attendee"}));
  const seen=new Set(attRows.map(a=>low(a.email)));
  const all=attRows.concat((rows||[]).filter(r=>r&&r.email&&!seen.has(low(r.email))));
  const want=low(savedTo);
  let pre=new Set(), note="", greet="";
  if(want){ if(all.some(r=>low(r.email)===want)) pre.add(want); }
  else if(attRows.length===1){ pre.add(low(attRows[0].email)); greet=attRows[0].name; }
  else if(attRows.length>1){ note=`${attRows.length} people at the meeting have an email — tick who this goes to.`; }
  else if(all.length){ pre.add(low(all[0].email)); greet=all[0].name||""; }
  const noEmail=att.filter(a=>!RCPT_RE.test(String(a.email||"").trim())).map(a=>a.name);
  return { rows:all, pre, note, greet, noEmail, extra: want&&!all.some(r=>low(r.email)===want) ? String(savedTo).trim() : "" };
}

/* ---- WHO THE EMAIL GOES TO -------------------------------------------------
   The pre-visit heads-up and the after-visit follow-up are drafted by different code and sent by
   this one, so the recipient picker lives here and serves both.

   It used to be a single box holding one address that the server had chosen — whichever contact
   row came back first. An account where the owner, the buyer and the billing clerk all deal with
   us could only ever be written to at that one address, and a rep who wanted anyone else had to
   remember it and type it. */

/* The people this stop can be emailed. A day cached before this shipped carries no list on its
   stops, so the one address it does have becomes a list of one rather than an empty picker —
   this app is used in a van with no signal and that cache can be days old. */
function recipientRows(s){
  const list=(s&&Array.isArray(s.contacts))?s.contacts.slice():[];
  if(list.length) return list;
  const e=String((s&&s.contact_email)||"").trim();
  return e?[{name:String((s&&s.contact_name)||"").trim(),email:e,title:"",source:"contact"}]:[];
}
/* Anything a person might type into a free-text address box: commas, semicolons, spaces, or a
   pasted "Name <addr>" pair. Returns the pieces in order with the empties gone — it does not
   judge them, because telling someone their typo is not an address is splitRecipients' job. */
function parseEmails(text){
  return String(text==null?"":text).replace(/[<>]/g," ").split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean);
}
const RCPT_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
/* ONE EMAIL, ONE PRIMARY. The first address picked is the To and the rest are copied — a note to
   a person who happens to have colleagues, rather than a group memo. Case and repetition collapse,
   because the same address is often on both a contact row and the account record. Anything
   malformed is handed back rather than quietly dropped: a rep who mistypes an address should be
   told, not left believing a dealer was written to.
   Pure, so the rule can be tested without a browser. */
function splitRecipients(list){
  const seen=new Set(), good=[], bad=[];
  (list||[]).forEach(raw=>{
    const a=String(raw==null?"":raw).trim(); if(!a) return;
    if(!RCPT_RE.test(a)){ bad.push(a); return; }
    const k=a.toLowerCase(); if(seen.has(k)) return; seen.add(k);
    good.push(a);
  });
  return { to:good[0]||"", cc:good.slice(1), bad:bad };
}
/* The greeting follows the person it is addressed to: tick Stacey instead of Bryant and "Hi
   Bryant," becomes "Hi Stacey,". Only a line that already looks like a greeting is touched, and
   only the first one — whatever the rep has written underneath is never rewritten. A replacer
   function rather than a replacement string, because a name is data and "$&" in a replacement
   string is not. */
function swapGreeting(body,name){
  const first=String(name==null?"":name).trim().split(/\s+/)[0]||"";
  if(!first) return body;
  /* The name goes in through the replacer's return value, never through a replacement string —
     a "$&" or "$1" in a replacement string is an instruction, and a name is not. */
  return String(body==null?"":body).replace(/^(\s*)Hi [^,\n]{1,40},/, (m,lead)=>lead+"Hi "+first+",");
}
/* opts.visit — the follow-up to an approved visit: adds Copy and Save draft (kept on the visit,

/* What the picker currently adds up to: the ticked addresses in the order shown, then anything
   typed, and the name of whoever is first — which is who the greeting belongs to. */
function draftPicked(){
  const out=[]; let firstName="";
  document.querySelectorAll("#d_people .d_p").forEach(el=>{
    if(!el.checked) return;
    out.push(el.getAttribute("data-email")||"");
    if(!firstName) firstName=el.getAttribute("data-name")||"";
  });
  parseEmails(($("#d_extra")||{}).value||"").forEach(a=>out.push(a));
  return { list:out, firstName:firstName };
}
/* Keep the summary line and the greeting in step with the ticks, so what the rep is about to do

function draftWho(){
  const p=draftPicked(), r=splitRecipients(p.list), who=$("#d_who");
  if(who){
    who.style.color="";

      who.textContent="To "+r.to+(r.cc.length?" · copy to "+r.cc.join(", "):"")
        +(r.bad.length?"  ·  not an email address: "+r.bad.join(", "):"");
    } else {
      who.textContent=r.bad.length?("Not an email address: "+r.bad.join(", "))
        :"Tick at least one person, or type an address.";
    }

  }
  const body=$("#d_body");
  if(body && r.to && p.firstName){
    /* Only a ticked contact carries a name to greet. A typed-in address has none, so the

/* ---- ETAs (also stores arrival ms per stop for the calendar export) ----
   This ran its own clock: one unbroken accumulation, in the phone's timezone,
   with no idea that a stop could end the day. A saved three-day Kentucky loop
   therefore showed stop 10 at 12:25 AM and stop 14 at 7:07 AM, all on day one's
   date — and since the heads-up email, the .ics export and the Outlook sync all
   read these same numbers, every one of them was wrong in the same way.
   The arithmetic now comes from RouteClock, which the planner's own itinerary is
   built on: it ends the day at an overnight and resumes next morning, and it
   works in each stop's zone — this loop crosses the Central/Eastern line at
   Glasgow, which a browser-local clock cannot see. */
async function computeEtas(){
  const r=DAY.route, stops=DAY.stops||[];
  const useHome = r.round_trip && r.home_base && isFinite(r.home_base.lat) && isFinite(r.home_base.lng);
  if(!stops.length || stops.some(s=>!(isFinite(s.lat)&&isFinite(s.lng)))) return;
  const coords=[]; if(useHome) coords.push([r.home_base.lng,r.home_base.lat]);
  stops.forEach(s=>coords.push([s.lng,s.lat]));
  if(coords.length<2) return;
  let legs=[]; try{ const d=await rapi({action:"directions",coords}); legs=(d&&d.legs)||[]; }catch(e){}
  if(legs.length<coords.length-1) return;
  if(typeof RouteClock==="undefined") return;   // no clock, no invented times

  const depart=(r.home_base&&r.home_base.depart_time)||"08:00";
  const items=RouteClock.routeItinerary({
    stops, legs, leadingLeg:useHome,
    startDate:(r.scheduled_date||todayStr()),
    startMinutes:RouteClock.parseTimeMin(depart, 8*60),
    defaultVisit:30
  });
  if(!items.length) return;

  DAY._days=RouteClock.dayCount(items);
  for(let k=0;k<stops.length;k++){
    const it=items[k];
    stops[k]._arrive=it.arriveAbs;
    stops[k]._tz=it.tz;
    stops[k]._dateISO=it.dateISO;     // the date THIS stop falls on, for the heads-up
    stops[k]._dayIndex=it.dayIndex;
    const el=$("#eta_"+k);
    if(el) el.textContent=RouteClock.fmtAbs(it.arriveAbs, it.tz);
    /* On a multi-day route "ETA" alone is a lie of omission — the rep needs to know
       which day, and so does anyone reading over their shoulder. */
    const lab=$("#etal_"+k);
    if(lab) lab.textContent = DAY._days>1 ? ("ETA · Day "+(it.dayIndex+1)) : "ETA";
  }
}

// ---- Direct Outlook sync (Graph); falls back to the .ics download if not permitted yet ----
async function syncCalendar(){
  const r=DAY.route, stops=DAY.stops||[];
  if(!navigator.onLine){ toast("Calendar sync needs a connection"); return; }
  if(!stops.some(s=>s._arrive)){ try{ await computeEtas(); }catch(e){} }
  const times={}; stops.forEach(s=>{ if(s.dealer_id && s._arrive) times[s.dealer_id]=s._arrive; });
  toast("Syncing to Outlook…");
  let j; try{ j=await rapi({action:"route_calendar_sync",route_id:r.id,times}); }catch(e){ j=null; }
  if(j&&j.ok){ toast(`Synced to Outlook ✓ · ${j.events} visit${j.events===1?"":"s"}`); return; }
  toast((j&&j.message)||"Outlook not ready — downloading a calendar file instead");
  addToCalendar();
}
// ---- Calendar export (.ics): master route event + one event per dealer visit ----
function icsEsc(s){ return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function icsStamp(ms){ const d=new Date(ms); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(d.getHours())+p(d.getMinutes())+"00"; }
function icsDay(ds){ return String(ds||todayStr()).replace(/-/g,""); }
function nextDayStr(ds){ const d=new Date((ds||todayStr())+"T00:00:00"); d.setDate(d.getDate()+1); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate()); }
function routeUrl(id){ return location.origin+"/admin/scheduled-routes.html?route="+encodeURIComponent(id); }
function addToCalendar(){
  const r=DAY.route, stops=DAY.stops||[];
  const uid=(r.id||"route")+"@hcps";
  const times=stops.map(s=>s._arrive).filter(x=>x);
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//HCPS//Scheduled Routes//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  // Master route event
  L.push("BEGIN:VEVENT","UID:"+uid+"-master","SUMMARY:"+icsEsc("Route: "+(r.name||"Sales route")));
  if(times.length){ const start=Math.min.apply(null,times);
    const lastArrive=Math.max.apply(null,times); const lastVisit=(stops[stops.length-1]&&stops[stops.length-1].visit_min!=null?stops[stops.length-1].visit_min:30);
    L.push("DTSTART:"+icsStamp(start),"DTEND:"+icsStamp(lastArrive+lastVisit*60000)); }
  else { L.push("DTSTART;VALUE=DATE:"+icsDay(r.scheduled_date),"DTEND;VALUE=DATE:"+nextDayStr(r.scheduled_date)); }
  const summaryList=stops.map((s,i)=>`${i+1}. ${s.name}${s._arrive?" — "+new Date(s._arrive).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):""}${s.city?", "+s.city+(s.state?" "+s.state:""):""}`).join("\n");
  const masterDesc=(r.round_trip?"Round trip. ":"")+(r.duration_s?Math.round(r.duration_s/60)+" min driving. ":"")+stops.length+" stops.\n\n"+summaryList+"\n\nOpen route: "+routeUrl(r.id);
  L.push("DESCRIPTION:"+icsEsc(masterDesc),"END:VEVENT");
  // Per-dealer visit events (only when we have arrival times)
  stops.forEach((s,i)=>{ if(!s._arrive) return; const vis=(s.visit_min!=null?s.visit_min:30);
    const desc=(s.contact_name?"Contact: "+s.contact_name+(s.contact_phone?" · "+s.contact_phone:"")+"\n":"")+"Stop "+(i+1)+" of "+stops.length+" on "+(r.name||"route")+"\nOpen route: "+routeUrl(r.id);
    L.push("BEGIN:VEVENT","UID:"+uid+"-"+i,"SUMMARY:"+icsEsc("Visit: "+s.name),
      "DTSTART:"+icsStamp(s._arrive),"DTEND:"+icsStamp(s._arrive+vis*60000),
      "LOCATION:"+icsEsc([s.address,s.city,s.state,s.zip].filter(Boolean).join(", ")),
      "DESCRIPTION:"+icsEsc(desc),"END:VEVENT"); });
  L.push("END:VCALENDAR");
  const blob=new Blob([L.join("\r\n")],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=(r.name||"route").replace(/[^a-z0-9]+/gi,"_").replace(/^_|_$/g,"")+".ics";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast(times.length?"Calendar file ready — open it to add to Outlook":"Added route (all-day) — open to add to Outlook");
}

// ---- Connectivity ----
window.addEventListener("online", ()=>{ updateStatus(); flushOutbox().then(()=>{ if(navigator.onLine && TOKEN){ if(DAY&&DAY.route) openRoute(DAY.route.id); else showList(); } }); });
window.addEventListener("offline", ()=>updateStatus());
if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("/admin/sr-sw.js").catch(()=>{}); }catch(e){} }

updateStatus();
boot();
</script>
