<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/admin/admin-shell.css">
<title>Partner 360 · Catalog Management Workspace</title>
<style>
:root{--navy:#12253c;--navy2:#17456e;--orange:#ef6325;--gold:#fcb21e;--blue:#1681c2;--blue-dk:#0f5c8f;
--paper:#f6f7f5;--line:#e7e2d8;--gray:#6b7280;--ink:#39424e;
--grad:linear-gradient(100deg,var(--orange),var(--gold));--shadow:0 18px 40px -20px rgba(11,13,15,.28);
--good:#1c7a44;--goodbg:#e9f7ef;--warn:#9a4b0d;--warnbg:#fff3e0;--bad:#b42323;--badbg:#fdecec;
--pub:#0f5c8f;--pubbg:#e5f0fd;--disc:#7a5a00;--discbg:#fdf3dd;--hid:#5b6472;--hidbg:#eef0f3;--flag:#8a1c5a;--flagbg:#fdeaf3;}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--paper);color:var(--navy);overflow-x:hidden}
.top{background:#0b0d0f;color:#c7d2df;font-size:12px;padding:7px 22px}.top b{color:#fff}
.pagehd{background:#fff;border-bottom:3px solid var(--orange);padding:14px 22px}
.pagehd h1{font-family:'Archivo',sans-serif;font-weight:900;font-size:22px;margin:0}
.pagehd .sub{color:var(--gray);font-size:13px;margin-top:3px}
.wrap{max-width:1220px;margin:0 auto;padding:20px 22px 120px}
/* workflow stepper */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 16px}
.step{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--gray)}
.step .n{width:19px;height:19px;border-radius:50%;background:var(--paper);color:var(--gray);display:grid;place-items:center;font-size:11px;font-weight:800;border:1px solid var(--line)}
.step.on{border-color:var(--navy);color:var(--navy)}.step.on .n{background:var(--navy);color:#fff;border-color:var(--navy)}
.step{cursor:pointer;transition:border-color .12s,background .12s}
.step:hover{border-color:var(--navy2)}
.step.active{background:var(--navy);color:#fff;border-color:var(--navy)}.step.active .n{background:#fff;color:var(--navy);border-color:#fff}
.guide{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:0 0 16px;overflow:hidden}
.guide-h{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 16px;cursor:pointer;background:linear-gradient(180deg,#f3f9ff,#fff);border-bottom:1px solid var(--line)}
.guide.collapsed .guide-h{border-bottom:none}
.guide-h .gt{font-family:'Archivo',sans-serif;font-weight:800;font-size:14.5px;color:var(--navy)}
.guide-h .gt .gstep{color:var(--orange)}
.guide-h .gtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.guide-b{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
@media(max-width:720px){.guide-b{grid-template-columns:1fr}}
.guide.collapsed .guide-b{display:none}
.gblock h5{margin:0 0 5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
.gblock ul{margin:0;padding-left:17px;font-size:13px;line-height:1.55;color:var(--ink)}
.gblock p{margin:0;font-size:13px;line-height:1.55;color:var(--ink)}
.gblock.dont h5{color:var(--bad)}.gblock.dont ul{color:#7a2b2b}
.gblock.next{grid-column:1/-1;background:#eef5ff;border:1px solid #cfe2fb;border-radius:10px;padding:10px 12px}
.gbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:800;cursor:pointer;color:var(--navy);font-family:inherit}
.gbtn.grad{background:var(--grad);border:none;color:#141414}
.tut h3{font-family:'Archivo',sans-serif;margin:16px 0 6px;font-size:16px;color:var(--navy)}
.tut h3:first-child{margin-top:0}
.tut p{font-size:13.5px;line-height:1.6;margin:0 0 8px;color:var(--ink)}
.tut ol{font-size:13.5px;line-height:1.6;padding-left:20px}
.tut .rule{background:#fff3e0;border:1px solid #f2d9b0;border-radius:10px;padding:11px 14px;font-size:13.5px;color:#7a4a0d;margin:0 0 12px}
.tut table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 12px}
.tut th,.tut td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tut th{background:var(--paper);font-family:'Archivo',sans-serif}
/* stats */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow)}
.stat b{font-family:'Archivo',sans-serif;font-size:21px;display:block;line-height:1.1}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-family:inherit;font-size:13.5px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--navy);font-family:inherit}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--navy);font-family:'Archivo',sans-serif;min-height:40px}
.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.grad{background:var(--grad);color:#141414;border:none}
.btn.ghost{background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* structure review banner */
.structure{background:linear-gradient(180deg,#fdeaf3,#fff);border:2px solid #f4c4dd;border-radius:16px;padding:16px 18px;margin-bottom:18px}
.structure h2{font-family:'Archivo',sans-serif;font-size:16px;margin:0 0 4px;color:var(--flag)}
.structure p{margin:0 0 12px;font-size:13px;color:var(--navy2)}
.flagcard{background:#fff;border:1px solid #f4c4dd;border-radius:12px;padding:13px 15px;margin-bottom:10px}
.flagcard .fh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.flagcard .fn{font-family:'Archivo',sans-serif;font-weight:800;font-size:15px}
.flagcard .reasons{font-size:12px;color:var(--flag);margin:6px 0 0}
/* product card */
.card{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.card.flagged{border-color:#f4c4dd}
.chead{display:grid;grid-template-columns:auto 62px 1fr auto;gap:14px;align-items:center;padding:14px 16px}
@media(max-width:720px){.chead{grid-template-columns:auto 48px 1fr;row-gap:10px}.chead .cactions{grid-column:1/-1}}
.selbox{width:20px;height:20px}
.cthumb{width:62px;height:62px;border-radius:10px;background:var(--paper) center/contain no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:#b9bfc7;font-size:9px;text-align:center}
.pname{font-family:'Archivo',sans-serif;font-weight:800;font-size:16.5px;margin:0;border:1px solid transparent;border-radius:7px;padding:2px 5px}
.pname:focus{outline:none;border-color:var(--line);background:var(--paper)}
.pmeta{font-size:11.5px;color:var(--gray);margin-top:3px;display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center}
.cactions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-block;border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.b-pending_review{background:var(--warnbg);color:var(--warn);border:1px solid #f2d9b0}
.b-approved{background:var(--goodbg);color:var(--good);border:1px solid #b7e2c8}
.b-published{background:var(--pubbg);color:var(--pub);border:1px solid #bcd9f4}
.b-active{background:var(--goodbg);color:var(--good);border:1px solid #b7e2c8}
.b-discontinued{background:var(--discbg);color:var(--disc);border:1px solid #ecdca6}
.b-hidden{background:var(--hidbg);color:var(--hid);border:1px solid #d7dbe0}
.b-rejected{background:var(--badbg);color:var(--bad);border:1px solid #f3c0c0}
.b-need{background:#f1f0ff;color:#4b3fb0;border:1px solid #d6d2f7}
.b-flag{background:var(--flagbg);color:var(--flag);border:1px solid #f4c4dd}
/* expanded panel */
.panel{border-top:1px solid var(--line);padding:0;display:none}
.card.open .panel{display:block}
.sec{border-bottom:1px solid var(--line);padding:15px 18px}
.sec:last-child{border-bottom:none}
.sec h4{font-family:'Archivo',sans-serif;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--navy2);margin:0 0 11px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--gray)}
input.ed,textarea.ed,select.ed{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13.5px;color:var(--navy);resize:vertical;background:#fff}
select.ed{cursor:pointer}
textarea.ed{min-height:64px}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.feat li{display:flex;gap:6px;align-items:flex-start}
.feat li .x,.specrow .x{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;min-height:38px;cursor:pointer;color:var(--bad);font-weight:800;flex:0 0 auto}
.specrow{display:grid;grid-template-columns:1fr 1.4fr 34px;gap:6px;margin-bottom:6px}
/* SKU grid */
.skutable{width:100%;border-collapse:collapse;font-size:13px}
.skutable th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);padding:6px 8px;border-bottom:1px solid var(--line)}
.skutable td{padding:5px 8px;border-bottom:1px solid #f1efe9;vertical-align:middle}
.skutable input.sed{width:100%;border:1px solid transparent;border-radius:6px;padding:5px 6px;font-family:inherit;font-size:12.5px;background:transparent}
.skutable input.sed:focus{outline:none;border-color:var(--line);background:#fff}
.skutable select.sst{border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:11.5px;font-family:inherit}
.skutable tr.disabled{opacity:.5}
.skusel{width:17px;height:17px}
.gal{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.gal a{display:block;text-decoration:none}
.gal img{width:150px;height:150px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;cursor:zoom-in;transition:box-shadow .13s,transform .13s}
.gal img:hover{box-shadow:0 12px 26px -12px rgba(11,13,15,.35);transform:translateY(-2px)}
@media(max-width:560px){.gal img{width:44vw;height:44vw}}
.mini-ai{border:1px solid #cfe2fb;background:#eef5ff;border-radius:7px;padding:2px 9px;font-size:10.5px;font-weight:800;cursor:pointer;color:var(--blue-dk);margin-left:8px;vertical-align:middle}
.mini-ai:hover{background:#dfeeff}
.mini-ai:disabled{opacity:.5;cursor:default}
.skuedit{border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 7px;font-size:12px;cursor:pointer;color:var(--blue-dk);line-height:1.3}
.skuedit:hover{background:#eef5ff;border-color:#cfe2fb}
.skudel{border:1px solid #f3c0c0;background:#fff;border-radius:6px;padding:1px 6px;font-size:12px;cursor:pointer;color:var(--bad);line-height:1.3;margin-left:3px}
.skudel:hover{background:#fdecec}
.gal .prov{font-size:9px;color:var(--gray);text-align:center;display:block}
.provline{font-size:11.5px;color:var(--gray)}
.provline a{color:var(--blue-dk);font-weight:700;word-break:break-all}
.hint{font-size:11.5px;color:var(--gray);margin:4px 0 0}
.savebar{display:flex;gap:8px;align-items:center;margin-top:11px}
.savebar .ok{font-size:12px;color:var(--good);font-weight:700}
.chip{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;margin:0 4px 4px 0}
.codechip{background:#eef5ff;border-color:#cfe2fb;color:var(--navy2)}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--gray);font-size:12.5px;background:var(--paper);cursor:pointer;outline:none;transition:border-color .13s,background .13s}
.dropzone:focus,.dropzone.drag{border-color:var(--orange,#ef6325);background:#fff7f2;color:var(--navy2)}
.dropzone b{color:var(--navy2)}
.dropzone .dzbtns{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.galctl{display:flex;gap:4px;justify-content:center;margin-top:3px}
.galctl button{padding:2px 7px;font-size:10px;border-radius:7px}
.linkrow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.linkrow a{flex:1;color:var(--blue-dk);font-weight:600;font-size:12.5px;word-break:break-all;text-decoration:none}
.linkrow a:hover{text-decoration:underline}
.linkrow .x{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--bad);font-weight:800;flex:0 0 auto}
/* sticky action bars */
.selbar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:12px 22px;display:none;z-index:40;box-shadow:0 -10px 30px -18px rgba(0,0,0,.5)}
.selbar.show{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.selbar .grow{flex:1;min-width:120px;font-size:13px}
.selbar select,.selbar input{border:none;border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px}
.selbar .btn{background:#1c3a5c;color:#fff;border:1px solid #2b5680}
.selbar .btn.grad{background:var(--grad);color:#141414;border:none}
/* modal + drawer */
/* z-index 300 clears the sticky Connect 360 nav (z-index:100) so the dialog's header/close
   are never hidden behind it; the modal scrolls internally so it always fits the screen. */
.overlay{position:fixed;inset:0;background:rgba(9,12,16,.55);display:none;z-index:300;padding:24px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay.show{display:block}
.modal{background:#fff;border-radius:16px;max-width:760px;width:100%;margin:0 auto;max-height:calc(100vh - 48px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.modal .mh h3{font-family:'Archivo',sans-serif;margin:0;font-size:17px}
.modal .mb{padding:18px 20px;overflow-y:auto;flex:1 1 auto}
.modal .close{border:none;background:var(--paper);border-radius:9px;width:34px;height:34px;font-size:17px;cursor:pointer}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:#fff;box-shadow:-20px 0 60px -30px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .22s;z-index:320;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.drawer .dh h3{font-family:'Archivo',sans-serif;margin:0;font-size:16px}
.drawer .db{overflow:auto;padding:8px 0}
.hrow{padding:11px 18px;border-bottom:1px solid #f1efe9;font-size:12.5px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.hrow .ha{font-size:10.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;font-weight:800}
.hrow .hu{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--navy);flex:0 0 auto}
.hrow.undone{opacity:.5}
/* preview */
.pv h2{font-family:'Archivo',sans-serif;margin:0 0 2px}
.pv .pvtag{color:var(--orange);font-weight:700;margin:0 0 8px}
.pv .pvimgs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.pv .pvimgs img{width:96px;height:96px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff}
.pv table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
.pv th,.pv td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.pv th{background:var(--paper)}
.mut{color:var(--gray)}
.tabscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
@media(max-width:640px){input.ed,textarea.ed,select.ed,input.search{font-size:16px}}
</style></head><body>
<header id="ac-head"></header>
<div class="pagehd">
  <h1>Product Content Enrichment &amp; Review</h1>
  <div class="sub">Import → <b>review structure</b> → correct products &amp; categories → enrich images &amp; content → add sizing/specs → disable obsolete → preview → approve → <b>publish to Partner 360</b>.</div>
</div>
<div class="wrap">
  <div class="steps" id="steps"></div>
  <div id="guide"></div>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input class="search" id="search" placeholder="Search products, SKUs, categories…" oninput="onSearch(this.value)">
    <button class="btn ghost" data-act="run-structure">⚑ Structure review</button>
    <button class="btn ghost" data-act="new-product">＋ New product</button>
    <button class="btn ghost" data-act="price-check">💲 Price check</button>
    <button class="btn ghost" data-act="catalog-structure">🌐 Catalog structure</button>
    <button class="btn ghost" data-act="batch-align">🎯 Align all</button>
    <button class="btn ghost" data-act="naming-review">✍️ Naming review</button>
    <button class="btn ghost" data-act="open-history">↺ History</button>
    <button class="btn ghost" id="selmode" data-act="toggle-selmode">☐ Select</button>
  </div>
  <div class="filters" id="filters"></div>
  <div id="structure"></div>
  <div id="cards"></div>
</div>

<!-- product multi-select bulk bar -->
<div class="selbar" id="bulkbar">
  <span class="grow"><b id="bulkcount">0</b> products selected</span>
  <select id="bulkstatus"><option value="">Set status…</option></select>
  <input id="bulkcat" placeholder="Set category…" style="max-width:170px">
  <button class="btn" data-act="bulk-apply">Apply</button>
  <button class="btn grad" data-act="bulk-publish">Publish selected</button>
  <button class="btn" data-act="clear-sel">Clear</button>
</div>

<!-- SKU move/split bar -->
<div class="selbar" id="skubar">
  <span class="grow"><b id="skucount">0</b> SKUs selected from <span id="skufrom">—</span></span>
  <select id="movetarget"><option value="">Move to product…</option></select>
  <button class="btn" data-act="move-skus">Move</button>
  <input id="splitname" placeholder="Split into new product name…" style="max-width:220px">
  <button class="btn grad" data-act="split-skus">Split out</button>
  <button class="btn" data-act="remove-skus-bulk" style="border-color:#e39; background:#7a1c46; color:#fff">🗑 Remove from product</button>
  <button class="btn" data-act="clear-skusel">Clear</button>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="drawer" id="drawer">
  <div class="dh"><h3>Change history</h3><button class="close" data-act="close-drawer">✕</button></div>
  <div class="db" id="historybody"><div style="padding:18px" class="mut">Loading…</div></div>
</div>

<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script>
/* ===================== Catalog Management Workspace ===================== */
const API='/.netlify/functions/product-content';
const MFR=new URLSearchParams(location.search).get('manufacturer')||'ovation-medical';
const pages={};
let filter='all', search='', ONLINE=true, selMode=false;
function token(){ try{ return (window.HCPS&&HCPS.token&&HCPS.token())||''; }catch(e){ return ''; } }
function authHeaders(extra){ return Object.assign({'Content-Type':'application/json','authorization':'Bearer '+token()}, extra||{}); }
const selProducts=new Set();          // page_keys chosen for bulk
let skuSel={pk:null, ids:new Set()};  // SKUs chosen (single product at a time) for move/split
const dismissed=new Set();            // structure flags dismissed this session
const openCards=new Set();            // expanded cards

const STATUSES=[
  ['pending_review','Pending review'],['approved','Approved'],['published','Published'],
  ['active','Active'],['discontinued','Discontinued'],['hidden','Hidden'],['rejected','Rejected']];
const PUBLIC_SET=new Set(['published','active','discontinued']);
const SKU_STATUSES=['active','discontinued','hidden'];
const WORKFLOW=['Import','Review structure','Correct products','Enrich content','Sizing & specs','Disable obsolete','Preview','Approve & publish'];

/* ===================== Step-by-step "How to use this step" guides ===================== */
const STEP_GUIDE=[
  { title:"Import Manufacturer Data",

/* ---------- boot: pull live rows via admin token (falls back to offline seed) ---------- */
async function boot(){
  if(!token()){ location.replace('/admin/'); return; }   // not signed in → Connect 360 gate
  try{
    const r=await fetch(`${API}?manufacturer=${encodeURIComponent(MFR)}`,{headers:authHeaders()});
    const j=await r.json().catch(()=>({ok:false}));
    if(!j.ok){ gate(j.error||'Could not authenticate.'); return; }
    if(!j.admin){ gate("Your account isn't an admin, so it can't edit product content."); return; }
    const pg={}; (j.rows||[]).forEach(row=>{ pg[row.page_key]=row; });
    Object.keys(pages).forEach(k=>delete pages[k]); Object.assign(pages,pg);
    render();
  }catch(e){ const el=document.getElementById('cards'); if(el) el.innerHTML='<div class="mut" style="padding:24px">Couldn\'t reach the server — reload to try again.</div>'; }
}
function gate(msg){ const w=document.querySelector('.wrap');
  if(w) w.innerHTML='<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;margin-top:16px"><h2 style="font-family:Archivo;margin:0 0 6px">Admin access required</h2><p class="mut">'+esc(msg)+'</p><button class="btn dark" style="margin-top:10px" onclick="location.href=\'/admin/\'">Go to Connect 360 →</button></div>'; }
async function apiWrite(payload){
  try{ const r=await fetch(`${API}?manufacturer=${encodeURIComponent(MFR)}`,
      {method:'POST',headers:authHeaders(),body:JSON.stringify(payload)});
    const json=await r.json().catch(()=>({})); return {ok:r.ok, json}; }
  catch(e){ return {ok:false, json:{error:String(e)}}; }
}
function toast(msg,bad){ const el=document.getElementById('toast')||(()=>{const d=document.createElement('div');d.id='toast';
  d.style.cssText='position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:'+(bad?'#b42323':'#12253c')+';color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:400;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)';document.body.appendChild(d);return d;})();
  el.style.background=bad?'#b42323':'#12253c'; el.textContent=msg; el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(()=>{el.style.opacity='0';},2200); }

/* ---------- SKU helpers (mirror the backend normalizer) ---------- */
function normSku(s){ if(s==null)return null;
  if(typeof s==='string'||typeof s==='number') return {sku:String(s),name:'',size:'',hcpcs:'',group:'',status:'active',disabled:false,image:'',images:[],source:''};
  return Object.assign({sku:'',name:'',size:'',hcpcs:'',group:'',status:'active',disabled:false,image:'',images:[],source:''},s,{sku:String(s.sku!=null?s.sku:(s.id!=null?s.id:''))}); }
function skusOf(k){ return (Array.isArray(pages[k].skus)?pages[k].skus:[]).map(normSku).filter(Boolean); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

/* ---------- client-side Structure Review ---------- */
function structureFlags(){
  const out=[];
  Object.keys(pages).forEach(k=>{ const p=pages[k];
    if(dismissed.has(k)) return;
    if(p.is_parent||p.parent_key) return;           // parents/variant children already structured
    const skus=skusOf(k); if(skus.length<2) return;
    const hcpcs=new Set(skus.map(s=>(s.hcpcs||'').trim()).filter(Boolean));
    const bases=new Set(skus.map(s=>baseToken(s.name||'')).filter(Boolean));
    const groups=new Set(skus.map(s=>(s.group||'').trim()).filter(Boolean));
    const reasons=[];
    if(hcpcs.size>1) reasons.push(hcpcs.size+' different HCPCS codes across its SKUs');
    if(bases.size>1) reasons.push(bases.size+' distinct product names in the SKU list');
    if(groups.size>1) reasons.push(groups.size+' catalog groups');
    const strong=reasons.length>0;   // HCPCS / name / group divergence = likely several products
    if(skus.length>=8 && !strong) reasons.push(skus.length+' SKUs under one product — confirm these are size/quantity variants of one product, not several products bundled together');
    else if(skus.length>=8) reasons.push(skus.length+' SKUs total');
    if(reasons.length) out.push({key:k, name:p.name||k, count:skus.length, strong, reasons});
  });
  return out;
}
const SIZE_WORDS=/\b(x{0,3}s|s|m|l|x{0,3}l|xxl|xl|small|medium|large|universal|left|right|regular|tall|short|std|standard|adult|pediatric|youth|\d+(\.\d+)?("|in|inch|inches|cm|mm)?)\b/gi;
function baseToken(str){ return String(str||'').toLowerCase().replace(SIZE_WORDS,' ').replace(/[^a-z ]+/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' '); }

/* ---------- counts / categories ---------- */
function counts(){ const c={total:0,skus:0,pending:0,published:0,needs:0,flagged:structureFlags().length};
  for(const k in pages){ const p=pages[k]; c.total++; c.skus+=(p.sku_count||skusOf(k).length||0);
    if(p.needs_content) c.needs++;
    if(p.status==='pending_review'||p.status==='approved'||!p.status) c.pending++;
    if(PUBLIC_SET.has(p.status)) c.published++; }
  return c; }
function allCategories(){ const s=new Set(); for(const k in pages){ if(pages[k].category) s.add(pages[k].category);} return [...s].sort(); }
function allFamilies(){ const s=new Set(); for(const k in pages){ if(pages[k].family) s.add(pages[k].family);} return [...s].sort(); }

/* ---------- render ---------- */
function render(){
  const c=counts();
  renderSteps(); renderGuide();
  document.getElementById('stats').innerHTML=
    stat(c.total,'Products')+stat(c.skus,'SKUs')+stat(c.published,'Live on Partner 360')+
    stat(c.pending,'In review')+stat(c.needs,'Need content')+stat(c.flagged,'Structure flags');
  const fdefs=[['all','All'],['flagged','Flagged'],['pending','In review'],['published','Live'],
    ['discontinued','Discontinued'],['hidden','Hidden'],['needs','Needs content']];
  document.getElementById('filters').innerHTML=fdefs.map(f=>`<button class="${f[0]===filter?'on':''}" onclick="setFilter('${f[0]}')">${f[1]}</button>`).join('')
    +`<span style="align-self:center;margin-left:6px;font-size:11.5px;color:var(--gray)">${ONLINE?'● Live · writing to Supabase':'○ Offline preview'}</span>`;
  renderStructure();
  document.getElementById('cards').innerHTML=visibleKeys().map(cardHTML).join('')
    || '<div class="mut" style="padding:26px;text-align:center">No products match this filter.</div>';
  // bulk-select column visibility
  document.getElementById('selmode').textContent=selMode?'☑ Selecting':'☐ Select';
  document.getElementById('bulkstatus').innerHTML='<option value="">Set status…</option>'+STATUSES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('');
  updateBulkBar(); updateSkuBar();
}
function stat(v,l){return `<div class="stat"><b>${v}</b><span>${l}</span></div>`;}
function setFilter(f){ filter=f; render(); }
function onSearch(v){ search=v.toLowerCase().trim(); render(); }
function matchesSearch(k){ if(!search) return true; const p=pages[k];
  if((p.name||'').toLowerCase().includes(search)) return true;
  if((p.category||'').toLowerCase().includes(search)) return true;
  if((p.family||'').toLowerCase().includes(search)) return true;
  return skusOf(k).some(s=>(s.sku||'').toLowerCase().includes(search)||(s.name||'').toLowerCase().includes(search)); }
function visibleKeys(){ const flagSet=new Set(structureFlags().map(f=>f.key));
  return Object.keys(pages).filter(k=>{ const p=pages[k]; if(p.is_parent&&!skusOf(k).length&&!(p.variants||[]).length) {}
    if(!matchesSearch(k)) return false;
    if(filter==='flagged') return flagSet.has(k);
    if(filter==='pending') return (p.status==='pending_review'||p.status==='approved'||!p.status)&&!p.needs_content;
    if(filter==='published') return PUBLIC_SET.has(p.status);
    if(filter==='discontinued') return p.status==='discontinued';
    if(filter==='hidden') return p.status==='hidden';
    if(filter==='needs') return !!p.needs_content;
    return true; })
    .sort((a,b)=>{ const fa=flagSet.has(a)?0:1, fb=flagSet.has(b)?0:1; if(fa!==fb) return fa-fb;
      return (pages[a].name||a).localeCompare(pages[b].name||b); }); }

function renderStructure(){
  const flags=structureFlags();
  const el=document.getElementById('structure');
  if(!flags.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="structure"><h2>⚑ Possible Multiple Products — Review SKU Grouping</h2>
    <p>${flags.length} product${flags.length>1?'s':''} may bundle several distinct products under one record. Open each, select the SKUs that belong together, and <b>Split out</b> into their own product — or dismiss if the SKUs really are size variants of one product.</p>
    ${flags.slice().sort((a,b)=>(b.strong?1:0)-(a.strong?1:0)).map(f=>`<div class="flagcard"><div class="fh">
        <div><div class="fn">${esc(f.name)} ${f.strong?'<span class="badge b-flag">Likely multiple products</span>':'<span class="badge b-need">Large SKU set — review</span>'}</div><div class="reasons">${f.reasons.map(esc).join(' · ')}</div></div>
        <div style="display:flex;gap:6px"><button class="btn" data-act="open-manage" data-pk="${escA(f.key)}">Review SKUs</button>
        <button class="btn ghost" data-act="dismiss-flag" data-pk="${escA(f.key)}">Dismiss</button></div>
      </div></div>`).join('')}</div>`;
}

/* -- Section 4: sizing / specs paste -- */
function sizingSec(k){ const p=pages[k]; const st=normSizing(p.sizing_table);
  return `<div class="sec"><h4>Sizing / spec table</h4>
    ${st.rows.length?`<div class="tabscroll"><table class="pv"><thead><tr>${st.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${st.rows.map(r=>`<tr>${st.columns.map(c=>`<td>${esc(r[c]!=null?r[c]:'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
      :'<div class="hint">No sizing table yet.</div>'}
    <div class="fld" style="margin-top:10px"><label>Paste a sizing / spec chart (tab- or comma-separated; first row = column headers)</label>
      <textarea class="ed" id="sz-${cssId(k)}" rows="4" placeholder="Description&#9;Part Number&#9;Size&#10;Universal Double-Pull LST&#9;61002&#9;25&quot;-50&quot;"></textarea></div>
    <div class="fld" style="margin-top:8px"><label>Note (optional)</label><input class="ed" id="szn-${cssId(k)}" value="${escA(p.sizing_note||'')}" placeholder="e.g. For left or right foot. Available in Black &amp; White."></div>
    <div class="savebar"><button class="btn" data-act="parse-sizing" data-pk="${escA(k)}">Preview parse</button>
      <button class="btn dark" data-act="save-sizing" data-pk="${escA(k)}">Save sizing</button></div>
    <div id="szprev-${cssId(k)}"></div>
  </div>`; }
function normSizing(st){ if(!st) return {columns:[],rows:[]};
  if(Array.isArray(st)){ const cols=st[0]?Object.keys(st[0]):[]; return {columns:cols,rows:st}; }
  if(st.columns&&st.rows) return {columns:st.columns,rows:st.rows};
  return {columns:[],rows:[]}; }
function parseTable(txt){ const lines=txt.replace(/\r/g,'').split('\n').map(l=>l.trimEnd()).filter(l=>l.trim().length);
  if(!lines.length) return {columns:[],rows:[]};
  const delim=lines[0].indexOf('\t')>=0?'\t':(lines[0].indexOf(',')>=0?',':'\t');
  const cols=lines[0].split(delim).map(c=>c.trim());
  const rows=lines.slice(1).map(l=>{ const cells=l.split(delim); const o={}; cols.forEach((c,i)=>o[c]=(cells[i]||'').trim()); return o; });
  return {columns:cols,rows}; }

/* ===================== local edits ===================== */
function editField(k,f,v){ pages[k][f]=v; }
function editSku(k,id,f,v){ const skus=skusOf(k); const i=skus.findIndex(s=>s.sku===id); if(i>=0){ skus[i][f]=v; pages[k].skus=skus; } }
function editFeat(k,i,v){ pages[k].features=pages[k].features||[]; pages[k].features[i]=v; }
function editClin(k,i,v){ pages[k].clinical_applications=pages[k].clinical_applications||[]; pages[k].clinical_applications[i]=v; }
function editSpec(k,i,f,v){ pages[k].specs=pages[k].specs||[]; pages[k].specs[i]=pages[k].specs[i]||{label:'',value:''}; pages[k].specs[i][f]=v; }
function editCodes(k,v){ pages[k].billing_codes=v.split(',').map(x=>x.trim()).filter(Boolean); }

/* ===================== delegated actions ===================== */
document.addEventListener('click',async function(e){
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.getAttribute('data-act'); const k=t.getAttribute('data-pk'); const sku=t.getAttribute('data-sku'); const i=t.getAttribute('data-i');
  if(act==='manage'||act==='open-manage'){ if(openCards.has(k)) openCards.delete(k); else openCards.add(k);
    if(act==='open-manage'){ openCards.add(k); } render();
    if(act==='open-manage'){ const el=document.getElementById('card-'+cssId(k)); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); } return; }
  if(act==='dismiss-flag'){ dismissed.add(k); render(); return; }
  if(act==='toggle-selmode'){ selMode=!selMode; if(!selMode) selProducts.clear(); render(); return; }
  if(act==='toggle-product'){ if(selProducts.has(k)) selProducts.delete(k); else selProducts.add(k); updateBulkBar(); return; }
  if(act==='clear-sel'){ selProducts.clear(); render(); return; }
  if(act==='toggle-sku'){ if(skuSel.pk!==k){ skuSel={pk:k,ids:new Set()}; } if(skuSel.ids.has(sku)) skuSel.ids.delete(sku); else skuSel.ids.add(sku);
    if(!skuSel.ids.size) skuSel.pk=null; updateSkuBar(); return; }
  if(act==='clear-skusel'){ skuSel={pk:null,ids:new Set()}; render(); return; }
  if(act==='add-feature'){ pages[k].features=pages[k].features||[]; pages[k].features.push(''); reopen(k); return; }
  if(act==='del-feature'){ pages[k].features.splice(+i,1); reopen(k); return; }
  if(act==='add-clin'){ pages[k].clinical_applications=pages[k].clinical_applications||[]; pages[k].clinical_applications.push(''); reopen(k); return; }
  if(act==='del-clin'){ pages[k].clinical_applications.splice(+i,1); reopen(k); return; }
  if(act==='add-spec'){ pages[k].specs=pages[k].specs||[]; pages[k].specs.push({label:'',value:''}); reopen(k); return; }
  if(act==='del-spec'){ pages[k].specs.splice(+i,1); reopen(k); return; }
  if(act==='parse-sizing'){ const txt=document.getElementById('sz-'+cssId(k)).value; const tb=parseTable(txt);
    document.getElementById('szprev-'+cssId(k)).innerHTML=tb.rows.length?`<div class="tabscroll" style="margin-top:8px"><table class="pv"><thead><tr>${tb.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(r=>`<tr>${tb.columns.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="hint">Nothing parsed — check the paste.</div>'; return; }
  if(act==='add-image'){ const url=(document.getElementById('img-'+cssId(k)).value||'').trim(); if(!url) return;
    pages[k].images_gallery=Array.isArray(pages[k].images_gallery)?pages[k].images_gallery:[]; pages[k].images_gallery.push({url,source:'manual'});
    if(!pages[k].image) pages[k].image=url; await save('save-content',k); reopen(k); return; }
  if(act==='pick-img'){ const el=document.getElementById('fi-img-'+cssId(k)); if(el) el.click(); return; }
  if(act==='pick-doc'){ const el=document.getElementById('fi-doc-'+cssId(k)); if(el) el.click(); return; }
  if(act==='focus-dz'){ t.focus(); return; }
  if(act==='del-gal-img'){ (pages[k].images_gallery||[]).splice(+i,1); await doSaveContent(k); reopen(k); return; }
  if(act==='set-primary-img'){ const g=pages[k].images_gallery||[]; g.forEach((x,j)=>{ x.primary=(j===+i); }); if(g[+i]) pages[k].image=g[+i].url; await doSaveContent(k); reopen(k); return; }
  if(act==='add-video') return addVideoUrl(k);
  if(act==='del-video'){ (pages[k].videos||[]).splice(+i,1); await doSaveContent(k); reopen(k); return; }
  if(act==='add-doc-url') return addDocUrl(k);
  if(act==='del-doc'){ (pages[k].documents||[]).splice(+i,1); await doSaveContent(k); reopen(k); return; }
  if(act==='ai-gen') return doAiGen(k, t.getAttribute('data-field'), t);
  if(act==='rename-sku') return doRenameSku(k, sku);
  if(act==='remove-sku') return doRemoveSku(k, sku);
  if(act==='remove-skus-bulk') return doRemoveBulk();
  // status + saves + structural

function fileToB64(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=()=>rej(fr.error||new Error('read failed')); fr.onload=()=>{ const s=String(fr.result||''); const c=s.indexOf(','); res(c>=0?s.slice(c+1):s); }; fr.readAsDataURL(file); }); }
async function uploadImageFile(k,file){
  if(!file) return;

  if(file.size>6*1024*1024){ toast('Image is over 6MB — resize and try again',true); return; }
  toast('Uploading image…');

    const content_base64=await fileToB64(file);
    const r=await apiWrite({action:'upload_image',page_key:k,content_base64,content_type:file.type||'image/png',filename:file.name||'image'});
    const out=r.json||{};
    if(!r.ok||!out.ok||!out.url){ toast(out.error||'Upload failed',true); return; }
    pages[k].images_gallery=Array.isArray(pages[k].images_gallery)?pages[k].images_gallery:[];
    const first=!pages[k].images_gallery.length && !pages[k].image;
    pages[k].images_gallery.push({url:out.url,source:'upload',caption:file.name||'',primary:first});

async function doPriceCheck(){

  if(!cat || (!(cat.products||[]).length && !(cat.custom||[]).length)){
    modalHTML('💲 Price Check', '<div class="tut"><p class="mut">Couldn\'t read the catalog price list. Price checking reads the Product Catalog, which is President-only — make sure you\'re signed in as president. If you are, this manufacturer may not have a catalog loaded yet.</p></div>'); return; }
  const ov=cat.overrides||{}, custom={}, std={};
  (cat.custom||[]).forEach(p=>{ custom[String(p.code)]=p; });
  (cat.products||[]).forEach(p=>{ std[String(p.code)]=p; });
  const inCatalog=c=>{ c=String(c); return !!(custom[c]||std[c]); };
  function priceOf(c){ c=String(c); const o=ov[c]||{};
    if(o.base_price!=null&&o.base_price!=='') return Number(o.base_price);
    const cu=custom[c]; if(cu&&cu.base_price!=null&&cu.base_price!=='') return Number(cu.base_price);
    const p=std[c]; if(p&&p.base_price!=null&&p.base_price!=='') return Number(p.base_price);
    return null; }
  let total=0, priced=0; const missing=[], notInCat=[];
  Object.keys(pages).forEach(k=>{ const p=pages[k]; if(p.is_parent) return;
    skusOf(k).forEach(s=>{ const code=String(s.sku||''); if(!code) return; total++;
      if(!inCatalog(code)){ notInCat.push({code,product:p.name||k}); return; }
      const pr=priceOf(code); if(pr!=null&&pr>0) priced++; else missing.push({code,product:p.name||k}); }); });
  const pct=total?Math.round(priced/total*100):0;
  const grp=list=>{ const by={}; list.forEach(x=>{(by[x.product]=by[x.product]||[]).push(x.code);});
    return Object.keys(by).sort().map(pn=>`<tr><td>${esc(pn)}</td><td>${by[pn].map(esc).join(', ')}</td></tr>`).join(''); };
  modalHTML('💲 Price Check · '+esc(MFR), `<div class="tut">
    <div class="rule"><b>${priced} of ${total} SKUs have a price loaded (${pct}%).</b> ${missing.length?`<b style="color:#b42323">&nbsp;${missing.length} catalog SKU(s) are missing a price.</b>`:'&nbsp;Every catalog SKU has a price. ✅'} ${notInCat.length?`&nbsp;${notInCat.length} SKU(s) aren't in the catalog yet.`:''}</div>
    <p class="mut">Prices come from the <b>Product Catalog</b> (base/list price) and <b>Contract Pricing</b> (per-dealer). Removing a SKU here never changes pricing — this only verifies it's loaded. Fix missing prices in those tools.</p>
    ${missing.length?`<h3>In the catalog but missing a price (${missing.length})</h3>
      <div class="tabscroll"><table><thead><tr><th>Product</th><th>SKU(s)</th></tr></thead><tbody>${grp(missing)}</tbody></table></div>`:''}
    ${notInCat.length?`<h3>Not found in the catalog (${notInCat.length})</h3>
      <p class="mut">On a product here, but not in the ordering catalog yet — add them in Product Catalog (or it may be a renamed/typo code).</p>
      <div class="tabscroll"><table><thead><tr><th>Product</th><th>SKU(s)</th></tr></thead><tbody>${grp(notInCat)}</tbody></table></div>`:''}
    ${(!missing.length&&!notInCat.length)?'<p><b>✅ All good — every SKU is in the catalog with a price.</b></p>':''}
  </div>`);
}

// Push a product's category down to the live ordering catalog so the shop actually re-files it

async function syncShopCategory(k, category){
  const codes=skusOf(k).map(s=>String(s.sku||'')).filter(Boolean); if(!codes.length) return {ok:true,skipped:true};
  try{ const r=await fetch('/.netlify/functions/catalog-api',{method:'POST',headers:authHeaders(),body:JSON.stringify({action:'set_category',manufacturer:MFR,codes,category})}); return {ok:r.ok,status:r.status}; }
  catch(e){ return {ok:false}; }
}

let _alignRows=[];
async function openBatchAlign(){
  const keys=Object.keys(pages).filter(k=>!pages[k].is_parent && pages[k].name);
  if(!keys.length){ toast('No products loaded to align',true); return; }
  if(!window.confirm('Run the AI Catalog Review across all '+keys.length+' loaded '+MFR+' product(s)?\n\nIt analyzes each product and proposes Family / Category / Subcategory against the HCPS structure. This takes a moment and costs AI usage. Nothing changes until you review and Apply.')) return;

  _alignRows=[]; let done=0, idx=0; const CONC=4, total=keys.length;
  async function worker(){
    while(idx<keys.length){
      const k=keys[idx++];
      try{ const r=await apiWrite({action:'classify_product',page_key:k});
        if(r.ok && r.json && r.json.ok!==false && r.json.recommendation){ _alignRows.push({k,name:pages[k].name,cur:r.json.current||{},rec:r.json.recommendation}); }

      const bar=document.getElementById('align-bar'); if(bar) bar.style.width=Math.round(done/total*100)+'%';
    }
  }
  await Promise.all(Array.from({length:Math.min(CONC,keys.length)},()=>worker()));
  renderBatchAlign();
}

async function doRenameSku(k, oldSku){
  oldSku=String(oldSku);
  const newSku=(window.prompt('Change SKU number — updates the catalog (ordering, pricing, featured, media), the content here, and per-dealer contract prices. Past orders and sales reports keep the old number as a record.\n\nNew SKU for '+oldSku+':', oldSku)||'').trim();
  if(!newSku || newSku===oldSku) return;
  if(skusOf(k).some(s=>String(s.sku)===newSku)){ toast('That SKU already exists on this product',true); return; }
  toast('Renaming '+oldSku+' → '+newSku+'…');
  // 1) catalog side — only if the code exists in the catalog
  const cat=await catalogGet();
  const inCustom=(cat.custom||[]).find(p=>String(p.code)===oldSku);
  const prod=inCustom||(cat.products||[]).find(p=>String(p.code)===oldSku);
  let catalogNote='';
  if(prod){
    try{
      const cr=await fetch('/.netlify/functions/catalog-api',{method:'POST',headers:authHeaders(),body:JSON.stringify({
        action:'rename_code', manufacturer:MFR, old_code:oldSku, new_code:newSku, was_custom:!!inCustom,
        product:{name:prod.name,category:prod.category,base_price:prod.base_price,msrp:prod.msrp,image:prod.image,description:prod.description,tiers:prod.tiers,price_note:prod.price_note,active:prod.active}
      })});
      const cj=await cr.json().catch(()=>({}));
      if(cr.status===409){ toast('That SKU is already in use in the catalog',true); return; }
      if(!cr.ok || cj.ok===false){ toast('Catalog rename failed'+(cj.error?': '+cj.error:''),true); return; }
      _catalogCache=null; catalogNote=' · catalog + pricing updated';
    }catch(e){ toast('Catalog rename failed — nothing changed',true); return; }
  } else { catalogNote=' · not in catalog (content only)'; }
  // 2) content overlay
  const r=await apiWrite({action:'rename_sku', page_key:k, old_sku:oldSku, new_sku:newSku});
  if(r.ok && (!r.json || r.json.ok!==false)){
    const skus=skusOf(k); const i=skus.findIndex(s=>String(s.sku)===oldSku); if(i>=0){ skus[i].sku=newSku; pages[k].skus=skus; }
    toast('SKU '+oldSku+' → '+newSku+catalogNote); render();
  } else { toast('Content rename failed'+(prod?' (catalog already updated — re-run to sync content)':''),true); }
}
async function doAiGen(k, field, btn){
  if(!field) return; const p=pages[k]; const orig=btn?btn.textContent:''; if(btn){ btn.disabled=true; btn.textContent='✨ …'; }
  const ctx={ name:p.name, category:p.category, subcategory:p.subcategory, family:p.family,
    tagline:p.tagline, description:p.description, features:p.features||[],
    clinical_applications:p.clinical_applications||[], billing_codes:p.billing_codes||[],
    manufacturer:p.manufacturer||MFR, skus:skusOf(k).map(s=>({sku:s.sku,size:s.size,hcpcs:s.hcpcs})),
    existing_categories:allCategories() };
  const r=await apiWrite({action:'generate_content', page_key:k, field, context:ctx});
  if(btn){ btn.disabled=false; btn.textContent=orig; }
  const out=r.json||{};
  if(!r.ok || out.ok===false){ toast(out.message||out.error||'AI generation failed',true); return; }
  if(field==='features'||field==='clinical_applications'){
    if(Array.isArray(out.list)&&out.list.length) pages[k][field]=out.list;
    else if(out.text) pages[k][field]=out.text.split('\n').map(x=>x.replace(/^[-•*\d.\s]+/,'').trim()).filter(Boolean);
  } else if(out.text!=null){ pages[k][field]=out.text; }
  toast('AI draft added — review, then Save'); reopen(k);
}
async function doSaveSkus(k){ const skus=skusOf(k); pages[k].skus=skus; pages[k].sku_count=skus.length;
  const r=await apiWrite({action:'save_skus',page_key:k,skus});
  toast(r.ok?'SKUs saved':'Save failed',!r.ok); }
/* AI-draft each SKU's Name / Size / HCPCS from the product + sizing table + billing codes. Fills BLANKS only. */
async function doAiFillSkus(k,btn){
  const skus=skusOf(k); if(!skus.length){ toast('No SKUs to fill on this product',true); return; }
  const orig=btn?btn.textContent:''; if(btn){ btn.disabled=true; btn.textContent='✨ …'; }
  const r=await apiWrite({action:'ai_fill_skus',page_key:k});
  if(btn){ btn.disabled=false; btn.textContent=orig; }
  const out=r.json||{};
  if(!r.ok||out.ok===false){ toast(out.message||out.error||'AI fill failed',true); return; }
  const rows=Array.isArray(out.rows)?out.rows:[];
  if(!rows.length){ toast('AI returned nothing to fill',true); return; }
  const byCode={}; rows.forEach(x=>{ if(x&&x.sku!=null) byCode[String(x.sku).trim()]=x; });
  let filled=0;
  const next=skus.map(s=>{ const rec=byCode[String(s.sku).trim()]; if(!rec) return s;
    const o=Object.assign({},s);
    ['name','size','hcpcs'].forEach(f=>{ const cur=String(o[f]||'').trim(); const val=String(rec[f]||'').trim();
      if(!cur && val){ o[f]=val; filled++; } });
    return o; });
  pages[k].skus=next;
  toast(filled?('AI filled '+filled+' field(s) — review, then Save SKU edits'):'Nothing blank to fill — all SKU details already set');
  reopen(k);
}
async function doSaveSizing(k){ const txt=document.getElementById('sz-'+cssId(k)).value.trim();
  const note=document.getElementById('szn-'+cssId(k)).value;
  let payload={action:'save_sizing',page_key:k,sizing_note:note};
  if(txt){ const tb=parseTable(txt); if(!tb.rows.length){ toast('Nothing parsed',true); return; }
    payload.columns=tb.columns; payload.sizing_table=tb.rows; pages[k].sizing_table={columns:tb.columns,rows:tb.rows}; }
  else { const cur=normSizing(pages[k].sizing_table); payload.columns=cur.columns; payload.sizing_table=cur.rows; }
  pages[k].sizing_note=note;
  const r=await apiWrite(payload); toast(r.ok?'Sizing saved':'Save failed',!r.ok); reopen(k); }

async function doMove(){ if(!skuSel.pk||!skuSel.ids.size) return; const to=document.getElementById('movetarget').value;
  if(!to){ toast('Pick a target product',true); return; }
  const ids=[...skuSel.ids];
  const r=await apiWrite({action:'move_skus',from_page_key:skuSel.pk,to_page_key:to,skus:ids});
  if(r.ok){ // update local
    const src=skusOf(skuSel.pk), moving=src.filter(s=>skuSel.ids.has(s.sku));
    pages[skuSel.pk].skus=src.filter(s=>!skuSel.ids.has(s.sku)); pages[skuSel.pk].sku_count=pages[skuSel.pk].skus.length;
    const dst=skusOf(to); const dstIds=new Set(dst.map(s=>s.sku)); moving.forEach(s=>{if(!dstIds.has(s.sku))dst.push(s);});
    pages[to].skus=dst; pages[to].sku_count=dst.length;
    toast('Moved '+ids.length+' SKU(s)'); skuSel={pk:null,ids:new Set()}; render();
  } else toast('Move failed',true); }
async function doSplit(){ if(!skuSel.pk||!skuSel.ids.size) return; const name=(document.getElementById('splitname').value||'').trim();
  if(!name){ toast('Name the new product',true); return; }
  const npk=slug(name); const ids=[...skuSel.ids]; const from=skuSel.pk; const srcP=pages[from];
  const r=await apiWrite({action:'split',from_page_key:from,skus:ids,new:{page_key:npk,name,category:srcP.category,subcategory:srcP.subcategory,family:srcP.family}});
  if(r.ok){ const src=skusOf(from), moving=src.filter(s=>skuSel.ids.has(s.sku));
    pages[from].skus=src.filter(s=>!skuSel.ids.has(s.sku)); pages[from].sku_count=pages[from].skus.length;
    pages[npk]={page_key:npk,name,category:srcP.category,subcategory:srcP.subcategory,family:srcP.family,skus:moving,sku_count:moving.length,status:'pending_review',msrp_rule:srcP.msrp_rule,features:[],image:(moving[0]&&moving[0].image)||''};
    toast('Split into "'+name+'"'); skuSel={pk:null,ids:new Set()}; document.getElementById('splitname').value=''; openCards.add(npk); render();
  } else toast('Split failed',true); }
function slug(s){ return String(s).toLowerCase().replace(/['".]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60); }

async function doBulk(publish){ const keys=[...selProducts]; if(!keys.length) return;
  const patch={}; const st=publish?'published':document.getElementById('bulkstatus').value; const cat=document.getElementById('bulkcat').value.trim();
  if(st) patch.status=st; if(cat) patch.category=cat;
  if(!Object.keys(patch).length){ toast('Choose a status or category',true); return; }
  const r=await apiWrite({action:'bulk',page_keys:keys,patch});
  if(r.ok){ keys.forEach(k=>{ if(patch.status)pages[k].status=patch.status; if(patch.category)pages[k].category=patch.category; });
    toast('Updated '+keys.length+' product(s)'); selProducts.clear(); document.getElementById('bulkcat').value=''; render(); }
  else toast('Bulk update failed',true); }

async function doNewProduct(){
  const name=(document.getElementById('np-name').value||'').trim(); if(!name){toast('Name required',true);return;}
  const cat=document.getElementById('np-cat').value.trim(), fam=document.getElementById('np-fam').value.trim();
  const rows=[...document.querySelectorAll('#np-skurows .np-skurow')].map(r=>({
    code:(r.querySelector('.np-sku').value||'').trim(),
    name:(r.querySelector('.np-skuname').value||'').trim(),
    price:(r.querySelector('.np-skuprice').value||'').trim()
  })).filter(x=>x.code);
  const seen=new Set(); for(const x of rows){ if(seen.has(x.code)){ toast('Duplicate SKU '+x.code,true); return; } seen.add(x.code); }
  const npk=slug(name);
  const btn=document.querySelector('[data-act="new-save"]'); if(btn){ btn.disabled=true; btn.textContent='Creating…'; }
  // 1) content record (Review Structure)
  const skusForContent=rows.map(r=>({sku:r.code,name:r.name,status:'active'}));
  const r=await apiWrite({action:'create_product',product:{page_key:npk,name,category:cat,family:fam,skus:skusForContent}});
  if(!(r.ok && (!r.json||r.json.ok!==false))){ toast((r.json&&(r.json.message||r.json.error))||'Create failed',true); if(btn){btn.disabled=false;btn.textContent='Create product';} return; }
  // 2) orderable + priced catalog items (custom_products via catalog-api, President-only)
  let made=0, priced=0, catFail=0, forbidden=false;
  for(const it of rows){
    const price=it.price===''?null:Number(it.price.replace(/[^0-9.\-]/g,''));
    const prod={code:it.code, name:it.name||name, category:cat||null, active:true};
    if(price!=null && isFinite(price)) prod.base_price=price;
    try{
      const cr=await fetch('/.netlify/functions/catalog-api',{method:'POST',headers:authHeaders(),body:JSON.stringify({action:'save_product',manufacturer:MFR,product:prod})});
      if(cr.ok){ made++; if(prod.base_price!=null) priced++; } else { catFail++; if(cr.status===403) forbidden=true; }
    }catch(e){ catFail++; }
  }
  pages[npk]={page_key:npk,name,category:cat,family:fam,skus:skusForContent,sku_count:skusForContent.length,status:'pending_review',features:[]};
  _catalogCache=null;   // Price Check will re-read the catalog
  document.getElementById('overlay').classList.remove('show'); openCards.add(npk);
  if(forbidden) toast('Product created, but adding to the catalog needs President access — no catalog items written.',true);
  else if(catFail) toast('Created "'+name+'". '+catFail+' SKU(s) couldn\'t be added to the catalog — check them in Product Catalog.',true);
  else toast('Created "'+name+'" · '+made+' orderable SKU(s)'+(priced?' ('+priced+' priced)':'')+'.');
  render();
}

    ${st.rows.length?`<h4 style="font-family:Archivo">Sizing</h4><div class="tabscroll"><table class="pv"><thead><tr>${st.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${st.rows.map(r=>`<tr>${st.columns.map(c=>`<td>${esc(r[c]!=null?r[c]:'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${p.sizing_note?`<div class="hint">${esc(p.sizing_note)}</div>`:''}`:''}

/* ===================== history / undo ===================== */
async function openHistory(){ const d=document.getElementById('drawer'); d.classList.add('show');
  const body=document.getElementById('historybody');
  if(!ONLINE){ body.innerHTML='<div style="padding:18px" class="mut">History is available when connected live (admin token).</div>'; return; }
  body.innerHTML='<div style="padding:18px" class="mut">Loading…</div>';
  const r=await apiWrite({action:'history',limit:80});
  const list=(r.json&&r.json.history)||[];
  body.innerHTML=list.length?list.map(h=>`<div class="hrow ${h.undone?'undone':''}">
    <div><div class="ha">${esc(h.action)} · ${new Date(h.at).toLocaleString()}</div><div>${esc(h.summary||'')}</div><div class="mut" style="font-size:11px">${esc(h.actor||'')}</div></div>
    ${h.undone?'<span class="mut" style="font-size:11px">undone</span>':`<button class="hu" data-act="undo" data-id="${h.id}">Undo</button>`}</div>`).join('')
    :'<div style="padding:18px" class="mut">No changes recorded yet.</div>'; }
async function doUndo(id,btn){ btn.disabled=true; const r=await apiWrite({action:'undo',id:Number(id)});
  if(r.ok){ toast('Change undone — reloading'); const rr=await fetch(`${API}?manufacturer=${encodeURIComponent(MFR)}`,{headers:authHeaders()});
    if(rr.ok){ const j=await rr.json(); if(j&&j.rows){ const pg={}; j.rows.forEach(row=>pg[row.page_key]=row); Object.keys(pages).forEach(k=>delete pages[k]); Object.assign(pages,pg);} }
    render(); openHistory(); } else { toast('Undo failed',true); btn.disabled=false; } }

  document.getElementById('overlay').classList.add('show'); }
document.getElementById('overlay').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); });

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
