<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/admin/admin-shell.css">
<title>Partner 360 · Catalog Management Workspace</title>
<style>
:root{--navy:#12253c;--navy2:#17456e;--orange:#ef6325;--gold:#fcb21e;--blue:#1681c2;--blue-dk:#0f5c8f;
--paper:#f6f7f5;--line:#e7e2d8;--gray:#6b7280;--ink:#39424e;
--grad:linear-gradient(100deg,var(--orange),var(--gold));--shadow:0 18px 40px -20px rgba(11,13,15,.28);
--good:#1c7a44;--goodbg:#e9f7ef;--warn:#9a4b0d;--warnbg:#fff3e0;--bad:#b42323;--badbg:#fdecec;
--pub:#0f5c8f;--pubbg:#e5f0fd;--disc:#7a5a00;--discbg:#fdf3dd;--hid:#5b6472;--hidbg:#eef0f3;--flag:#8a1c5a;--flagbg:#fdeaf3;}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--paper);color:var(--navy);overflow-x:hidden}
.top{background:#0b0d0f;color:#c7d2df;font-size:12px;padding:7px 22px}.top b{color:#fff}
.pagehd{background:#fff;border-bottom:3px solid var(--orange);padding:14px 22px}
.pagehd h1{font-family:'Archivo',sans-serif;font-weight:900;font-size:22px;margin:0}
.pagehd .sub{color:var(--gray);font-size:13px;margin-top:3px}
.wrap{max-width:1220px;margin:0 auto;padding:20px 22px 120px}
/* workflow stepper */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 16px}
.step{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--gray)}
.step .n{width:19px;height:19px;border-radius:50%;background:var(--paper);color:var(--gray);display:grid;place-items:center;font-size:11px;font-weight:800;border:1px solid var(--line)}
.step.on{border-color:var(--navy);color:var(--navy)}.step.on .n{background:var(--navy);color:#fff;border-color:var(--navy)}
.step{cursor:pointer;transition:border-color .12s,background .12s}
.step:hover{border-color:var(--navy2)}
.step.active{background:var(--navy);color:#fff;border-color:var(--navy)}.step.active .n{background:#fff;color:var(--navy);border-color:#fff}
.guide{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:0 0 16px;overflow:hidden}
.guide-h{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 16px;cursor:pointer;background:linear-gradient(180deg,#f3f9ff,#fff);border-bottom:1px solid var(--line)}
.guide.collapsed .guide-h{border-bottom:none}
.guide-h .gt{font-family:'Archivo',sans-serif;font-weight:800;font-size:14.5px;color:var(--navy)}
.guide-h .gt .gstep{color:var(--orange)}
.guide-h .gtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.guide-b{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
@media(max-width:720px){.guide-b{grid-template-columns:1fr}}
.guide.collapsed .guide-b{display:none}
.gblock h5{margin:0 0 5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
.gblock ul{margin:0;padding-left:17px;font-size:13px;line-height:1.55;color:var(--ink)}
.gblock p{margin:0;font-size:13px;line-height:1.55;color:var(--ink)}
.gblock.dont h5{color:var(--bad)}.gblock.dont ul{color:#7a2b2b}
.gblock.next{grid-column:1/-1;background:#eef5ff;border:1px solid #cfe2fb;border-radius:10px;padding:10px 12px}
.gbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:800;cursor:pointer;color:var(--navy);font-family:inherit}
.gbtn.grad{background:var(--grad);border:none;color:#141414}
.tut h3{font-family:'Archivo',sans-serif;margin:16px 0 6px;font-size:16px;color:var(--navy)}
.tut h3:first-child{margin-top:0}
.tut p{font-size:13.5px;line-height:1.6;margin:0 0 8px;color:var(--ink)}
.tut ol{font-size:13.5px;line-height:1.6;padding-left:20px}
.tut .rule{background:#fff3e0;border:1px solid #f2d9b0;border-radius:10px;padding:11px 14px;font-size:13.5px;color:#7a4a0d;margin:0 0 12px}
.tut table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 12px}
.tut th,.tut td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tut th{background:var(--paper);font-family:'Archivo',sans-serif}
/* stats */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
/* Manufacturer selector + progress dashboard */
.mfrbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.mfrbar .lbl{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--gray)}
.mfrbar select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;font-weight:700;color:var(--navy2,#22303f);background:#fff;cursor:pointer;max-width:320px}
.mfrbar select:focus{outline:none;border-color:var(--orange,#ef6325)}
.mstate{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.mstate.published{background:#e7f3ec;color:#1a7f4b}
.mstate.in_progress{background:#fdf0e2;color:#b8791b}
.mstate.in_review{background:#eef5ff;color:#2a5c9a}
.mstate.not_started{background:#eef0f2;color:#6b7280}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
.mcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;transition:box-shadow .13s,transform .13s}
.mcard:hover{box-shadow:0 12px 26px -14px rgba(11,13,15,.35);transform:translateY(-1px);border-color:var(--orange,#ef6325)}
.mcard.on{border-color:var(--orange,#ef6325);background:#fff7f2}
.mcard .mn{font-family:Archivo,sans-serif;font-weight:800;font-size:14.5px;margin-bottom:5px}
.mcard .mm{font-size:11.5px;color:var(--gray);margin-top:6px}
.mbar{height:6px;background:#eef0f2;border-radius:4px;overflow:hidden;margin-top:8px}
.mbar>div{height:100%;background:var(--orange,#ef6325)}
/* Duplicate gate */
.dupbanner{border-radius:11px;padding:12px 14px;font-size:13px;line-height:1.5}
.dupbanner.exact{background:#fdecec;border:1px solid #f0c7c7;color:#8d2b2b}
.dupbanner.poss{background:#fdf3e2;border:1px solid #ecd6a8;color:#8a5e12}
.dupbanner b{display:block;font-family:Archivo,sans-serif;font-size:14.5px;margin-bottom:3px}
.duprow{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px;background:#fff;flex-wrap:wrap}
.duprow .dupmain{flex:1;min-width:210px}
.duprow .dupn{font-weight:800;font-size:13.5px;margin-bottom:3px}
.duprow .dupacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* Start new enrichment wizard */
.sesteps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sestep{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:#eef0f2;color:#6b7280}
.sestep.on{background:var(--navy,#10263f);color:#fff}
.sestep.done{background:#e7f3ec;color:#1a7f4b}
.secand{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px;background:#fff;flex-wrap:wrap}
.secand.dupe{border-color:#f0c7c7;background:#fffafa}
.secand .sem{flex:1;min-width:200px}
.secand .sen{font-weight:800;font-size:13.5px}
.seprog{height:8px;background:#eef0f2;border-radius:5px;overflow:hidden;margin-top:8px}
.seprog>div{height:100%;background:var(--orange,#ef6325);transition:width .2s}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow)}
.stat b{font-family:'Archivo',sans-serif;font-size:21px;display:block;line-height:1.1}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-family:inherit;font-size:13.5px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--navy);font-family:inherit}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--navy);font-family:'Archivo',sans-serif;min-height:40px}
.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.grad{background:var(--grad);color:#141414;border:none}
.btn.ghost{background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* structure review banner */
.structure{background:linear-gradient(180deg,#fdeaf3,#fff);border:2px solid #f4c4dd;border-radius:16px;padding:16px 18px;margin-bottom:18px}
.structure h2{font-family:'Archivo',sans-serif;font-size:16px;margin:0 0 4px;color:var(--flag)}
.structure p{margin:0 0 12px;font-size:13px;color:var(--navy2)}
.flagcard{background:#fff;border:1px solid #f4c4dd;border-radius:12px;padding:13px 15px;margin-bottom:10px}
.flagcard .fh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.flagcard .fn{font-family:'Archivo',sans-serif;font-weight:800;font-size:15px}
.flagcard .reasons{font-size:12px;color:var(--flag);margin:6px 0 0}
/* product card */
.card{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.card.flagged{border-color:#f4c4dd}
.chead{display:grid;grid-template-columns:auto 62px 1fr auto;gap:14px;align-items:center;padding:14px 16px}
@media(max-width:720px){.chead{grid-template-columns:auto 48px 1fr;row-gap:10px}.chead .cactions{grid-column:1/-1}}
.selbox{width:20px;height:20px}
.cthumb{width:62px;height:62px;border-radius:10px;background:var(--paper) center/contain no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:#b9bfc7;font-size:9px;text-align:center}
.pname{font-family:'Archivo',sans-serif;font-weight:800;font-size:16.5px;margin:0;border:1px solid transparent;border-radius:7px;padding:2px 5px}
.pname:focus{outline:none;border-color:var(--line);background:var(--paper)}
.pmeta{font-size:11.5px;color:var(--gray);margin-top:3px;display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center}
.cactions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-block;border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.b-pending_review{background:var(--warnbg);color:var(--warn);border:1px solid #f2d9b0}
.b-approved{background:var(--goodbg);color:var(--good);border:1px solid #b7e2c8}
.b-published{background:var(--pubbg);color:var(--pub);border:1px solid #bcd9f4}
.b-active{background:var(--goodbg);color:var(--good);border:1px solid #b7e2c8}
.b-discontinued{background:var(--discbg);color:var(--disc);border:1px solid #ecdca6}
.b-hidden{background:var(--hidbg);color:var(--hid);border:1px solid #d7dbe0}
.b-rejected{background:var(--badbg);color:var(--bad);border:1px solid #f3c0c0}
.b-need{background:#f1f0ff;color:#4b3fb0;border:1px solid #d6d2f7}
.b-flag{background:var(--flagbg);color:var(--flag);border:1px solid #f4c4dd}
/* expanded panel */
.panel{border-top:1px solid var(--line);padding:0;display:none}
.card.open .panel{display:block}
.sec{border-bottom:1px solid var(--line);padding:15px 18px}
.sec:last-child{border-bottom:none}
.sec h4{font-family:'Archivo',sans-serif;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--navy2);margin:0 0 11px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--gray)}
input.ed,textarea.ed,select.ed{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13.5px;color:var(--navy);resize:vertical;background:#fff}
select.ed{cursor:pointer}
textarea.ed{min-height:64px}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.feat li{display:flex;gap:6px;align-items:flex-start}
.feat li .x,.specrow .x{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;min-height:38px;cursor:pointer;color:var(--bad);font-weight:800;flex:0 0 auto}
.specrow{display:grid;grid-template-columns:1fr 1.4fr 34px;gap:6px;margin-bottom:6px}
/* SKU grid */
.skutable{width:100%;border-collapse:collapse;font-size:13px}
.skutable th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);padding:6px 8px;border-bottom:1px solid var(--line)}
.skutable td{padding:5px 8px;border-bottom:1px solid #f1efe9;vertical-align:middle}
.skutable input.sed{width:100%;border:1px solid transparent;border-radius:6px;padding:5px 6px;font-family:inherit;font-size:12.5px;background:transparent}
.skutable input.sed:focus{outline:none;border-color:var(--line);background:#fff}
.skutable select.sst{border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:11.5px;font-family:inherit}
.skutable tr.disabled{opacity:.5}
.skusel{width:17px;height:17px}
.gal{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.gal a{display:block;text-decoration:none}
.gal img{width:150px;height:150px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;cursor:zoom-in;transition:box-shadow .13s,transform .13s}
.gal img:hover{box-shadow:0 12px 26px -12px rgba(11,13,15,.35);transform:translateY(-2px)}
@media(max-width:560px){.gal img{width:44vw;height:44vw}}
.mini-ai{border:1px solid #cfe2fb;background:#eef5ff;border-radius:7px;padding:2px 9px;font-size:10.5px;font-weight:800;cursor:pointer;color:var(--blue-dk);margin-left:8px;vertical-align:middle}
.mini-ai:hover{background:#dfeeff}
.mini-ai:disabled{opacity:.5;cursor:default}
.skuedit{border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 7px;font-size:12px;cursor:pointer;color:var(--blue-dk);line-height:1.3}
.skuedit:hover{background:#eef5ff;border-color:#cfe2fb}
.skudel{border:1px solid #f3c0c0;background:#fff;border-radius:6px;padding:1px 6px;font-size:12px;cursor:pointer;color:var(--bad);line-height:1.3;margin-left:3px}
.skudel:hover{background:#fdecec}
.gal .prov{font-size:9px;color:var(--gray);text-align:center;display:block}
.provline{font-size:11.5px;color:var(--gray)}
.provline a{color:var(--blue-dk);font-weight:700;word-break:break-all}
.hint{font-size:11.5px;color:var(--gray);margin:4px 0 0}
.savebar{display:flex;gap:8px;align-items:center;margin-top:11px}
.savebar .ok{font-size:12px;color:var(--good);font-weight:700}
.chip{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;margin:0 4px 4px 0}
.codechip{background:#eef5ff;border-color:#cfe2fb;color:var(--navy2)}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--gray);font-size:12.5px;background:var(--paper);cursor:pointer;outline:none;transition:border-color .13s,background .13s}
.dropzone:focus,.dropzone.drag{border-color:var(--orange,#ef6325);background:#fff7f2;color:var(--navy2)}
.dropzone b{color:var(--navy2)}
.dropzone .dzbtns{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.galctl{display:flex;gap:4px;justify-content:center;margin-top:3px}
.galctl button{padding:2px 7px;font-size:10px;border-radius:7px}
.linkrow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.linkrow a{flex:1;color:var(--blue-dk);font-weight:600;font-size:12.5px;word-break:break-all;text-decoration:none}
.linkrow a:hover{text-decoration:underline}
.linkrow .x{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--bad);font-weight:800;flex:0 0 auto}
/* Price audit */
.pa-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.pa-score{display:flex;align-items:center;gap:12px;border:2px solid #ccc;border-radius:12px;padding:8px 16px}
.pa-scv{font-family:Archivo,sans-serif;font-weight:800;font-size:30px;line-height:1}
.pa-scl{font-size:12px;font-weight:700;color:var(--navy2,#22303f)}
.pa-actions{display:flex;gap:8px;flex-wrap:wrap}
.pa-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pa-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin-top:8px}
.pa-sumc{border:1px solid var(--line,#e5e9ee);border-radius:10px;padding:9px 11px;background:#fff}
.pa-sumv{font-size:19px;font-weight:800;color:#12253c;font-variant-numeric:tabular-nums}
.pa-suml{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.03em;font-weight:700;margin-top:1px}
.pa-steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pa-step{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line,#e5e9ee);background:#fff;color:#54606d}
.pa-step b{font-size:11px}
.pa-step i{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.pa-step.done{border-color:#b6d8c1;background:#f2f8f4;color:#1a7f4b}
.pa-step.open{border-color:#f0c7c7;background:#fdf5f5;color:#b42323}
.pachip{display:inline-block;background:#eef7f0;border:1px solid #d5e6da;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;color:var(--navy2,#22303f)}
.pa-sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.pa-sec h3{margin:0 0 4px;font-family:Archivo,sans-serif;font-size:14px}
.pa-bulk{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--paper,#f6f7f5);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:12px}
.pa-bulk .ed{padding:6px 8px}
/* sticky action bars */
.selbar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:12px 22px;display:none;z-index:40;box-shadow:0 -10px 30px -18px rgba(0,0,0,.5)}
.selbar.show{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.selbar .grow{flex:1;min-width:120px;font-size:13px}
.selbar select,.selbar input{border:none;border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px}
.selbar .btn{background:#1c3a5c;color:#fff;border:1px solid #2b5680}
.selbar .btn.grad{background:var(--grad);color:#141414;border:none}
.selbar .btn.danger{background:#7c2020;border-color:#a33;color:#fff}
.selbar .btn.danger:hover{background:#9b2626}
/* modal + drawer */
/* z-index 300 clears the sticky Connect 360 nav (z-index:100) so the dialog's header/close
   are never hidden behind it; the modal scrolls internally so it always fits the screen. */
.overlay{position:fixed;inset:0;background:rgba(9,12,16,.55);display:none;z-index:300;padding:24px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay.show{display:block}
.modal{background:#fff;border-radius:16px;max-width:760px;width:100%;margin:0 auto;max-height:calc(100vh - 48px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.modal .mh h3{font-family:'Archivo',sans-serif;margin:0;font-size:17px}
.modal .mb{padding:18px 20px;overflow-y:auto;flex:1 1 auto}

<script>
/* ===================== Catalog Management Workspace ===================== */
const API='/.netlify/functions/product-content';
const MFR=new URLSearchParams(location.search).get('manufacturer')||'ovation-medical';
/* ?find=… prefills the search. The Link audit in Product Catalog is read-only by design — the
   fix for an unconnected SKU belongs to the record, and the record is edited here — so its rows
   link straight to the product instead of offering a second place to change the same thing. */
const FIND=new URLSearchParams(location.search).get('find')||'';
const pages={};
let filter='all', search='', ONLINE=true, selMode=false;
function token(){ try{ return (window.HCPS&&HCPS.token&&HCPS.token())||''; }catch(e){ return ''; } }
function authHeaders(extra){ return Object.assign({'Content-Type':'application/json','authorization':'Bearer '+token()}, extra||{}); }
const selProducts=new Set();          // page_keys chosen for bulk
let skuSel={pk:null, ids:new Set()};  // SKUs chosen (single product at a time) for move/split
const dismissed=new Set();            // structure flags dismissed this session
const openCards=new Set();            // expanded cards

const STATUSES=[
  ['pending_review','Pending review'],['approved','Approved'],['published','Published'],
  ['active','Active'],['discontinued','Discontinued'],['hidden','Hidden'],['rejected','Rejected']];
const PUBLIC_SET=new Set(['published','active','discontinued']);
const SKU_STATUSES=['active','discontinued','hidden'];
const WORKFLOW=['Import','Review structure','Correct products','Enrich content','Sizing & specs','Disable obsolete','Preview','Approve & publish'];

/* ===================== Step-by-step "How to use this step" guides ===================== */
const STEP_GUIDE=[
  { title:"Import Manufacturer Data",
    purpose:"Bring the raw product data into the tool — the manufacturer's coded catalog & PDF, their website, and your existing HCPS catalog. This is the source material for everything that follows.",

    next:"Go to Step 2 — Review Structure — to confirm each record is really ONE product." },
  { title:"Review Product / SKU Structure",
    purpose:"Decide whether each record is a single product or several distinct products bundled under one. This step is ONLY about grouping SKUs into the correct products — nothing else.",
    do:["Open the ⚑ “Possible Multiple Products” flags at the top.","For each flagged product: Manage → SKUs, and look at the SKU numbers/names.","Check the SKUs that belong elsewhere, then use the bottom bar to Split them into a new product or Move them to the right one; Merge true duplicates.","To take a SKU out of a product entirely (one you don't recognize, or that doesn't belong), use the 🗑 Remove button (or check rows → 🗑 Remove from product). ⚠ “Off” only HIDES a SKU and leaves it listed — use Remove to actually take it out.","If the SKUs are just sizes/colors of ONE product, click Dismiss on the flag."],

    haveReady:["The manufacturer catalog, so you can confirm which SKUs are genuinely separate products."],
    confirm:["Every product contains only the SKUs that belong to it, and no bundle is left flagged (or you dismissed the size-only flags)."],
    next:"Go to Step 3 — Correct Products & Categories — to set each product's identity." },
  { title:"Correct Products & Categories",
    purpose:"Now that the grouping is right, fix each product's identity — name, manufacturer, family, category, subcategory, status, and any SKU numbers that changed.",
    do:["Manage → Product record: set Category & Subcategory (✨ AI can suggest), Family, Manufacturer, MSRP rule, Name, Tagline.","If a SKU number changed, click the ✎ beside it to rename it everywhere (catalog + pricing + content).","Click Save record."],
    dontYet:["Don't write long descriptions or add images yet — that's Step 4. Don't approve/publish."],
    haveReady:["Your category/subcategory list and the correct product names from the catalog."],

    next:"Go to Step 4 — Enrich Images & Content." },
  { title:"Enrich Images & Content",
    purpose:"Write the customer-facing content and curate the images dealers will see in Partner 360.",
    do:["Manage → Content: write the Description, Key features, clinical applications, billing codes (use ✨ AI to draft, then edit).","Manage → Images, documents & source: add image URLs, note the primary, and check the “where fields came from” provenance.","Click Save content."],
    dontYet:["Don't add sizing charts or specs here — that's Step 5. Don't approve yet."],
    haveReady:["Product photos (hosted image URLs) and the manufacturer's feature/benefit copy."],
    confirm:["Each product has a clear description, a few real features, and at least one correct image."],
    next:"Go to Step 5 — Add Sizing / Specs." },
  { title:"Add Sizing / Specifications",
    purpose:"Add the sizing chart, spec table, and warranty so dealers can order the right size with confidence.",
    do:["Manage → Sizing / spec table: paste the manufacturer's chart (tab- or comma-separated), click Preview parse, then Save sizing.","Add Specifications (label → value) and Warranty in the Content section."],

let guideStep=1, guideOpen=true;
try{ const gs=JSON.parse(localStorage.getItem('pc_guide')||'null'); if(gs){ if(typeof gs.s==='number') guideStep=gs.s; guideOpen=gs.o!==false; } }catch(e){}
function persistGuide(){ try{ localStorage.setItem('pc_guide',JSON.stringify({s:guideStep,o:guideOpen})); }catch(e){} }
function renderSteps(){ const el=document.getElementById('steps'); if(!el) return;
  el.innerHTML=WORKFLOW.map((s,i)=>`<div class="step ${i===guideStep?'active':''}" onclick="showStep(${i})" title="How to use this step"><span class="n">${i+1}</span>${s}</div>`).join(''); }
function renderGuide(){ const el=document.getElementById('guide'); if(!el) return; const g=STEP_GUIDE[guideStep]; if(!g){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="guide ${guideOpen?'':'collapsed'}">
    <div class="guide-h" onclick="toggleGuide()">
      <div class="gt"><span class="gstep">Step ${guideStep+1} of 8</span> · How to use “${g.title}”</div>
      <div class="gtools">
        <button class="gbtn grad" onclick="event.stopPropagation();openTutorial()">📘 Full tutorial</button>
        <span style="font-size:12px;color:var(--gray)">${guideOpen?'▾ hide':'▸ show'}</span>
      </div>
    </div>
    <div class="guide-b">
      <div class="gblock"><h5>✅ What this step is for</h5><p>${g.purpose}</p></div>
      <div class="gblock"><h5>Do here</h5><ul>${g.do.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="gblock dont"><h5>⛔ Not yet — leave for a later step</h5><ul>${g.dontYet.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="gblock"><h5>Have ready before this step</h5><ul>${g.haveReady.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="gblock"><h5>Confirm before moving on</h5><ul>${g.confirm.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="gblock next"><h5>➡ Next step</h5><p>${g.next}</p></div>
    </div>
  </div>`; }
function showStep(i){ guideStep=i; guideOpen=true; persistGuide(); renderSteps(); renderGuide();
  const el=document.getElementById('guide'); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'nearest'}); }
function toggleGuide(){ guideOpen=!guideOpen; persistGuide(); renderGuide(); }
function openTutorial(){ modalHTML('📘 Product Content Enrichment — Full Tutorial', `<div class="tut">
  <div class="rule"><b>The golden rule:</b> work each product <b>top to bottom</b> through its Manage panel — the sections are already in workflow order. <b>Review Structure (Step 2) is ONLY for deciding which SKUs belong to which product.</b> Everything else — categories, content, images, sizing — happens in the later steps.</div>
  <h3>What each stage is for</h3>
  <div class="tabscroll"><table>
    <thead><tr><th>Stage</th><th>This stage is for…</th></tr></thead>
    <tbody>
      <tr><td><b>1 · Import</b></td><td>Getting the data in (documents → website → HCPS catalog). Just confirm it arrived.</td></tr>
      <tr><td><b>2 · Review Structure</b></td><td><b>Structural changes only</b> — split / move / merge SKUs so each record is one real product.</td></tr>
      <tr><td><b>3 · Correct Products & Categories</b></td><td>Identity — name, family, category, subcategory, status, SKU-number fixes.</td></tr>
      <tr><td><b>4 · Enrich Images & Content</b></td><td>Content — description, features, images, provenance.</td></tr>
      <tr><td><b>5 · Sizing / Specs</b></td><td>Sizing chart, spec table, warranty.</td></tr>
      <tr><td><b>6 · Disable Obsolete</b></td><td>Mark discontinued / hidden SKUs and products.</td></tr>
      <tr><td><b>7 · Preview</b></td><td>Check the Partner 360 view before it's live.</td></tr>
      <tr><td><b>8 · Approve & Publish</b></td><td><b>Approve</b> = signed off (internal). <b>Publish</b> = live to dealers.</td></tr>
    </tbody>
  </table></div>
  <h3>The full order, start to finish</h3>
  <ol>
    <li><b>Import documents</b> — load the manufacturer's coded/retail catalog PDF (via the importer) so products and SKUs exist.</li>
    <li><b>Import website content</b> — open a product and “Run website import” to pull the manufacturer's live images and copy as a source.</li>
    <li><b>Review product / SKU structure</b> — clear the ⚑ flags: split bundled products, move stray SKUs, merge duplicates, dismiss size-only groups. <b>Do nothing else here.</b></li>
    <li><b>Correct categories & variants</b> — set category/subcategory, family, status, and fix any SKU numbers. Multi-model products become one record per model (variants).</li>
    <li><b>Enrich images & product data</b> — write the description and features (✨ AI to draft), pick the primary image, add documents.</li>
    <li><b>Review sizing / specifications</b> — paste the sizing chart, add specs and warranty.</li>
    <li><b>Preview</b> — open the Partner 360 preview and confirm it looks right.</li>
    <li><b>Approve, then Publish</b> — Approve to sign off, Publish to go live. Bulk-publish a finished manufacturer with Select → Publish selected.</li>
  </ol>
  <div class="rule">Tip: click any numbered step at the top of the page to pop open its “How to use this step” reminder. Your last-open step is remembered on this browser.</div>
</div>`); }

/* ---------- boot: pull live rows via admin token (falls back to offline seed) ---------- */
async function boot(){
  if(!token()){ location.replace('/admin/'); return; }   // not signed in → Connect 360 gate
  try{
    const r=await fetch(`${API}?manufacturer=${encodeURIComponent(MFR)}`,{headers:authHeaders()});
    const j=await r.json().catch(()=>({ok:false}));
    if(!j.ok){ gate(j.error||'Could not authenticate.'); return; }
    if(!j.admin){ gate("Your account isn't an admin, so it can't edit product content."); return; }
    const pg={}; (j.rows||[]).forEach(row=>{ pg[row.page_key]=row; });
    Object.keys(pages).forEach(k=>delete pages[k]); Object.assign(pages,pg);
    if(FIND){
      search=String(FIND).toLowerCase().trim();
      const box=document.getElementById('search'); if(box) box.value=FIND;
    }
    render();
    renderMfrBar();   // manufacturer selector + status (non-blocking)
  }catch(e){ const el=document.getElementById('cards'); if(el) el.innerHTML='<div class="mut" style="padding:24px">Couldn\'t reach the server — reload to try again.</div>'; }
}
function gate(msg){ const w=document.querySelector('.wrap');
  if(w) w.innerHTML='<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;margin-top:16px"><h2 style="font-family:Archivo;margin:0 0 6px">Admin access required</h2><p class="mut">'+esc(msg)+'</p><button class="btn dark" style="margin-top:10px" onclick="location.href=\'/admin/\'">Go to Connect 360 →</button></div>'; }
async function apiWrite(payload){
  try{ const r=await fetch(`${API}?manufacturer=${encodeURIComponent(MFR)}`,
      {method:'POST',headers:authHeaders(),body:JSON.stringify(payload)});
    /* A platform timeout or crash answers with an HTML body, not JSON. Swallowing
       that to {} is what turned a real 502 into a blank "could not run" message —
       so keep the status and a snippet of whatever came back. */
    const raw=await r.text();
    let json; try{ json=raw?JSON.parse(raw):{}; }catch(e){
      json={ error:'http_'+r.status,
             message:(r.status===502||r.status===504)
               ? 'The server ran out of time on this request (HTTP '+r.status+'). This usually means the job was too big to finish in one pass — try a smaller scope.'
               : 'The server returned HTTP '+r.status+' instead of a result.',
             detail:String(raw||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,300) };
    }
    return {ok:r.ok, status:r.status, json}; }
  catch(e){ return {ok:false, status:0, json:{error:'network', message:'Could not reach the server. '+String(e)}}; }
}
function toast(msg,bad){ const el=document.getElementById('toast')||(()=>{const d=document.createElement('div');d.id='toast';
  d.style.cssText='position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:'+(bad?'#b42323':'#12253c')+';color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:400;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)';document.body.appendChild(d);return d;})();
  el.style.background=bad?'#b42323':'#12253c'; el.textContent=msg; el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(()=>{el.style.opacity='0';},2200); }

/* ---------- SKU helpers (mirror the backend normalizer) ---------- */
function normSku(s){ if(s==null)return null;
  if(typeof s==='string'||typeof s==='number') return {sku:String(s),name:'',size:'',hcpcs:'',group:'',status:'active',disabled:false,image:'',images:[],source:''};
  return Object.assign({sku:'',name:'',size:'',hcpcs:'',group:'',status:'active',disabled:false,image:'',images:[],source:''},s,{sku:String(s.sku!=null?s.sku:(s.id!=null?s.id:''))}); }
function skusOf(k){ return (Array.isArray(pages[k].skus)?pages[k].skus:[]).map(normSku).filter(Boolean); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

/* ---------- client-side Structure Review ---------- */
function structureFlags(){
  const out=[];
  Object.keys(pages).forEach(k=>{ const p=pages[k];
    if(dismissed.has(k)) return;
    if(p.is_parent||p.parent_key) return;           // parents/variant children already structured
    const skus=skusOf(k); if(skus.length<2) return;
    const hcpcs=new Set(skus.map(s=>(s.hcpcs||'').trim()).filter(Boolean));
    const bases=new Set(skus.map(s=>baseToken(s.name||'')).filter(Boolean));
    const groups=new Set(skus.map(s=>(s.group||'').trim()).filter(Boolean));
    const reasons=[];
    if(hcpcs.size>1) reasons.push(hcpcs.size+' different HCPCS codes across its SKUs');
    if(bases.size>1) reasons.push(bases.size+' distinct product names in the SKU list');
    if(groups.size>1) reasons.push(groups.size+' catalog groups');
    const strong=reasons.length>0;   // HCPCS / name / group divergence = likely several products
    if(skus.length>=8 && !strong) reasons.push(skus.length+' SKUs under one product — confirm these are size/quantity variants of one product, not several products bundled together');
    else if(skus.length>=8) reasons.push(skus.length+' SKUs total');
    if(reasons.length) out.push({key:k, name:p.name||k, count:skus.length, strong, reasons});

const SIZE_WORDS=/\b(x{0,3}s|s|m|l|x{0,3}l|xxl|xl|small|medium|large|universal|left|right|regular|tall|short|std|standard|adult|pediatric|youth|\d+(\.\d+)?("|in|inch|inches|cm|mm)?)\b/gi;
function baseToken(str){ return String(str||'').toLowerCase().replace(SIZE_WORDS,' ').replace(/[^a-z ]+/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' '); }

function counts(){ const c={total:0,skus:0,pending:0,published:0,needs:0,flagged:structureFlags().length};

    if(p.needs_content) c.needs++;
    if(p.status==='pending_review'||p.status==='approved'||!p.status) c.pending++;
    if(PUBLIC_SET.has(p.status)) c.published++; }
  return c; }

function matchesSearch(k){ if(!search) return true; const p=pages[k];
  if((p.name||'').toLowerCase().includes(search)) return true;
  if((p.category||'').toLowerCase().includes(search)) return true;
  if((p.family||'').toLowerCase().includes(search)) return true;
  return skusOf(k).some(s=>(s.sku||'').toLowerCase().includes(search)||(s.name||'').toLowerCase().includes(search)); }
function visibleKeys(){ const flagSet=new Set(structureFlags().map(f=>f.key));
  return Object.keys(pages).filter(k=>{ const p=pages[k]; if(p.is_parent&&!skusOf(k).length&&!(p.variants||[]).length) {}

function normSizing(st){ if(!st) return {columns:[],rows:[]};
  if(Array.isArray(st)){ const cols=st[0]?Object.keys(st[0]):[]; return {columns:cols,rows:st}; }
  if(st.columns&&st.rows) return {columns:st.columns,rows:st.rows};
  return {columns:[],rows:[]}; }
function parseTable(txt){ const lines=txt.replace(/\r/g,'').split('\n').map(l=>l.trimEnd()).filter(l=>l.trim().length);
  if(!lines.length) return {columns:[],rows:[]};
  const delim=lines[0].indexOf('\t')>=0?'\t':(lines[0].indexOf(',')>=0?',':'\t');
  const cols=lines[0].split(delim).map(c=>c.trim());
  const rows=lines.slice(1).map(l=>{ const cells=l.split(delim); const o={}; cols.forEach((c,i)=>o[c]=(cells[i]||'').trim()); return o; });
  return {columns:cols,rows}; }

/* ── Where an image actually lives ────────────────────────────────────────────
   A scraped image is a LINK to the manufacturer's CDN — it renders because their
   server serves it. If they rename the file, redesign the site, or drop the
   product, the image disappears from our dealer pages too, and nothing here would
   warn us. An image copied into HCPS storage is our own file and keeps working.

   doSecureImages downloads each external image server-side and re-points the
   product at our stored copy. The original stays untouched on their site; we just
   stop depending on it. */
function isExternalImg(u){
  u=String(u||'');
  if(!u) return false;
  if(u.indexOf('/storage/v1/object/public/product-content/')>=0) return false;  // ours
  return /^https?:\/\//i.test(u);                                                // someone else's
}
function externalImgsOf(k){
  const p=pages[k]||{}; const out=[];
  (Array.isArray(p.images_gallery)?p.images_gallery:[]).forEach((g,i)=>{ if(g&&isExternalImg(g.url)) out.push({i,url:g.url}); });
  return out;
}
async function doSecureImages(k, quiet){
  const p=pages[k]; if(!p) return {copied:0,failed:0};
  const todo=externalImgsOf(k);
  const primaryExternal = isExternalImg(p.image) && !todo.some(x=>x.url===p.image);
  if(!todo.length && !primaryExternal){ if(!quiet) toast('All images are already stored by HCPS'); return {copied:0,failed:0}; }
  if(!quiet) toast('Copying '+todo.length+' image(s) into HCPS storage…');
  let copied=0, failed=0;
  for(const it of todo){
    const r=await apiWrite({action:'rehost',page_key:k,source_url:it.url});
    if(r.ok && r.json && r.json.ok && r.json.url){ pages[k].images_gallery[it.i].url=r.json.url;
      pages[k].images_gallery[it.i].source=(pages[k].images_gallery[it.i].source||'website')+'→stored';
      if(p.image===it.url) pages[k].image=r.json.url;
      copied++; }
    else failed++;
  }
  if(primaryExternal){
    const r=await apiWrite({action:'rehost',page_key:k,source_url:p.image});
    if(r.ok&&r.json&&r.json.ok&&r.json.url){ pages[k].image=r.json.url; copied++; } else failed++;
  }
  if(copied){
    // Persist the new URLs, and keep the original link on the record so we can always
    // see where the artwork came from.
    const patch={images_gallery:pages[k].images_gallery||[],image:pages[k].image||''};
    await apiWrite({action:'set_content',page_key:k,patch});
  }
  if(!quiet){ toast(copied+' image(s) now stored by HCPS'+(failed?(' · '+failed+' could not be copied'):''), !!failed && !copied); reopen(k); }
  return {copied,failed};
}
async function doBulkSecureImages(){
  const keys=[...selProducts].filter(k=>pages[k]);
  if(!keys.length){ toast('Nothing selected',true); return; }
  const withExt=keys.filter(k=>externalImgsOf(k).length||isExternalImg((pages[k]||{}).image));
  if(!withExt.length){ toast('Every selected product already has stored images'); return; }
  const total=withExt.reduce((n,k)=>n+externalImgsOf(k).length,0);
  if(!window.confirm('Copy '+total+' externally-linked image(s) across '+withExt.length+' product(s) into HCPS storage?\n\nThe images stop depending on the manufacturer\u2019s website. Nothing on their site changes. This can take a minute.')) return;
  let copied=0, failed=0, done=0;
  for(const k of withExt){
    done++; toast('Securing images… '+done+'/'+withExt.length);
    const r=await doSecureImages(k,true); copied+=r.copied; failed+=r.failed;
  }
  toast(copied+' image(s) copied into HCPS storage'+(failed?(' · '+failed+' failed'):''), !!failed && !copied);
  render();
}

function fileToB64(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=()=>rej(fr.error||new Error('read failed')); fr.onload=()=>{ const s=String(fr.result||''); const c=s.indexOf(','); res(c>=0?s.slice(c+1):s); }; fr.readAsDataURL(file); }); }
async function uploadImageFile(k,file){
  if(!file) return;
  if(!/^image\//.test(file.type||'')){ toast("That file isn't an image",true); return; }
  if(file.size>6*1024*1024){ toast('Image is over 6MB — resize and try again',true); return; }
  toast('Uploading image…');
  try{
    const content_base64=await fileToB64(file);
    const r=await apiWrite({action:'upload_image',page_key:k,content_base64,content_type:file.type||'image/png',filename:file.name||'image'});
    const out=r.json||{};
    if(!r.ok||!out.ok||!out.url){ toast(out.error||'Upload failed',true); return; }
    pages[k].images_gallery=Array.isArray(pages[k].images_gallery)?pages[k].images_gallery:[];
    const first=!pages[k].images_gallery.length && !pages[k].image;
    pages[k].images_gallery.push({url:out.url,source:'upload',caption:file.name||'',primary:first});
    if(first) pages[k].image=out.url;
    await doSaveContent(k); toast('Image added'); reopen(k);
  }catch(e){ toast('Upload failed — '+(e&&e.message||'error'),true); }
}
async function uploadDocFile(k,file){
  if(!file) return;
  if(file.size>6*1024*1024){ toast('File is over 6MB — upload a smaller copy or paste a link',true); return; }
  toast('Uploading document…');
  try{
    const content_base64=await fileToB64(file);
    const r=await apiWrite({action:'upload_file',page_key:k,content_base64,content_type:file.type||'application/octet-stream',filename:file.name||'document'});
    const out=r.json||{};
    if(!r.ok||!out.ok||!out.url){ toast(out.error||'Upload failed',true); return; }
    pages[k].documents=Array.isArray(pages[k].documents)?pages[k].documents:[];

/* ---- Add a size run in one pass -------------------------------------------------
   Adding sizes one SKU at a time is the single most repeated action on this screen, and
   the codes being typed already exist in the catalog — they are the unassigned prices
   Price Check is complaining about. So the work is really selection, not data entry:
   show the catalog codes that look like siblings of what this product already has, and
   let a whole size run be claimed at once. The typed list stays for everything else. */
let _sizeAdd=null;

// Everything the catalog holds for this manufacturer that no product record claims.
function unclaimedCatalog(cat){
  const claimed=new Set();
  Object.keys(pages).forEach(x=>{ if(pages[x].is_parent) return;
    skusOf(x).forEach(sk=>{ const c=String(sk.sku||'').trim(); if(c) claimed.add(c.toUpperCase()); }); });
  const ov=cat.overrides||{}; const out=[]; const seen=new Set();
  const push=(pr,kind)=>{ const code=String(pr.code||'').trim(); if(!code) return;
    const U=code.toUpperCase(); if(claimed.has(U)||seen.has(U)) return; seen.add(U);
    const o=ov[code]||{};
    if(o.disposition) return;                       // already answered for, elsewhere
    const price=[o.base_price,pr.base_price].find(v=>v!=null&&v!=='');
    out.push({code,name:String(o.name||pr.name||''),price:(price!=null?Number(price):null),kind}); };
  (cat.products||[]).forEach(p=>push(p,'catalog'));
  (cat.custom||[]).forEach(p=>push(p,'added'));
  return out;
}
// Longest shared opening run — how sibling SKUs in a size range actually look.
function lcpLen(a,b){ a=String(a).toUpperCase(); b=String(b).toUpperCase();
  let i=0; while(i<a.length&&i<b.length&&a[i]===b[i]) i++; return i; }
const SA_SIZE_WORDS=/\b(XXX-?LARGE|XX-?LARGE|X-?LARGE|X-?SMALL|SMALL|MEDIUM|LARGE|UNIVERSAL|ONE SIZE|XXXL|XXL|XL|XS|2XL|3XL|4XL)\b/i;
function guessSize(name){
  const t=String(name||'').trim(); if(!t) return '';
  const tail=t.indexOf(',')>=0 ? t.slice(t.lastIndexOf(',')+1).trim() : '';
  const m=(tail||t).match(SA_SIZE_WORDS); if(m) return m[0];
  // Stockinette and tape are sized by width — "Synthetic Stockinette, 4\"" — so a short
  // trailing segment is the size even when it is not a word.
  if(tail && tail.length<=14 && /[0-9]/.test(tail)) return tail;
  return '';
}
const SA_STOP=new Set(['the','and','with','for','ovation','pro','premium','a','of','in','w']);
function nameWords(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').split(/\s+/)
  .filter(w=>w.length>2&&!SA_STOP.has(w)); }
/* Why a candidate is offered, and how strongly. A shared SKU stem with a short differing
   tail is what a size range looks like; a shared product name is the fallback for lines
   whose numbering carries no pattern at all. */
function sizeCandidates(k,pool){
  const mine=skusOf(k).map(x=>String(x.sku||'')).filter(Boolean);
  const pname=new Set(nameWords((pages[k]||{}).name));
  const out=[];
  pool.forEach(c=>{
    let best=0, why='';
    mine.forEach(m=>{
      const L=lcpLen(m,c.code);
      if(L<3) return;
      const tailA=m.length-L, tailB=c.code.length-L;
      if(tailA>4||tailB>4) return;                  // 733-002PRP vs 733-002-PRPSHOE is NOT a size
      const score=L*10-(tailA+tailB);
      if(score>best){ best=score; why='matches '+m; }
    });
    if(!best && pname.size){
      /* Names only, for lines whose numbering carries no pattern. Compare the HEAD of the
         catalog name — everything before the first comma — because manufacturers write
         "Product, size, colour, spec" and only the head is the product's identity.
         Sharing words is not enough: the pressure relief PAD and the post-op SHOE WITH a
         pressure relief pad share every word of the shorter name, are three digits apart,
         and are different products at different prices. So the head must also add almost
         nothing of its own — one word, for a colour or a variant. */
      const head=String(c.name||'').split(',')[0];
      const hw=nameWords(head);
      const shared=hw.filter(w=>pname.has(w));
      const extra=hw.filter(w=>!pname.has(w)&&!SA_SIZE_WORDS.test(w));
      if(shared.length>=2 && extra.length<=1){
        best=shared.length; why='name matches “'+shared.slice(0,3).join(' ')+'”'; }
    }
    if(best) out.push(Object.assign({},c,{_score:best,_why:why,_size:guessSize(c.name)}));
  });
  return out.sort((a,b)=>b._score-a._score||a.code.localeCompare(b.code));
}

async function doSizeAdd(){
  const A=_sizeAdd; if(!A) return;

    rows.push({sku:code,name:c.name||'',size:guessSize(c.name)}); });
  // Pasted lines: SKU first, then an optional size, then an optional name.
  const txt=(document.getElementById('sa-txt')||{}).value||'';
  String(txt).split(/\r?\n/).forEach(l=>{ const t=l.trim(); if(!t) return;
    const parts=t.split(',').map(x=>x.trim());
    const sku=parts[0]; if(!sku) return;
    if(rows.some(r=>r.sku===sku)) return;
    rows.push({sku,size:parts[1]||'',name:parts.slice(2).join(', ')||''}); });
  const fresh=rows.filter(r=>!have.has(r.sku));
  if(!fresh.length){ toast(rows.length?'Those SKUs are already on this product':'Nothing selected',true); return; }
  document.getElementById('overlay').classList.remove('show');
  toast('Adding '+fresh.length+' SKU'+(fresh.length===1?'':'s')+'…');
  let added=0; const failed=[];
  for(const r of fresh){
    const res=await apiWrite({action:'set_sku',page_key:k,sku:r.sku,create:true,patch:{name:r.name,size:r.size}});
    if(res.ok&&(!res.json||res.json.ok!==false)){ added++;
      pages[k].skus=[...skusOf(k), normSku({sku:r.sku,name:r.name,size:r.size})]; }
    else failed.push(r.sku);
  }
  pages[k].sku_count=skusOf(k).length;
  _sizeAdd=null; render();
  toast(added+' SKU'+(added===1?'':'s')+' added'+(failed.length?(' · '+failed.length+' failed: '+failed.slice(0,4).join(', ')):''),!!failed.length);
}

/* ---- Delete a whole product record (duplicates / stubs). Undoable from History; blocked on published. ---- */
/* Bulk delete — for clearing out a bad import run. Same guards as single delete: live products
   are refused (change their status first), orderable catalog items are never touched, and every
   removal is logged so it can be undone from History. Typed confirmation because it's bulk. */
async function doBulkDelete(){
  const keys=[...selProducts].filter(k=>pages[k]);
  if(!keys.length){ toast('Nothing selected',true); return; }
  const live=keys.filter(k=>PUBLIC_SET.has((pages[k]||{}).status));
  const del=keys.filter(k=>!PUBLIC_SET.has((pages[k]||{}).status));
  if(!del.length){
    window.alert(live.length+' selected product(s) are live on Partner 360.\n\nSet them to Hidden or Discontinued first — bulk delete never removes a live product.');
    return; }

function pmoney(n){ if(n==null||n===''||!isFinite(Number(n))) return '—'; return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function firstNum(){ for(let i=0;i<arguments.length;i++){ const v=arguments[i]; if(v!=null&&v!==''){ const n=Number(v); if(isFinite(n)) return n; } } return null; }

let PRICE_MARKUP=2.0;   // default auto-MSRP multiplier (100% over the dealer price)
let _priceState=null, _priceSel=new Set();

function buildPriceState(cat){
  const std={}, custom={}, ov=cat.overrides||{};
  (cat.products||[]).forEach(p=>{ std[String(p.code)]=p; });
  (cat.custom||[]).forEach(p=>{ custom[String(p.code)]=p; });
  const allCodes=new Set([...Object.keys(std),...Object.keys(custom)]);
  function recOf(code){ code=String(code); const b=std[code], c=custom[code], o=ov[code]||{};
    const base_price=firstNum(o.base_price, c&&c.base_price, b&&b.base_price);
    const msrp=firstNum(o.msrp, c&&c.msrp, b&&b.msrp);
    const map=firstNum(o.map, c&&c.map);
    const msrp_auto=(o.msrp_auto!=null)?!!o.msrp_auto:(c?!!c.msrp_auto:false);
    const active=(o.active===false)?false:(c?(c.active!==false):true);
    const name=o.name||(c&&c.name)||(b&&b.name)||'';
    const category=o.category||(c&&c.category)||(b&&b.category)||'';
    const updated=o._updated_at||(c&&c.updated_at)||null;
    // A recorded decision that this code is deliberately not listed. Held on the
    // override layer, so it survives a re-import and travels with the code.
    const disposition=o.disposition||null, disposition_note=o.disposition_note||null, disposition_at=o.disposition_at||null;
    const layers=[];
    if(b&&b.base_price!=null&&b.base_price!=='') layers.push({src:'base',price:Number(b.base_price)});
    if(c&&c.base_price!=null&&c.base_price!=='') layers.push({src:'custom',price:Number(c.base_price)});
    if(o.base_price!=null&&o.base_price!=='') layers.push({src:'override',price:Number(o.base_price)});
    const source=(o.base_price!=null&&o.base_price!=='')?'override':((c&&c.base_price!=null&&c.base_price!=='')?'custom':((b&&b.base_price!=null)?'base':(c?'custom':'base')));
    /* An override price IS a decision: it is the number dealers read, so once one
       exists the layers below it no longer leave anything ambiguous. merged_at records
       that a base+custom duplicate was deliberately reconciled rather than merely priced. */
    const settled=(o.base_price!=null&&o.base_price!=='');
    const merged_at=o.merged_at||null;
    /* The ladder dealers are actually charged at, resolved through the same layer order
       as the base price: an override wins, then the custom row, then the base catalog.
       Without it here, an import could not show what the breaks are today, and so could
       not tell a changed ladder from an unchanged one. */
    const tiers=piTierList(o.tiers!=null?o.tiers:((c&&c.tiers)||(b&&b.tiers)||null));
    return {code,name,category,base_price,msrp,map,msrp_auto,active,updated,layers,source,tiers,
      disposition,disposition_note,disposition_at,settled,merged_at,
      editTarget:c?'custom':'base', isBase:!!b, isCustom:!!c, duplicate:!!(b&&c)};
  }
  const byLen=[...allCodes].sort((a,b)=>b.length-a.length);
  function nearMatch(code){ code=String(code);
    for(const c of byLen){ if(c!==code && code.length>c.length && code.indexOf(c)===0 && c.length>=3) return c; }
    const stripped=code.replace(/(RED|GREY|GRAY|BLACK|BLUE|WHITE|BEIGE|TAN)$/i,'');
    if(stripped!==code && allCodes.has(stripped)) return stripped;
    return null;
  }
  const content=[]; const assigned=new Set();
  Object.keys(pages).forEach(k=>{ const p=pages[k]; if(p.is_parent) return;
    skusOf(k).forEach(s=>{ const code=String(s.sku||'').trim(); if(!code) return; assigned.add(code);
      content.push({code,pk:k,product:p.name||k,family:p.family||'',category:p.category||'',subcategory:p.subcategory||'',
        status:s.status||'active',disabled:(!!s.disabled||!!p.disabled),size:s.size||''}); }); });
  const missingPrice=[], mismatch=[], notInCat=[], needsMsrp=[], discWithPrice=[], outdated=[], decidedLive=[];
  const now=Date.now(), YEAR=365*24*3600*1000;
  content.forEach(cs=>{
    if(!allCodes.has(cs.code)){ const nm=nearMatch(cs.code);
      if(nm){ const r=recOf(nm); mismatch.push(Object.assign({},cs,{baseCode:nm,basePrice:r.base_price,baseMsrp:r.msrp,baseMap:r.map})); }
      else notInCat.push(cs);
      return; }
    const r=recOf(cs.code);
    /* A decision applies wherever the code appears. If a live SKU has been recorded
       as not-listed, it is not an outstanding pricing gap either — it leaves every
       queue and shows up under the resolved heading with the rest of the decisions. */
    if(r.disposition){ decidedLive.push(r); return; }
    if(r.base_price==null||r.base_price<=0){ missingPrice.push(Object.assign({},cs,{rec:r})); return; }
    const off=(cs.disabled||cs.status==='discontinued'||cs.status==='hidden');
    if(off) discWithPrice.push(Object.assign({},cs,{rec:r}));
    if(!off && (r.msrp==null||r.msrp<=0)) needsMsrp.push(Object.assign({},cs,{rec:r}));
    if(!off && r.updated && (now-Date.parse(r.updated))>YEAR) outdated.push(Object.assign({},cs,{rec:r}));
  });
  // Base codes that anchor a matched variant (e.g. 10102 for 10102RED/GREY) are pricing anchors,
  // not truly "unassigned" — keep them out of the orphan queue.
  const anchorCodes=new Set(mismatch.map(m=>m.baseCode));
  /* The same idea one step further on. mismatch covers a colour SKU the catalog has never
     heard of; this covers the ordinary case where BOTH exist — the manufacturer's bare
     part number carries the price, the colour SKUs are what dealers order, and the bare
     code has no live SKU of its own. That is a pricing anchor, not an orphan. Calling it
     an error asked for twenty decisions that all had the same answer: leave it alone. */
  const liveCodes=[...assigned];
  const anchors=[];
  allCodes.forEach(code=>{ if(assigned.has(code)||anchorCodes.has(code)) return;
    const kids=piColorKids(code,liveCodes); if(!kids.length) return;
    const r=recOf(code); if(!(r.base_price!=null&&r.base_price>0)) return;
    anchors.push(Object.assign({},r,{kids,kidPrices:[...new Set(kids.map(k=>{
      const kr=allCodes.has(k)?recOf(k):null; return kr?kr.base_price:null; }))]}));
  });
  const anchorSet=new Set(anchors.map(a=>a.code));
  /* A dispositioned code is a DECISION, not an outstanding problem. It leaves the
     unassigned queue and stops counting against the score — which is the whole point:
     a manufacturer sheet always contains codes HCPS will never list, and without this
     Price Check could never honestly read 100%. They are still listed, under their
     own heading, so the decision stays visible and can be undone. */
  const orphans=[], resolved=[];
  allCodes.forEach(code=>{ if(assigned.has(code)||anchorCodes.has(code)||anchorSet.has(code)) return; const r=recOf(code);
    if(!(r.base_price!=null&&r.base_price>0)) return;
    (r.disposition ? resolved : orphans).push(r); });
  decidedLive.forEach(r=>{ if(!resolved.some(x=>x.code===r.code)) resolved.push(r); });
  /* A conflict is only outstanding while nothing has settled it. Writing an override
     price is the settlement — that value is what Partner 360 serves, whatever the layers
     underneath still say — so a settled code leaves both queues. Without this the "Use $X"
     button appeared to do nothing: the row was rewritten and then flagged again. */
  const conflicts=[]; allCodes.forEach(code=>{ const r=recOf(code); if(r.disposition||r.settled) return;
    if([...new Set(r.layers.map(l=>l.price))].length>1) conflicts.push(r); });
  const dupes=[]; allCodes.forEach(code=>{ const r=recOf(code);
    if(r.disposition||r.settled||r.merged_at) return; if(r.duplicate) dupes.push(r); });
  let denom=0, ok=0;
  content.forEach(cs=>{ if(cs.disabled) return;
    const r=allCodes.has(cs.code)?recOf(cs.code):null;
    if(r&&r.disposition) return;               // deliberately not listed — not a gap
    denom++; if(r&&r.base_price>0) ok++; });
  return {recOf, allCodes, content, assigned, missingPrice, mismatch, notInCat, needsMsrp,
    discWithPrice, outdated, orphans, resolved, conflicts, dupes, anchors, liveCodes,
    score:(denom?Math.round(ok/denom*100):0), denom, ok};
}

const PA_DISPO={archived:'Removed',do_not_list:'Confirmed – do not list',discontinued:'Discontinued',not_offered:'Not offered by HCPS',ignore:'Ignored price record'};
/* Reasons are bookkeeping; getting the thing off the shelf is the job. So the queue has
   one button and no menu, and the reason can be stated afterwards from the resolved list
   — where there is time to care — or left as "Removed", which claims nothing untrue. */
const PA_REASONS=[['archived','Removed'],['discontinued','Discontinued — manufacturer no longer makes it'],
  ['not_offered','Not offered by HCPS — still made, we do not carry it'],
  ['do_not_list','Confirmed – do not list — we could carry it, we choose not to'],
  ['ignore','Ignore this price record — junk row, item stays active']];

/* Record (or clear) a decision that HCPS will not list a priced code. Written to the
   override layer, so it rides with the code and survives the next price-list import —
   re-importing the manufacturer's sheet will not quietly resurrect something we have
   already decided against. */
/* Three of the four decisions mean "this is not something a dealer can buy from us", and
   one — Ignore — means only "stop asking me about this price row". They were all written
   the same way: a disposition and nothing else. But Partner 360 hides a product on
   active===false, NOT on disposition, so a record marked Discontinued stayed orderable
   the moment anything else made it visible. The three real removals now go through
   retire_sku, which sets both and is reversible; Ignore still only annotates. */

/* One click, one confirm, done. "Removed" is the honest default: the record is off the
   shelf and the reason has not been claimed. */
async function paRemove(code){

    +'It stops being listed or sold on Partner 360 and moves to the Resolved list, where you can undo it.\n\n'
    +'Its price, images and order history are kept.')) return;

// Refine why, after the fact, from the resolved list. The record is already inactive;

    ? await catalogPost({action:'save_override',manufacturer:MFR,code,patch:{disposition:'ignore',

async function paDispose(code,val,el){

/* Settle a conflict by writing the winning value as an override — the layer dealers
   actually read. Picking a value here is what "the override wins" means in practice. */
async function paSettle(code,val){
  const v=Number(val); if(!isFinite(v)) return;
  if(!window.confirm('Make '+pmoney(v)+' the dealer price for '+code+'?\n\nWritten as an override, so it wins over the base file and any added product.')) return;
  const r=await catalogPost({action:'save_override',manufacturer:MFR,code,patch:{base_price:v}});
  if(r.ok&&r.json&&r.json.ok!==false){ toast(code+' set to '+pmoney(v)); openPriceAudit(); }
  else toast((r.json&&r.json.error)||'Could not set that price',true);

async function paSettleManual(code){
  const S=_priceState; const cur=S?S.recOf(code):null;
  const v=window.prompt('Dealer price for '+code+':', cur&&cur.base_price!=null?String(cur.base_price):'');
  if(v==null||String(v).trim()==='') return;
  const n=Number(String(v).replace(/[^0-9.\-]/g,''));
  if(!isFinite(n)||n<0){ toast('That is not a price',true); return; }
  return paSettle(code,n);

/* ---- Imported pricing that DISAGREES with what we already have ----------------
   An import that silently overwrites existing pricing is how a wrong number reaches
   dealers. So a row whose price differs from the record we hold is not applied — it is
   parked in a review queue, held per manufacturer so it survives a refresh, and cleared
   one decision at a time. Rows that are new, or that match what we have, still apply
   straight through: only genuine disagreements ask for a person. ---------------- */
function piqKey(){ return 'pcr_priceq_'+MFR; }
function piqLoad(){ try{ const a=JSON.parse(localStorage.getItem(piqKey())||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function piqSave(a){ try{ localStorage.setItem(piqKey(), JSON.stringify((a||[]).slice(0,3000))); }catch(e){} }
function piqDrop(code){ piqSave(piqLoad().filter(r=>String(r.code)!==String(code))); }
function piqAdd(rows){
  const by={}; piqLoad().forEach(r=>{ by[String(r.code)]=r; });
  (rows||[]).forEach(r=>{ by[String(r.code)]=r; });   // a newer file supersedes an older queued row
  piqSave(Object.keys(by).map(k=>by[k]));
}
/* What counts as a disagreement: the file states a value AND we hold a different one.
   A blank in the file is not a claim that the price is blank, and a value we simply
   don't have yet is an addition, not a conflict. */
function piqDiff(row, rec){
  const out=[]; if(!rec) return out;
  [['base_price','Dealer cost'],['map','MAP'],['msrp','MSRP']].forEach(([k,label])=>{
    const nv=row[k], cv=rec[k];
    if(nv==null||nv==='') return;
    if(cv==null||cv==='') return;
    if(Number(cv)===Number(nv)) return;
    out.push({key:k,label,from:Number(cv),to:Number(nv)});
  });
  /* A ladder that differs is a price change even when the qty-1 price is identical —
     most of a dealer's spend sits on the breaks, so a silent ladder swap moves more
     money than a moved base price. Compared as a whole: a break added, removed or
     re-pointed all count. */
  if(row.tiers&&row.tiers.length&&piTierDiffers(row.tiers,rec.tiers)){
    out.push({key:'tiers',label:'Quantity breaks',
      text_from:piTierText(rec.tiers),text_to:piTierText(row.tiers)});
  }
  return out;
}
async function piqAccept(code){
  const q=piqLoad().find(r=>String(r.code)===String(code)); if(!q) return;
  const r=await catalogPost({action:'bulk_price',manufacturer:MFR,rows:[Object.assign({},q,{create:false})]});
  if(r.ok&&r.json&&r.json.ok!==false){ piqDrop(code); toast(code+' updated from the file'); openPriceAudit(); }
  else toast((r.json&&r.json.error)||'Could not apply that price',true);
}
function piqKeep(code){ piqDrop(code); toast(code+' — kept our price'); openPriceAudit(); }
async function piqEdit(code){
  const q=piqLoad().find(r=>String(r.code)===String(code)); if(!q) return;
  const S=_priceState, cur=S?S.recOf(code):null;
  const v=window.prompt('Dealer price for '+code+':\n\nOurs: '+pmoney(cur&&cur.base_price)+'   ·   File: '+pmoney(q.base_price),
    q.base_price!=null?String(q.base_price):(cur&&cur.base_price!=null?String(cur.base_price):''));
  if(v==null||String(v).trim()==='') return;
  const n=Number(String(v).replace(/[^0-9.\-]/g,''));
  if(!isFinite(n)||n<0){ toast('That is not a price',true); return; }
  const r=await catalogPost({action:'save_override',manufacturer:MFR,code,patch:{base_price:n,source_file:q.source_file||'',effective_date:q.effective_date||''}});
  if(r.ok&&r.json&&r.json.ok!==false){ piqDrop(code); toast(code+' set to '+pmoney(n)); openPriceAudit(); }
  else toast((r.json&&r.json.error)||'Could not set that price',true);
}
async function piqAcceptAll(){
  const q=piqLoad(); if(!q.length) return;
  if(!window.confirm('Apply all '+q.length+' imported price(s) over what we currently hold?\n\nThis is what dealers will pay.')) return;
  const r=await catalogPost({action:'bulk_price',manufacturer:MFR,rows:q.map(x=>Object.assign({},x,{create:false}))});
  if(r.ok&&r.json&&r.json.ok!==false){ piqSave([]); toast('Applied '+((r.json.applied||0)+(r.json.created||0))+' price(s)'); openPriceAudit(); }
  else toast((r.json&&r.json.error)||'Import failed',true);
}
function piqKeepAll(){
  const n=piqLoad().length; if(!n) return;
  if(!window.confirm('Discard all '+n+' imported price(s) and keep what we have?')) return;
  piqSave([]); toast('Kept our pricing'); openPriceAudit();
}

/* ---- Merge a duplicate ---------------------------------------------------------
   The same code existing as both a catalog product and an added product is not just a
   price disagreement — two records describe one SKU. Merging writes the surviving
   values as an override (the layer dealers read) and stamps merged_at, so the pair is
   recorded as reconciled rather than quietly re-flagged on the next check. -------- */
async function paMerge(code){
  const S=_priceState, r=S?S.recOf(code):null; if(!r) return;
  const prices=[...new Set(r.layers.map(l=>l.price))];
  const pick=window.prompt('"'+code+'" exists as both a catalog product and an added product.\n\n'
    +r.layers.map(l=>'  '+l.src+': '+pmoney(l.price)).join('\n')
    +'\n\nWhich dealer price should survive? (it is written as an override, so it wins everywhere)',
    String(prices[prices.length-1]!=null?prices[prices.length-1]:(r.base_price||'')));
  if(pick==null||String(pick).trim()==='') return;
  const n=Number(String(pick).replace(/[^0-9.\-]/g,''));
  if(!isFinite(n)||n<0){ toast('That is not a price',true); return; }
  const patch={base_price:n, merged_at:new Date().toISOString()};
  if(r.msrp!=null) patch.msrp=r.msrp;
  if(r.map!=null) patch.map=r.map;
  const res=await catalogPost({action:'save_override',manufacturer:MFR,code,patch});
  if(res.ok&&res.json&&res.json.ok!==false){ toast(code+' merged at '+pmoney(n)); openPriceAudit(); }
  else toast((res.json&&res.json.error)||'Could not merge that record',true);
}

/* Correct a SKU that is simply wrong on our side — a formatting difference, a typo, a
   code the manufacturer has since changed. Renaming carries the price with it, which is
   what makes the row disappear from the unassigned queue for the right reason rather
   than being papered over with a duplicate. */
async function paFixSku(code){
  const S=_priceState; const cur=S?S.recOf(code):null; if(!cur) return;
  const to=window.prompt('This price is filed under "'+code+'".\n\nWhat is the correct SKU?\n(The price, MSRP and MAP move with it.)', code);
  if(!to||String(to).trim()===code) return;
  const newCode=String(to).trim();
  if(S.allCodes.has(newCode)&&!window.confirm(newCode+' already exists in the catalog. Continue and let the existing record keep its own price?')) return;
  const r=await catalogPost({action:'rename_code',manufacturer:MFR,old_code:code,new_code:newCode,
    product:{name:cur.name,category:cur.category,base_price:cur.base_price,msrp:cur.msrp,map:cur.map}});
  if(r.ok&&r.json&&r.json.ok!==false){ toast(code+' → '+newCode); openPriceAudit(); }
  else toast((r.json&&r.json.error)||'Could not rename that SKU',true);
}

function paChip(n,label,color){ return `<span class="pachip" style="${n?('background:'+(color||'#fdecec')+';border-color:'+(color?'#e3caa0':'#f0c7c7')):''}">${n} ${esc(label)}</span>`; }

        <button class="btn" data-act="price-import">⬆ Import pricelist</button>
        <button class="btn" data-act="dealer-price-preview">👁 Preview as dealer</button>
        <button class="btn" data-act="price-refresh">↻ Re-check</button>
      </div>
    </div>
    <div class="pa-chips">
      ${paChip(S.missingPrice.length,'live · no price')}

      ${paChip(S.conflicts.length,'conflict')}
      ${paChip(S.dupes.length,'duplicate')}
      ${(function(){const n=piqLoad().length; return n?paChip(n,'imported · to review','#fff4d6'):'';})()}

    ${mmArr.length?`<div class="pa-sec"><h3>Code mismatches — pricing exists under a base code (${mmArr.reduce((n,g)=>n+g.codes.length,0)} SKU${mmArr.reduce((n,g)=>n+g.codes.length,0)===1?'':'s'})</h3>
      <p class="mut">These live SKUs aren't in the catalog, but a matching base code IS priced (e.g. <b>11102RED → 11102</b>). Assign the base price to each variant so every color/side becomes orderable.</p>
      ${tbl(['Product','Base code','Base price','Variant SKUs','Action'], mmArr.map((g,i)=>`<tr>
        <td>${esc(g.product)}</td><td><b>${esc(g.baseCode)}</b></td><td>${pmoney(g.basePrice)}</td>

    ${S.missingPrice.length?`<div class="pa-sec"><h3>Live but missing a price (${S.missingPrice.length})</h3>

      ${tbl(['Product','SKU(s)'], Object.entries(grpProd(S.missingPrice)).map(([pn,codes])=>`<tr><td>${esc(pn)}</td><td class="mut" style="font-size:11px">${codes.map(esc).join(', ')}</td></tr>`).join(''))}

    ${S.orphans.length?`<div class="pa-sec"><h3>Unassigned pricing — priced but on no live SKU (${S.orphans.length})</h3>
      <p class="mut">A price exists in the catalog for these codes, but no product here uses them. Three ways to clear each one:

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
          <button class="btn dark" style="padding:4px 10px" onclick="piqAcceptAll()">Accept all ${q.length} new price(s)</button>
          <button class="btn ghost" style="padding:4px 10px" onclick="piqKeepAll()">Keep all current</button>
        </div>
        ${tbl(['Code','Current (HCPS)','New (manufacturer)','Source file','Effective','Decision'], rows)}
        ${q.length>400?`<p class="mut">Showing the first 400 of ${q.length}.</p>`:''}
      </div>`;
    })()}

/* ---- Pricelist importer ---- */
/* ═══ PRICE LIST IMPORTER ══════════════════════════════════════════════════════
   Upload → map columns → preview → apply. XLSX, CSV or a paste all end up in the
   same place: a header row plus data rows, which the mapping step then interprets.

   Columns are GUESSED, never assumed. A manufacturer sheet might label dealer cost
   "Dealer", "Your Cost", "DLR", or "Net" — so the guess is a starting point the
   admin confirms, and a wrong guess is one dropdown away from right rather than a
   silently mispriced catalog. */
const PI_FIELDS=[
  {key:'code',  label:'SKU / item code', required:true,
   hints:['code','sku','item','item #','item no','part','part #','part number','model','model #','catalog','catalog #']},
  {key:'name',  label:'Product name',    hints:['name','description','product','item description','desc']},
  {key:'base_price', label:'Dealer cost', hints:['dealer','dealer price','dealer cost','cost','net','net price','your price','your cost','wholesale','base','base price','price','dlr']},
  {key:'map',   label:'MAP',             hints:['map','map price','min advertised','minimum advertised','minimum advertised price']},
  {key:'msrp',  label:'MSRP',            hints:['msrp','retail','list','list price','suggested retail','srp','msrp price']},
  {key:'case_qty', label:'Case quantity',hints:['case','case qty','case quantity','qty per case','pack','pack qty','uom qty','units per case']},
  {key:'effective_date', label:'Effective date', hints:['effective','effective date','eff date','price date','date','valid from']},
];
/* ── Colour variants ────────────────────────────────────────────────────────────
   Ovation — and most manufacturers — price a bare part number (10002). HCPS sells the
   colour SKU (10002BLUE). Partner 360 already knows this: a colour SKU with no price of
   its own falls back to its base part number. Two places here have to know it too, or the
   bare code looks like an error and the price list never reaches the SKUs dealers buy.

   The tail must be the WHOLE remainder and a colour word, so 10002 claims 10002BLUE and
   never 100021. */
const PI_COLOR_TAIL=/^[-_ ]?(BLUE|RED|GREY|GRAY|BLACK|WHITE|PINK|TAN|NAVY|GREEN|PURPLE|ORANGE|BEIGE|BK|WH|PK|DB|BL|GY|RD|NV|TN)$/i;
function piIsColorOf(base,code){
  const b=String(base||'').toUpperCase(), c=String(code||'').toUpperCase();
  if(!b||!c||c===b||!c.startsWith(b)) return false;
  return PI_COLOR_TAIL.test(c.slice(b.length));
}
// the live SKUs that inherit from this base part number
function piColorKids(code, liveCodes){
  const out=[]; (liveCodes||[]).forEach(c=>{ if(piIsColorOf(code,c)&&out.indexOf(c)<0) out.push(c); });
  return out;
}

/* ── Quantity breaks ────────────────────────────────────────────────────────────
   A manufacturer's price list holds the ladder as COLUMNS — "2-5", "6-10", "11-20",
   "21+" — one price per break, not one row per break. So a tier slot is a pair: which
   column holds the price, and the quantity that price starts at. The quantity is
   guessed from the header and stays editable, because the break points are the part
   manufacturers move most often and a wrong one silently mis-prices every order at
   that quantity — the kind of error nobody sees until a dealer is billed. */
const PI_TIERS=[{key:'t1'},{key:'t2'},{key:'t3'},{key:'t4'},{key:'t5'},{key:'t6'}];
let _piTierCol={}, _piTierMin={};

// normalise any stored ladder to [{min_qty,price}] ascending — the shape Partner 360 reads
function piTierList(t){ if(!Array.isArray(t)) return [];
  return t.map(x=>({min_qty:Math.max(1,parseInt(x.min_qty!=null?x.min_qty:(x.minQty!=null?x.minQty:1),10)||1),
                    price:(x.price==null||x.price==='')?null:Number(x.price)}))
    .filter(x=>x.price!=null&&isFinite(x.price)).sort((a,b)=>a.min_qty-b.min_qty); }
function piTierText(t){ const l=piTierList(t); return l.length?l.map(x=>x.min_qty+'+ '+pmoney(x.price)).join(' · '):'—'; }
// true when the two ladders are not the same ladder — a break added, dropped, repriced
// or moved to a different quantity all count.
function piTierDiffers(a,b){ const x=piTierList(a), y=piTierList(b);
  if(x.length!==y.length) return true;
  return !x.every((t,i)=>t.min_qty===y[i].min_qty&&Math.abs(Number(t.price)-Number(y[i].price))<0.005); }
// "qty 6", "6-10", "11 - 20", "21+", "6 or more" → 6, 11, 21 …
function piTierMinFromHeader(h){ const s=String(h||'').toLowerCase();
  let m=s.match(/qty[^0-9]{0,6}(\d+)/); if(m) return parseInt(m[1],10);
  m=s.match(/(\d+)\s*(?:[-\u2013\u2014]\s*\d+|\+|\s*or\s*(?:more|up)|\s*and\s*(?:up|over))/); if(m) return parseInt(m[1],10);
  m=s.match(/^\s*(\d+)\s*$/); if(m) return parseInt(m[1],10);
  return null; }
function piIsTierHeader(h){ const s=String(h||'').trim().toLowerCase();
  if(!s) return false;
  if(/case|pack|uom/.test(s)) return false;          // that is case quantity, not a break
  if(/tier|break|qty|quantity|\bea\b/.test(s)) return true;
  return /^\d+\s*(?:[-\u2013\u2014]\s*\d+|\+)$/.test(s); }

let _piGrid=null, _piMap={}, _piRows=[], _piFile='';

  modalHTML('⬆ Import pricelist · '+esc(MFR), `<div class="tut">

         ondrop="piDropFile(event,this)">
      <input type="file" id="pi-file" accept=".xlsx,.xls,.csv,.tsv,.txt" style="display:none" onchange="piPickFile(event)">
