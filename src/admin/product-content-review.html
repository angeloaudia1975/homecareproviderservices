/* The box carried the dropzone class — dashed border, pointer cursor, the whole visual
   grammar of "drop a file here" — with no drop handler and no click target except the
   small button inside it. Dropping did nothing and clicking the box did nothing, which
   is indistinguishable from the page refusing the file. Both now do what they look like
   they do. */
function piDropFile(ev,el){
  ev.preventDefault(); if(el) el.classList.remove('drag');
  const f=((ev.dataTransfer&&ev.dataTransfer.files)||[])[0]; if(!f) return;
  piPickFile({target:{files:[f]}});
}
function piPickFile(ev){
  const f=(ev.target.files||[])[0]; if(!f) return;
  _piFile=f.name;
  const prev=document.getElementById('pi-prev'); prev.innerHTML='<div class="hint">Reading '+esc(f.name)+'…</div>';
  const isCsv=/\.(csv|tsv|txt)$/i.test(f.name);
  loadXlsx().then(XLSX=>{
    const rd=new FileReader();
    rd.onload=e=>{
      try{
        const wb=isCsv ? XLSX.read(String(e.target.result),{type:'string'})
                       : XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const names=wb.SheetNames||[];
        if(!names.length){ prev.innerHTML='<div class="hint">That file has no readable sheets.</div>'; return; }
        window._piWb=wb;
        if(names.length>1){
          prev.innerHTML='<div class="rule">Which sheet holds the price list?</div>'
            +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'
            +names.map(n=>`<button class="btn" onclick="piUseSheet('${escA(n)}')">${esc(n)}</button>`).join('')+'</div>';
        } else piUseSheet(names[0]);
      }catch(err){ prev.innerHTML='<div class="hint">Could not read that file: '+esc(err.message||String(err))+'</div>'; }
    };
    rd.onerror=()=>{ prev.innerHTML='<div class="hint">Could not read that file.</div>'; };
    isCsv ? rd.readAsText(f) : rd.readAsArrayBuffer(f);
  }).catch(e=>{ prev.innerHTML='<div class="hint">'+esc(e.message||'Could not load the spreadsheet reader')+'</div>'; });
}
function piUseSheet(name){
  const XLSX=window.XLSX, wb=window._piWb; if(!XLSX||!wb) return;
  _piGrid=sheetToGrid(XLSX,wb,name);
  if(!_piGrid.headers.length||!_piGrid.rows.length){
    document.getElementById('pi-prev').innerHTML='<div class="hint">That sheet has no usable rows.</div>'; return; }
  piGuessMap(); piRenderMap();
}
function piPasteParse(){
  const txt=(document.getElementById('pi-txt')||{}).value||'';
  const lines=String(txt).split(/\r?\n/).map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim());
  if(lines.length<2){ document.getElementById('pi-prev').innerHTML='<div class="hint">Paste a header row plus at least one data row.</div>'; return; }
  const split=l=>l.indexOf('\t')>=0?l.split('\t'):l.split(',');
  _piFile='pasted rows';
  _piGrid={headers:split(lines[0]).map(h=>h.trim()), rows:lines.slice(1).map(split), sheet:'paste', header_row:1};
  piGuessMap(); piRenderMap();
}
// Best guess per field: exact header match first, then a contains match.
function piGuessMap(){
  const heads=_piGrid.headers.map(h=>String(h||'').trim().toLowerCase());
  _piMap={};
  PI_FIELDS.forEach(f=>{
    let i=heads.findIndex(h=>f.hints.indexOf(h)>=0);
    if(i<0) i=heads.findIndex(h=>h&&f.hints.some(x=>h.indexOf(x)>=0));
    if(i>=0 && Object.values(_piMap).indexOf(i)<0) _piMap[f.key]=i;
  });
  /* Break columns, left to right, skipping anything a named field already claimed —
     the dealer-cost column is itself a quantity break (qty 1) and must not be counted
     twice. A slot with no detected quantity is left blank rather than guessed at 1;
     an unanswered question is safer here than a confident wrong ladder. */
  _piTierCol={}; _piTierMin={};
  const taken=Object.values(_piMap);
  let slot=0;
  heads.forEach((h,i)=>{ if(slot>=PI_TIERS.length) return; if(taken.indexOf(i)>=0) return;
    if(!piIsTierHeader(_piGrid.headers[i])) return;
    const k=PI_TIERS[slot].key; _piTierCol[k]=i; _piTierMin[k]=piTierMinFromHeader(_piGrid.headers[i]); slot++; });
}
function piRenderMap(){
  const prev=document.getElementById('pi-prev'); if(!prev) return;
  const opts=(sel)=>'<option value="-1">— not in this file —</option>'
    +_piGrid.headers.map((h,i)=>`<option value="${i}"${sel===i?' selected':''}>${esc(h)}</option>`).join('');
  const sample=_piGrid.rows.slice(0,3);
  prev.innerHTML=`<div class="rule"><b>${_piGrid.rows.length}</b> row(s) read from <b>${esc(_piGrid.sheet||'file')}</b>${_piGrid.header_row?` · headers on row ${_piGrid.header_row}`:''}. Confirm the columns:</div>
    <table style="width:100%;font-size:12px;margin-top:8px"><tbody>
    ${PI_FIELDS.map(f=>`<tr>
      <td style="width:150px;padding:4px 6px">${esc(f.label)}${f.required?' <span style="color:var(--bad)">*</span>':''}</td>
      <td style="padding:4px 6px"><select class="ed" id="pim-${f.key}" onchange="piRemap()" style="width:100%">${opts(_piMap[f.key]!=null?_piMap[f.key]:-1)}</select></td>
      <td class="mut" style="padding:4px 6px;font-size:11px">${_piMap[f.key]!=null?sample.map(r=>esc(String((r||[])[_piMap[f.key]]||''))).filter(Boolean).slice(0,2).join(' · '):''}</td>
    </tr>`).join('')}
    </tbody></table>
    ${piTierMapHtml(opts,sample)}
    <div id="pi-prev2" style="margin-top:10px"></div>`;
  piRemap();
}
/* The break columns, shown open when the file has any so they are confirmed rather than
   discovered later, and collapsed when it doesn't so a flat price list stays a two-line job. */
function piTierMapHtml(opts,sample){
  const found=PI_TIERS.filter(t=>_piTierCol[t.key]!=null).length;
  const rows=PI_TIERS.map((t,i)=>{ const ci=_piTierCol[t.key];
    return `<tr>
      <td style="width:150px;padding:4px 6px">Break ${i+1}</td>
      <td style="padding:4px 6px"><select class="ed" id="pit-${t.key}" onchange="piRemap()" style="width:100%">${opts(ci!=null?ci:-1)}</select></td>
      <td class="mut" style="padding:4px 6px;font-size:11px;white-space:nowrap">at qty
        <input class="ed" id="pitq-${t.key}" type="number" min="1" step="1" style="width:64px;padding:2px 4px"
               value="${_piTierMin[t.key]!=null?_piTierMin[t.key]:''}" onchange="piRemap()"> or more
        ${ci!=null&&sample.length?`<span style="margin-left:6px">${esc(sample.map(r=>String((r||[])[ci]||'')).filter(Boolean).slice(0,2).join(' · '))}</span>`:''}</td>
    </tr>`; }).join('');
  return `<details style="margin-top:8px"${found?' open':''}>
    <summary class="mut" style="cursor:pointer;font-size:12px">Quantity breaks ${found?`— <b>${found}</b> column(s) detected, confirm the quantity each one starts at`:'— none detected in this file'}</summary>
    <table style="width:100%;font-size:12px;margin-top:6px"><tbody>${rows}</tbody></table>
    <div class="mut" style="font-size:11px;margin-top:4px">A break needs both a column and a quantity. Dealer cost is the qty-1 price and is not a break.</div>

      // explicit price with an inherited one.
      if(seen.has(k.toUpperCase())) return;

const XLSX_VER='0.18.5';

                `https://cdn.jsdelivr.net/npm/xlsx@${XLSX_VER}/dist/xlsx.full.min.js`];
let _xlsxReady=null;
function loadXlsx(){
  if(_xlsxReady) return _xlsxReady;

    if(window.XLSX) return res(window.XLSX);

    // importer down with it.
    let i=0;
    const next=()=>{
      if(i>=XLSX_SRC.length){ rej(new Error('Could not load the spreadsheet reader — check the connection, or use "or paste rows instead" below.')); return; }
      const s=document.createElement('script');
      s.src=XLSX_SRC[i++];
      s.onload=()=>{ if(window.XLSX) res(window.XLSX); else next(); };

  // dropped connection would keep failing after it came back. Clear it and let the

/* Turn any sheet into a header row + data rows. Manufacturer sheets rarely start at A1 —
   there is usually a title, a logo row, maybe a blank line — so the header is found by
   looking for the first row that actually looks like column headings rather than
   assuming row 1. Getting this wrong imports the title row as a product. */
function sheetToGrid(XLSX, wb, sheetName){
  const ws=wb.Sheets[sheetName]; if(!ws) return {headers:[],rows:[]};
  const grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
  const looksHeader=row=>{
    const cells=(row||[]).map(c=>String(c||'').trim()).filter(Boolean);
    if(cells.length<2) return false;
    // A header row is mostly words, not numbers.
    const numeric=cells.filter(c=>/^[$]?[\d,.]+$/.test(c)).length;
    return numeric<=Math.floor(cells.length/2);
  };
  let hi=0;
  for(let i=0;i<Math.min(grid.length,25);i++){ if(looksHeader(grid[i])){ hi=i; break; } }
  const headers=(grid[hi]||[]).map((c,i)=>String(c||'').trim()||('Column '+(i+1)));
  const rows=grid.slice(hi+1).filter(r=>(r||[]).some(c=>String(c||'').trim()!==''));

async function extractPdfPages(file,onProgress){
  const lib=await loadPdfJs(); if(!lib) throw new Error('PDF reader unavailable');
  const buf=await file.arrayBuffer();
  const doc=await lib.getDocument({data:buf}).promise;
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i);
    const tc=await pg.getTextContent();
    pages.push((tc.items||[]).map(x=>x.str).join(' ').replace(/\s+/g,' ').trim());
    if(onProgress) onProgress(i,doc.numPages);
  }

}

    else cur = cur ? (cur+'\n\n'+pg) : pg; }

}

      const res=await fetch('/.netlify/functions/content-scrape',{method:'POST',headers:authHeaders(),body:JSON.stringify({url:u})});
      const j=await res.json().catch(()=>({}));
      if(res.ok&&j.ok&&j.data){ const d=j.data;
        // A Shopify page returns its real variant SKUs and prices — use them so matching keys on
        // SKU (strongest signal) and the created SKUs are the manufacturer's actual codes.
        const vcodes=(Array.isArray(d.variants)?d.variants:[]).map(v=>String(v.sku||'').trim()).filter(Boolean);
        const vprice=(Array.isArray(d.variants)&&d.variants.length&&d.variants[0].price!=null)?Number(d.variants[0].price):null;
        // A manufacturer page shows RETAIL pricing — record it as MSRP. Dealer cost is never
        // scraped; it comes from your pricelist, so an import can't overwrite what dealers pay.
        const ptype=(d.product_type||'').trim();
        const junkCat=/^(product|products|default|general|misc|uncategori[sz]ed)$/i.test(ptype);
        _seCands.push({name:(d.name||'').trim()||u,codes:vcodes,category:junkCat?'':ptype,
          url:d.source_url||u,src:'website'+(d.source==='shopify-json'?' · structured':''),
          msrp:(vprice!=null&&isFinite(vprice))?vprice:null,
          note:(Array.isArray(d.variants)&&d.variants.length>1)?(d.variants.length+' variants: '+d.variants.map(v=>v.title).filter(Boolean).slice(0,4).join(', ')):'',
          data:d}); }
      else _seCands.push({name:u,codes:[],category:'',url:u,src:'website',error:(j&&(j.error||j.message))||'could not read that page'});
    }catch(e){ _seCands.push({name:u,codes:[],category:'',url:u,src:'website',error:'could not reach that page'}); }
    bump();
  }
  await seMatch();
}
function parseCatalogRows(txt){
  const lines=String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean); if(lines.length<2) return [];
  const split=l=>l.indexOf('\t')>=0?l.split('\t'):l.split(',');
  const heads=split(lines[0]).map(h=>h.trim().toLowerCase());
  const idx=ns=>{ for(const n of ns){ const i=heads.indexOf(n); if(i>=0) return i; } return -1; };
  const iC=idx(['code','sku','item','part','part number','item #']), iN=idx(['name','description','product']), iCat=idx(['category','cat']);
  if(iC<0) return [];
  const out=[];
  for(let r=1;r<lines.length;r++){ const c=split(lines[r]); const code=(c[iC]||'').trim(); if(!code) continue;
    out.push({code,name:iN>=0?(c[iN]||'').trim():'',category:iCat>=0?(c[iCat]||'').trim():''}); }
  return out;
}

/* Scraped image arrays have arrived in two shapes over time: plain URL strings, and
   {url}/{src} objects from the JSON-LD path. Anything but a string here ends up as
   [object Object] in an <img src>, which is what broke the Climbing Steps gallery.
   Coerce defensively so the wizard can never store a non-URL again. */
function normScrapedImages(list){
  const out=[], seen=new Set();
  (Array.isArray(list)?list:[]).forEach(x=>{
    let u = (typeof x==='string') ? x : (x && (x.url||x.src||x.contentUrl)) || '';
    u=String(u||'').trim();
    if(!u || u.startsWith('data:')) return;
    if(u.startsWith('//')) u='https:'+u;
    if(!/^https?:\/\//i.test(u) && !u.startsWith('/')) return;
    if(seen.has(u)) return; seen.add(u); out.push(u);
  });
  return out;
}

/* ===================== Catalog Health — final publish validation gate =====================
   One screen per manufacturer: products, SKUs, possible duplicates, missing images/categories,
   unassigned catalog SKUs, content that WON'T render on Partner 360 (unmatched key or not live),
   unpriced SKUs → what's ready vs blocked. "Live" = the tool's published state (PUBLIC_SET);
   Approve = internal, Publish = live. Each number drills into its list. */
function contentMatchIndex(cat){
  const imgKeys=new Set(), groups=new Set(), codes=new Set();
  const addCode=c=>{ c=String(c||'').trim().toUpperCase(); if(c) codes.add(c); };
  (cat.products||[]).forEach(p=>{ const ik=String(p.image||'').split('/').pop().replace(/\.(png|jpe?g|webp)$/i,''); if(ik) imgKeys.add(ik); if(p.group) groups.add(String(p.group)); addCode(p.code); });
  (cat.custom||[]).forEach(p=>{ const ik=String(p.image||'').split('/').pop().replace(/\.(png|jpe?g|webp)$/i,''); if(ik) imgKeys.add(ik); addCode(p.code); });
  return {imgKeys,groups,codes};
}
/* Three ways a content page can reach the dealer page, most reliable first:
   1. SKU — the page lists a part number the catalog also carries. Deterministic, and the only
      one that survives a rename, a re-slug, or a new photo.
   2. variant_group — curated routing for a family that splits into models.
   3. page_key === the catalog image's filename — the original heuristic, kept for older records. */
function willRender(k, idx){
  const sk=skusOf(k)||[];
  for(const s of sk){ const c=String((s&&s.sku)||'').trim().toUpperCase(); if(c && idx.codes && idx.codes.has(c)) return true; }
  if(idx.imgKeys.has(k)) return true;
  const vg=pages[k]&&pages[k].variant_group;
  if(vg){ for(const g of String(vg).split('|')){ if(idx.groups.has(g.trim())) return true; } }
  return false; }
function healthBlockers(k, S, cat, idx, dupeKeys){ const p=pages[k]||{}; const b=[];
  if(!p.image && !(p.images_gallery&&p.images_gallery.length)) b.push('image');
  if(!p.category) b.push('category');
  if(S && skusOf(k).some(s=>{ const r=S.recOf(String(s.sku)); return !(r&&r.base_price>0); })) b.push('price');
  if(cat && idx && !willRender(k,idx)) b.push('won’t render');
  if(dupeKeys&&dupeKeys.has(k)) b.push('duplicate');
  return b; }

  toast('Running catalog health…'); _catalogCache=null; const cat=await catalogGet();
  const S=(cat&&((cat.products||[]).length||(cat.custom||[]).length))?buildPriceState(cat):null;
  const idx=cat?contentMatchIndex(cat):null;
  const keys=Object.keys(pages).filter(k=>!pages[k].is_parent && pages[k].name);
  let skuTotal=0; const byName={}, skuOwner={}, skuCollide={};
  keys.forEach(k=>{ const skus=skusOf(k); skuTotal+=skus.length; const nm=baseToken(pages[k].name);
    (byName[nm]=byName[nm]||[]).push(k);
    skus.forEach(s=>{ const c=String(s.sku); if(skuOwner[c]&&skuOwner[c]!==k){ (skuCollide[c]=skuCollide[c]||new Set()).add(skuOwner[c]); skuCollide[c].add(k); } else skuOwner[c]=k; }); });
  const dupeGroups=Object.keys(byName).filter(nm=>nm&&byName[nm].length>1).map(nm=>byName[nm]);
  const dupeKeys=new Set(); dupeGroups.forEach(a=>a.forEach(k=>dupeKeys.add(k)));

/* Merge duplicate records into one from Catalog Health (uses merge_products; undoable in History).
   Keeps the record with the most SKUs as the survivor so the least work is lost. */
async function healthMerge(keys){
  keys=(Array.isArray(keys)?keys:[]).filter(k=>pages[k]); if(keys.length<2){ toast('Need two records to merge',true); return; }
  const survivor=keys.slice().sort((a,b)=>(skusOf(b).length-skusOf(a).length)||String(a).localeCompare(String(b)))[0];
  const froms=keys.filter(k=>k!==survivor);
  const nm=k=>(pages[k]&&pages[k].name)||k;
  if(!window.confirm('Merge into “'+nm(survivor)+'”?\n\nAbsorbing: '+froms.map(nm).join(', ')+'\n\nAll SKUs and content move onto the surviving record. Undoable from History.')) return;
  const r=await apiWrite({action:'merge_products',into_page_key:survivor,from_page_keys:froms});
  if(r.ok && (!r.json||r.json.ok!==false)){
    toast('Merged '+froms.length+' record(s) into “'+nm(survivor)+'”');
    await boot(); openCatalogHealth();
  } else toast((r.json&&(r.json.message||r.json.error))||'Merge failed',true);
}
/* Say WHY the page can't be reached, not just that it can't. The two causes need different
   fixes: no catalog row at all (add the product to the ordering catalog) vs. a catalog row whose
   codes this page doesn't claim (put the right SKUs on the record). */
function renderBlockReason(k, idx){
  const sk=(skusOf(k)||[]).map(s=>String((s&&s.sku)||'').trim()).filter(Boolean);
  if(!sk.length) return 'this record has no SKUs, so nothing in the catalog can point at it — add its part numbers';
  const missing=sk.filter(c=>!idx.codes.has(c.toUpperCase()));
  if(missing.length===sk.length) return 'none of its SKUs ('+sk.slice(0,4).join(', ')+(sk.length>4?'…':'')+') exist in the ordering catalog yet — the enriched page has no product to attach to';
  return 'won’t match the catalog — the enriched page won’t show';
}
/* Publish guard: warn on blockers before a product goes live. */
async function doPublishGuarded(k){ const p=pages[k]; const quick=[];
  if(!p.image && !(p.images_gallery&&p.images_gallery.length)) quick.push('no image');
  if(!p.category) quick.push('no category');
  let cat=null; try{ cat=await catalogGet(); }catch(e){}
  const S=(cat&&((cat.products||[]).length||(cat.custom||[]).length))?buildPriceState(cat):null;
  const idx=cat?contentMatchIndex(cat):null;
  if(S && skusOf(k).some(s=>{ const r=S.recOf(String(s.sku)); return !(r&&r.base_price>0); })) quick.push('one or more SKUs have no price');
  if(cat && idx && !willRender(k,idx)) quick.push(renderBlockReason(k,idx));
  if(quick.length){ if(!window.confirm('“'+(p.name||k)+'” has issues that affect the dealer page:\n\n• '+quick.join('\n• ')+'\n\nPublish live anyway?')) return; }
  return doStatus(k,'published');
}

function qScoreRows(k, priceInfo){
  const p=pages[k]||{}, skus=skusOf(k), R=[]; const add=(label,state,note)=>R.push({label,state,note:note||''});
  add('Primary image', p.image?'pass':'fail', p.image?'':'add a main photo');

  add('Description', (p.description&&p.description.trim().length>=40)?'pass':'fail', p.description?(p.description.trim().length+' chars'):'missing');
  add('Key features', ((p.features||[]).filter(Boolean).length>=3)?'pass':'warn', (p.features||[]).filter(Boolean).length+' listed');
  add('Specifications', ((p.specs||[]).length)?'pass':'warn', (p.specs||[]).length+' rows');
  add('Category', p.category?'pass':'fail', p.category||'missing');
  add('Subcategory', p.subcategory?'pass':'warn', p.subcategory||'—');
  add('Family / product line', p.family?'pass':'warn', p.family||'—');
  add('Sizing chart', (p.sizing_table&&((p.sizing_table.rows&&p.sizing_table.rows.length)||p.sizing_table.length))?'pass':'warn', 'if applicable');
  add('Warranty', p.warranty?'pass':'warn', p.warranty?'':'—');
  add('Documents', ((p.documents||[]).length)?'pass':'warn', ((p.documents||[]).length||0)+' attached');
  add('SKUs present', skus.length?'pass':'fail', skus.length+' SKU(s)');
  if(priceInfo) add('Pricing loaded', (priceInfo.missing===0&&priceInfo.notInCat===0&&priceInfo.total>0)?'pass':((priceInfo.missing||priceInfo.notInCat)?'fail':'warn'), priceInfo.priced+'/'+priceInfo.total+' priced'+(priceInfo.notInCat?' · '+priceInfo.notInCat+' not in catalog':''));
  return R;
}

/* The content half of a rename, on its own: this product now uses that SKU. Used by the
   ordinary rename and by both ways out of the conflict above. */
async function renameContentSku(k,oldSku,newSku){
  const r=await apiWrite({action:'rename_sku', page_key:k, old_sku:oldSku, new_sku:newSku});
  if(r.ok && (!r.json || r.json.ok!==false)){
    const skus=skusOf(k); const i=skus.findIndex(x=>String(x.sku)===oldSku);
    if(i>=0){ skus[i].sku=newSku; pages[k].skus=skus; }
    render(); return true;
  }
  toast('Content rename failed — the catalog side is already done, re-run to sync content',true);
  return false;
}
async function doRenameSku(k, oldSku){
  oldSku=String(oldSku);
  const newSku=(window.prompt('Change SKU number — updates the catalog (ordering, pricing, featured, media), the content here, and per-dealer contract prices. Past orders and sales reports keep the old number as a record.\n\nNew SKU for '+oldSku+':', oldSku)||'').trim();
  if(!newSku || newSku===oldSku) return;
  if(skusOf(k).some(s=>String(s.sku)===newSku)){ toast('That SKU already exists on this product',true); return; }
  toast('Renaming '+oldSku+' → '+newSku+'…');
  // 1) catalog side — only if the code exists in the catalog
  const cat=await catalogGet();
  const inCustom=(cat.custom||[]).find(p=>String(p.code)===oldSku);
  const prod=inCustom||(cat.products||[]).find(p=>String(p.code)===oldSku);
  let catalogNote='';
  if(prod){
    try{
      const cr=await fetch('/.netlify/functions/catalog-api',{method:'POST',headers:authHeaders(),body:JSON.stringify({
        action:'rename_code', manufacturer:MFR, old_code:oldSku, new_code:newSku, was_custom:!!inCustom,
        product:{name:prod.name,category:prod.category,base_price:prod.base_price,msrp:prod.msrp,image:prod.image,description:prod.description,tiers:prod.tiers,price_note:prod.price_note,active:prod.active}
      })});
      const cj=await cr.json().catch(()=>({}));
      /* The target code usually EXISTS — that is the normal case, not a collision. A SKU is
         corrected to match the manufacturer's price list, and that code is already in the
         catalog holding the new price with no product attached: it is exactly why it showed
         up in Price Check as unassigned. Refusing here left the correction impossible from
         this screen, so the conflict now opens the way through instead of closing it. */
      if(cr.status===409){ _skuMove={k,oldSku,newSku,info:cj,oldRec:prod,wasCustom:!!inCustom}; return skuMoveModal(); }
      if(!cr.ok || cj.ok===false){ toast('Catalog rename failed'+(cj.error?': '+cj.error:''),true); return; }
      _catalogCache=null; catalogNote=' · catalog + pricing updated';
    }catch(e){ toast('Catalog rename failed — nothing changed',true); return; }
  } else { catalogNote=' · not in catalog (content only)'; }
  // 2) content overlay
  if(await renameContentSku(k,oldSku,newSku)) toast('SKU '+oldSku+' → '+newSku+catalogNote);
}
async function doAiGen(k, field, btn){
  if(!field) return; const p=pages[k]; const orig=btn?btn.textContent:''; if(btn){ btn.disabled=true; btn.textContent='✨ …'; }
  const ctx={ name:p.name, category:p.category, subcategory:p.subcategory, family:p.family,
    tagline:p.tagline, description:p.description, features:p.features||[],
    clinical_applications:p.clinical_applications||[], billing_codes:p.billing_codes||[],
    manufacturer:p.manufacturer||MFR, skus:skusOf(k).map(s=>({sku:s.sku,size:s.size,hcpcs:s.hcpcs})),
    sizing_rows:(p.sizing_table&&(p.sizing_table.rows||p.sizing_table))||null,
    existing_categories:allCategories() };
  const r=await apiWrite({action:'generate_content', page_key:k, field, context:ctx});
  if(btn){ btn.disabled=false; btn.textContent=orig; }
  const out=r.json||{};
  if(!r.ok || out.ok===false){ toast(out.message||out.error||'AI generation failed',true); return; }
  if(field==='specs'){
    const incoming=Array.isArray(out.specs)?out.specs:[];
    const rows=incoming.map(s=>({label:String((s&&s.label)||'').trim(),value:String((s&&s.value)||'').trim()})).filter(s=>s.label||s.value);
    if(!rows.length){ toast('AI returned no specifications — try again',true); return; }
    const cur=Array.isArray(pages[k].specs)?pages[k].specs.filter(s=>s&&(String(s.label||'').trim()||String(s.value||'').trim())):[];
    const seen=new Set(cur.map(s=>String(s.label||'').toLowerCase().trim()));
    rows.forEach(s=>{ const key=s.label.toLowerCase(); if(!seen.has(key)){ cur.push(s); seen.add(key); } });
    pages[k].specs=cur;
  } else if(field==='features'||field==='clinical_applications'){
    if(Array.isArray(out.list)&&out.list.length) pages[k][field]=out.list;
    else if(out.text) pages[k][field]=out.text.split('\n').map(x=>x.replace(/^[-•*\d.\s]+/,'').trim()).filter(Boolean);
  } else if(out.text!=null){ pages[k][field]=out.text; }
  toast('AI draft added — review, then Save'); reopen(k);
}

async function doAiFillSkus(k,btn){
  const skus=skusOf(k); if(!skus.length){ toast('No SKUs to fill on this product',true); return; }
  const orig=btn?btn.textContent:''; if(btn){ btn.disabled=true; btn.textContent='✨ …'; }
  const r=await apiWrite({action:'ai_fill_skus',page_key:k});
  if(btn){ btn.disabled=false; btn.textContent=orig; }
  const out=r.json||{};
  if(!r.ok||out.ok===false){ toast(out.message||out.error||'AI fill failed',true); return; }
  const rows=Array.isArray(out.rows)?out.rows:[];
  if(!rows.length){ toast('AI returned nothing to fill',true); return; }
  const byCode={}; rows.forEach(x=>{ if(x&&x.sku!=null) byCode[String(x.sku).trim()]=x; });
  let filled=0;
  const next=skus.map(s=>{ const rec=byCode[String(s.sku).trim()]; if(!rec) return s;
    const o=Object.assign({},s);
    ['name','size','hcpcs'].forEach(f=>{ const cur=String(o[f]||'').trim(); const val=String(rec[f]||'').trim();
      if(!cur && val){ o[f]=val; filled++; } });
    return o; });
  pages[k].skus=next;
  toast(filled?('AI filled '+filled+' field(s) — review, then Save SKU edits'):'Nothing blank to fill — all SKU details already set');
  reopen(k);
}

/* ---- Phase 3: duplicate prevention BEFORE a product is created ----
   Checks manufacturer + SKU + name + product URL against every existing record. An exact hit
   offers to enrich the existing record instead of creating a second copy; a possible hit asks
   for a decision. Nothing is created until the check passes or staff overrides. */
let _npPending=null;
async function doNewProduct(force){
  const name=(document.getElementById('np-name').value||'').trim(); if(!name){toast('Name required',true);return;}
  const cat=document.getElementById('np-cat').value.trim(), fam=document.getElementById('np-fam').value.trim();
  const rows=[...document.querySelectorAll('#np-skurows .np-skurow')].map(r=>({
    code:(r.querySelector('.np-sku').value||'').trim(),
    name:(r.querySelector('.np-skuname').value||'').trim(),
    price:(r.querySelector('.np-skuprice').value||'').trim()
  })).filter(x=>x.code);
  const seen=new Set(); for(const x of rows){ if(seen.has(x.code)){ toast('Duplicate SKU '+x.code,true); return; } seen.add(x.code); }
  const url=((document.getElementById('np-url')||{}).value||'').trim();
  if(force!==true){
    const chk=await apiWrite({action:'find_duplicates',name,codes:rows.map(r=>r.code),source_url:url});
    const cj=(chk&&chk.json)||{};
    if(chk.ok && cj.ok && Array.isArray(cj.matches) && cj.matches.length){
      _npPending={name,cat:document.getElementById('np-cat').value.trim(),fam:document.getElementById('np-fam').value.trim(),url,rows};
      showDuplicateGate(cj); return;
    }
  }
  const npk=slug(name);
  const btn=document.querySelector('[data-act="new-save"]'); if(btn){ btn.disabled=true; btn.textContent='Creating…'; }
  // 1) content record (Review Structure)
  const skusForContent=rows.map(r=>({sku:r.code,name:r.name,status:'active'}));
  const r=await apiWrite({action:'create_product',product:{page_key:npk,name,category:cat,family:fam,skus:skusForContent}});
  if(!(r.ok && (!r.json||r.json.ok!==false))){ toast((r.json&&(r.json.message||r.json.error))||'Create failed',true); if(btn){btn.disabled=false;btn.textContent='Create product';} return; }
  // 2) orderable + priced catalog items (custom_products via catalog-api, President-only)
  let made=0, priced=0, catFail=0, forbidden=false, dupBlocked=0;
  _pubCollisions=[];
  for(const it of rows){
    const price=it.price===''?null:Number(it.price.replace(/[^0-9.\-]/g,''));
    const prod={code:it.code, name:it.name||name, category:cat||null, active:true};
    if(price!=null && isFinite(price)) prod.base_price=price;
    try{
      const res=await publishToCatalog(prod, _pubCollisions);
      if(res.ok){ made++; if(prod.base_price!=null) priced++; }
      else if(res.duplicate){ dupBlocked++; }
      else { catFail++; if(res.status===403) forbidden=true; }
    }catch(e){ catFail++; }
  }
  pages[npk]={page_key:npk,name,category:cat,family:fam,skus:skusForContent,sku_count:skusForContent.length,status:'pending_review',features:[]};
  _catalogCache=null;   // Price Check will re-read the catalog
  document.getElementById('overlay').classList.remove('show'); openCards.add(npk);
  if(dupBlocked) reportCollisions(_pubCollisions);
  if(forbidden) toast('Product created, but adding to the catalog needs President access — no catalog items written.',true);
  else if(catFail) toast('Created "'+name+'". '+catFail+' SKU(s) couldn\'t be added to the catalog — check them in Product Catalog.',true);
  else toast('Created "'+name+'" · '+made+' orderable SKU(s)'+(priced?' ('+priced+' priced)':'')+'.');
  render();
}

  if(r.ok){ toast('Change undone — reloading'); const rr=await fetch(`${API}?manufacturer=${encodeURIComponent(MFR)}`,{headers:authHeaders()});
    if(rr.ok){ const j=await rr.json(); if(j&&j.rows){ const pg={}; j.rows.forEach(row=>pg[row.page_key]=row); Object.keys(pages).forEach(k=>delete pages[k]); Object.assign(pages,pg);} }
    render(); openHistory(); } else { toast('Undo failed',true); btn.disabled=false; } }

/* ===================== modal helper ===================== */
function modalHTML(title,inner){ const m=document.getElementById('modal');
  m.innerHTML=`<div class="mh"><h3>${title}</h3><button class="close" data-act="close-modal">✕</button></div><div class="mb">${inner}</div>`;
  document.getElementById('overlay').classList.add('show'); }
document.getElementById('overlay').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); });

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
window.addEventListener('hcps-token', function(){ if(!Object.keys(pages).length) boot(); });
</script>
