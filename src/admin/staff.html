<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HCPS Admin — Staff</title>
<style>
 :root{--ink:#16202e;--blue:#3B599A;--blue-dk:#2B4071;--orange:#F5821F;--bg:#eef2f7;--line:#e3e8ef;--muted:#64707e;--ok:#1f9d55;--danger:#d64545;--card:#fff}
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
 a{color:inherit;text-decoration:none}
 .adminnav{background:var(--ink);display:flex;align-items:center;gap:4px;padding:10px 22px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.14)}
 .adminnav .bd{color:#fff;font-weight:800;font-size:15px;margin-right:16px}.adminnav .bd span{color:var(--orange)}
 .adminnav a{color:#aeb9c6;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-radius:7px}
 .adminnav a:hover{color:#fff;background:rgba(255,255,255,.07)}.adminnav a.on{color:#fff;background:var(--blue)}
 .adminnav .navright{margin-left:auto;display:flex;gap:10px;align-items:center}
 .who{color:#8493a6;font-size:11.5px}
 .lock{background:transparent;border:1px solid rgba(255,255,255,.22);color:#cdd6e2;border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
 .wrap{max-width:940px;margin:24px auto;padding:0 20px 60px}
 h1{font-size:24px;margin:0 0 3px}.sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);margin-bottom:18px}
 .card h2{font-size:16px;margin:0 0 10px}
 label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 4px}
 input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:#fff}
 .btn{border:1px solid var(--blue-dk);background:var(--blue);color:#fff;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer}
 .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)} .btn.sm{padding:5px 9px;font-size:12px}
 .btn.danger{background:#fff;color:var(--danger);border-color:#f0c8c8}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 table{width:100%;border-collapse:collapse;font-size:13.5px}
 th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
 th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
 .rolechip{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:2px 8px;border-radius:20px}
 .r-president{background:#eef4fb;color:var(--blue-dk)} .r-rep{background:#e9f7ee;color:#1f7a44} .r-relations{background:#fbf0e6;color:#9a5b12}
 .off{opacity:.5}
 .hint{color:var(--muted);font-size:12.5px}
 .msg{font-size:13px;margin-top:8px;min-height:16px}.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
 .loginwrap{min-height:70vh;display:grid;place-items:center;padding:20px}
 .logincard{background:#fff;border-radius:16px;padding:30px;width:100%;max-width:390px;box-shadow:0 20px 60px rgba(0,0,0,.14)}
 .logincard .brand{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--orange);font-weight:800}
 .logincard h2{margin:6px 0 3px;font-size:22px}.logincard p{color:var(--muted);font-size:13px;margin:0 0 16px}
 .logincard label{margin-top:10px}
 .logincard .btn{width:100%;justify-content:center;margin-top:14px;padding:12px}
</style></head><body>

<nav class="adminnav">
  <div class="bd">HCPS <span>Admin</span></div>
  <a href="/admin/">Home</a>
  <a href="/admin/analytics.html">Analytics</a>
  <a href="/admin/dealers.html">Dealer Manager</a>
  <a href="/admin/map.html">Map</a>
  <a href="/admin/territory.html">Territory</a>
  <a href="/admin/staff.html" class="on">Staff</a>
  <a href="/admin/catalog.html">Catalog</a>
  <a href="/admin/website.html">Website</a>
  <div class="navright"><span class="who" id="who"></span><button class="lock" id="lockBtn" onclick="signOut()" hidden>Sign out</button></div>
</nav>

<div id="app"><div class="loginwrap"><div class="logincard">
  <div class="brand">HomeCare Provider Services</div>
  <h2>Staff sign-in</h2>
  <p id="loginNote">Sign in with your work email and password.</p>
  <label>Email</label><input id="email" type="email" autocomplete="username" placeholder="you@company.com">
  <label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn" onclick="doLogin()">Sign in</button>
  <div class="msg" id="loginMsg"></div>
</div></div></div>

<div class="verbadge" style="position:fixed;bottom:6px;right:9px;z-index:99999;font:600 11px/1 system-ui,sans-serif;color:#8a949c;background:rgba(255,255,255,.78);border:1px solid #dde3e8;border-radius:6px;padding:3px 7px;pointer-events:none">VER 1.0</div>

<script>
const $=s=>document.querySelector(s);
const SKEY="hcps_staff_token", PKEY="hcps_staff_profile";
let TOKEN=sessionStorage.getItem(SKEY)||null;
let ME=null; try{ ME=JSON.parse(sessionStorage.getItem(PKEY)||"null"); }catch(e){ ME=null; }
const API="/.netlify/functions/staff-auth";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ROLELBL={president:"President",rep:"Sales Rep",relations:"Customer Relations"};

async function api(body,useAuth){
  const h={"content-type":"application/json"}; if(useAuth&&TOKEN)h["authorization"]="Bearer "+TOKEN;
  const r=await fetch(API,{method:"POST",headers:h,body:JSON.stringify(body)});
  return r.json().catch(()=>({}));
}
async function doLogin(){
  const email=($("#email").value||"").trim(), password=$("#password").value||"";
  const m=$("#loginMsg"); m.className="msg"; m.textContent="Signing in…";
  const j=await api({action:"login",email,password},false);
  if(j&&j.error==="tables_missing"){ m.className="msg err"; m.textContent="Run staff.sql in Supabase first."; return; }
  if(!j||!j.ok){ m.className="msg err"; m.textContent=(j&&j.message)||"Could not sign in."; return; }
  TOKEN=j.token; ME=j.profile; sessionStorage.setItem(SKEY,TOKEN); sessionStorage.setItem(PKEY,JSON.stringify(ME));
  render();
}
function signOut(){ sessionStorage.removeItem(SKEY); sessionStorage.removeItem(PKEY); TOKEN=null; ME=null; location.reload(); }

function loginView(note){
  $("#lockBtn").hidden=true; $("#who").textContent="";
  $("#app").innerHTML=`<div class="loginwrap"><div class="logincard">
    <div class="brand">HomeCare Provider Services</div><h2>Staff sign-in</h2>
    <p>${note||"Sign in with your work email and password."}</p>
    <label>Email</label><input id="email" type="email" autocomplete="username" placeholder="you@company.com">
    <label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">Sign in</button><div class="msg" id="loginMsg"></div></div></div>`;
}
async function render(){
  if(!TOKEN||!ME){ loginView(); return; }
  $("#who").textContent=`${ME.name||ME.email} · ${ROLELBL[ME.role]||ME.role}`; $("#lockBtn").hidden=false;
  if(ME.role!=="president"){
    $("#app").innerHTML=`<div class="wrap"><h1>Staff</h1>
      <div class="card"><h2>You're signed in</h2>
      <p class="hint">Signed in as <b>${esc(ME.name||ME.email)}</b> — ${ROLELBL[ME.role]||ME.role}${ME.rep_name?` · book: ${esc(ME.rep_name)}`:""}.</p>
      <p class="hint" style="margin-top:8px">Team management is President-only. Your account tools will scope to your accounts once that layer is switched on.</p></div></div>`;
    return;
  }
  const j=await api({action:"list_users"},true);
  const users=(j&&j.users)||[];
  $("#app").innerHTML=`<div class="wrap">
    <h1>Staff</h1><p class="sub">Add teammates, set their role, and control travel/route access. Removing someone cuts their access immediately.</p>
    <div class="card"><h2>Add a team member</h2>
      <div class="grid2">
        <div><label>Name</label><input id="n_name" placeholder="Full name"></div>
        <div><label>Work email</label><input id="n_email" type="email" placeholder="name@company.com"></div>
        <div><label>Role</label><select id="n_role" onchange="roleHint()">
          <option value="rep">Sales Rep</option><option value="relations">Customer Relations</option><option value="president">President</option></select></div>
        <div><label>Account book (rep name)</label><input id="n_rep" placeholder="matches the 'rep' on their accounts"></div>
      </div>
      <label class="hint" style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:600"><input type="checkbox" id="n_travel" style="width:auto"> Can plan &amp; save routes (travels)</label>
      <div style="margin-top:12px"><button class="btn" onclick="addUser()">Add team member</button> <span class="msg" id="addMsg" style="display:inline"></span></div>
      <p class="hint" style="margin-top:8px">They set their own password the first time they sign in — no invite email needed.</p>
    </div>
    <div class="card"><h2>Team (${users.length})</h2>
      <table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Book</th><th>Travel</th><th></th></tr></thead><tbody>
      ${users.map(u=>userRow(u)).join("")}
      </tbody></table>
    </div></div>`;
}
function userRow(u){
  const me = u.email===ME.email;
  return `<tr class="${u.active?"":"off"}">
    <td>${esc(u.name||"—")}${me?' <span class="hint">(you)</span>':""}</td>
    <td>${esc(u.email)}</td>
    <td><span class="rolechip r-${u.role}">${ROLELBL[u.role]||u.role}</span></td>
    <td>${esc(u.rep_name||"—")}</td>
    <td>${u.role==="president"?"—":(u.can_travel?"✓":"—")}</td>
    <td style="white-space:nowrap;text-align:right">
      <button class="btn ghost sm" onclick="editUser('${esc(u.email)}')">Edit</button>
      ${me?"":(u.active?`<button class="btn danger sm" onclick="removeUser('${esc(u.email)}','${esc(u.name||u.email)}')">Remove</button>`
                     :`<button class="btn ghost sm" onclick="reactivate('${esc(u.email)}')">Restore</button>`)}
    </td></tr>`;
}
function roleHint(){ const r=$("#n_role").value; const t=$("#n_travel"); if(r==="president"){t.checked=true;t.disabled=true;} else if(r==="relations"){t.checked=false;t.disabled=false;} else {t.disabled=false;} }
async function addUser(){
  const email=($("#n_email").value||"").trim(), name=($("#n_name").value||"").trim(), role=$("#n_role").value, rep_name=($("#n_rep").value||"").trim(), can_travel=$("#n_travel").checked;
  const m=$("#addMsg"); m.className="msg"; m.textContent="Adding…";
  const j=await api({action:"add_user",email,name,role,rep_name,can_travel},true);
  if(!j||!j.ok){ m.className="msg err"; m.textContent=(j&&j.message)||"Couldn't add."; return; }
  render();
}
let CUREDIT=null;
function editUser(email){ CUREDIT=email; render2edit(email); }
async function render2edit(email){
  const j=await api({action:"list_users"},true); const u=((j&&j.users)||[]).find(x=>x.email===email); if(!u)return render();
  const html=`<div class="wrap"><h1>Edit teammate</h1>
    <div class="card"><h2>${esc(u.name||u.email)}</h2>
      <div class="grid2">
        <div><label>Name</label><input id="e_name" value="${esc(u.name||"")}"></div>
        <div><label>Email</label><input value="${esc(u.email)}" disabled></div>
        <div><label>Role</label><select id="e_role" onchange="if(this.value==='president'){document.getElementById('e_travel').checked=true;}">
          ${["rep","relations","president"].map(r=>`<option value="${r}"${u.role===r?" selected":""}>${ROLELBL[r]}</option>`).join("")}</select></div>
        <div><label>Account book (rep name)</label><input id="e_rep" value="${esc(u.rep_name||"")}"></div>
      </div>
      <label class="hint" style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:600"><input type="checkbox" id="e_travel" style="width:auto" ${u.can_travel?"checked":""}> Can plan &amp; save routes (travels)</label>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn" onclick="saveEdit('${esc(u.email)}')">Save</button>
        <button class="btn ghost" onclick="render()">Cancel</button></div>
      <div class="msg" id="editMsg"></div></div></div>`;
  $("#app").innerHTML=html;
}
async function saveEdit(email){
  const patch={name:$("#e_name").value,role:$("#e_role").value,rep_name:$("#e_rep").value,can_travel:$("#e_travel").checked};
  const m=$("#editMsg"); m.className="msg"; m.textContent="Saving…";
  const j=await api({action:"update_user",email,patch},true);
  if(!j||!j.ok){ m.className="msg err"; m.textContent=(j&&j.message)||"Couldn't save."; return; }
  render();
}
async function removeUser(email,name){
  if(!confirm(`Remove ${name}? Their access is cut immediately. You can restore them later.`))return;
  const j=await api({action:"remove_user",email},true); render();
}
async function reactivate(email){ await api({action:"update_user",email,patch:{active:true}},true); render(); }

// boot: if we have a token, verify it; else show login
(async function(){
  if(TOKEN){ const j=await api({action:"me"},true); if(j&&j.ok){ ME=j.profile; sessionStorage.setItem(PKEY,JSON.stringify(ME)); render(); return; } sessionStorage.removeItem(SKEY); TOKEN=null; }
  loginView();
})();
</script>
</body></html>
