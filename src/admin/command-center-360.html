<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS Admin — Command Center 360</title>
<link rel="stylesheet" href="/admin/admin-shell.css">
<style>
 .cc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
 .cc-yr{display:flex;gap:5px;flex-wrap:wrap}
 .cc-yr button{font-size:12px;font-weight:700;border:1px solid var(--line);background:#f5f8fb;color:var(--navy);border-radius:999px;padding:5px 11px;cursor:pointer}
 .cc-yr button.on{background:#10263f;border-color:#10263f;color:#fff}
 .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:2px 0 14px}
 .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
 .kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);font-weight:700}
 .kpi .v{font-size:23px;font-weight:800;color:var(--navy);font-family:'Barlow Condensed',sans-serif;margin-top:2px}
 .kpi .s{font-size:11px;color:var(--gray);margin-top:1px}
 .kpi .v.up{color:#1f7a44}.kpi .v.down{color:#c2410c}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
 @media(max-width:900px){.grid2{grid-template-columns:1fr}}
 .card h2{display:flex;align-items:center;justify-content:space-between;gap:8px}
 .card h2 .side{font-size:11px;color:var(--gray);font-weight:600}
 .drow{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:8px;cursor:pointer}
 .drow:hover{background:#f2f7fb}
 .drow .nm{width:150px;min-width:110px;font-size:12.5px;color:var(--navy);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .drow .track{flex:1;background:#eef2f6;border-radius:5px;height:14px;overflow:hidden}
 .drow .fill{height:100%;background:#1681c2;border-radius:5px}
 .drow .val{width:88px;text-align:right;font-size:12.5px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
 .drow .arw{color:#9aa4ae;font-size:12px}
 .search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;margin:2px 0 8px;font-family:inherit}
 .scrollbox{max-height:420px;overflow:auto}
 .chartwrap{position:relative}
 .cctip{position:absolute;pointer-events:none;background:#0f1b2b;color:#fff;border-radius:7px;padding:5px 8px;font-size:12px;opacity:0;transition:opacity .1s;z-index:5}
 .cctip b{font-size:13px}
 .drill{position:fixed;inset:0;background:rgba(12,22,34,.42);z-index:50;display:flex;justify-content:flex-end}
 .drill .panel{width:min(760px,96vw);background:var(--paper,#f4f6f9);height:100%;overflow:auto;box-shadow:-12px 0 40px rgba(0,0,0,.25);padding:0 0 40px}
 .drill .dhead{position:sticky;top:0;background:#10263f;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;z-index:2}
 .crumbs{font-size:12px;color:#aebdd0}.crumbs a{color:#fff;cursor:pointer;text-decoration:underline}
 .drill .dbody{padding:16px 20px}
 .drill .x{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:18px;border-radius:8px;width:30px;height:30px;cursor:pointer}
 .stat{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
 .stat .s{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 13px;min-width:96px}
 .stat .s .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);font-weight:600}
 .stat .s .v{font-size:18px;font-weight:800;color:var(--navy)}
 table{width:100%;border-collapse:collapse;font-size:13px}
 th{text-align:left;color:var(--gray);font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:5px 7px;border-bottom:1px solid var(--line)}
 td{padding:6px 7px;border-bottom:1px solid #eef2f6}
 td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
 .lnk{color:#1681c2;cursor:pointer;font-weight:600}
 .pill{font-size:10px;font-weight:800;text-transform:uppercase;border-radius:6px;padding:2px 7px}
 .pill.up{background:#e7f6ec;color:#1f7a44}.pill.down{background:#fdecec;color:#b42323}.pill.flat{background:#eef2f7;color:#5b6b7b}
 .pill.dorm{background:#f3eef9;color:#5b3fa0}
 .ihd{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);font-weight:800;margin:10px 0 4px}
 .chttl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);font-weight:800;margin:4px 0 2px}
 .chart{width:100%;height:auto;display:block;overflow:visible}
 .cyt{font-size:10px;fill:var(--gray);font-variant-numeric:tabular-nums}.cxt{font-size:10px;fill:var(--gray)}.cend{font-size:11px;fill:var(--navy);font-weight:800}
</style>
</head><body>
<header id="ac-head"></header>
<div class="wrap">
  <div class="top cc-top"><div><h1 style="margin:0">Command Center 360</h1>
    <div class="sub">Every number is clickable. Summary → manufacturer → dealer → branch → product → order, with trend forecasts. Sales from commission &amp; sales imports; intelligence from Dealer 360, ordering activity &amp; CRM.</div></div>
    <div class="cc-yr" id="yr"></div></div>
  <div id="body"><div class="msg">Loading…</div></div>
</div>
<div id="drillHost"></div>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Math.round(Number(n)||0).toLocaleString("en-US");
const short=n=>{n=Number(n)||0;const a=Math.abs(n);if(a>=1e6)return "$"+(n/1e6).toFixed(1).replace(/\.0$/,"")+"M";if(a>=1e3)return "$"+(n/1e3).toFixed(1).replace(/\.0$/,"")+"k";return "$"+Math.round(n);};
window.addEventListener("hcps-token",e=>{try{TOKEN=e.detail;}catch(_){}});
let ME=null; try{ME=HCPS.profile()}catch(e){ME=null;}
let TOKEN=HCPS.token(), A=null, I=null, YEAR="all", NAMEID={}, INFO={}, ENG={}, BUSY=false;
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ym=p=>String(p||"").slice(0,7);
const pmOf=p=>{const s=ym(p);const a=s.split("-");return (Number(a[0])||0)*12+((Number(a[1])||1)-1);};
const pmLabel=pm=>MON[((pm%12)+12)%12]+" "+String(Math.floor(pm/12)).slice(2);
const norm=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();

function gate(msg){$("#body").innerHTML=`<div class="gate"><h2>Staff sign-in</h2><p class="hint">Sign in with your work email and password.</p><input id="lemail" type="email" placeholder="Email" autocomplete="username"><input id="lpass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitTok()"><button class="go" onclick="submitTok()">Sign in</button><div class="er" id="lerr" style="color:#b42323;margin-top:8px">${msg||""}</div></div>`;setTimeout(()=>{const t=$("#lemail");if(t)t.focus();},50);}
async function submitTok(){
  const email=(($("#lemail")||{}).value||"").trim(), password=(($("#lpass")||{}).value||"");
  try{ const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email,password})});
    const j=await r.json().catch(()=>({})); if(!j||!j.ok){ gate((j&&j.message)||"Could not sign in."); return; }
    HCPS.setSession(j); TOKEN=j.token; ME=j.profile; boot();
  }catch(err){ gate("Could not reach the server. Try again."); }
}
function lock(){ HCPS.signOut(); TOKEN=null; ME=null; location.reload(); }

async function boot(){
  if(!TOKEN){ gate(); return; }
  try{
    const h={authorization:"Bearer "+TOKEN};
    const [ar,ir]=await Promise.all([
      fetch("/.netlify/functions/analytics",{headers:h}),
      fetch("/.netlify/functions/command360-api",{method:"POST",headers:{...h,"content-type":"application/json"},body:"{}"})
    ]);
    if(ar.status===401){ gate("Your session ended — sign in again."); return; }
    if(ar.status===403){ $("#body").innerHTML='<div class="msg err"><b>President only.</b></div>'; return; }
    A=await ar.json(); I=await ir.json().catch(()=>({}));
    INFO=A.dealerInfo||{};
    (I.dealers||[]).forEach(d=>{ NAMEID[norm(d.name)]=d.id; });
    (I.engagement&&[].concat(I.engagement.dormant||[],I.engagement.declining||[],I.engagement.growing||[])||[]).forEach(e=>{ ENG[norm(e.name)]=e; });
    buildYears(); render();
  }catch(e){ $("#body").innerHTML=`<div class="msg err">Couldn't load: ${esc(String(e.message||e))}</div>`; }
}
function buildYears(){
  const ys=[...new Set((A.facts||[]).map(f=>ym(f.period).slice(0,4)))].filter(Boolean).sort();
  $("#yr").innerHTML=[`<button class="${YEAR==='all'?'on':''}" onclick="setYear('all')">All</button>`].concat(ys.map(y=>`<button class="${YEAR===y?'on':''}" onclick="setYear('${y}')">${y}</button>`)).join("");
}
function setYear(y){ YEAR=y; buildYears(); render(); }
function facts(){ return (A.facts||[]).filter(f=>YEAR==="all"||ym(f.period).slice(0,4)===YEAR); }

/* ---------- aggregation helpers ---------- */
function agg(F,keyFn){ const m=new Map(); for(const f of F){ const k=keyFn(f); if(k==null)continue; m.set(k,(m.get(k)||0)+(f.sales||0)); } return m; }
function series(F){ const m=new Map(); for(const f of F){ const pm=pmOf(f.period); m.set(pm,(m.get(pm)||0)+(f.sales||0)); } const pms=[...m.keys()].sort((a,b)=>a-b); return pms.length?Array.from({length:pms[pms.length-1]-pms[0]+1},(_,i)=>({pm:pms[0]+i,v:Math.round((m.get(pms[0]+i)||0)*100)/100})):[]; }
function stateOf(name){ const i=INFO[name]; return (i&&i.state)||"—"; }
function forecast(pts,n){ n=n||3; if(pts.length<2) return {proj:[],dir:"flat",pct:null}; const N=pts.length; let sx=0,sy=0,sxx=0,sxy=0; pts.forEach((p,i)=>{sx+=i;sy+=p.v;sxx+=i*i;sxy+=i*p.v;}); const d=N*sxx-sx*sx; const m=d?(N*sxy-sx*sy)/d:0; const b=(sy-m*sx)/N; const proj=[]; const lastPm=pts[N-1].pm; for(let i=1;i<=n;i++){ proj.push({pm:lastPm+i,v:Math.max(0,Math.round((m*(N-1+i)+b)*100)/100)}); } const lastv=pts[N-1].v||0; const projLast=proj[proj.length-1].v; const pct=lastv>0?Math.round(((projLast-lastv)/lastv)*100):null; const dir=pct!=null?(pct>2?"up":pct<-2?"down":"flat"):(m>0.5?"up":m<-0.5?"down":"flat"); return {proj,dir,pct}; }

/* ---------- render ---------- */
function render(){
  const F=facts();
  const total=F.reduce((s,f)=>s+(f.sales||0),0);
  const comm=F.reduce((s,f)=>s+(f.comm||0),0);
  const months=new Set(F.map(f=>ym(f.period))).size||1;
  const dealers=new Set(F.map(f=>f.dealer)).size;
  const ser=series(F); const fc=forecast(ser,3);
  const yoy=computeYoY();
  const opps=(I.opportunities||{});
  const kpis=`<div class="kpis">
    ${kpi("Total sales",short(total),YEAR==="all"?"all time":YEAR)}
    ${kpi("YoY growth",yoy?((yoy.pct>=0?"+":"")+yoy.pct+"%"):"—",yoy?`${yoy.cur} vs ${yoy.prev}`:"need prior year",yoy?(yoy.pct>=0?"up":"down"):"")}
    ${kpi("Commission",short(comm),"~"+(total?Math.round(comm/total*1000)/10:0)+"% of sales")}
    ${kpi("Active dealers",dealers,YEAR==="all"?"with sales":"this year")}
    ${kpi("Avg / month",short(total/months),months+" mo")}
    ${kpi("Forecast trend",fc.pct==null?"—":((fc.pct>=0?"+":"")+fc.pct+"%"),"next 3 mo projection",fc.dir)}
  </div>`;
  // trend + forecast chart
  const trend=`<div class="card"><h2>Monthly sales <span class="side">history + ${fc.dir==="up"?"▲ rising":fc.dir==="down"?"▼ falling":"flat"} forecast</span></h2>
    <div class="chartwrap">${lineFC(ser,fc.proj,"Total monthly sales — solid = actual, dashed = projected")}</div></div>`;
  // interactive: manufacturers + states
  const byMfr=[...agg(F,f=>f.line).entries()].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const byState=[...agg(F,f=>stateOf(f.dealer)).entries()].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const mfrCard=`<div class="card"><h2>Manufacturer sales <span class="side">click to isolate</span></h2>${barRows(byMfr.slice(0,14),'mfr',byMfr[0]&&byMfr[0].v)}</div>`;
  const stateCard=`<div class="card"><h2>Sales by state <span class="side">click to see the breakdown</span></h2>${barRows(byState.slice(0,14),'state',byState[0]&&byState[0].v)}</div>`;
  // companies — full scrollable/searchable
  const byCo=[...agg(F,f=>f.dealer).entries()].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  window._CO=byCo;
  const coCard=`<div class="card"><h2>Companies <span class="side">${byCo.length} with sales · click any</span></h2>
    <input class="search" id="coSearch" placeholder="Search all companies…" oninput="renderCo()">
    <div class="scrollbox" id="coList"></div></div>`;
  // Outlook email reminder — surfaces senders captured but not yet linked to a dealer.
  const eu=(I.email_unmatched||{});
  const emailBanner = eu.senders ? `<div class="card" style="border-left:3px solid #F5821F;background:#fff8ef;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
    <div style="flex:1;min-width:220px"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#b45309;font-weight:800">Email needs attention</div>
    <div style="font-size:14px;color:var(--navy);margin-top:2px">✉ <b>${eu.senders}</b> unmatched email sender${eu.senders===1?"":"s"} (${eu.messages} message${eu.messages===1?"":"s"}) aren't linked to a dealer yet.</div></div>
    <a class="btn sm orange" href="/admin/email-sync.html">Review &amp; assign →</a></div>` : "";
  // intelligence tiles
  // Claude AI spend panel — management only (reps use this page too, scoped to their book).
  const _adminMe=["president","admin","owner"].includes(String((HCPS.profile()||{}).role||"").toLowerCase());
  const html=emailBanner+kpis+insightsCard(F)+trend+predictCard(F)+`<div class="grid2">${mfrCard}${stateCard}</div>`+`<div class="grid2">${territoryCard(F)}${whitespaceCard(F)}</div>`+coCard+productsCard()+intelSection()+intelSection2()+(_adminMe?aiUsageCard():"");
  $("#body").innerHTML=html;
  drawFC(ser,fc.proj,"trendMain");
  renderCo(); renderProd(); if(_adminMe) fillAiUsage();
}
// ---- Claude AI usage & credits panel (calls ai-usage-api; cached so year toggles don't re-hit it) ----
var AIU=null, AIUloading=false;
function aiUsageCard(){ return `<div class="card" id="aiUsageCard"><h2>Claude AI usage &amp; credits <span class="side"><a class="link" href="/admin/ai-usage.html">full detail &amp; settings →</a></span></h2><div id="aiuBody"><div class="hint">Loading spend…</div></div></div>`; }
async function fillAiUsage(){
  const host=$("#aiuBody"); if(!host) return;
  if(AIU){ paintAiUsage(AIU); return; }
  if(AIUloading) return; AIUloading=true;
  try{ const r=await fetch("/.netlify/functions/ai-usage-api",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+TOKEN},body:JSON.stringify({action:"report"})}); AIU=await r.json().catch(()=>({ok:false})); }
  catch(e){ AIU={ok:false,message:"Couldn't load AI usage."}; }
  AIUloading=false; paintAiUsage(AIU);
}
function paintAiUsage(j){
  const host=$("#aiuBody"); if(!host) return;
  const m=n=>"$"+(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  if(!j||!j.ok){ host.innerHTML=`<div class="hint">${esc((j&&j.message)||"Live AI spend isn't set up yet.")} <a class="link" href="/admin/ai-usage.html">Set it up →</a></div>`; return; }
  let t="";
  if(j.balance!=null) t+=kpi("Running balance",m(j.balance),m(j.purchased)+" purchased − "+m(j.spend_since)+" spent");
  t+=kpi("Spend this month",m(j.spend_month),"month to date");
  t+=kpi("Last 7 days",m(j.spend_7),"");
  t+=kpi("Since "+esc(String(j.since||"")),m(j.spend_since),"AI · Claude Code · Workbench");
  host.innerHTML=`<div class="kpis">${t}</div>`;
}
function pmFromLabel(l){ const a=String(l||"").split(" "); const mo=MON.indexOf(a[0]); const y=2000+(Number(a[1])||0); return mo<0?0:y*12+mo; }
function predictCard(F){
  const s=series(F); const fc=forecast(s,3); const nextQ=fc.proj.reduce((a,p)=>a+p.v,0); const last3=s.slice(-3).reduce((a,p)=>a+p.v,0);
  const lines=[...new Set(F.map(f=>f.line))];
  const rows=lines.map(m=>{ const fm=F.filter(f=>f.line===m); const ms=series(fm); const mfc=forecast(ms,3); return {m,proj:mfc.proj.reduce((a,p)=>a+p.v,0),l3:ms.slice(-3).reduce((a,p)=>a+p.v,0),dir:mfc.dir,pct:mfc.pct}; }).sort((a,b)=>b.proj-a.proj).slice(0,8);
  return `<div class="card"><h2>Predicted sales <span class="side">next 3 months, from trend</span></h2>
    <div class="stat">${st("Projected next 3 mo",short(nextQ))}${st("vs last 3 mo",(nextQ>=last3?"▲ +":"▼ ")+(last3>0?Math.round((nextQ-last3)/last3*100):0)+"%")}${st("Direction",nextQ>last3?"▲ Rising":nextQ<last3?"▼ Falling":"Flat")}</div>
    <table><thead><tr><th>Manufacturer</th><th class="num">Last 3 mo</th><th class="num">Next 3 mo (proj)</th><th>Trend</th></tr></thead><tbody>
    ${rows.map(r=>`<tr data-drill="mfr" data-key="${esc(r.m)}" style="cursor:pointer"><td>${esc(r.m)}</td><td class="num">${short(r.l3)}</td><td class="num">${short(r.proj)}</td><td><span class="pill ${r.dir}">${r.dir==="up"?"▲":r.dir==="down"?"▼":"▬"} ${r.pct==null?"—":(r.pct>=0?"+":"")+r.pct+"%"}</span></td></tr>`).join("")}
    </tbody></table>
    <div class="hint" style="margin-top:6px">Straight-line projection from monthly history — a directional guide, not a guarantee.</div></div>`;
}
function productsCard(){ const P=(I&&I.products)||{top:[]}; if(!P.top||!P.top.length) return `<div class="card"><h2>Top products</h2><div class="hint">No product-level sales imported yet — this fills in once sales reports with line items are loaded (e.g. Strongback).</div></div>`;
  return `<div class="card"><h2>Top products <span class="side">${P.count} products · click any</span></h2>
    <input class="search" id="pSearch" placeholder="Search products…" oninput="renderProd()"><div class="scrollbox" id="pList"></div></div>`; }
function renderProd(){ const P=(I&&I.products)||{top:[]}; if(!P.top||!P.top.length)return; const q=norm(($("#pSearch")||{}).value||"");
  const rows=P.top.map((p,i)=>({p,i})).filter(x=>!q||norm(x.p.name+" "+x.p.mfr).includes(q)); const max=(P.top[0]&&P.top[0].amount)||1;
  const el=$("#pList"); if(el) el.innerHTML=rows.map(x=>`<div class="drow" data-drill="product" data-key="${x.i}" style="cursor:pointer"><div class="nm" title="${esc(x.p.name)}">${esc(x.p.name)}</div><div class="track"><div class="fill" style="width:${Math.max(2,Math.round(x.p.amount/max*100))}%"></div></div><div class="val">${short(x.p.amount)}</div><span class="arw">›</span></div>`).join("")||'<div class="hint">No match.</div>'; }
function drillProduct(idx){ const p=(I.products&&I.products.top[idx]); if(!p) return '<div class="hint">Product not found.</div>';
  const pts=(p.months||[]).map(m=>({pm:pmFromLabel(m.label),v:m.amount})); const fc=forecast(pts,3);
  return `<h2 style="margin:0 0 4px">${esc(p.name)}</h2><div class="hint" style="margin:0 0 8px">${esc(p.mfr)}${p.sku&&String(p.sku).toLowerCase()!==String(p.name).toLowerCase()?" · "+esc(p.sku):""}</div>
   <div class="stat">${st("Total sales",short(p.amount))}${st("Units",Number(p.qty).toLocaleString())}${st("Dealers",p.dealers)}${st("Trend",(fc.dir==="up"?"▲ ":fc.dir==="down"?"▼ ":"")+(fc.pct==null?"—":(fc.pct>=0?"+":"")+fc.pct+"%"))}</div>
   ${lineFC(pts,fc.proj,esc(p.name)+" — monthly sales + forecast")}
   <div class="ihd">Top dealers buying this</div>${barRows((p.topDealers||[]).map(d=>({k:d.name,v:d.amount})),'company',(p.topDealers&&p.topDealers[0]&&p.topDealers[0].amount)||1)}`;
}
function intelSection2(){ return `<div class="grid2" style="margin-top:14px">${marketingCard()}${coverageCard()}</div>`; }
function marketingCard(){ const m=(I&&I.marketing)||{campaigns:[],send_volume:{}}; const sv=m.send_volume||{}; const svK=Object.keys(sv).sort((a,b)=>sv[b]-sv[a]);
  return `<div class="card"><h2>Marketing &amp; email engagement <span class="side">Zoho campaigns</span></h2>
   <div class="stat">${st("Emails sent",(m.sent||0).toLocaleString())}${st("Open rate",(m.open_rate||0)+"%")}${st("Click rate",(m.click_rate||0)+"%")}</div>
   <div class="ihd">Campaigns by volume</div>

function niceMax(v){ if(!(v>0))return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return m*p; }
function lineFC(hist,proj,title){
  const all=hist.concat(proj); if(!all.length) return '<div class="hint">No monthly data.</div>';
  const W=880,Hh=250,ml=58,mr=18,mt=24,mb=26,iw=W-ml-mr,ih=Hh-mt-mb;
  const vmax=niceMax(Math.max(1,...all.map(p=>p.v))); const n=all.length;
  const X=i=>n===1?ml+iw/2:ml+iw*i/(n-1); const Y=v=>mt+ih-ih*(v/vmax);
  let grid="",yl=""; [0,vmax/2,vmax].forEach(tv=>{const gy=Y(tv);grid+=`<line x1="${ml}" y1="${gy.toFixed(1)}" x2="${W-mr}" y2="${gy.toFixed(1)}" stroke="#e7edf3"/>`;yl+=`<text x="${ml-8}" y="${(gy+3).toFixed(1)}" text-anchor="end" class="cyt">${short(tv)}</text>`;});
  const geo=all.map((p,i)=>({x:X(i),y:Y(p.v),v:p.v,pm:p.pm}));
  const hn=hist.length;
  let hp="",pp="";
  geo.forEach((g,i)=>{ if(i<hn) hp+=(i?"L":"M")+g.x.toFixed(1)+" "+g.y.toFixed(1)+" "; });
  if(proj.length){ const start=geo[hn-1]; pp="M"+start.x.toFixed(1)+" "+start.y.toFixed(1)+" "+geo.slice(hn).map(g=>"L"+g.x.toFixed(1)+" "+g.y.toFixed(1)).join(" "); }
  const area=`M${geo[0].x.toFixed(1)} ${Y(0).toFixed(1)} `+geo.slice(0,hn).map(g=>`L${g.x.toFixed(1)} ${g.y.toFixed(1)} `).join("")+`L${geo[hn-1].x.toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const step=Math.max(1,Math.ceil(n/8)); let xl=""; for(let i=0;i<n;i+=step) xl+=`<text x="${X(i).toFixed(1)}" y="${Hh-8}" text-anchor="middle" class="cxt">${pmLabel(all[i].pm)}</text>`;
  window._FCGEO={geo,W,Hh};

    <path d="${hp}" fill="none" stroke="#1681c2" stroke-width="2" stroke-linejoin="round"/>
    ${proj.length?`<path d="${pp}" fill="none" stroke="#EE5A5A" stroke-width="2" stroke-dasharray="5 4"/>`:""}
    ${geo[hn-1]?`<circle cx="${geo[hn-1].x.toFixed(1)}" cy="${geo[hn-1].y.toFixed(1)}" r="3.5" fill="#1681c2"/>`:""}
    ${proj.length?`<circle cx="${geo[n-1].x.toFixed(1)}" cy="${geo[n-1].y.toFixed(1)}" r="3.5" fill="#EE5A5A"/><text x="${geo[n-1].x.toFixed(1)}" y="${Math.max(mt-6,geo[n-1].y-9).toFixed(1)}" text-anchor="end" class="cend" fill="#EE5A5A">${short(all[n-1].v)}</text>`:""}
    ${xl}</svg>`;
}

const REGION={}; (function(){ const R={Northeast:["CT","ME","MA","NH","RI","VT","NJ","NY","PA"],Midwest:["IL","IN","MI","OH","WI","IA","KS","MN","MO","NE","ND","SD"],South:["DE","FL","GA","MD","NC","SC","VA","DC","WV","AL","KY","MS","TN","AR","LA","OK","TX"],West:["AZ","CO","ID","MT","NV","NM","UT","WY","AK","CA","HI","OR","WA"]}; for(const k in R)for(const a of R[k])REGION[a]=k; })();
const NAME2AB={ALABAMA:"AL",ALASKA:"AK",ARIZONA:"AZ",ARKANSAS:"AR",CALIFORNIA:"CA",COLORADO:"CO",CONNECTICUT:"CT",DELAWARE:"DE",FLORIDA:"FL",GEORGIA:"GA",HAWAII:"HI",IDAHO:"ID",ILLINOIS:"IL",INDIANA:"IN",IOWA:"IA",KANSAS:"KS",KENTUCKY:"KY",LOUISIANA:"LA",MAINE:"ME",MARYLAND:"MD",MASSACHUSETTS:"MA",MICHIGAN:"MI",MINNESOTA:"MN",MISSISSIPPI:"MS",MISSOURI:"MO",MONTANA:"MT",NEBRASKA:"NE",NEVADA:"NV","NEW HAMPSHIRE":"NH","NEW JERSEY":"NJ","NEW MEXICO":"NM","NEW YORK":"NY","NORTH CAROLINA":"NC","NORTH DAKOTA":"ND",OHIO:"OH",OKLAHOMA:"OK",OREGON:"OR",PENNSYLVANIA:"PA","RHODE ISLAND":"RI","SOUTH CAROLINA":"SC","SOUTH DAKOTA":"SD",TENNESSEE:"TN",TEXAS:"TX",UTAH:"UT",VERMONT:"VT",VIRGINIA:"VA",WASHINGTON:"WA","WEST VIRGINIA":"WV",WISCONSIN:"WI",WYOMING:"WY"};
function abbr(st){ st=String(st||"").trim().toUpperCase(); return st.length>2?(NAME2AB[st]||st):st; }
function regionOf(st){ return REGION[abbr(st)]||"Other"; }
function moversBy(F,keyFn){ const keys=[...new Set(F.map(keyFn))]; return keys.map(k=>{ const s=series(F.filter(f=>keyFn(f)===k)); const l3=s.slice(-3).reduce((a,p)=>a+p.v,0), p3=s.slice(-6,-3).reduce((a,p)=>a+p.v,0); return {k,l3,p3,delta:Math.round((l3-p3)*100)/100,pct:p3>0?Math.round((l3-p3)/p3*100):null}; }).filter(x=>x.l3>0||x.p3>0); }
function whitespace(F){ const lines=[...new Set(F.map(f=>f.line))]; const buyers={}, tot={};
  for(const f of F){ (buyers[f.line]||(buyers[f.line]=new Set())).add(f.dealer); tot[f.line]=(tot[f.line]||0)+(f.sales||0); }
  const avg={}; for(const l of lines) avg[l]=buyers[l].size?tot[l]/buyers[l].size:0;
  const out=[]; for(const A of lines) for(const B of lines){ if(A===B||!buyers[A]||!buyers[B])continue; const only=[...buyers[A]].filter(d=>!buyers[B].has(d)); if(only.length>=3) out.push({A,B,count:only.length,potential:Math.round(only.length*(avg[B]||0))}); }
  return out.sort((a,b)=>b.potential-a.potential); }
function ins(icon,text,action,dt,key){ const clk=dt?` data-drill="${dt}" data-key="${esc(key)}" style="cursor:pointer"`:""; return `<div class="drow"${clk} style="align-items:flex-start;padding:8px 6px;border-bottom:1px solid #eef2f6"><div style="font-size:17px">${icon}</div><div style="flex:1"><div style="font-size:13.5px;color:var(--navy)">${text}</div><div class="hint" style="margin:2px 0 0"><b style="color:#1f7a44">Action:</b> ${esc(action)}</div></div>${dt?'<span class="arw" style="align-self:center">›</span>':""}</div>`; }
function insightsCard(F){
  const mv=moversBy(F,f=>f.line).filter(x=>x.pct!=null).sort((a,b)=>b.delta-a.delta); const up=mv[0], down=mv[mv.length-1];
  const dDown=moversBy(F,f=>f.dealer).filter(x=>x.p3>0).sort((a,b)=>a.delta-b.delta)[0];
  const s=series(F), fc=forecast(s,3); const nextQ=fc.proj.reduce((a,p)=>a+p.v,0), last3=s.slice(-3).reduce((a,p)=>a+p.v,0);
  const eng=(I&&I.engagement)||{}; const risk=[].concat(eng.dormant||[],eng.declining||[]); const riskVal=risk.reduce((a,r)=>a+(r.total||0),0);
  const ws=whitespace(F)[0]; const rows=[];
  rows.push(ins("📈",`Overall sales are projected to <b>${nextQ>=last3?"rise":"fall"} ${last3>0?Math.abs(Math.round((nextQ-last3)/last3*100)):0}%</b> next quarter to <b>${short(nextQ)}</b>.`, nextQ>=last3?"Keep momentum — ensure inventory & rep coverage.":"Headwind — prioritize re-orders and at-risk accounts.", null,null));
  if(up&&up.delta>0) rows.push(ins("🟢",`<b>${esc(up.k)}</b> is the top grower — up <b>${up.pct>=0?"+":""}${up.pct}%</b> (${short(up.delta)}) last 3 months.`,"Double down: feature it, confirm stock, target look-alike dealers.","mfr",up.k));
  if(down&&down.delta<0) rows.push(ins("🔴",`<b>${esc(down.k)}</b> is slipping — down <b>${down.pct}%</b> (${short(down.delta)}) last 3 months.`,"Investigate: call its top dealers, check pricing & supply.","mfr",down.k));
  if(dDown&&dDown.delta<0) rows.push(ins("⚠️",`<b>${esc(dDown.k)}</b> dropped <b>${short(dDown.delta)}</b> vs the prior quarter.`,"Follow up this week — open its 360 and log a touch.","company",dDown.k));
  if(risk.length) rows.push(ins("💤",`<b>${risk.length} dealers</b> are dormant or declining — <b>${short(riskVal)}</b> in relationship value at risk.`,"Run a re-engagement pass (see the momentum panel below).",null,null));
  if(ws) rows.push(ins("🎯",`<b>${ws.count} dealers</b> buy <b>${esc(ws.A)}</b> but not <b>${esc(ws.B)}</b> — ~<b>${short(ws.potential)}</b> cross-sell potential.`,`Target them with ${esc(ws.B)}.`,"mfr",ws.B));
  return `<div class="card" style="border-left:4px solid #10263f"><h2>Insights &amp; recommended actions <span class="side">what changed · why · what to do</span></h2>${rows.join("")||'<div class="hint">Not enough history yet for insights.</div>'}</div>`;
}
function territoryCard(F){ const m=[...agg(F,f=>regionOf(stateOf(f.dealer))).entries()].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  return `<div class="card"><h2>Sales by territory <span class="side">region · click to drill</span></h2>${barRows(m,'region',m[0]&&m[0].v)}</div>`; }
function drillRegion(region){ const F=facts().filter(f=>regionOf(stateOf(f.dealer))===region); const total=F.reduce((s,f)=>s+(f.sales||0),0);
  const states=[...agg(F,f=>stateOf(f.dealer)).entries()].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const cos=[...agg(F,f=>f.dealer).entries()].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const mfr=[...agg(F,f=>f.line).entries()].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  return `<h2 style="margin:0 0 8px">${esc(region)} region</h2>
   <div class="stat">${st("Region sales",short(total))}${st("States",states.length)}${st("Dealers",cos.length)}</div>
   ${miniChart(F,esc(region)+" — monthly sales + forecast")}
   <div class="ihd">States</div>${barRows(states,'state',states[0]&&states[0].v)}
   <div class="ihd">Manufacturers</div>${barRows(mfr.slice(0,12),'mfr',mfr[0]&&mfr[0].v)}
   <div class="ihd">Dealers (${cos.length})</div><div class="scrollbox">${barRows(cos.slice(0,120),'company',cos[0]&&cos[0].v)}</div>`; }
function whitespaceCard(F){ const ws=whitespace(F).slice(0,10);
  if(!ws.length) return `<div class="card"><h2>Cross-sell white-space</h2><div class="hint">Not enough multi-line dealers yet to surface cross-sell gaps.</div></div>`;
  return `<div class="card"><h2>Cross-sell white-space <span class="side">buys A, not B → target B</span></h2>
   ${ws.map(o=>`<div class="drow" data-drill="mfr" data-key="${esc(o.B)}" style="cursor:pointer"><div class="nm" style="width:auto;flex:1;white-space:normal">Buy <b>${esc(o.A)}</b>, not <b>${esc(o.B)}</b></div><div class="val" style="width:64px">${o.count} dlrs</div><div class="val">${short(o.potential)}</div><span class="arw">›</span></div>`).join("")}
   <div class="hint" style="margin-top:6px">Potential = prospect count × the missing line's average sales per dealer.</div></div>`; }

function hydrateHover(){}
boot();
</script>
