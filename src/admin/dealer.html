<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS Admin — Dealer 360</title>
<link rel="stylesheet" href="/admin/admin-shell.css">
<style>
 .d360{display:grid;grid-template-columns:1fr 340px;gap:15px;align-items:start}
 @media(max-width:900px){.d360{grid-template-columns:1fr}}
 .idrow{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:#41576b;margin:6px 0 0}
 .idrow b{color:var(--navy)}
 .spark{width:100%;height:70px;display:block}
 .stat{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 0}
 .stat .s{background:#f5f8fb;border:1px solid var(--line);border-radius:10px;padding:8px 13px;min-width:96px}
 .stat .s .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);font-weight:600}
 .stat .s .v{font-size:19px;font-weight:800;font-family:'Barlow Condensed';color:var(--navy)}
 .sig{display:flex;flex-direction:column;gap:8px}
 .sig .row{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
 .sig .row.hot{background:#e7f6ec;border-color:#bfe3ca}
 .sig .row.warn{background:#fdeee0;border-color:#f6d5ad}
 .sig .row.cool{background:#f3eef9;border-color:#e0d5f5}
 .pill2{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:6px;padding:2px 7px}
 .pill2.ok{background:#e7f6ec;color:#1f7a44}.pill2.due{background:#fdeee0;color:#b45309}.pill2.dorm{background:#f3eef9;color:#5b3fa0}
 .note-ph{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--gray);font-size:13px;text-align:center;background:#fafbfc}
 .itile{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff}
 .itile .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);font-weight:700}
 .itile .v{font-size:16px;font-weight:800;color:var(--navy);line-height:1.1;margin-top:1px}
 .ihd{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);font-weight:800;margin:8px 0 4px}
 .schips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
 .schip{font-size:12px;font-weight:700;color:var(--navy);background:#f5f8fb;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;font-family:inherit}
 .schip:hover{background:#eef3f8}
 .schip.on{background:#1681c2;border-color:#1681c2;color:#fff}
 .schip .scnt{font-weight:600;opacity:.65;margin-left:5px;font-size:11px}
 .schip.on .scnt{opacity:.9}
 .chwrap{position:relative;margin:2px 0 0}
 .chart{width:100%;height:auto;display:block;overflow:visible}
 .chttl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);font-weight:800;margin:4px 0 2px}
 .cyt{font-size:10px;fill:var(--gray);font-variant-numeric:tabular-nums}
 .cxt{font-size:10px;fill:var(--gray)}
 .cend{font-size:11px;fill:var(--navy);font-weight:800}
 .chtip{position:absolute;pointer-events:none;background:#0f1b2b;color:#fff;border-radius:7px;padding:5px 8px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:5}
 .chtip .chtv{font-weight:800;font-size:13px}
 .chtip .chtl{font-size:10.5px;color:#aebccd;margin-top:1px}
 .stbl{overflow-x:auto;margin-top:2px}
 .stbl table{width:100%}
 td.lbl a.link{cursor:pointer}
 .prow2{display:block;padding:9px 10px;border-bottom:1px solid #eef2f6;text-decoration:none;color:var(--navy)}
 .prow2:hover{background:#f6fafd}.prow2 b{font-weight:700}
 .tasks{display:flex;flex-direction:column;gap:6px}
 .tk{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff}
 .tk.hi{border-left:3px solid var(--orange)}
 .tkchk{background:none;border:0;font-size:17px;line-height:1;cursor:pointer;color:var(--blue);padding:0;margin-top:1px}
 .tkb{flex:1;min-width:0}.tkt{font-size:13px;font-weight:600;color:var(--navy)}.tkt.dn{text-decoration:line-through;color:var(--gray)}
 .tkadd{display:flex;gap:6px;margin-top:4px}.tkadd input#ntitle{flex:1;min-width:0}
 .nt{padding:7px 0;border-bottom:1px solid #eef2f6}.nt .ntb{font-size:13px;white-space:pre-wrap;color:var(--ink)}
 /* ---- Voice notes (Web Speech API dictation) ---- */
 .vn{margin-top:8px;border:1px solid var(--line);border-radius:11px;background:#fafbfc;padding:9px}
 .vn-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
 .vn-mic{display:inline-flex;align-items:center;gap:7px}
 .vn .btn.sm{min-height:38px}
 @media(max-width:640px){.vn .btn.sm{min-height:44px}}
 .vn-rec-dot{width:9px;height:9px;border-radius:50%;background:#d9342b;display:inline-block;box-shadow:0 0 0 0 rgba(217,52,43,.5);animation:vnpulse 1.3s infinite}
 @keyframes vnpulse{0%{box-shadow:0 0 0 0 rgba(217,52,43,.5)}70%{box-shadow:0 0 0 8px rgba(217,52,43,0)}100%{box-shadow:0 0 0 0 rgba(217,52,43,0)}}
 .vn-status{font-size:12px;color:var(--gray);display:inline-flex;align-items:center;gap:6px;margin-left:2px}
 .vn-status.err{color:#b4321f}
 .vn-preview{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 10px;font:inherit;font-size:14px;color:var(--ink);min-height:56px;resize:vertical;line-height:1.45}
 .vn-preview[readonly]{background:#f4f8fb}
 .vn-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
 .vn-hint{font-size:11.5px;color:var(--gray);margin-top:6px}
 .vn-unsupported{font-size:12.5px;color:var(--gray);margin-top:8px;background:#fafbfc;border:1px dashed var(--line);border-radius:9px;padding:9px 11px}
 @media(prefers-reduced-motion:reduce){.vn-rec-dot{animation:none}}
</style>
</head><body>
<header id="ac-head"></header>
<div class="wrap">
  <div class="backbar"><a class="btn ghost sm" href="/admin/dealer.html" onclick="return backToPicker(event)">← All dealers</a>
    <span class="hint" style="margin:0"><a class="link" href="/admin/call-list.html">Who to Call</a> · <a class="link" href="/admin/command-center.html">Command Center</a></span></div>
  <div id="body"><div class="msg">Loading dealer…</div></div>
</div>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script src="/admin/dealer-handout.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Math.round(Number(n||0)).toLocaleString("en-US");
const TKEY="hcps_staff_token", PKEY="hcps_staff_profile";
window.addEventListener("hcps-token",function(e){try{TOKEN=e.detail;}catch(_){}});
let ME=null; try{ME=HCPS.profile()}catch(e){ME=null;}
let TOKEN=HCPS.token(), CUR=null, ALLD=[];
const Q=new URLSearchParams(location.search); const QID=Q.get("id"); const QNAME=Q.get("name");
let SORTKEY="sales_desc";   // Dealer 360 picker sort — default: highest sales first
let HEALTH=null;            // dealer_id -> {score, churn, status} from health-api (loaded lazily for the picker)
const MONTH=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pmOf=p=>{const s=String(p||"").slice(0,7);const[y,m]=s.split("-").map(Number);return y*12+(m-1);};
const pmLabel=pm=>MONTH[((pm%12)+12)%12]+" "+Math.floor(pm/12);
const median=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y);const m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2;};

function gate(msg){$("#body").innerHTML=`<div class="gate"><h2>Staff sign-in</h2><p class="hint" style="margin:2px 0 10px">Sign in with your work email and password.</p><input id="lemail" type="email" placeholder="Email" autocomplete="username"><input id="lpass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitTok()"><button class="go" onclick="submitTok()">Sign in</button><div class="er" id="lerr" style="color:#b42323;margin-top:8px">${msg||""}</div></div>`;setTimeout(()=>{const t=$("#lemail");if(t)t.focus();},50);}
async function submitTok(){
  const email=(($("#lemail")||{}).value||"").trim(), password=(($("#lpass")||{}).value||"");
  const e=$("#lerr"); if(e)e.textContent="Signing in…";
  try{ const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email,password})});
    const j=await r.json().catch(()=>({})); if(!j||!j.ok){ gate((j&&j.message)||"Could not sign in."); return; }
    HCPS.setSession(j); TOKEN=j.token; ME=j.profile; load();
  }catch(err){ gate("Could not reach the server. Try again."); }
}
function lock(){ HCPS.signOut(); TOKEN=null; ME=null; location.reload(); }

async function load(){
  if(!TOKEN){ gate(); return; }
  try{
    const h={authorization:"Bearer "+TOKEN};
    const [dRes,aRes]=await Promise.all([
      fetch("/.netlify/functions/dealers-api",{headers:h}),
      fetch("/.netlify/functions/analytics",{headers:h}).catch(()=>null)
    ]);
    if(dRes.status===401){ gate("Your session ended — sign in again."); return; }
    if(dRes.status===403){ $("#body").innerHTML=`<div class="msg err"><b>President only.</b> <button class="go" onclick="lock()">Sign in as a different user</button></div>`; return; }
    const D=await dRes.json(); if(D.error){ $("#body").innerHTML=`<div class="msg err">${esc(D.error)}</div>`; return; }
    let A={}; try{ A=aRes?await aRes.json():{}; }catch(e){ A={}; }
    render(D,A);
  }catch(e){ $("#body").innerHTML=`<div class="msg err">Couldn't load: ${esc(String(e.message||e))}<br><br><button class="go" onclick="load()">Retry</button></div>`; }
}

function render(D,A){
  const dealers=D.dealers||[];
  ALLD=dealers;   // keep the full list so "← All dealers" can show the 360 picker instantly
  let d = QID ? dealers.find(x=>x.id===QID) : null;
  if(!d && QNAME) d = dealers.find(x=>x.name===QNAME);
  if(!d){
    if(!QID && !QNAME) return renderPicker(dealers);   // opened with no dealer → show the 360 picker
    $("#body").innerHTML=`<div class="msg">Dealer not found. <a class="link" href="/admin/dealer.html">Choose a dealer</a></div>`; return;
  }

  // per-line order history from the analytics cube (facts for this dealer)
  const facts=(A.facts||[]).filter(f=>f.dealer===d.name);
  let latest=0; for(const f of (A.facts||[])){ const pm=pmOf(f.period); if(pm>latest) latest=pm; }
  const byLine=new Map(); const byMonth={};
  for(const f of facts){ const pm=pmOf(f.period);
    let o=byLine.get(f.line); if(!o){ o={pms:new Set(),sales:0,comm:0}; byLine.set(f.line,o); }
    o.pms.add(pm); o.sales+=f.sales||0; o.comm+=f.comm||0;
    byMonth[pm]=(byMonth[pm]||0)+(f.sales||0);
  }
  const lines=[...byLine.entries()].map(([line,o])=>{
    const pms=[...o.pms].sort((a,b)=>a-b);
    const gaps=[]; for(let i=1;i<pms.length;i++)gaps.push(pms[i]-pms[i-1]);
    const cycle=median(gaps);
    const last=pms[pms.length-1], since=latest-last;
    let status="ok";
    if(pms.length>=2 && cycle!=null && cycle>0 && since>=cycle+Math.max(1,Math.round(cycle*0.5))) status="due";
    else if(since>=3) status="dorm";
    return {line,orders:pms.length,first:pms[0],last,cycle,since,sales:o.sales,status};
  }).sort((a,b)=>b.sales-a.sales);

  // activity signals
  const sess=(D.recentSessions||[]).filter(s=>s.dealer_id===d.id).sort((a,b)=>new Date(b.last_seen_at)-new Date(a.last_seen_at))[0];
  const cart=(D.openCarts||[]).filter(c=>c.dealer_id===d.id).sort((a,b)=>b.value-a.value)[0];

  const info=(A.dealerInfo&&A.dealerInfo[d.name])||{};
  const website=info.website||d.website||"";
  const totalSales=d.sales||0, totalComm=d.comm||0;
  const lastPm = lines.length?Math.max(...lines.map(l=>l.last)):null;
  const monthsSince = lastPm!=null?(latest-lastPm):null;

  DOBJ=d;
  // ---- left column ----
  const status = d.status==="review"?`<span class="chip rev">review</span>`:(d.status?`<span class="chip">${esc(d.status)}</span>`:"");
  const rel = d.master?`Branch of <a class="link" href="/admin/dealer.html?name=${encodeURIComponent(d.master)}">${esc(d.master)}</a>`
            : (d.branches&&d.branches.length?`HQ · ${d.branches.length} branch${d.branches.length===1?"":"es"}`:"Standalone");
  const header=`<div class="card" id="hdrCard">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div><h1 style="margin:0;font-size:25px">${esc(d.name)} ${status}</h1>
        <div class="hint" style="margin:3px 0 0">${rel}</div>
        <div class="idrow">
          ${d.rep?`<span>Rep: <b>${esc(d.rep)}</b></span>`:""}
          ${d.hcps_account?`<span>HCPS #: <b>${esc(d.hcps_account)}</b></span>`:""}
          ${d.phone?`<span>☎ ${esc(d.phone)}</span>`:""}
          ${d.email?`<span>✉ <a class="link" href="mailto:${esc(d.email)}">${esc(d.email)}</a></span>`:""}
          ${website?`<span>🌐 <a class="link" href="${esc(/^https?:/i.test(website)?website:'https://'+website)}" target="_blank">${esc(website.replace(/^https?:\/\//,''))}</a></span>`:""}
        </div>
        <div class="idrow">${[d.address,d.city,[d.state,d.zip].filter(Boolean).join(" ")].filter(Boolean).map(esc).join(", ")}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ghost sm" onclick="editCompany()">✎ Edit company info</button>${(d.golden_url||d.golden_status==='Account'||d.golden_status==='Prospect')?`<button class="btn ghost sm" onclick="openGolden(this)" title="Open this dealer's Golden ordering portal (signed one-click sign-in)">🟡 Open Golden portal →</button>`:""}<a class="btn ghost sm" href="/admin/dealers.html?dealer=${encodeURIComponent(d.id)}">Dealer Manager →</a></div>
    </div>
    <div class="stat">
      <div class="s"><div class="l">Total sales</div><div class="v">${money(totalSales)}</div></div>
      <div class="s"><div class="l">Commission</div><div class="v">${money(totalComm)}</div></div>
      <div class="s"><div class="l">Last order</div><div class="v">${lastPm!=null?pmLabel(lastPm):"—"}</div></div>
      <div class="s"><div class="l">Lines bought</div><div class="v">${lines.length}</div></div>
      <div class="s"><div class="l">Contacts</div><div class="v">${(d.contacts||[]).length}</div></div>
    </div>
  </div>`;

  // per-line history table
  const lrows=lines.map(l=>{
    const badge=l.status==="due"?`<span class="pill2 due">Overdue</span>`:l.status==="dorm"?`<span class="pill2 dorm">Dormant</span>`:`<span class="pill2 ok">On track</span>`;
    return `<tr><td class="lbl"><a class="link" href="javascript:void(0)" data-mfr="${esc(l.line)}" onclick="salesSelectByName(this.getAttribute('data-mfr'))">${esc(l.line)}</a></td><td class="num">${l.orders}</td>
      <td>${pmLabel(l.first)} → ${pmLabel(l.last)}</td>
      <td class="num">${l.cycle!=null?"~"+Math.round(l.cycle)+"mo":"—"}</td>
      <td class="num">${l.since}mo</td>
      <td class="num">${money(l.sales)}</td><td>${badge}</td></tr>`;
  }).join("");
  const history=`<div class="card"><h2>Order history by line</h2>
    ${lines.length?`<table><thead><tr><th>Manufacturer</th><th class="num">Orders</th><th>Span</th><th class="num">Cycle</th><th class="num">Since</th><th class="num">Sales</th><th>Status</th></tr></thead><tbody>${lrows}</tbody></table>`:`<div class="hint">No commission history on file for this dealer yet.</div>`}
    <div style="margin-top:12px">${sparkline(byMonth,latest)}</div>
  </div>`;

  // contacts + account numbers — managed live via crm-api (loadContacts)
  const contactsCard=`<div class="card"><h2>Contacts</h2><div id="contacts"><div class="hint">Loading…</div></div></div>`;

  // ---- right column ----
  const sig=[];
  if(cart&&cart.itemCount>0) sig.push(`<div class="row hot">🛒 <div><b>Open cart ${money(cart.value)}</b> · ${cart.itemCount} item${cart.itemCount===1?"":"s"}<div class="hint" style="margin:0">${cart.updated_at?"updated "+new Date(cart.updated_at).toLocaleDateString():""}</div></div></div>`);
  if(sess) sig.push(`<div class="row ${sess.live?'hot':''}">${sess.live?"🟢":"👤"} <div><b>${sess.live?"Online now":"Last login"}</b><div class="hint" style="margin:0">${sess.last_seen_at?new Date(sess.last_seen_at).toLocaleString():""}</div></div></div>`);
  const due=lines.filter(l=>l.status==="due");
  if(due.length) sig.push(`<div class="row warn">⏰ <div><b>${due.length} line${due.length===1?"":"s"} overdue to reorder</b><div class="hint" style="margin:0">${esc(due.slice(0,3).map(l=>l.line).join(", "))}</div></div></div>`);
  if(monthsSince!=null && monthsSince>=3) sig.push(`<div class="row cool">💤 <div><b>Dormant ${monthsSince} months</b><div class="hint" style="margin:0">no orders since ${pmLabel(lastPm)}</div></div></div>`);
  if(!sig.length) sig.push(`<div class="row">✅ <div>No follow-up flags right now.</div></div>`);
  const signals=`<div class="card"><h2>Signals</h2><div class="sig">${sig.join("")}</div>
    <button class="btn sm orange" style="margin-top:10px;width:100%" onclick="sendReengage()">✉ Send re-engagement email</button>
    <div id="reMsg" class="hint" style="margin:6px 0 0"></div></div>`;

  // addresses
  const addrs=(info.addresses||d.addresses||[]);
  const addrCard=addrs.length?`<div class="card"><h2>Addresses <span style="float:right;font-size:11px;color:var(--gray);font-weight:600">${addrs.length}</span></h2>
    ${addrs.map(a=>`<div style="font-size:13px;padding:6px 0;border-bottom:1px solid #eef2f6">${a.pri>=3?"⭐ ":""}${esc([a.address,a.city,[a.state,a.zip].filter(Boolean).join(" ")].filter(Boolean).join(", "))}${a.label?` <span class="chip">${esc(a.label)}</span>`:""}</div>`).join("")}</div>`:"";

  // Notes & tasks (right column) and a standalone Notes card (left, under order history).
  const tasksCard=`<div class="card"><h2>Tasks &amp; timeline</h2><div id="crm"><div class="hint">Loading…</div></div></div>`;
  const notesCard=`<div class="card"><h2>Notes</h2><div id="notes"><div class="hint">Loading…</div></div></div>`;
  const acctCard=`<div class="card"><h2>Manufacturer account numbers</h2><div id="acctcard"><div class="hint">Loading…</div></div></div>`;
  const intelCard=`<div class="card"><h2>Digital activity &amp; interest</h2><div id="intel"><div class="hint">Loading activity…</div></div></div>`;
  const salesCard=`<div class="card" id="salesCard"><h2>Monthly sales &amp; product detail</h2><div id="sales"><div class="hint">Loading sales…</div></div></div>`;
  const commCard=`<div class="card"><h2>Commission — paid vs. outstanding</h2><div id="commled"><div class="hint">Loading…</div></div></div>`;
  const emailCard=`<div class="card" id="emailCard"><h2>Outlook email <span id="emailCount" style="float:right;font-size:11px;color:var(--gray);font-weight:600"></span></h2>
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);font-weight:800;margin:2px 0 6px">✨ AI compose</div>
    <div id="compose"><div class="hint">Loading compose…</div></div>
    <div style="height:1px;background:var(--line);margin:12px 0"></div>
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);font-weight:800;margin:0 0 4px">Recent messages</div>
    <div id="emails"><div class="hint">Loading email…</div></div></div>`;
  const callCard=`<div class="card"><h2>Make a call</h2><div id="callbox"><div class="hint">Loading…</div></div></div>`;
  const touchCard=`<div class="card"><h2>Log a touch</h2><div id="touch"><div class="hint">Loading…</div></div></div>`;
  const handoutCard=`<div class="card" id="handoutCard"><h2>Dealer handout</h2><div id="handout"><div class="hint">Loading…</div></div></div>`;

  // Next best action — synthesized from what we already know (upgraded once intent loads).
  const nba=nextBestAction(d,lines,monthsSince,cart,sess);
  const terr=[d.state,d.city].filter(Boolean).join(" · ");
  const nextBanner=`<div class="card" style="border-left:3px solid #F5821F;background:#fff8ef">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#b45309;font-weight:800">Next best action</div>
        <div id="nbaText" style="font-size:14px;color:var(--navy);margin-top:2px">${nba.ic} ${esc(nba.t)}</div>
        <div class="hint" style="margin:3px 0 0">${d.rep?`Rep ${esc(d.rep)}`:"Unassigned"}${terr?` · Territory ${esc(terr)}`:""}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn sm" onclick="printDealerHandout(CUR)">🖨 Dealer handout</button>
        <button class="btn sm orange" onclick="var e=document.getElementById('la_sum');if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.focus();}">✎ Log a touch</button>
        <a class="btn sm" href="/admin/map.html">🗺 Territory map</a>
      </div>
    </div></div>`;

  // Rep workstation order (left column, top→bottom): Notes → Outlook Email → Make a Call → Log a
  // Touch → Signals & Analytics. Reference sidebar (right): tasks/timeline, contacts, addresses, accounts.
  $("#body").innerHTML=`${header}${nextBanner}
    <div class="d360">

// Compare two picker dealers by the active sort. Falls back to sales, then name, for stable ordering.
function pickerCmp(a,b){
  const H=HEALTH||{};
  const ha=H[a.id]||{}, hb=H[b.id]||{};
  const lp=d=>d.lastPeriod?String(d.lastPeriod).slice(0,10):"";
  const byName=()=>String(a.name||"").localeCompare(String(b.name||""),"en",{sensitivity:"base"});
  const bySalesDesc=()=>(b.sales||0)-(a.sales||0);
  switch(SORTKEY){
    case "sales_asc":   return (a.sales||0)-(b.sales||0) || byName();
    case "name_asc":    return byName();
    case "health_risk": return (hb.churn||0)-(ha.churn||0) || (ha.score||0)-(hb.score||0) || bySalesDesc();
    case "last_recent": { const A=lp(a),B=lp(b); if(A!==B) return A<B?1:-1; return bySalesDesc(); }        // newest first; blanks last
    case "last_overdue":{ const A=lp(a)||"",B=lp(b)||""; if(A!==B) return A<B?-1:1; return bySalesDesc(); }               // never-ordered first, then oldest→newest
    case "sales_desc":
    default:            return bySalesDesc() || byName();
  }
}
// Score one dealer against the query. Prefix matches on the business name rank highest, then account #
// and contact-name prefixes, then "contains" matches — so typing "m" surfaces businesses starting with
// M first, and a contact name or account number finds its dealer. Returns null if nothing matches.
function pickerScore(d,q){
  const toks=q.split(/\s+/).filter(Boolean);
  for(const t of toks){ if(d._hay.indexOf(t)===-1) return null; }   // every word must appear somewhere
  const n=d._name;
  if(n.indexOf(q)===0) return {score:100,why:""};                    // business name starts with query
  for(const w of n.split(/\s+/)){ if(w.indexOf(q)===0) return {score:86,why:""}; }  // a name word starts with it
  if(d._acct && d._acct.indexOf(q)===0) return {score:80,why:"acct #"+d.hcps_account};
  for(const c of d._cnames){ if(c.toLowerCase().indexOf(q)===0) return {score:72,why:"contact: "+c}; }
  if(n.indexOf(q)!==-1) return {score:60,why:""};                    // business name contains query
  for(const c of d._cnames){ if(c.toLowerCase().indexOf(q)!==-1) return {score:52,why:"contact: "+c}; }
  if(d._acct && d._acct.indexOf(q)!==-1) return {score:50,why:"acct #"+d.hcps_account};
  for(const e of d._cemails){ if(e.toLowerCase().indexOf(q)!==-1) return {score:46,why:e}; }
  if(String(d.email||"").toLowerCase().indexOf(q)!==-1) return {score:45,why:d.email};
  for(const a of (d.aliases||[])){ if(String(a).toLowerCase().indexOf(q)!==-1) return {score:40,why:"aka "+a}; }
  if(String(d.rep||"").toLowerCase().indexOf(q)!==-1) return {score:30,why:"rep: "+d.rep};
  return {score:20,why:""};   // matched on city/state/phone, or across several words
}
function sortLabel(){ return {sales_desc:"highest sales",sales_asc:"lowest sales",health_risk:"needs attention",last_recent:"most recent order",last_overdue:"longest since last order",name_asc:"name (A–Z)"}[SORTKEY]||"highest sales"; }
function lastOrderLabel(d){ const p=d.lastPeriod; if(!p) return "no orders yet"; const s=String(p).slice(0,7); const [y,m]=s.split("-"); const mi=(+m)-1; if(mi<0||mi>11) return ""; return "last order "+MONTH[mi]+" '"+String(y).slice(2); }
function healthChip(status){ const map={active:["#e6f6ec","#1c7a44","Active"],slipping:["#fff4e0","#a65b00","Slipping"],overdue:["#fdeaea","#b42323","Overdue"],dormant:["#eef0f3","#5b6672","Dormant"],inactive:["#eef0f3","#5b6672","Inactive"],new:["#e8f0fe","#2c5cc5","New"]}; const m=map[String(status||"").toLowerCase()]; if(!m) return ""; return ` <span style="font-size:11px;color:${m[1]};background:${m[0]};border:1px solid ${m[1]}33;border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap">${m[2]}</span>`; }
function pickerRow(d,why){
  const loc=[d.city,d.state].filter(Boolean).join(", ");
  const sub=[loc, d.rep, d.sales?money(d.sales):"", lastOrderLabel(d)].filter(Boolean).join(" · ");
  const h=(HEALTH||{})[d.id];
  const chip=h&&h.status?healthChip(h.status):"";
  const whyHtml=why?` <span style="font-size:11px;color:#b45309;background:#fdeee0;border:1px solid #f6d5ad;border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap">${esc(why)}</span>`:"";
  return `<a class="prow2" href="/admin/dealer.html?id=${encodeURIComponent(d.id)}"><b>${esc(d.name)}</b> <span class="hint" style="margin:0">${esc(sub)}</span>${chip}${whyHtml}</a>`;
}
function filterPicker(){
  const el=$("#plist"); if(!el) return;
  const q=(($("#dq")||{}).value||"").toLowerCase().trim();
  const meta=$("#pmeta");
  if(!q){
    const list=[...(PICKER||[])].sort(pickerCmp);

    if(meta) meta.textContent=`${(PICKER||[]).length} dealers · sorted by ${sortLabel()} — start typing to find one by business, contact, account # or email.`;

  }
  const scored=[];
  for(const d of (PICKER||[])){ const r=pickerScore(d,q); if(r) scored.push({d,score:r.score,why:r.why}); }
  scored.sort((a,b)=>b.score-a.score || String(a.d.name||"").localeCompare(String(b.d.name||""),"en",{sensitivity:"base"}));
  const shown=scored.slice(0,300);
  el.innerHTML=shown.map(x=>pickerRow(x.d,x.why)).join("")
    || `<div class="hint">No match for “${esc(q)}”. Try a business name, contact name, account #, or email.</div>`;
  if(meta) meta.textContent=scored.length?`${scored.length} match${scored.length===1?"":"es"}${scored.length>300?" — showing top 300":""}`:"";
}

function chartHTML(series,title){
  const W=560,H=210, ml=54,mr=16,mt=26,mb=26, iw=W-ml-mr, ih=H-mt-mb;
  const pts=(series||[]).map(d=>({label:d.label,amount:Number(d.amount)||0}));
  if(!pts.length) return `<div class="hint">No monthly data.</div>`;
  const vmax=niceMax(Math.max(1,...pts.map(p=>p.amount))), n=pts.length;
  const X=i=> n===1? ml+iw/2 : ml+(iw*i/(n-1));
  const Y=v=> mt+ih-(ih*(v/vmax));
  let grid="",ylab=""; [0,vmax/2,vmax].forEach(tv=>{ const gy=Y(tv);
    grid+=`<line x1="${ml}" y1="${gy.toFixed(1)}" x2="${W-mr}" y2="${gy.toFixed(1)}" stroke="#e7edf3" stroke-width="1"/>`;
    ylab+=`<text x="${ml-8}" y="${(gy+3).toFixed(1)}" text-anchor="end" class="cyt">${moneyShort(tv)}</text>`; });
  const geo=[]; let line="";
  pts.forEach((p,i)=>{ const x=X(i),y=Y(p.amount); geo.push({x,y,label:p.label,amount:p.amount}); line+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" "; });
  const area=`M${X(0).toFixed(1)} ${Y(0).toFixed(1)} `+geo.map(g=>`L${g.x.toFixed(1)} ${g.y.toFixed(1)} `).join("")+`L${X(n-1).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const step=Math.max(1,Math.ceil(n/6)); let xlab="";
  for(let i=0;i<n;i+=step){ xlab+=`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" class="cxt">${esc(pts[i].label)}</text>`; }
  if((n-1)%step!==0){ xlab+=`<text x="${X(n-1).toFixed(1)}" y="${H-8}" text-anchor="middle" class="cxt">${esc(pts[n-1].label)}</text>`; }
  const last=geo[geo.length-1];
  const endDot=`<circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="4" fill="#1681c2" stroke="#fff" stroke-width="2"/>`;
  const endLab=`<text x="${last.x.toFixed(1)}" y="${Math.max(mt-6,last.y-9).toFixed(1)}" text-anchor="${last.x>W-70?"end":"middle"}" class="cend">${money(last.amount)}</text>`;
  SCHART={geo,W,H,ml,mr,mt,ih};
  return `<div class="chttl">${esc(title)}</div>
  <svg id="salesSvg" viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(title)}">
    ${grid}${ylab}
    <path d="${area}" fill="#1681c2" fill-opacity="0.10"/>
    <path d="${line}" fill="none" stroke="#1681c2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${endDot}${endLab}${xlab}
    <line id="chCross" x1="0" y1="${mt}" x2="0" y2="${mt+ih}" stroke="#98a6b5" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>
    <circle id="chDot" r="4" fill="#1681c2" stroke="#fff" stroke-width="2" style="display:none"/>
    <rect id="chOv" x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/>
  </svg><div id="chTip" class="chtip" style="display:none"></div>`;
}
function attachChartHover(){
  const svg=document.getElementById("salesSvg"); if(!svg||!SCHART) return;
  const ov=document.getElementById("chOv"), cross=document.getElementById("chCross"), dot=document.getElementById("chDot"), tip=document.getElementById("chTip");
  const wrap=svg.closest(".chwrap"), geo=SCHART.geo;
  function move(e){
    const r=svg.getBoundingClientRect(); const sx=(e.clientX-r.left)/r.width*SCHART.W;
    let best=geo[0],bd=1e9; for(const g of geo){ const d=Math.abs(g.x-sx); if(d<bd){bd=d;best=g;} }
    cross.setAttribute("x1",best.x); cross.setAttribute("x2",best.x); cross.style.display="";
    dot.setAttribute("cx",best.x); dot.setAttribute("cy",best.y); dot.style.display="";
    if(tip&&wrap){ const wr=wrap.getBoundingClientRect();
      const px=(best.x/SCHART.W)*r.width+(r.left-wr.left), py=(best.y/SCHART.H)*r.height+(r.top-wr.top);
      tip.innerHTML=""; const a=document.createElement("div"); a.className="chtv"; a.textContent=money(best.amount);
      const bq=document.createElement("div"); bq.className="chtl"; bq.textContent=best.label; tip.appendChild(a); tip.appendChild(bq);
      tip.style.display=""; tip.style.left=Math.max(2,Math.min(px+8,wr.width-96))+"px"; tip.style.top=Math.max(0,py-40)+"px"; }

  function leave(){ cross.style.display="none"; dot.style.display="none"; if(tip)tip.style.display="none"; }

// One-click into the dealer's Golden portal. Opens the tab inside the click gesture (avoids pop-up
// blocking), then points it at the short-lived signed SSO URL minted server-side.
async function openGolden(btn){
  if(!CUR) return;
  const w=window.open("about:blank","_blank");
  const old=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent="Opening…"; }
  try{
    const j=await fapi({action:"golden_sso_link",dealer_id:CUR});
    if(j&&j.ok&&j.url){ if(w) w.location.href=j.url; else window.location.href=j.url; }
    else { if(w) w.close(); if(btn){ btn.textContent=(j&&j.error==="no_golden_slug")?"No Golden portal on file":"Couldn't open"; setTimeout(()=>{ if(btn) btn.textContent=old; },2600); } }
  }catch(e){ if(w) w.close(); if(btn){ btn.textContent="Couldn't open"; setTimeout(()=>{ if(btn) btn.textContent=old; },2600); } }
  finally{ if(btn) btn.disabled=false; }
}

/* ===================== Voice-to-text notes (Web Speech API) =====================
   Free, browser-native dictation. No backend, no API key, no ongoing cost.
   Works in Chrome/Edge (Android + desktop) and Safari (iOS 14.5+/macOS).
   Nothing is ever posted automatically — text lands in the note field for review. */
var VN_REC=null, VN_ON=false, VN_FINAL="", VN_SUPPORTED=null;
function vnSR(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
function vnEl(id){ return document.getElementById(id); }
function vnStatus(msg, isErr){ var s=vnEl("vnStatus"); if(!s)return; s.innerHTML=(VN_ON?'<span class="vn-rec-dot"></span>':'')+(msg?('<span>'+esc(msg)+'</span>'):''); s.className="vn-status"+(isErr?" err":""); }
function initVoiceNotes(){
  VN_ON=false; VN_FINAL="";
  var SR=vnSR(); VN_SUPPORTED=!!SR;
  var vn=vnEl("vn"), no=vnEl("vnNoSupport");
  if(!VN_SUPPORTED){ if(vn)vn.hidden=true; if(no)no.hidden=false; return; }
  if(vn)vn.hidden=false; if(no)no.hidden=true;
  vnToggleButtons(false);
  vnStatus("Tap to dictate your note.");
}
function vnToggleButtons(recording){
  var st=vnEl("vnStart"), sp=vnEl("vnStop"), pv=vnEl("vnPreview");
  if(st)st.hidden=recording; if(sp)sp.hidden=!recording;
  if(pv)pv.readOnly=recording; // editable only when not actively recording
}
function vnBuildRec(){
  var SR=vnSR(); if(!SR)return null;
  var rec=new SR();
  rec.lang="en-US"; rec.interimResults=true; rec.continuous=true;
  rec.onresult=function(e){
    var interim="";
    for(var i=e.resultIndex;i<e.results.length;i++){
      var t=e.results[i][0].transcript;
      if(e.results[i].isFinal){ VN_FINAL += (VN_FINAL && !/\s$/.test(VN_FINAL)?" ":"")+t.trim(); }
      else interim += t;
    }
    var pv=vnEl("vnPreview"); if(pv){ pv.value=(VN_FINAL+(interim?(" "+interim):"")).replace(/\s{2,}/g," ").replace(/^\s+/,""); pv.scrollTop=pv.scrollHeight; }
  };
  rec.onerror=function(e){
    var msg;
    switch(e.error){
      case "not-allowed": case "service-not-allowed": msg="Microphone blocked — allow mic access for this site, then try again."; VN_ON=false; vnToggleButtons(false); break;
      case "audio-capture": msg="No microphone found."; VN_ON=false; vnToggleButtons(false); break;
      case "no-speech": msg="Didn't catch that — keep talking or tap Stop."; break;
      case "network": msg="Network needed for transcription — check your connection."; break;
      case "aborted": return; // user-initiated stop
      default: msg="Voice error ("+e.error+").";
    }
    vnStatus(msg, true);
  };
  rec.onend=function(){
    // Some browsers (esp. iOS) end after a pause. If the user is still recording, resume.
    if(VN_ON){ try{ rec.start(); }catch(_){ } }
    else { vnToggleButtons(false); }
  };
  return rec;
}
function vnStart(){
  if(!vnSR()){ initVoiceNotes(); return; }
  if(VN_ON) return;
  if(!VN_REC) VN_REC=vnBuildRec();
  // continue from whatever is already in the preview (manual edits included)
  var pv=vnEl("vnPreview"); VN_FINAL = pv && pv.value.trim() ? pv.value.trim() : "";
  VN_ON=true; vnToggleButtons(true); vnStatus("Listening…");
  try{ VN_REC.start(); }catch(_){ /* start() throws if already started */ }
}
function vnStop(){
  VN_ON=false;
  if(VN_REC){ try{ VN_REC.stop(); }catch(_){ } }
  vnToggleButtons(false);
  var pv=vnEl("vnPreview");
  vnStatus(pv && pv.value.trim() ? "Stopped — review & edit, then Insert into note." : "Stopped. Nothing captured — try again.");
}
function vnClearPreview(){
  VN_FINAL=""; var pv=vnEl("vnPreview"); if(pv)pv.value="";
  vnStatus(VN_ON?"Listening…":"Cleared. Tap Start to dictate.");
}
function vnRerecord(){
  if(VN_ON){ VN_ON=false; if(VN_REC){ try{VN_REC.stop();}catch(_){}} }
  vnClearPreview();
  setTimeout(vnStart, 180); // let the previous session tear down first
}
function vnInsert(){
  var pv=vnEl("vnPreview"); var nb=vnEl("nbody");
  var t=pv?pv.value.trim():""; if(!t){ vnStatus("Nothing to insert — dictate a note first.", true); return; }
  if(nb){ nb.value=(nb.value.trim()? nb.value.replace(/\s+$/,"")+"\n":"")+t; nb.focus(); nb.scrollTop=nb.scrollHeight; }
  vnClearPreview();
  vnStatus("Inserted into your note — review it, then tap Post note.");
}

  await crm(body); loadCRM();
}
async function startOpp(line){
  const t=(prompt("New opportunity for this dealer:", line?(line+" adoption"):"")||"").trim(); if(!t) return;
  const val=prompt("Estimated annual value ($)? (optional)","");
  await fetch("/.netlify/functions/pipeline-api",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+TOKEN},body:JSON.stringify({action:"add",dealer_id:CUR,title:t,line:line||"",value:Number(val)||0,source:"crosssell"})});
  loadCRM();
}
async function taskAction(id,act){ await crm({action:act,id}); loadCRM(); }
async function sendReengage(){
  if(!CUR) return;
  if(!confirm("Send the 'we've missed you — come back and reorder' email to this dealer's contact?")) return;
  const el=$("#reMsg"); if(el) el.textContent="Sending…";
  const j=await crm({action:"send_reengagement",dealer_id:CUR});
  if(el) el.textContent = j.ok ? ("✓ Sent to "+j.to) : ("⚠ "+(j.message||j.error||"couldn't send"));
  if(j.ok) loadCRM();
}

// tiny monthly sales sparkline (single series, this dealer)
function sparkline(byMonth,latest){
  const keys=Object.keys(byMonth).map(Number).sort((a,b)=>a-b);
  if(keys.length<2) return "";
  const min=keys[0], max=latest||keys[keys.length-1];
  const span=Math.max(1,max-min);
  const vmax=Math.max(1,...keys.map(k=>byMonth[k]));
  const W=680,H=70,pad=4;
  const x=pm=>pad+((pm-min)/span)*(W-2*pad);
  const y=v=>H-pad-(v/vmax)*(H-2*pad);
  let dd="",started=false,pts="";
  for(let pm=min;pm<=max;pm++){ const v=byMonth[pm]; if(v==null){ started=false; continue; } const cx=x(pm),cy=y(v); dd+=(started?"L":"M")+cx.toFixed(1)+" "+cy.toFixed(1)+" "; started=true; pts+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="2.5" fill="#1681c2"><title>${pmLabel(pm)}: ${money(v)}</title></circle>`; }
  return `<div class="hint" style="margin:0 0 4px">Monthly sales</div><svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${dd}" fill="none" stroke="#1681c2" stroke-width="2" stroke-linejoin="round"/>${pts}</svg>`;
}

/* ---------- Dealer leave-behind handout (ported from the Territory Map) ---------- */
const ORDERING_URL=DealerHandout.ORDERING_URL;
const HANDOUT_UPDATES=DealerHandout.UPDATES.slice();
let HANDOUT={ordering_url:ORDERING_URL, updates:HANDOUT_UPDATES.slice()};
const fmtUsd=n=>"$"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
async function rapi(body){ const h={"content-type":"application/json"}; if(TOKEN)h["authorization"]="Bearer "+TOKEN;
  const r=await fetch("/.netlify/functions/routes-api",{method:"POST",headers:h,body:JSON.stringify(body)}); return r.json().catch(()=>({})); }
async function printDealerHandout(id){
  id=id||CUR; if(!id) return;
  const w=window.open("","_blank"); if(!w){ alert("Allow pop-ups to print the handout."); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><body style="font:15px Arial;margin:28px;color:#5b6672">Preparing dealer handout…</body>'); w.document.close();
  try{ const s=await rapi({action:"get_settings",key:"handout"}); if(s&&s.ok&&s.value){ HANDOUT={ordering_url:s.value.ordering_url||ORDERING_URL, updates:Array.isArray(s.value.updates)&&s.value.updates.length?s.value.updates:HANDOUT_UPDATES.slice()}; } }catch(e){}
  let c={};
  try{ const r=await rapi({action:"business_case",dealer_ids:[id]}); c=(r&&r.cases&&r.cases[id])||{}; }catch(e){}
  try{ w.document.open(); w.document.write(handoutHtml(c)); w.document.close(); }catch(e){}
}
function handoutHtml(c){ return DealerHandout.html(c, {HANDOUT:HANDOUT, ME:ME}); }

/* ---------- Handout curation: featured-pick preview + per-manufacturer exclude toggles ---------- */
let HBC=null;
async function loadHandout(){
  const el=$("#handout"); if(!el||!CUR) return;
  el.innerHTML='<div class="hint">Loading…</div>';
  let c={}; try{ const r=await rapi({action:"business_case",dealer_ids:[CUR]}); c=(r&&r.cases&&r.cases[CUR])||{}; }catch(e){}
  HBC=c; renderHandout();
}
function renderHandout(){
  const el=$("#handout"); if(!el) return;
  const c=HBC||{}; const cx=c.crossover;
  const basisLabel={engagement:"Portal engagement",regional:"Regional demand",fit:"Product fit",reorder:"Re-stock"};
  const feat = cx
    ? `<div style="border:1px solid #fed7aa;background:#fff8f0;border-radius:10px;padding:10px 12px;margin-bottom:10px">
        <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:#b45309;font-weight:800">Featured on the handout${cx.basis?` · ${esc(basisLabel[cx.basis]||cx.basis)}`:""}</div>
        <div style="font-weight:800;color:var(--navy);margin-top:2px">${esc(cx.name||"")}</div>
        <div class="hint" style="margin-top:2px">${esc(cx.reason||"")}</div>
      </div>`
    : `<div class="hint" style="margin-bottom:10px">No featured opportunity right now — every approved line is either already stocked or excluded.</div>`;
  const opps=(c.opps||[]), excluded=(c.excluded||[]), featSlug=cx&&cx.slug;
  const row=(m,isEx)=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)">
      <input type="checkbox" ${isEx?"checked":""} onchange="toggleExclude('${esc(String(m.slug).replace(/'/g,"\\'"))}',this.checked,this)">
      <span style="flex:1">${esc(m.name||m.slug)}${(!isEx&&m.slug===featSlug)?` <span style="font-size:10px;color:#b45309;font-weight:800">★ featured</span>`:""}</span>
      <span class="hint">${isEx?"excluded":"eligible"}</span>
    </label>`;
  const list = (opps.length||excluded.length)
    ? `<div style="font-size:12px;color:var(--gray);margin:2px 0 4px">Tick a manufacturer to exclude it from this dealer's handout — poor fits won't be featured or suggested. Affects the handout only; the account's lines and CRM are unchanged.</div>${opps.map(m=>row(m,false)).join("")}${excluded.map(m=>row(m,true)).join("")}`
    : `<div class="hint">No opportunity lines to curate for this dealer yet.</div>`;
  el.innerHTML=`${feat}${list}
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
      <button class="btn sm" onclick="printDealerHandout(CUR)">🖨 Print handout</button>
      <span id="hox_msg" class="hint"></span>
    </div>`;
}
async function toggleExclude(slug,on,elm){
  const msg=$("#hox_msg"); if(msg)msg.textContent="Saving…";
  if(elm) elm.disabled=true;
  try{
    const r=await rapi({action:"set_handout_exclusion",dealer_id:CUR,manufacturer:slug,excluded:on});
    if(!(r&&r.ok)) throw new Error((r&&r.error)||"failed");
    await loadHandout();   // refresh so the featured pick re-computes live
  }catch(e){
    if(elm){ elm.checked=!on; elm.disabled=false; }
    if(msg) msg.textContent = /not your account/.test(String(e.message))?"You can only exclude on your own accounts.":"Couldn't save.";
  }
}

load();
