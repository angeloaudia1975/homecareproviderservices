<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS Admin — Campaign Studio</title>
<link rel="stylesheet" href="/admin/admin-shell.css">
<style>
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
 .fld{display:block;margin:8px 0}.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);font-weight:700;margin:0 0 3px}
 .fld input,.fld select,.fld textarea{width:100%;box-sizing:border-box;font-family:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
 .btn2{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
 .btn2.ghost{background:#eef2f6;color:var(--navy)}.btn2[disabled]{opacity:.5;cursor:default}
 .conn{border-radius:12px;padding:12px 15px;margin:0 0 16px;font-size:13.5px}
 .conn.ok{background:#e7f4ee;color:#166b45;border:1px solid #bfe4cf}
 .conn.no{background:#fdf7ec;color:#8a5d12;border:1px solid #f0dcae}
 .scopes{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin:6px 0;user-select:all}
 .subj{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dotted var(--line)}
 .subj .v{background:#eef3f8;border-radius:6px;padding:2px 7px;font-size:11px;color:var(--gray)}
 .prev{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;max-height:340px;overflow:auto}
 .tt{width:100%;border-collapse:collapse;font-size:13px}.tt th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--gray);padding:7px 9px;border-bottom:2px solid var(--line)}.tt td{padding:8px 9px;border-bottom:1px solid #eef2f6}
 .bdg{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;background:#eef2f6;color:#5c6b7a}
 .bdg.pushed{background:#e7f1f9;color:#1568a6}.bdg.draft{background:#fdf4e6;color:#8a5d12}
 .hint2{font-size:12px;color:var(--gray)}
</style>
</head><body>
<header id="ac-head"></header>
<div class="wrap">
  <div class="top"><div><h1>Campaign Studio</h1><div class="sub">Give a brief; the portal builds the audience, copy &amp; sequence, then drafts it into Zoho for your review.</div></div></div>
  <div id="conn"></div>
  <div id="body"><div class="msg">Loading…</div></div>
</div>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
window.addEventListener("hcps-token",function(e){try{TOKEN=e.detail;}catch(_){}});
let ME=null; try{ME=HCPS.profile()}catch(e){ME=null;}
let TOKEN=HCPS.token(), STATUS=null, SEGS=[], MFRS=[], REPS=[], STATES=[], CUR=null, SEQ=[];
let AUDS=[], APREV=null;   // saved Target Audiences + the live breakdown of the selected one
let EXCL=new Set(), RQ="";  // pre-send review: excluded recipient emails + list filter
const jesc=s=>String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
function qparam(k){ try{ return new URLSearchParams(location.search).get(k)||""; }catch(e){ return ""; } }
const num=n=>Number(n||0).toLocaleString("en-US");
const GOALS=[["manufacturer_intro","Manufacturer introduction"],["launch","New product launch"],["promo","Promotion / offer"],["cross_sell","Cross-sell"],["reactivation","Reactivation"],["acquisition","Dealer acquisition"]];

function gate(msg){$("#body").innerHTML=`<div class="gate"><h2>Staff sign-in</h2><p class="hint" style="margin:2px 0 10px">Sign in with your work email and password.</p><input id="lemail" type="email" placeholder="Email" autocomplete="username"><input id="lpass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitTok()"><button class="go" onclick="submitTok()">Sign in</button><div class="er" id="lerr" style="color:#b42323;margin-top:8px">${msg||""}</div></div>`;setTimeout(()=>{const t=$("#lemail");if(t)t.focus();},50);}
async function submitTok(){
  const email=(($("#lemail")||{}).value||"").trim(), password=(($("#lpass")||{}).value||"");
  const e=$("#lerr"); if(e)e.textContent="Signing in…";
  try{ const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email,password})});
    const j=await r.json().catch(()=>({})); if(!j||!j.ok){ gate((j&&j.message)||"Could not sign in."); return; }
    HCPS.setSession(j); TOKEN=j.token; ME=j.profile; boot();
  }catch(err){ gate("Could not reach the server. Try again."); }
}
async function api(payload){ const r=await fetch("/.netlify/functions/campaign-api",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+TOKEN},body:JSON.stringify(payload)}); return {status:r.status,body:await r.json().catch(()=>({}))}; }

async function boot(){
  if(!TOKEN){ gate(); return; }
  const [st,sg,au]=await Promise.all([api({action:"zoho_status"}),api({action:"segments"}),api({action:"audiences"})]);
  if(st.status===401){ gate("Your session ended — sign in again."); return; }
  STATUS=st.body||{}; SEGS=(sg.body&&sg.body.segments)||[]; MFRS=(sg.body&&sg.body.manufacturers)||[]; REPS=(sg.body&&sg.body.reps)||[]; STATES=(sg.body&&sg.body.states)||[];
  AUDS=(au.body&&au.body.audiences)||[];
  renderConn(); renderBuilder(); loadList(); loadAudStats();
  const pre=qparam("audience"); if(pre){ const sel=$("#c_aud"); if(sel){ sel.value=pre; audChange(); } }
}
function renderConn(){
  const c=$("#conn");
  if(STATUS.ready){ c.className=""; c.innerHTML=`<div class="conn ok">✓ Connected to Zoho Campaigns — drafts can be pushed for review.</div>`; return; }
  const scopes=(STATUS.scopes||[]).join(",");
  c.innerHTML=`<div class="conn no">
    <b>Zoho Campaigns isn't connected yet.</b> ${STATUS.creds_set?"":"First set <code>ZOHO_CLIENT_ID</code> and <code>ZOHO_CLIENT_SECRET</code> in Netlify. Then, "}in the Zoho <a href="https://api-console.zoho.com/" target="_blank" rel="noopener">API Console</a> → your Self Client → <b>Generate Code</b>, use these scopes:
    <div class="scopes">${esc(scopes)}</div>
    Pick a 10-minute duration, generate the code, and paste it here:
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><input id="zcode" placeholder="Paste the Self Client code" style="flex:1;min-width:220px;padding:7px 9px;border:1px solid #e0cfa0;border-radius:8px;font-family:inherit">
      <button class="btn2" onclick="connectZoho()">Connect</button></div>
    <div id="zmsg" class="hint2" style="margin-top:6px"></div></div>`;
}
async function connectZoho(){
  const code=(($("#zcode")||{}).value||"").trim(); const m=$("#zmsg"); if(!code){ if(m)m.textContent="Paste the code first."; return; }
  if(m)m.textContent="Connecting…";
  const r=await api({action:"connect_zoho",code});
  if(r.body&&r.body.ok){ if(m)m.textContent="Connected ✓"; STATUS.ready=true; renderConn(); }
  else if(m) m.textContent=(r.body&&r.body.message)||"Couldn't connect.";
}
function renderBuilder(){
  const goalOpts=GOALS.map(g=>`<option value="${g[0]}">${g[1]}</option>`).join("");
  const segOpts=SEGS.map(s=>`<option value="${esc(s.key)}" data-mfr="${s.needs_mfr?1:0}">${esc(s.label)}${s.count!=null?` (${num(s.count)})`:""}</option>`).join("");
  const mfrOpts=`<option value="">— pick a manufacturer —</option>`+MFRS.map(m=>`<option value="${esc(m.slug)}">${esc(m.name)}</option>`).join("");
  const audOpts=`<option value="">— none: build a live segment below —</option>`+AUDS.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} · ${num(a.contact_count||0)} contacts${a.type==="dynamic"?" (dynamic)":""}</option>`).join("");
  $("#body").innerHTML=`<div class="grid2">
    <div class="card"><h2>New campaign</h2>
      <div class="fld"><label>Campaign name</label><input id="c_name" placeholder="e.g. Bemis prospects — Q3"></div>
      <div class="fld"><label>Goal</label><select id="c_goal">${goalOpts}</select></div>
      <div class="fld"><label>Saved Target Audience <span class="hint2">(from the Audience Builder)</span></label><select id="c_aud" onchange="audChange()">${audOpts}</select></div>
      <div id="audPrev"></div>
      <div id="segWrap">
        <div class="fld"><label>Audience segment</label><select id="c_seg" onchange="segChange()">${segOpts}</select></div>
      </div>
      <div class="fld" id="mfrWrap"><label>Manufacturer / line</label><select id="c_mfr">${mfrOpts}</select></div>
      <div class="fld"><label>Offer / message <span class="hint2">(optional)</span></label><input id="c_offer" placeholder="e.g. intro pricing through Q3"></div>
      ${STATUS&&STATUS.ai_available?`<div class="fld"><label style="display:flex;align-items:center;gap:7px;text-transform:none;font-weight:600;color:var(--navy)"><input type="checkbox" id="c_ai" checked style="width:auto"> Write copy with AI <span class="hint2">(falls back to templates if it can't)</span></label></div>`:""}
      <div id="narrowWrap" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="fld"><label>Narrow by state <span class="hint2">(optional)</span></label><select id="c_state"><option value="">— all states —</option>${STATES.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select></div>
        <div class="fld"><label>Narrow by rep <span class="hint2">(optional)</span></label><select id="c_rep"><option value="">— all reps —</option>${REPS.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select></div>
      </div>
      <button class="btn2" id="genBtn" onclick="generate()">Generate campaign →</button>
      <div id="genMsg" class="hint2" style="margin-top:6px"></div>
    </div>
    <div class="card"><h2>Saved campaigns</h2><div id="list"><div class="hint2">Loading…</div></div></div>
  </div>
  <div id="audstats" style="margin-top:16px"></div>
  <div id="review"></div>`;
  segChange();
}
function audId(){ return (($("#c_aud")||{}).value||"").trim(); }
function segChange(){
  const w=$("#mfrWrap"); if(!w) return;
  // With a saved audience the recipients are fixed, but the line still drives the
  // copy & product images — so keep manufacturer available.
  if(audId()){ w.style.display="block"; return; }
  const sel=$("#c_seg"); const needs=sel&&sel.options[sel.selectedIndex]&&sel.options[sel.selectedIndex].getAttribute("data-mfr")==="1";
  w.style.display=needs?"block":"none";
}
async function audChange(){
  const id=audId(); const seg=$("#segWrap"), nar=$("#narrowWrap"), pv=$("#audPrev"); const on=!!id;
  // A saved audience already defines who receives it — hide the live-segment controls.
  if(seg) seg.style.display=on?"none":"block";
  if(nar) nar.style.display=on?"none":"grid";
  segChange();
  if(!on){ APREV=null; if(pv)pv.innerHTML=""; return; }
  if(pv) pv.innerHTML=`<div class="hint2" style="margin:2px 0 10px">Resolving audience…</div>`;
  const r=await api({action:"preview_audience",audience_id:id});
  if(r.body&&r.body.ok){ APREV=r.body; renderAudPrev(); } else { APREV=null; if(pv)pv.innerHTML=`<div class="hint2" style="color:#b42323">Couldn't resolve this audience.</div>`; }
}
function renderAudPrev(){
  const pv=$("#audPrev"); if(!pv||!APREV) return; const bd=APREV.breakdown||{};
  pv.innerHTML=`<div style="background:#f6f9fc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:2px 0 12px">
    <div style="font-size:12px;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Send audience — ${esc(APREV.audience.name||"")}</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px">
      <span><b>${num(bd.companies||0)}</b> companies</span>
      <span><b>${num(bd.contacts||0)}</b> contacts</span>
      <span style="color:#166b45"><b>${num(bd.valid||0)}</b> will send</span>
      ${bd.unsubscribed?`<span style="color:#8a5d12"><b>${num(bd.unsubscribed)}</b> unsubscribed</span>`:""}
      ${bd.invalid?`<span style="color:#b42323"><b>${num(bd.invalid)}</b> invalid</span>`:""}
    </div></div>`;
}
async function generate(){
  const brief={ name:(($("#c_name")||{}).value||"").trim(), goal:($("#c_goal")||{}).value, segment:($("#c_seg")||{}).value,
    audience_id:audId()||"",
    manufacturer:($("#c_mfr")||{}).value||"", offer:(($("#c_offer")||{}).value||"").trim(),
    state:($("#c_state")||{}).value||"", rep:($("#c_rep")||{}).value||"",
    use_ai: $("#c_ai")? !!$("#c_ai").checked : undefined };
  const m=$("#genMsg"), btn=$("#genBtn"); if(btn)btn.disabled=true; if(m)m.textContent="Building audience & copy…";
  const r=await api({action:"generate",brief});
  if(btn)btn.disabled=false;
  if(r.body&&r.body.ok){ CUR=r.body.campaign; if(m)m.textContent=""; renderReview(); loadList(); window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); }
  else if(m) m.textContent=(r.body&&r.body.error)||"Couldn't generate.";
}
function sampleContact(){ const s=((CUR&&CUR.audience&&CUR.audience.sample)||[])[0]||{}; return {first:(String(s.name||"").trim().split(/\s+/)[0]||"there"), company:(s.company||s.name||"your dealership")}; }
function personalize(html){ const s=sampleContact(); return String(html||"").split("{{first_name}}").join(esc(s.first)).split("{{company}}").join(esc(s.company)); }
function renderReview(){
  if(!CUR){ $("#review").innerHTML=""; return; }
  const g=CUR.generated||{}, a=CUR.audience||{}; const bd=a.breakdown||null;
  const pushed=!!CUR.zoho_campaign_key;
  EXCL=new Set(((a.exclusions)||[]).map(e=>String(e||"").toLowerCase())); RQ="";
  const audLine = bd
    ? `Audience: <b>${num(bd.send||a.count||0)}</b> will send · ${num(bd.companies||0)} companies · ${num(bd.contacts||0)} contacts${a.audience_name?` · “${esc(a.audience_name)}”`:""}${bd.unsubscribed?` · ${num(bd.unsubscribed)} unsubscribed`:""}${bd.invalid?` · ${num(bd.invalid)} invalid`:""}`
    : `Audience: <b>${num(a.count||0)}</b> dealers with email · segment: ${esc(CUR.segment||"")}${CUR.manufacturer?` · ${esc(CUR.manufacturer)}`:""}`;
  $("#review").innerHTML=`<div class="card" style="margin-top:16px">
    <h2>${esc(CUR.name||"Campaign")} <span class="bdg ${pushed?"pushed":"draft"}">${pushed?"pushed to Zoho":"draft"}</span>${(g.ai_used)?` <span class="bdg" style="background:#efe9fb;color:#6b4bb4">✦ AI-written</span>`:""}</h2>
    <div class="hint2" style="margin:-4px 0 12px">${audLine}</div>
    <div class="grid2">
      <div>
        <label class="hint2" style="font-weight:700">Subject lines <span style="font-weight:400">(first is primary)</span></label>
        <div class="fld"><input id="r_subject" value="${esc((g.subjects||[])[0]||"")}"></div>
        ${(g.subjects||[]).slice(1).map(s=>`<div class="subj"><span class="v">alt</span> ${esc(s)}</div>`).join("")}
        <div class="fld" style="margin-top:10px"><label>Preheader</label><input id="r_pre" value="${esc(g.preheader||"")}"></div>
        <h3 style="font-size:12px;text-transform:uppercase;color:var(--gray);margin:14px 0 4px">Sequence <span style="font-weight:400;text-transform:none;color:var(--gray)">— 5 touches to convert (edit or add)</span></h3>
        <div id="seqBox"></div>
        <div class="hint2" style="margin-top:8px">Suggested send: ${esc((g.schedule&&g.schedule.recommended)||"")}</div>
      </div>
      <div>
        <label class="hint2" style="font-weight:700">Email preview <span style="font-weight:400">— sample for ${esc(sampleContact().company)}</span></label>
        <div class="prev" id="r_prev">${personalize(g.body_html||"")}</div>
        <div class="hint2" style="margin:6px 0 0">✎ Personalized per dealer: <code>{{first_name}}</code> and <code>{{company}}</code> merge to each recipient's name &amp; dealership at send. Preview shows one sample.</div>
        <details style="margin-top:8px"><summary class="hint2" style="cursor:pointer">Edit HTML</summary>
          <textarea id="r_body" rows="8" style="width:100%;box-sizing:border-box;font-family:ui-monospace,monospace;font-size:11.5px;margin-top:6px" oninput="document.getElementById('r_prev').innerHTML=personalize(this.value)">${esc(g.body_html||"")}</textarea></details>
      </div>
    </div>
    <div id="recips" style="margin-top:14px"></div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn2 ghost" onclick="saveCampaign()">Save edits</button>
      <button class="btn2" onclick="pushZoho()" ${STATUS.ready?"":"disabled title='Connect Zoho first'"}>Push draft to Zoho →</button>
      ${pushed?`<button class="btn2 ghost" onclick="getResults()">Refresh results</button>`:""}
    </div>
    <div id="rmsg" class="hint2" style="margin-top:8px"></div></div>`;
  SEQ=((CUR.generated||{}).sequence||[]).slice(); renderSeq(); renderRecips();
}
// ---- Pre-send contact review: view the send list, exclude individual recipients ----
function effCount(){ const t=((CUR&&CUR.audience&&CUR.audience.sample)||[]).length; return Math.max(0,t-EXCL.size); }
function recipSummary(){ return `Review recipients — <b>${num(effCount())}</b> will send${EXCL.size?` · ${num(EXCL.size)} excluded`:""}`; }
function renderRecips(){
  const host=$("#recips"); if(!host) return;
  const list=((CUR&&CUR.audience&&CUR.audience.sample)||[]);
  if(!list.length){ host.innerHTML=`<div class="hint2">Individual recipient review isn't available for this campaign — regenerate it to load the contact list.</div>`; return; }
  host.innerHTML=`<details><summary style="cursor:pointer;font-weight:700;font-size:13px;color:var(--navy)">${recipSummary()}</summary>
    <div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
        <input id="rq" placeholder="Filter by company, name or email…" value="${esc(RQ)}" oninput="RQ=this.value;paintRecips()" style="flex:1;min-width:200px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit">
        <button class="btn2 ghost" onclick="saveExcl()" title="Save which contacts to skip before pushing">Save recipient list</button>
      </div>
      <div class="hint2" style="margin-bottom:6px">Uncheck anyone you don't want to email. Excluded contacts are skipped when the draft is pushed to Zoho.</div>
      <div id="recipRows" style="max-height:320px;overflow:auto"></div>
    </div></details>`;
  paintRecips();
}
function paintRecips(){
  const box=$("#recipRows"); if(!box) return;
  const q=RQ.trim().toLowerCase();
  const list=((CUR&&CUR.audience&&CUR.audience.sample)||[]);
  const rows=list.filter(s=>!q||[s.company,s.name,s.email].some(v=>String(v||"").toLowerCase().includes(q)));
  box.innerHTML=`<table class="tt"><tbody>${rows.map(s=>{ const ex=EXCL.has(String(s.email||"").toLowerCase());
    return `<tr style="${ex?"opacity:.5":""}"><td style="width:22px"><input type="checkbox" ${ex?"":"checked"} onclick="toggleExcl('${jesc(s.email)}')" title="Uncheck to exclude"></td>
      <td><b>${esc(s.company||"")}</b>${s.name?`<div class="hint2">${esc(s.name)}</div>`:""}</td>
      <td class="hint2" style="${ex?"text-decoration:line-through":""}">${esc(s.email||"")}</td></tr>`;
  }).join("")}</tbody></table>${rows.length?"":'<div class="hint2" style="padding:6px 0">No contacts match that filter.</div>'}`;
}
function toggleExcl(email){ const lo=String(email||"").toLowerCase(); if(EXCL.has(lo))EXCL.delete(lo); else EXCL.add(lo);
  const s=document.querySelector("#recips summary"); if(s) s.innerHTML=recipSummary(); paintRecips();
}
async function saveExcl(){ if(!CUR) return {body:{}}; const m=$("#rmsg"); if(m)m.textContent="Saving recipient list…";
  const r=await api({action:"exclude",id:CUR.id,emails:[...EXCL]});
  if(r.body&&r.body.ok){ if(CUR.audience)CUR.audience.exclusions=[...EXCL]; if(m)m.textContent=`Recipient list saved — ${num(r.body.will_send)} will send.`; }
  else if(m)m.textContent="Couldn't save the recipient list.";
  return r;
}
function renderSeq(){
  const box=$("#seqBox"); if(!box) return;
  box.innerHTML=(SEQ||[]).map((x,i)=>`<div style="display:flex;gap:6px;align-items:center;margin:4px 0">
    <span class="bdg" style="min-width:56px;text-align:center">Touch ${i+1}</span>
    <input type="number" min="0" value="${Number(x.wait_days)||0}" title="days after start" style="width:60px;padding:5px 7px;border:1px solid var(--line);border-radius:6px" onchange="SEQ[${i}].wait_days=Math.max(0,parseInt(this.value,10)||0)"><span class="hint2">days</span>
    <input value="${esc(x.subject||"")}" placeholder="Subject line" style="flex:1;min-width:0;padding:5px 7px;border:1px solid var(--line);border-radius:6px" onchange="SEQ[${i}].subject=this.value">
    <button class="btn2 ghost" style="padding:5px 9px" title="Remove touch" onclick="removeTouch(${i})">✕</button></div>`).join("")
    +`<button class="btn2 ghost" style="margin-top:6px" onclick="addTouch()">+ Add touch</button>`;
}
function addTouch(){ const last=(SEQ&&SEQ.length)?SEQ[SEQ.length-1]:{wait_days:0}; SEQ.push({step:SEQ.length+1,wait_days:(Number(last.wait_days)||0)+7,purpose:"Follow-up",subject:""}); renderSeq(); }
function removeTouch(i){ SEQ.splice(i,1); SEQ.forEach((s,k)=>s.step=k+1); renderSeq(); }
async function saveCampaign(){
  if(!CUR) return; const m=$("#rmsg"); if(m)m.textContent="Saving…";
  const g=Object.assign({},CUR.generated||{});
  const s0=(($("#r_subject")||{}).value||"").trim(); if(s0){ g.subjects=[s0].concat((g.subjects||[]).slice(1)); }
  g.preheader=(($("#r_pre")||{}).value||"").trim();
  const bd=$("#r_body"); if(bd) g.body_html=bd.value;
  if(SEQ&&SEQ.length) g.sequence=SEQ.map((s,i)=>({...s,step:i+1}));
  const r=await api({action:"update",id:CUR.id,patch:{generated:g,name:CUR.name}});
  if(r.body&&r.body.ok){ CUR.generated=g; if(m)m.textContent="Saved ✓"; } else if(m) m.textContent="Couldn't save.";
}
async function pushZoho(){
  if(!CUR) return; const m=$("#rmsg");
  if(EXCL.size && !confirm(`${num(EXCL.size)} contact${EXCL.size===1?"":"s"} excluded — push the draft to Zoho for the remaining ${num(effCount())}?`)) return;
  if(m)m.textContent="Saving & pushing draft to Zoho…";
  await saveCampaign();
  await saveExcl();   // persist any pre-send exclusions so the push skips them
  const r=await api({action:"push_to_zoho",id:CUR.id});
  if(r.body&&r.body.ok){ if(m)m.textContent="Draft created in Zoho ✓ — open Zoho Campaigns to review and send."; CUR.zoho_campaign_key=r.body.zoho_campaign_key; renderReview(); loadList(); }
  else if(r.body&&r.body.not_configured){ if(m)m.textContent="Connect Zoho Campaigns first (panel at the top)."; }
  else if(m) m.textContent=(r.body&&r.body.message)||"Couldn't push.";
}
async function getResults(){ if(!CUR)return; const m=$("#rmsg"); if(m)m.textContent="Fetching results…"; const r=await api({action:"results",id:CUR.id}); if(m)m.textContent=(r.body&&r.body.ok)?"Results updated.":((r.body&&r.body.message)||"No results yet."); }
async function openCampaign(id){ const r=await api({action:"get",id}); if(r.body&&r.body.ok){ CUR=r.body.campaign; renderReview(); window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); } }
// ---- Per-audience performance -------------------------------------------------
let ASTATS=[], ASOPEN=null;
const pct=x=>(x==null?'<span class="hint2">—</span>':`${Math.round(x*1000)/10}%`);
async function loadAudStats(refresh){
  const host=$("#audstats"); if(!host) return;
  if(refresh){ host.innerHTML=`<div class="card"><h2>Audience performance</h2><div class="hint2">Refreshing from Zoho…</div></div>`; }
  const r=await api({action:"audience_stats",refresh:!!refresh});
  ASTATS=(r.body&&r.body.stats)||[];
  renderAudStats();
}
function renderAudStats(){
  const host=$("#audstats"); if(!host) return;
  if(!ASTATS.length){ host.innerHTML=`<div class="card"><h2>Audience performance</h2><div class="hint2">No saved-audience campaigns yet. Build a campaign from a Target Audience and its results will roll up here per audience.</div></div>`; return; }
  const rows=ASTATS.map(s=>{
    const open=ASOPEN===s.id;
    const metrics = s.haveMetrics
      ? `<td class="num">${num(s.totals.sent)}</td><td class="num">${pct(s.open_rate)}</td><td class="num">${pct(s.click_rate)}</td><td class="num">${pct(s.reply_rate)}</td>`
      : `<td class="num hint2" colspan="4" style="text-align:center">no results yet</td>`;
    const detail = open ? `<tr><td colspan="6" style="background:#f8fafc;padding:0">
      <table class="tt" style="margin:0"><tbody>${s.campaigns.map(c=>{ const m=c.metrics;
        return `<tr><td style="padding-left:18px"><a href="#" onclick="openCampaign('${c.id}');return false" style="color:var(--navy);font-weight:600;text-decoration:none">${esc(c.name||"(untitled)")}</a> <span class="bdg ${c.pushed?"pushed":"draft"}">${c.pushed?"pushed":esc(c.status||"draft")}</span></td>
          <td class="num">${m?num(m.sent):`<span class="hint2">${num(c.intended)} intended</span>`}</td>
          <td class="num">${m?pct(m.sent?m.opens/m.sent:null):'<span class="hint2">—</span>'}</td>
          <td class="num">${m?pct(m.sent?m.clicks/m.sent:null):'<span class="hint2">—</span>'}</td>
          <td class="num">${m?pct(m.sent?m.replies/m.sent:null):'<span class="hint2">—</span>'}</td></tr>`;
      }).join("")}</tbody></table></td></tr>` : "";
    return `<tr style="cursor:pointer" onclick="toggleAud('${s.id}')" title="Show campaigns">
      <td><b>${esc(s.name)}</b> <span class="hint2">${open?"▾":"▸"}</span><div class="hint2">${s.type==="dynamic"?"dynamic · ":""}${num(s.campaign_count)} campaign${s.campaign_count===1?"":"s"} · ${num(s.contact_count)} contacts</div></td>
      ${metrics}<td class="hint2" style="white-space:nowrap">${s.last?fmtDate(s.last):""}</td></tr>${detail}`;
  }).join("");
  host.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h2 style="margin:0">Audience performance</h2>
      <button class="btn2 ghost" onclick="loadAudStats(true)" ${STATUS.ready?"":"disabled title='Connect Zoho to pull live results'"}>↻ Refresh from Zoho</button></div>
    <div class="hint2" style="margin:4px 0 8px">Opens, clicks &amp; replies rolled up per saved audience across every campaign it was used in. Click an audience to see its campaigns.</div>
    <table class="tt"><thead><tr><th>Audience</th><th class="num">Sent</th><th class="num">Open</th><th class="num">Click</th><th class="num">Reply</th><th>Last</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function toggleAud(id){ ASOPEN=(ASOPEN===id?null:id); renderAudStats(); }
function fmtDate(s){ try{ return new Date(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }catch(e){ return ""; } }
async function loadList(){
  const r=await api({action:"list"}); const rows=(r.body&&r.body.campaigns)||[];
  const el=$("#list"); if(!el) return;
  el.innerHTML = rows.length ? `<table class="tt"><tbody>${rows.map(c=>`<tr><td><a href="#" onclick="openCampaign('${c.id}');return false" style="font-weight:700;color:var(--navy);text-decoration:none">${esc(c.name||"(untitled)")}</a><div class="hint2">${esc(c.segment||"")} · ${num(c.audience_count)} dealers</div></td><td><span class="bdg ${c.pushed?"pushed":"draft"}">${c.pushed?"pushed":esc(c.status||"draft")}</span></td></tr>`).join("")}</tbody></table>` : `<div class="hint2">No campaigns yet — build one on the left.</div>`;
}
boot();
</script>
</body></html>
