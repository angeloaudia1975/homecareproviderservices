<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS Admin — Manufacturer Center</title>
<style>
 :root{--ink:#1b2733;--blue:#3B599A;--blue-dk:#2B4071;--orange:#F5821F;--silver:#D8DEE4;--light:#F3F6FA;--gray:#5b6672;--green:#1A7A4A;--red:#B91C1C;--amber:#B45309}
 *{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--ink);padding-bottom:60px}
 .wrap{max-width:1240px;margin:22px auto;padding:0 20px}
 h1{font-size:22px;margin:0 0 3px}h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:14px 0 6px}
 .sub{color:var(--gray);font-size:13px;margin:0 0 12px;max-width:900px;line-height:1.45}
 .infobar{background:#eaf1f8;border:1px solid #cfe0f2;color:var(--blue-dk);border-radius:9px;padding:9px 13px;font-size:12.5px;margin-bottom:14px;line-height:1.5}
 .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
 .card{background:#fff;border:1px solid var(--silver);border-radius:12px;padding:14px 16px;margin-bottom:14px;overflow-x:auto}
 table{border-collapse:collapse;width:100%;font-size:12.5px}
 th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);padding:6px 8px;border-bottom:1px solid var(--silver);white-space:nowrap}
 td{padding:8px;border-bottom:1px solid #eef2f6;vertical-align:top}
 tr.sel td{background:#f5f8fc}
 .pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:3px 8px;border-radius:9px;white-space:nowrap}
 .p-frozen{background:#e8eefc;color:var(--blue-dk)}.p-pass{background:#e6f5ee;color:var(--green)}.p-fail{background:#fee2e2;color:var(--red)}
 .p-adv{background:#f1f4f8;color:var(--gray)}.p-warn{background:#fef3c7;color:var(--amber)}.p-auth{background:#eef6f1;color:var(--green)}
 .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 13px;font-weight:700;font-size:12.5px;cursor:pointer}
 .btn:hover{background:var(--blue-dk)}.btn:disabled{opacity:.55;cursor:default}
 .btn.ghost{background:#fff;color:var(--blue-dk);border:1px solid var(--silver)}.btn.warn{background:var(--amber);color:#fff}.btn.warn:hover{background:#92400e}
 .tabs{display:flex;gap:4px;border-bottom:1px solid var(--silver);margin:4px 0 12px}
 .tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;font-size:13px;color:var(--gray);cursor:pointer}
 .tabs button.on{color:var(--ink);border-bottom-color:var(--orange)}
 .mut{color:var(--gray)}.err{color:var(--red)}.ok{color:var(--green)}
 .chk{border:1px solid #e6ebf1;border-radius:9px;margin:6px 0;background:#fff}
 .chk summary{cursor:pointer;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:13px;list-style:none}
 .chk summary::-webkit-details-marker{display:none}
 .chk .det{padding:4px 12px 10px;font-size:12px}
 pre{white-space:pre-wrap;word-break:break-word;background:#f7f9fb;border:1px solid #eef2f6;border-radius:7px;padding:8px;font-size:11.5px;max-height:340px;overflow:auto}
 .gate,.msg{background:#fff;border:1px solid var(--silver);border-radius:12px;padding:24px;max-width:420px;margin:30px auto;text-align:center}
 .go{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
 input[type=text],input[type=email],input[type=password],textarea,select{padding:8px 10px;border:1px solid var(--silver);border-radius:8px;font-size:13px;background:#fff;font-family:inherit}
 textarea{width:100%;min-height:64px}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 @media(max-width:760px){.grid2{grid-template-columns:1fr}}
 .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
 .toast.show{opacity:1}
 .tabs.wf{flex-wrap:wrap}
 .rob{background:#eef3fb;border:1px solid #cfdcf0;color:var(--blue-dk);border-radius:9px;padding:9px 12px;font-size:12.5px;margin:0 0 12px;line-height:1.5}
 .dry{background:#f7f9fc;border:1px dashed #b8c6da;border-radius:9px;padding:10px 12px;margin:10px 0;font-size:12.5px}
 .gatebox{border:2px solid var(--silver);border-radius:11px;padding:10px 13px;margin:10px 0}
 .gatebox .gh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
 .gatebox .gn{background:var(--ink);color:#fff;border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
 .g-wait{border-color:#f3d9a4;background:#fffaf0}.g-ok{border-color:#bfe3cf;background:#f3fbf6}.g-used{border-color:var(--silver);background:#fafbfc}
 .chip{display:inline-block;background:#f1f4f8;border-radius:12px;padding:3px 9px;font-size:11.5px;margin:2px 2px 2px 0}.chip-warn{background:#fef3c7}
 .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0}
 @media(max-width:900px){.grid3{grid-template-columns:1fr}}
 label{font-size:11.5px;color:var(--gray);font-weight:700}
 .sub2{background:#fbfcfe}
 tr.needrow td{background:#fffbeb}.needtxt{color:var(--amber);font-size:11.5px}
 td.facts{background:#fbfcfd}td.interp{background:#f8fbf8}
 .enstages{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
 @media(max-width:900px){.enstages{grid-template-columns:repeat(2,1fr)}}
 .enst{background:#f7f9fc;border:1px solid var(--silver);border-radius:9px;padding:7px 9px;text-align:left;cursor:pointer;font-family:inherit}
 .enst b{display:block;font-size:12px;color:var(--ink)}.enst span{font-size:11px;color:var(--gray)}
 .enst.on{border-color:var(--orange);background:#fff7ef;box-shadow:inset 0 -3px 0 var(--orange)}.enst.later{opacity:.55}
 .enissue{border-left:4px solid #f3d9a4}.enissue span,.enissue b{overflow-wrap:anywhere}
 /* Release C — Dealer Preview (staff-only; the dealer-like cards use the storefront's own words and prices) */
 /* Batch 3 — pipeline status */
 .pl-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
 .pl-filters{display:flex;flex-wrap:wrap;gap:6px}.pl-filters .btn{min-height:44px}.pl-f.on{border-color:var(--orange);box-shadow:inset 0 -3px 0 var(--orange)}
 .pl-row{border:1px solid #e6ebf1;border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
 .pl-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}.pl-slug{font-size:11px}
 .pl-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.pl-a{text-decoration:none}
 .pl-steps{list-style:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:8px 0 0;padding:0}
 .pl-step a{display:flex;flex-direction:column;gap:2px;min-height:44px;height:100%;border:1px solid var(--silver);border-radius:9px;padding:7px 8px;text-decoration:none;color:var(--ink);background:#f7f9fc}
 .pl-dot{font-weight:800;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:#e5e9ef;color:var(--gray)}
 .pl-lab{font-weight:800;font-size:12px}.pl-st{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--gray)}
 .pl-sum{font-size:11.5px;color:var(--gray);overflow-wrap:anywhere}.pl-tool{font-size:11px;color:var(--blue-dk);font-weight:700;margin-top:auto}
 .s-done a{background:#f3fbf6;border-color:#bfe3cf}.s-done .pl-dot{background:var(--green);color:#fff}.s-done .pl-st{color:var(--green)}
 .s-attention a{background:#fffaf0;border-color:#f3d9a4}.s-attention .pl-dot{background:var(--amber);color:#fff}.s-attention .pl-st{color:var(--amber)}
 .s-blocked a{background:#fff5f5;border-color:#f3b4b4}.s-blocked .pl-dot{background:var(--red);color:#fff}.s-blocked .pl-st{color:var(--red)}
 .pl-why{margin-top:8px;font-size:12px;color:var(--red);background:#fff5f5;border:1px solid #f3d0d0;border-radius:8px;padding:6px 9px}
 @media(max-width:1100px){.pl-steps{grid-template-columns:repeat(4,minmax(0,1fr))}}
 @media(max-width:640px){.pl-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
 @media(max-width:380px){.pl-steps{grid-template-columns:1fr}}
 .pvtiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
 @media(max-width:900px){.pvtiles{grid-template-columns:repeat(2,1fr)}}
 .pvtile{border:1px solid var(--silver);border-radius:10px;padding:9px 10px;background:#fff}.pvtile b{display:block;font-size:22px;line-height:1.1}.pvtile span{font-size:11.5px;color:var(--gray)}
 .pvtile.good{border-color:#bfe3cf;background:#f3fbf6}.pvtile.bad{border-color:#f5b5b5;background:#fff3f3}
 .pvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:10px 0}
 .pvcard{border:1px solid #e3e8ef;border-radius:12px;padding:10px;background:#fff;cursor:pointer;text-align:left;font-family:inherit;min-width:0}
 .pvcard:hover{border-color:var(--orange)}.pvcard .t{font-weight:700;font-size:13px;margin:6px 0 2px;overflow-wrap:anywhere}
 .pvimg{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:8px;display:block}
 .pvph{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#f3f5f8;color:var(--gray);border-radius:8px;font-size:12px}
 .pvstaff{background:#fff4d6;border:1px dashed #d4a017;color:#6b4e00;font-size:11px;padding:4px 7px;border-radius:7px;margin-top:6px;line-height:1.35}
 .pvstaff b{font-size:10px;letter-spacing:.4px}
 .price{font-weight:800;font-size:17px;color:var(--ink)}.price.locked{font-size:13px;color:var(--gray)}.pnote{font-size:11.5px;color:var(--gray);margin-top:2px}
 .pvdetail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;border:1px solid #e3e8ef;border-radius:12px;padding:12px;background:#fff;margin:10px 0}
 @media(max-width:760px){.pvdetail{grid-template-columns:1fr}}
 .pvthumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.pvthumbs img{width:54px;height:54px;object-fit:contain;border:1px solid #e3e8ef;border-radius:6px;cursor:pointer;background:#fff}
 .pvcart{background:#f7f9fc;border:1px solid #dfe6f0;border-radius:9px;padding:9px 11px;margin-top:8px;font-size:12.5px}
 .pvtog{display:inline-flex;border:1px solid var(--silver);border-radius:9px;overflow:hidden}.pvtog button{border:0;background:#fff;padding:6px 12px;font-family:inherit;cursor:pointer}.pvtog button.on{background:var(--ink);color:#fff}
 /* Approve Content & Images (2026-10-12): Current Dealer View next to the proposal, area by area; nothing is chosen for you */
 .apnote{background:#eef4ff;border:1px solid #c9d8f5;color:#1e3a6e;border-radius:9px;padding:8px 11px;font-size:12.5px;margin:8px 0}
 .appages{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.appg{border:1px solid var(--silver);background:#fff;border-radius:9px;padding:7px 10px;text-align:left;cursor:pointer;font-family:inherit;max-width:100%}
 .appg.on{border-color:var(--orange);background:#fff7ef}.appg b{display:block;font-size:12.5px;overflow-wrap:anywhere}.appg span{font-size:11px;color:var(--gray)}
 .apcheck{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 10px}.apchip{font-size:11.5px;border-radius:12px;padding:3px 9px;border:1px solid var(--silver);background:#fff;max-width:100%;overflow-wrap:anywhere}
 .apchip.ok{background:#eef8f1;border-color:#bfe3cf;color:#14532d}.apchip.wait{background:#fffbeb;border-color:#f3d9a4;color:#7a4b00}.apchip.stale{background:#fff3f3;border-color:#f5b5b5;color:#8a1c1c}
 .aparea{border:1px solid #e3e8ef;border-radius:11px;padding:10px 12px;margin:10px 0;background:#fff;min-width:0}.aparea.done{border-left:4px solid #3aa76d}.aparea.todo{border-left:4px solid #e0a43a}
 .aphead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.aphead h4{margin:0;font-size:14px}
 .apcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:8px 0}@media(max-width:760px){.apcols{grid-template-columns:1fr}}
 .apcol{border:1px solid #edf0f5;border-radius:9px;padding:8px 10px;background:#fbfcfe;font-size:12.5px;line-height:1.45;min-width:0;overflow-wrap:anywhere}.apcol h5{margin:0 0 5px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--gray)}
 .gsban{margin:2px 0 10px;padding:7px 10px;border:1px solid #cfe9d8;background:#f4fbf6;border-radius:9px}.gsban .gshist{margin-top:3px}tr.gsrow td{background:#f4fbf6}
 .apcols.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}@media(max-width:760px){.apcols.three{grid-template-columns:1fr}}
 .apcol.on{border-color:#2e7d4f;box-shadow:inset 0 0 0 1px #2e7d4f}.apcol.ed{background:#fbf9f2}
 .apselected{font-size:12px;margin:2px 0 4px}.apwarn{margin:8px 0;padding:8px 10px;border:1px solid #e3b341;background:#fff8e6;border-radius:9px;font-size:12.5px;line-height:1.45}
 .apcol.cur{background:#f7faf8}.apcol ul{margin:3px 0 0 16px;padding:0}
 .apchoices{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12.5px}.apchoices label{display:inline-flex;gap:5px;align-items:center;font-weight:400;cursor:pointer}
 .apedit textarea{width:100%;min-height:90px;font-family:inherit;font-size:12.5px}
 .aparea input[type=file],.aparea input[type=text]{max-width:100%;box-sizing:border-box}
 .apthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:6px 0}
 .apimg{border:1px solid #e3e8ef;border-radius:9px;padding:5px;background:#fff;font-size:11px;position:relative;min-width:0}.apimg img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;border-radius:6px;background:#fff}
 .apimg.sel{border-color:var(--orange);box-shadow:0 0 0 2px #ffd9b3}.apimg .tag{display:inline-block;font-size:10px;border-radius:5px;padding:1px 5px;margin:2px 2px 0 0;background:#eef1f6}
 .apimg .tag.cur{background:#e7f6ec;color:#14532d}.apimg .tag.dup{background:#fff3f3;color:#8a1c1c}.apimg .ord{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;border-radius:999px;font-weight:700;font-size:11px;padding:1px 7px}
 .apimg .ctl{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}.apimg .ctl button{font-size:11px;padding:2px 6px}
 .apopt{display:grid;grid-template-columns:minmax(0,150px) minmax(0,110px) minmax(0,110px) minmax(0,1fr);gap:10px;align-items:start;border-top:1px solid #edf0f5;padding:8px 0}
 @media(max-width:760px){.apopt{grid-template-columns:1fr 1fr}}
 .apopt .pill,.aphead .pill{white-space:normal;max-width:100%}
 .apopt img,.apopt .pvph{width:100%;aspect-ratio:1/1;object-fit:contain;border:1px solid #e3e8ef;border-radius:7px;background:#fff}
</style><link rel="stylesheet" href="/admin/admin-shell.css"></head><body>
<header id="ac-head"></header>
<div class="wrap" id="wrap"><div class="msg">Loading…</div></div>
<div class="toast" id="toast"></div>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script src="/admin/mc-pipeline.js"></script>
<script>
/* MANUFACTURER CENTER — Phases 1–3 + the guided workflow of Phase 6 (approved 2026-10-10). It
   orchestrates the Structure Map, Product Content Enrichment, the commercial master (product_skus) and
   Partner 360; it is not another product database or pricing engine. Every write goes through catalog-api
   (president only), answers a dry run first, is refused on a frozen line, and the two that can change what
   dealers see need Approval 1 (staged records, freight terms); activation needs Approval 2. */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const API="/.netlify/functions/catalog-api";
window.addEventListener("hcps-token",function(e){try{TOKEN=e.detail;}catch(_){}});
let ME=null; try{ME=HCPS.profile()}catch(e){ME=null;}
let TOKEN=HCPS.token(), LINES=[], OPEN=null, TAB="verify", LINE=null, RUN=null, BUSY=false;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600);}
async function api(body){const h={"content-type":"application/json"};if(TOKEN)h["authorization"]="Bearer "+TOKEN;
  const r=await fetch(API,{method:"POST",headers:h,body:JSON.stringify(body)});
  if(r.status===401){gate();throw new Error("unauthorized");}
  if(r.status===403){$("#wrap").innerHTML='<div class="msg err">President only — Manufacturer Center is limited to President accounts. <button class="go" onclick="lock()">Sign in as a different user</button></div>';throw new Error("unauthorized");}
  const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error((j.message||j.error)||("HTTP "+r.status));return j;}
function gate(msg){$("#wrap").innerHTML=`<div class="gate"><h2>Staff sign-in</h2><p style="margin:2px 0 12px;color:#607089;font-size:13px">Sign in with your work email and password.</p><input id="lemail" type="email" placeholder="Email" autocomplete="username" style="margin:0 0 8px;width:100%"><input id="lpass" type="password" placeholder="Password" autocomplete="current-password" style="margin:0 0 12px;width:100%" onkeydown="if(event.key==='Enter')submitTok()"><br><button class="go" onclick="submitTok()">Sign in</button> <a href="reset.html" style="display:inline-block;margin-left:6px;color:#10263f;font-size:13px;font-weight:600">Forgot password?</a><div id="lerr" style="color:#b42323;margin-top:8px">${msg||""}</div></div>`;setTimeout(()=>{var t=$("#lemail");if(t)t.focus();},50);}
async function submitTok(){
  var email=(($("#lemail")||{}).value||"").trim(), password=(($("#lpass")||{}).value||"");
  var e=$("#lerr"); if(e)e.textContent="Signing in…";
  try{ const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email,password})});
    const j=await r.json().catch(()=>({})); if(!j||!j.ok){ gate((j&&j.message)||"Could not sign in."); return; }
    HCPS.setSession(j); TOKEN=j.token; ME=j.profile; boot();
  }catch(err){ gate("Could not reach the server. Try again."); }
}
function lock(){ HCPS.signOut(); TOKEN=null; ME=null; location.reload(); }
const fmtD=s=>s?String(s).slice(0,10):"";
const fmtT=s=>{ if(!s) return ""; try{ return new Date(s).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}); }catch(e){ return String(s); } };
function sourceCell(s){ if(!s) return '<span class="mut">none registered</span>';
  const rec=s.legacy?'<span class="mut">received date not recorded (legacy)</span>':'received '+esc(fmtD(s.received_date));
  return `${esc(s.title)}<div class="mut" style="font-size:11.5px">${rec}</div>`; }
function effCell(s){ if(!s) return ""; return s.effective_date_status==="stated"?esc(fmtD(s.manufacturer_effective_date)):(s.effective_date_status==="pending"?'<span class="pill p-warn">pending</span>':'<span class="mut">n/a</span>'); }
async function boot(){
  try{ const j=await api({action:"mc_overview"}); LINES=j.lines||[]; render();
    const h=new URLSearchParams(String(location.hash||"").replace(/^#/,""));
    if(h.get("enrich")) await openEnrichment(h.get("enrich"));
    else if(h.get("line")){ OPEN=h.get("line"); await openLine(OPEN); if(h.get("tab")&&STEPS.some(s=>s[0]===h.get("tab"))) go(h.get("tab")); }
    else if(OPEN) await openLine(OPEN,true); }
  catch(e){ if(String(e.message)!=="unauthorized") $("#wrap").innerHTML=`<div class="msg err">Manufacturer Center could not load: ${esc(e.message)}</div>`; }
}
/* (Angelo 2026-10-12) The newest finalized Gold Standard is the line's status; failed or rolled-back runs after it are
   history and never make the line read as failing. A line with no Gold Standard yet shows its last verification. */
function gsHistory(g){ return g&&g.later_failed?`<div class="mut gshist" style="font-size:11px;margin-top:2px">History: ${g.later_failed} later attempt${g.later_failed===1?'':'s'} failed and ${g.later_failed===1?'was':'were'} rolled back — Gold Standard unchanged</div>`:''; }
function statusCell(l){
  const g=l.gold_standard;
  if(g) return `<span class="pill p-pass" title="The newest finalized Gold Standard run">Gold Standard · pass</span> <span class="mut" style="font-size:11.5px">#${esc(g.id)} ${esc(g.phase)} · ${esc(fmtT(g.run_at))}</span>${gsHistory(g)}`;
  return l.last_run?`<span class="pill ${l.last_run.result==='pass'?'p-pass':'p-fail'}">${esc(l.last_run.result)}</span> <span class="mut" style="font-size:11.5px">${esc(l.last_run.phase)} · ${esc(fmtT(l.last_run.run_at))}</span>`:'<span class="mut">never</span>';
}
function gsBanner(g){ return g?`<div class="gsban"><span class="pill p-pass">Current Gold Standard: PASS</span> <span class="mut" style="font-size:12px">run #${esc(g.id)} · ${esc(g.phase)} · ${esc(fmtT(g.run_at))} · fingerprint <code>${esc(g.fingerprint||'')}</code></span>${gsHistory(g)}</div>`:''; }

/* ═══ THE GUIDED WORKFLOW (Manufacturer Center Phase 6, approved 2026-10-10) ═══════════════════════════
   One line, one path: Sources → Match & decide → Structure & content → Commercial & freight → Stage →
   Verify & activate, with History and the Decisions log beside it. Every button that writes first runs the
   same action as a dry run and shows exactly what would be written; the two that change what dealers can
   see (staged records, freight terms) then need APPROVAL 1, and activation needs APPROVAL 2 — both recorded
   as decisions, single-use, and bound by the server to exactly what was shown. A frozen line opens
   read-only: no write button is drawn, and the server refuses them anyway. */
const STEPS=[["sources","1 · Sources"],["match","2 · Match & decide"],["structure","3 · Structure & content"],["commercial","4 · Commercial & freight"],["stage","5 · Stage"],["activate","6 · Verify & activate"],["history","History"],["decisions","Decisions"]];
let WF={};                       // per-line workflow state; cleared when another line opens
function wfReset(){ WF={ match:null, structure:null, commercial:null, regDry:null, accDry:{}, impDry:null, decDry:null, decFor:null,
  stageDry:null, stageApproval:null, freightDry:null, freightApproval:null, preRun:null, actApproval:null, actDry:null, cmp:null, busy:false }; }
wfReset();
const frozen=()=>!!(LINE&&LINE.meta&&LINE.meta.frozen);
const money=n=>n==null||n===""?'<span class="mut">—</span>':"$"+Number(n).toFixed(2);
const jv=v=>v==null?'<span class="mut">—</span>':`<code style="font-size:11px">${esc(typeof v==="object"?JSON.stringify(v):String(v))}</code>`;
const pill=(cls,t)=>`<span class="pill ${cls}">${esc(t)}</span>`;
const short=h=>h?esc(String(h).slice(0,12))+"…":"";
function ro(note){ return `<div class="rob">🔒 <b>Read-only — this line is frozen</b> (Gold Standard COMPLETE). ${note||"Nothing here can be changed."} A correction goes through <b>Decisions → Report a regression</b>, which records a single-use <code>regression_fix</code> to send with the fix.</div>`; }
function gateBox(n, title, state, body){
  const cls=state==="used"?"g-used":(state==="approved"?"g-ok":"g-wait");
  const lab=state==="used"?"used":(state==="approved"?"approved":"waiting for approval");
  return `<div class="gatebox ${cls}"><div class="gh"><span class="gn">Approval ${n}</span> <b>${esc(title)}</b> ${pill(state==="approved"?"p-pass":(state==="used"?"p-adv":"p-warn"),lab)}</div>${body}</div>`;
}
async function apiq(body){ try{ return {ok:true, j:await api(body)}; }catch(e){ return {ok:false, e}; } }

function renderLine(){
  const L=LINE, m=L.meta||{}, l=LINES.find(x=>x.slug===L.manufacturer)||{};
  const tabs=STEPS.map(([k,n])=>`<button class="${TAB===k?'on':''}" onclick="go('${k}')">${n}</button>`).join("");
  $("#line").innerHTML=`<div class="card"><h2>${esc(l.name||L.manufacturer)} ${m.frozen?pill("p-frozen","Frozen · read-only"):""} ${m.record_authoritative?pill("p-auth","Record authority"):pill("p-adv","Layers")}</h2>${m.frozen_reason?`<p class="mut" style="font-size:12px;margin:-4px 0 8px">${esc(m.frozen_reason)}</p>`:''}${gsBanner(L.gold_standard)}<div class="tabs wf">${tabs}</div><div id="wfbody"></div></div>`;

}
function go(k){ TAB=k; renderLine(); }
async function drawStep(){

    if(TAB==="sources") B.innerHTML=stepSources();

    else if(TAB==="structure"){ if(!WF.structure){ B.innerHTML='<p class="mut">Reading structure and content status…</p>'; WF.structure=await api({action:"mc_structure",manufacturer:OPEN}); } B.innerHTML=stepStructure(); }
    else if(TAB==="commercial"){ if(!WF.commercial){ B.innerHTML='<p class="mut">Reading the commercial master and freight…</p>'; WF.commercial=await api({action:"mc_commercial",manufacturer:OPEN}); } B.innerHTML=stepCommercial(); }
    else if(TAB==="stage"){ if(!WF.match){ B.innerHTML='<p class="mut">Preparing the staging rows…</p>'; WF.match=await api({action:"mc_match",manufacturer:OPEN}); } B.innerHTML=stepStage(); }
    else if(TAB==="activate") B.innerHTML=stepActivate();
    else if(TAB==="history") B.innerHTML=stepHistory();
    else B.innerHTML=stepDecisions();
  }catch(e){ if(String(e.message)!=="unauthorized") B.innerHTML=`<div class="err">Could not load this step: ${esc(e.message)}</div>`; }

async function reloadLine(keepWF){ LINE=await api({action:"mc_line",manufacturer:OPEN}); const o=await api({action:"mc_overview"}); LINES=o.lines||LINES; if(!keepWF){ const keep={}; wfReset(); } render(); renderLine(); }

/* ── 1. SOURCES ─────────────────────────────────────────────────────────────────────────────────── */
function stepSources(){
  const L=LINE, src=L.sources||[];
  const rows=src.map(s=>`<tr><td>${s.id}</td><td>${esc(s.kind)}</td><td><b>${esc(s.title)}</b><div class="mut" style="font-size:11px">${esc(s.file_name||'')}${s.file_sha256?' · sha256 '+esc(s.file_sha256.slice(0,12))+'…':''}${s.storage_path?' · stored privately':''}</div></td>
    <td>${s.legacy?'<span class="mut">not recorded (legacy)</span>':esc(fmtD(s.received_date))}</td><td>${s.effective_date_status==='stated'?esc(fmtD(s.manufacturer_effective_date)):pill('p-warn',s.effective_date_status)}</td>
    <td>${pill(s.status==='accepted'?'p-pass':'p-adv',s.status)}${s.accepted_by?'<div class="mut" style="font-size:11px">'+esc(s.accepted_by)+'</div>':''}</td>
    <td>${(!frozen()&&(s.status==='received'||s.status==='under_review'))?acceptCell(s):''}${(!frozen()&&s.status==='accepted'&&s.kind==='price_list')?`<button class="btn ghost" onclick="WF.impFor=${s.id};drawStep()">Import rows…</button>`:''}</td></tr>`).join('');

  <p class="sub">The manufacturer's files exactly as received. A source has the day HCPS received it (never invented) and the manufacturer's own effective date only when the manufacturer states one. Files are stored privately (<code>mfr-sources</code>) with their SHA-256.</p>
  <table><thead><tr><th>#</th><th>Kind</th><th>Title / file</th><th>Received</th><th>Mfr effective date</th><th>Status</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="mut">No sources registered.</td></tr>'}</tbody></table>

}
function acceptCell(s){ const d=WF.accDry[s.id];

           :`<input type="text" id="accr_${s.id}" placeholder="Why it is accepted (required)" style="width:220px"> <button class="btn ghost" onclick="acceptSource(${s.id},true)">Check acceptance (dry run)</button>`; }

function registerPanel(){ const d=WF.regDry;
  return `<div class="card sub2"><h3 style="margin-top:0">Register a source</h3>
  <div class="grid3"><label>Kind<br><select id="rg_kind"><option>price_list</option><option>terms</option><option>catalog</option><option>images</option><option>cross_reference</option><option>status_list</option><option>other</option></select></label>

  <label>File (optional, ≤ 10 MB)<br><input type="file" id="rg_file"></label>
  <label>Note<br><input type="text" id="rg_note" style="width:100%"></label></div>
  ${d?`<div class="dry"><b>Dry run — would register:</b> ${jv(d.would_insert)}${d.file_bytes?` and store ${d.file_bytes} bytes privately`:''}<br><button class="btn" onclick="registerSource(false)">Register source (writes)</button> <button class="btn ghost" onclick="WF.regDry=null;drawStep()">Change</button></div>`
       :`<div style="margin-top:8px"><button class="btn ghost" onclick="registerSource(true)">Check registration (dry run)</button></div>`}</div>`; }
let REG_BODY=null;
async function registerSource(dry){

function importPanel(id){ const d=WF.impDry;

let IMP_ROWS=null;
function parseTable(txt){
  const lines=String(txt||"").split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2) return [];
  const sep=lines[0].includes("\t")?"\t":",", split=l=>l.split(sep).map(x=>x.trim().replace(/^"|"$/g,""));

    return ({code:"code",modelnumber:"code",sku:"code",description:"description",itemdescription:"description",baseprice:"base_price",dealerprice:"base_price",dealermastercasecost:"base_price",
      msrp:"msrp",map:"map",unitcost:"unit_cost",dealercostperunit:"unit_cost",caseqty:"case_qty_text",mastercaseqty:"case_qty_text"})[k]||null; };
  return lines.slice(1).map(l=>{ const c=split(l), raw={}, row={}; head.forEach((h,i)=>{ raw[h]=c[i]===""?null:c[i]; const k=key(h); if(k&&c[i]!==""&&c[i]!=null) row[k]=k==="code"||k==="description"||k==="case_qty_text"?c[i]:Number(String(c[i]).replace(/[$,]/g,"")); });

/* ── 2. MATCH & DECIDE ──────────────────────────────────────────────────────────────────────────── */
const ST_LABEL={new:"new on the record",same:"matches the record",changes:"record would change",not_in_source:"on record, not in source",retired:"retired",not_compared:"not compared (legacy source)"};
function stepMatch(){
  const M=WF.match, s=M.summary||{};
  if(!M.source) return `${frozen()?ro():''}<p class="mut">No accepted price list for this line yet. Register and accept one in <b>1 · Sources</b>, then import its rows.</p>`;
  /* Phase 6 correction: an accepted LEGACY source registered without row-level rows cannot be compared. That is
     information — not a conflict and not a request for a decision. */
  if(M.comparison&&M.comparison.available===false) return `${frozen()?ro("The match is shown for reference."):''}
  <div class="rob" style="background:#f5f7fb;border-color:#d8e0ec">ℹ️ <b>${esc(M.comparison.message||'Match comparison unavailable.')}</b><br><span class="mut" style="font-size:12px">Source #${M.source.id} ${esc(M.source.title)} was accepted before row-level source data was stored. No SKU is reported as missing from it and nothing here asks for a decision; the line's record stays as verified.</span></div>
  <div style="margin:4px 0 10px"><span class="chip">${esc(ST_LABEL.not_compared)}: <b>${s.not_compared||0}</b></span> <span class="chip">retired: <b>${s.retired||0}</b></span> <span class="chip">needs a decision: <b>0</b></span> <span class="chip">proposed changes: <b>0</b></span></div>`;
  const chips=[["new",s.new],["changes",s.changes],["same",s.same],["not_in_source",s.not_in_source],["retired",s.retired]].map(([k,n])=>`<span class="chip">${esc(ST_LABEL[k])}: <b>${n||0}</b></span>`).join(" ");
  const rows=M.rows.map((r,i)=>{ const need=r.needs_decision.length;
    return `<tr class="${need?'needrow':''}"><td><b>${esc(r.code)}</b>${r.on_storefront?'':'<div class="mut" style="font-size:11px">not on the storefront</div>'}</td><td>${pill(need?'p-warn':(r.status==='same'?'p-pass':'p-adv'),need?'needs a decision':ST_LABEL[r.status])}</td>
      <td class="facts">${r.source?`${money(r.source.base_price)} · MSRP ${money(r.source.msrp)} · MAP ${money(r.source.map)}<div class="mut" style="font-size:11px">case qty ${r.source.case_qty==null?'none given':esc(r.source.case_qty)} · unit cost ${money(r.source.dealer_unit_cost)}</div>`:'<span class="mut">not in source</span>'}</td>
      <td class="interp">${Object.keys(r.hcps||{}).length?jv(r.hcps)+'<div class="mut" style="font-size:11px">decision '+r.decision_ids.join(', ')+'</div>':'<span class="mut">none</span>'}</td>
      <td>${r.record?`${money(r.record.base_price)} · ${esc(r.record.uom||'')}${r.record.case_qty>1?' ('+esc(r.record.case_qty)+')':''}<div class="mut" style="font-size:11px">${esc(r.record.status||'')}</div>`:'<span class="mut">no record</span>'}</td>
      <td>${r.diffs.map(d=>`<div style="font-size:11.5px">${esc(d.field)}: ${jv(d.record)} → ${jv(d.proposed)}</div>`).join('')}${r.needs_decision.map(n=>`<div class="needtxt">${esc(n.why)}</div>`).join('')}</td>
      <td>${frozen()?'':`<button class="btn ghost" onclick="openDecision(${i})">Decide…</button>`}</td></tr>`; }).join('');
  return `${frozen()?ro("The match is shown for reference."):''}
  <p class="sub">Source <b>#${M.source.id} ${esc(M.source.title)}</b> against the master record. <b>Source facts</b> (left, as received) and <b>HCPS interpretations</b> (decisions) are kept apart; only their combination is proposed for staging, and nothing is written here except a decision.</p>
  <div style="margin:4px 0 10px">${chips} <span class="chip ${s.needs_decision?'chip-warn':''}">needs a decision: <b>${s.needs_decision||0}</b></span> <span class="chip">ready to stage: <b>${s.ready_to_stage||0}</b></span> <span class="chip ${s.proposed_changes?'chip-warn':''}">proposed changes (new or different): <b>${s.proposed_changes||0}</b></span></div>
  ${(M.unapplied||[]).length?`<div class="needtxt" style="margin-bottom:8px">Not applied — the "applies to" wording is not understood, so it was not guessed at: ${M.unapplied.map(u=>'decision #'+esc(u.id)+' ('+esc(u.field)+': '+esc(u.applies_to)+')').join('; ')}. Record it again as the whole line or as packs.</div>`:''}
  ${WF.decFor!=null&&!frozen()?decisionPanel(WF.decFor):''}
  <table><thead><tr><th>SKU</th><th>Status</th><th>Source facts (as received)</th><th>HCPS interpretation</th><th>Master record now</th><th>What would change / why a decision is needed</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}
function openDecision(i){ WF.decFor=i; WF.decDry=null; drawStep(); }
function decisionPanel(i){
  const r=WF.match.rows[i], need=(r.needs_decision[0]||{}).field||"", d=WF.decDry;
  const mv=r.source?{base_price:r.source.base_price,msrp:r.source.msrp,map:r.source.map,case_qty:r.source.case_qty,unit_cost:r.source.dealer_unit_cost}:null;
  return `<div class="card sub2"><h3 style="margin-top:0">Decision for ${esc(r.code)}</h3>
   <p class="mut" style="font-size:12px">The manufacturer value is filled from the source and kept as written. Put HCPS's interpretation in <b>HCPS value</b> as JSON using the staging fields (e.g. <code>{"uom":"Each","case_qty":1}</code>, <code>{"msrp_basis":"each"}</code>, <code>{"status":"discontinued"}</code>). It is recorded with your name and reason and never edited afterwards. Only the keys of the <b>Field</b> are used (uom with case_qty; msrp_basis with map_basis; status with status_note) — any other key is ignored.</p>
   <div class="grid3"><label>Kind<br><select id="dc_kind"><option>interpretation</option><option>conflict</option><option>exception</option></select></label>
   <label>Field<br><input type="text" id="dc_field" value="${esc(need)}"></label><label>Applies to<br><select id="dc_scope"><option value="sku">this SKU (${esc(r.code)})</option><option value="line">the whole line</option><option value="packs">every pack SKU on the line</option></select></label></div>
   <label>Manufacturer value (as received)<br><input type="text" id="dc_mv" value="${esc(mv?JSON.stringify(mv):'')}" style="width:100%" readonly></label>
   <label>HCPS value (JSON)<br><input type="text" id="dc_hv" style="width:100%" placeholder='{"uom":"Each","case_qty":1}'></label>
   <label>Reason (required)<br><textarea id="dc_reason"></textarea></label>
   ${d?`<div class="dry"><b>Dry run — would record:</b> ${jv(d.decision)}<br><button class="btn" onclick="recordDecision(false)">Record decision (writes)</button> <button class="btn ghost" onclick="WF.decDry=null;drawStep()">Change</button></div>`
      :`<div style="margin-top:8px"><button class="btn ghost" onclick="recordDecision(true)">Check decision (dry run)</button> <button class="btn ghost" onclick="WF.decFor=null;drawStep()">Close</button></div>`}</div>`;
}
let DEC_BODY=null;
async function recordDecision(dry){
  if(dry){ const r=WF.match.rows[WF.decFor]; let hv=null, mv=null; const hvt=$("#dc_hv").value.trim();
    try{ hv=hvt?JSON.parse(hvt):null; mv=$("#dc_mv").value?JSON.parse($("#dc_mv").value):null; }catch(e){ toast("HCPS value must be JSON"); return; }
    const scope=$("#dc_scope").value; if(scope==="packs"&&hv) hv=Object.assign({},hv,{applies_to:"packs"});
    DEC_BODY={action:"mc_record_decision",manufacturer:OPEN,kind:$("#dc_kind").value,field:$("#dc_field").value.trim(),code:scope==="sku"?r.code:null,
      manufacturer_value:mv,hcps_value:hv,source_id:WF.match.source?WF.match.source.id:null,reason:$("#dc_reason").value.trim()}; }
  const x=await apiq(Object.assign({},DEC_BODY,{dry_run:dry}));
  if(!x.ok){ toast("Not recorded: "+x.e.message); return; }
  if(dry){ WF.decDry=x.j; drawStep(); } else { toast("Decision #"+x.j.decision.id+" recorded"); WF.decDry=null; WF.decFor=null; WF.match=null; WF.stageDry=null; WF.stageApproval=null; await reloadLine(true); TAB="match"; renderLine(); }
}

/* ── 3. STRUCTURE & CONTENT (status and links — edited where they always were) ─────────────────────── */
function stepStructure(){
  const S=WF.structure, st=S.structure||{}, c=S.content||{};
  const steps=(c.steps||[]).map(x=>`<tr><td>${pill(x.pass?'p-pass':'p-warn',x.pass?'ok':'to do')}</td><td><b>${esc(x.name)}</b><div class="mut" style="font-size:11.5px">${esc(x.detail||'')}</div></td></tr>`).join('');

  <div class="card"><h3 style="margin-top:0">Content & publishing</h3><p>${pill(c.passed===c.of?'p-pass':'p-warn',(c.passed||0)+' of '+(c.of||0)+' steps')} <span class="mut">${c.percent_published!=null?esc(c.percent_published)+'% published':''}</span></p>
    ${c.next_step?`<p class="mut" style="font-size:12px">Next: <b>${esc(c.next_step)}</b> — ${esc(c.next_action||'')}</p>`:'<p class="ok" style="font-size:12px">The whole flow passes for this line.</p>'}
    <p><a class="btn ghost" href="${esc(S.links.structure_map)}" target="_blank" rel="noopener">Product Content Enrichment →</a> <a class="btn ghost" href="${esc(S.links.product_catalog)}" target="_blank" rel="noopener">Product Catalog →</a> <a class="btn ghost" href="${esc(S.links.images)}" target="_blank" rel="noopener">Images →</a></p></div></div>
  <div class="card"><table><tbody>${steps||'<tr><td class="mut">No steps reported.</td></tr>'}</tbody></table></div>`;
}

/* ── 4. COMMERCIAL & FREIGHT ────────────────────────────────────────────────────────────────────── */
function bTable(rows){ return rows&&rows.length?`<table><thead><tr><th>Group</th><th>Order</th><th>Fee</th><th>Words a dealer reads</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.group)}</td><td>${r.amount==null?'any':'$'+Number(r.amount).toFixed(2)}</td><td>$${Number(r.fee||0).toFixed(2)}</td><td>${esc(r.words)}</td></tr>`).join('')}</tbody></table>`:'<span class="mut">No freight rule — freight is not quoted.</span>'; }
function stepCommercial(){
  const C=WF.commercial, f=C.freight||{};
  const recs=(C.records||[]).map(r=>`<tr><td><b>${esc(r.code)}</b></td><td>${esc(r.status)}</td><td>${money(r.base_price)}</td><td>${money(r.msrp)}${r.msrp_basis?' <span class="mut">'+esc(r.msrp_basis)+'</span>':''}</td><td>${money(r.map)}${r.map_basis?' <span class="mut">'+esc(r.map_basis)+'</span>':''}</td><td>${esc(r.uom||'')}${r.case_qty>1?' ('+esc(r.case_qty)+')':''}</td><td>${money(r.dealer_unit_cost)}</td><td>${(r.tiers||[]).map(t=>esc((t.min_qty||t.minQty)+'+ $'+t.price)).join(' · ')||'<span class="mut">—</span>'}</td><td class="mut" style="font-size:11px">${esc(r.source_file||'')}</td></tr>`).join('');
  const srcPill=f.source==="record"?pill("p-pass","from the record (freight_terms)"):(f.source==="file"?pill("p-adv","from manufacturers.json (fallback)"):pill("p-adv","no rule"));
  return `${frozen()?ro("Prices and freight are shown for reference."):''}
  <p class="sub">The commercial master (<code>product_skus</code>) for this line, and the freight rule dealers get. Prices change only through <b>5 · Stage</b>; freight terms change here, after a dry run and Approval 1. Unit cost is HCPS's record and is never shown to dealers or used to price.</p>
  <div class="card"><h3 style="margin-top:0">Commercial master — ${(C.records||[]).length} records ${C.authoritative?pill('p-auth','prices from the record'):pill('p-adv','prices from the layers')}</h3>
   <table><thead><tr><th>SKU</th><th>Status</th><th>Dealer</th><th>MSRP</th><th>MAP</th><th>Unit</th><th>Unit cost</th><th>Breaks</th><th>Source</th></tr></thead><tbody>${recs||'<tr><td colspan="9" class="mut">No master records yet — stage the source in 5 · Stage.</td></tr>'}</tbody></table></div>
  <div class="card"><h3 style="margin-top:0">Freight ${srcPill} ${f.invalid?pill('p-fail','record terms invalid — file used'):''}</h3>
   ${f.record_terms&&f.record_terms.trace?`<p class="mut" style="font-size:12px">Traced to ${esc(JSON.stringify(f.record_terms.trace))}</p>`:''}
   ${bTable(f.boundaries)}
   ${frozen()?'':freightEditor(f)}</div>`;
}
function freightEditor(f){ const d=WF.freightDry, a=WF.freightApproval;
  const start=JSON.stringify(f.record_terms?Object.fromEntries(Object.entries(f.record_terms).filter(([k])=>k!=="trace")):(f.effective||{summary:"",groups:[],elseActual:true,actualNote:"Freight is confirmed by HCPS on your order confirmation."}),null,1);
  return `<h3>Change the freight terms</h3>
  <p class="mut" style="font-size:12px">Freight terms take effect for dealers the moment they are stored. Trace them to an accepted source and/or a decision of this line.</p>
  <textarea id="fr_terms" style="min-height:150px;font-family:monospace;font-size:11.5px" oninput="WF.freightDry=null;WF.freightApproval=null">${esc(start)}</textarea>
  <div class="grid3"><label>Source # (accepted)<br><input type="text" id="fr_src" value="${esc(((LINE.sources||[]).filter(s=>s.status==='accepted').slice(-1)[0]||{}).id||'')}"></label><label>Decision #<br><input type="text" id="fr_dec"></label></div>
  ${d?`<div class="dry"><b>Dry run</b> — plan <code>${short(d.plan_hash)}</code><div class="grid2"><div><b>Now</b> (${esc(d.preview.before.source)})${bTable(d.preview.before.boundaries)}</div><div><b>After</b> (record)${bTable(d.preview.after.boundaries)}</div></div></div>
     ${gateBox(1,"Write these freight terms",a?(a.used?"used":"approved"):"wait",a?`<p class="mut" style="font-size:12px">Approval #${a.id} for plan <code>${short(d.plan_hash)}</code></p><button class="btn" onclick="writeFreight()">Write freight terms (writes)</button>`
        :`<input type="text" id="fr_reason" placeholder="Why these terms are right (required)" style="width:60%"> <button class="btn warn" onclick="approve('stage','freight')">Approve exactly this plan</button>`)}`
     :`<div style="margin-top:8px"><button class="btn ghost" onclick="freightDry()">Preview (dry run)</button></div>`}`; }
let FR_BODY=null;
async function freightDry(){

  WF.freightDry=r.j; WF.freightApproval=null; drawStep();
}

  const r=await apiq(Object.assign({},FR_BODY,{approval_decision_id:WF.freightApproval.id})); if(!r.ok){ toast("Not written: "+r.e.message); return; }
  toast("Freight terms stored (approval #"+r.j.approval_used+" used)"); WF.freightDry=null; WF.freightApproval=null; WF.commercial=null; await reloadLine(true); TAB="commercial"; renderLine();
}

/* ── 5. STAGE ───────────────────────────────────────────────────────────────────────────────────── */
function stepStage(){
  const M=WF.match, d=WF.stageDry, a=WF.stageApproval;
  if(frozen()) return ro("Staging is not available on a frozen line.");
  if(!M.source) return '<p class="mut">No accepted price list to stage. Start in 1 · Sources.</p>';
  const blocked=(M.blocked||[]).map(b=>`<li><b>${esc(b.code)}</b> — ${b.needs.map(n=>esc(n.why)).join(' ')}</li>`).join('');
  const newRow=x=>`<span style="font-size:12px">${money(x.base_price)} per ${esc(x.uom||'unit')}${Number(x.case_qty)>1?' ('+esc(x.case_qty)+' each)':''} · MSRP ${money(x.msrp)}${x.msrp_basis?' '+esc(x.msrp_basis):''} · MAP ${money(x.map)}${x.map_basis?' '+esc(x.map_basis):''} · unit cost ${money(x.dealer_unit_cost)}${(x.tiers||[]).length?' · breaks '+esc(x.tiers.map(t=>(t.min_qty||t.minQty)+'+ $'+t.price).join(', ')):''} · ${esc(x.status||'active')}</span>`;
  const plan=d?d.plan.map(p=>`<tr><td><b>${esc(p.code)}</b></td><td>${p.action==='create'?pill('p-adv','new record'):esc(p.action)}</td><td>${p.action==='create'?newRow(p.set):(Object.entries(p.changed||{}).map(([k,v])=>`<div style="font-size:11.5px">${esc(k)}: ${jv(v[0])} → ${jv(v[1])}</div>`).join('')||'<span class="mut">no change</span>')}</td><td class="mut" style="font-size:11px">${(p.not_in_source||[]).join(', ')}</td><td>${(p.would_clear||[]).length?pill('p-fail','would clear '+p.would_clear.join(', ')):''}</td></tr>`).join(''):'';
  const prev=d&&d.activation_preview?`<p class="mut" style="font-size:12px">If this line were activated after staging: ${esc(JSON.stringify({compared:d.activation_preview.compared,differences:(d.activation_preview.drift||[]).length}))}</p>`:'';
  return `<p class="sub">The proposed rows are the source facts with the recorded HCPS decisions applied (${M.stage_rows.length} rows from source #${M.source.id}). A field the source leaves out is kept; nothing is cleared without a decision. The dry run shows exactly what would be written to the master record.</p>
  ${blocked?`<div class="card" style="border-color:#f3d9a4;background:#fffaf0"><b>${M.blocked.length} SKU(s) wait for a decision</b> and are not staged:<ul style="margin:6px 0 0 18px">${blocked}</ul><p style="margin-top:6px"><button class="btn ghost" onclick="go('match')">Go to 2 · Match & decide</button></p></div>`:''}
  <div class="bar"><button class="btn ghost" onclick="stageDry()" ${M.stage_rows.length?'':'disabled'}>Dry run</button><span class="mut" style="font-size:12px">Writes nothing.</span></div>
  ${d?`<div class="dry"><b>Dry run</b> — plan <code>${short(d.plan_hash)}</code> · ${d.plan.length} rows${(d.would_clear_refused||[]).length?' · '+pill('p-fail',d.would_clear_refused.length+' would clear — not allowed'):''}
     <table><thead><tr><th>SKU</th><th>Action</th><th>Changes</th><th>Not in source (kept)</th><th></th></tr></thead><tbody>${plan}</tbody></table>${prev}</div>
     ${gateBox(1,"Write the staged records",a?(a.used?"used":"approved"):"wait",a?`<p class="mut" style="font-size:12px">Approval #${a.id} for plan <code>${short(d.plan_hash)}</code>. Writing changes the master record only; dealers see nothing until the line is activated (Approval 2).</p><button class="btn" onclick="stageWrite()">Write staged records (writes)</button>`
        :`<input type="text" id="st_reason" placeholder="Why this plan is right (required)" style="width:60%"> <button class="btn warn" onclick="approve('stage','records')">Approve exactly this plan</button>`)}`:''}`;
}
function stageBody(){ const M=WF.match; return {action:"stage_record_source",manufacturer:OPEN,source_id:M.source.id,rows:M.stage_rows}; }
async function stageDry(){ const r=await apiq(Object.assign(stageBody(),{dry_run:true})); if(!r.ok){ toast("Dry run refused: "+r.e.message); return; } WF.stageDry=r.j; WF.stageApproval=null; drawStep(); }
async function stageWrite(){
  const r=await apiq(Object.assign(stageBody(),{approval_decision_id:WF.stageApproval.id})); if(!r.ok){ toast("Not staged: "+r.e.message); return; }
  toast(r.j.staged.length+" records staged (approval #"+r.j.approval_used+" used)"); WF.stageDry=null; WF.stageApproval=null; WF.match=null; WF.commercial=null; WF.preRun=null; await reloadLine(true); TAB="activate"; renderLine();
}
async function approve(gate, kind){
  const reason=((gate==="stage"?(kind==="freight"?$("#fr_reason"):$("#st_reason")):$("#act_reason"))||{}).value;
  if(!reason||!reason.trim()){ toast("Give the reason for the approval"); return; }
  const body={action:"mc_approve_gate",manufacturer:OPEN,gate,reason:reason.trim()};
  if(gate==="stage"){ const d=kind==="freight"?WF.freightDry:WF.stageDry; body.plan_hash=d.plan_hash; body.plan_kind=kind; } else body.run_id=WF.preRun.id;
  const r=await apiq(body); if(!r.ok){ toast("Not approved: "+r.e.message); return; }
  if(gate==="stage"&&kind==="freight") WF.freightApproval=r.j.approval; else if(gate==="stage") WF.stageApproval=r.j.approval; else WF.actApproval=r.j.approval;
  toast("Approval #"+r.j.approval.id+" recorded"); LINE=await api({action:"mc_line",manufacturer:OPEN}); drawStep();
}

/* ── 6. VERIFY & ACTIVATE ───────────────────────────────────────────────────────────────────────── */
function stepActivate(){
  const m=LINE.meta||{}, pre=WF.preRun, a=WF.actApproval, d=WF.actDry;
  const last=(LINE.runs||[])[0];
  const live=m.record_authoritative===true;
  const verifyBar=`<div class="bar"><button class="btn" id="vbtn" onclick="verifyWF('${live?'release':'pre'}')">${live?'Run verification':'Run pre-activation verification'}</button><span class="mut" style="font-size:12px">Saved as evidence; never deleted or rewritten.</span></div>`;
  let gate="";
  if(!live && !frozen()){
    gate=pre&&pre.result==="pass"
      ? gateBox(2,"Activate the line (prices come from the master record)",a?(a.used?"used":"approved"):"wait",
          a?`<p class="mut" style="font-size:12px">Approval #${a.id} for pre-activation run #${pre.id} (fingerprint <code>${esc(pre.fingerprint||'')}</code>).</p>
             ${d?`<div class="dry"><b>Activation dry run:</b> ${esc(d.message)}</div><button class="btn" onclick="activate(false)">Activate (writes)</button>`:`<button class="btn ghost" onclick="activate(true)">Activation dry run</button>`}`
           :`<input type="text" id="act_reason" placeholder="Why this line may go live (required)" style="width:60%"> <button class="btn warn" onclick="approve('activate')">Approve activation</button>`)
      : `<div class="gatebox g-wait"><div class="gh"><span class="gn">Approval 2</span> <b>Activate the line</b> ${pill('p-warn','needs a passing pre-activation run')}</div><p class="mut" style="font-size:12px">Run the pre-activation verification after staging. It must pass, and the record must not change after it, before activation can be approved.</p></div>`;
  }
  return `${frozen()?ro("You can still run the verification — it changes no product data."):''}
  <p class="sub">${live?'This line already prices from the master record. Verification checks everything a dealer sees against its baseline.':'The full verification suite on the staged record — cards, cart, server pricing, freight at every threshold, both emails, images and the fingerprint. Then Approval 2, an activation dry run, and activation; a post-activation verification runs straight after.'}</p>
  ${verifyBar}<div id="runview">${pre?runHtml(pre):(RUN?runHtml(RUN):'')}</div>${gate}
  ${LINE.gold_standard&&!pre?`<p style="font-size:12px"><b>Current Gold Standard:</b> ${pill('p-pass','pass')} run #${esc(LINE.gold_standard.id)} ${esc(LINE.gold_standard.phase)} · ${esc(fmtT(LINE.gold_standard.run_at))}</p>`:''}
  ${last&&!pre&&(!LINE.gold_standard||last.id!==LINE.gold_standard.id)?`<p class="mut" style="font-size:12px">${LINE.gold_standard?'History — latest run':'Last run'}: #${last.id} ${esc(last.phase)} ${esc(last.result)} · ${esc(fmtT(last.run_at))}</p>`:''}`;
}
async function verifyWF(phase){
  if(BUSY) return; BUSY=true; const b=$("#vbtn"); if(b){ b.disabled=true; b.textContent="Verifying… (up to a minute)"; }
  try{ const j=await api({action:"mc_verify",manufacturer:OPEN,phase}); const run={id:j.run_id,phase:j.phase,result:j.result,checks:j.checks,fingerprint:j.fingerprint,run_at:new Date().toISOString(),baseline_run:j.baseline_run};
    if(phase==="pre"){ WF.preRun=run; WF.actApproval=null; WF.actDry=null; } else RUN=run;
    toast(j.result==='pass'?'Verification passed':'Verification FAILED — see the checks'); await reloadLine(true); TAB="activate"; renderLine(); }
  catch(e){ toast("Verification did not finish: "+e.message); }
  BUSY=false;
}
async function activate(dry){
  const r=await apiq({action:"set_record_authority",manufacturer:OPEN,authoritative:true,confirm_parity:true,approval_decision_id:WF.actApproval.id,dry_run:dry});
  if(!r.ok){ toast((dry?"Dry run refused: ":"Not activated: ")+r.e.message); return; }
  if(dry){ WF.actDry=r.j; drawStep(); return; }
  toast("Activated — running the post-activation verification"); WF.actDry=null; WF.actApproval=null; WF.preRun=null;
  await reloadLine(true); await verifyWF("post");
}

/* ── HISTORY ────────────────────────────────────────────────────────────────────────────────────── */
function stepHistory(){
  const G=LINE.gold_standard;
  const runs=(LINE.runs||[]).map(r=>`<tr class="${RUN&&RUN.id===r.id?'sel':''}${G&&G.id===r.id?' gsrow':''}"><td><input type="checkbox" class="cmpk" value="${r.id}"></td><td>${r.id}</td><td>${esc(fmtT(r.run_at))}<div class="mut" style="font-size:11px">${esc(r.run_by||'')}</div></td><td>${esc(r.phase)}</td><td>${pill(r.result==='pass'?'p-pass':'p-fail',r.result)}${G&&G.id===r.id?' '+pill('p-pass','Current Gold Standard'):(G&&r.result!=='pass'?' <span class="mut" style="font-size:11px">history</span>':'')}</td><td><code>${esc(r.fingerprint||'')}</code></td><td><button class="btn ghost" onclick="showRun(${r.id})">View</button></td></tr>`).join("");
  const c=WF.cmp;

/* ── CORRECT A PUBLISHED PAGE (Angelo 2026-10-12) ── a regression_fix scoped to one live page and named content areas:

function corrFixes(){ return (LINE.decisions||[]).filter(d=>d.kind==="regression_fix"&&d.hcps_value&&d.hcps_value.scope==="content_correction"); }

    return `<div class="aparea"><div class="aphead"><h4>${esc(ch.area[0].toUpperCase()+ch.area.slice(1))}</h4><span class="mut" style="font-size:11px">correction #${esc(ch.decision)}${ch.from?' · the text of approval #'+esc(ch.from):''}</span></div>

    <p class="mut" style="font-size:12px">Unchanged on this page: ${esc((pl.unchanged&&pl.unchanged.fields||[]).join(', '))} — ${pl.unchanged&&pl.unchanged.identical?'identical':'DIFFERENT'}. Dealer preview: ${prev.pass?'pass':'FAIL'}.</p>`;

async function corrOpen(rid){

/* ═══ PRODUCT ENRICHMENT — Release B (approved 2026-10-11) ═════════════════════════════════════════════════
   The front door's stages 2–4 for one line: Products → Auto-Enrich → Review Issues. The system proposes the pages,
   reads the manufacturer's pages, drafts copy and copies photos into HCPS storage; Angelo works from Review Issues,
   never field by field. Every draft is hidden from dealers; on a frozen line every write carries the line's open

const PAPI="/.netlify/functions/product-content";
let EN=null;   // {slug, tab, plan, busy, log:[], pend:{}}
async function papi(body){ const h={"content-type":"application/json"}; if(TOKEN) h["authorization"]="Bearer "+TOKEN;
  const r=await fetch(PAPI,{method:"POST",headers:h,body:JSON.stringify(body)});
  if(r.status===401){ gate(); throw new Error("unauthorized"); }
  const j=await r.json().catch(()=>({})); if(!r.ok||j.ok===false||j.error) { const e=new Error(j.message||j.error||("HTTP "+r.status)); e.status=r.status; e.body=j; throw e; } return j; }
const ENRICH_STAGES=[["sources","1 · Manufacturer & Sources"],["products","2 · Products"],["auto","3 · Auto-Enrich"],["issues","4 · Review Issues"],["approve","5 · Approve Content & Images"],["preview","6 · Dealer Preview"],["publish","7 · Publish & Verify"]];

function enWin(){ return EN&&EN.plan&&EN.plan.window; }
function winBody(b){ const w=enWin(); return Object.assign({manufacturer:EN.slug}, w?{enrichment_window:{decision_id:w.id}}:{}, b); }

async function apSend(sel){
  try{ const r=await papi(Object.assign({action:"approval_record",manufacturer:EN.slug},Array.isArray(sel)?{selections:sel}:sel));
    (r.pages||[]).forEach(np=>{ const i=EN.ap.pages.findIndex(x=>x.page_key===np.page_key); if(i>=0) EN.ap.pages[i]=Object.assign({review_status:EN.ap.pages[i].review_status},np); });
    toast("Recorded"+(r.recorded&&r.recorded.length>1?" ("+r.recorded.length+" choices)":"")); return true; }
  catch(e){ toast("Not recorded: "+e.message); return false; }
}
async function apSave(id,confirmed){
  const [pk,area]=id.split("__"), p=EN.ap.pages.find(x=>x.page_key===pk), a=p.areas.find(x=>x.id===area), pend=EN.apPend[id]||{}, choice=pend.choice;

  /* never replace a saved President edit without an explicit confirmation */

  const value={};

    else value.text=String((el&&el.value)||"").trim(); }
  if(await apSend({page_key:pk,area,choice,value})){ delete EN.apPend[id]; if(area==="images") delete EN.apGal[pk]; $("#enbody").innerHTML=enApprove(); }

async function apUpload(pk,code){
  const id=code?pk+"__opt__"+code:pk, f=($("#apup_"+CSS.escape(id))||{}).files, file=f&&f[0]; if(!file){ toast("Choose a photo"); return; }
  if(file.size>6*1024*1024){ toast("Photo larger than 6 MB"); return; }
  const b64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(file); });
  try{ const up=await papi(winBody({action:"upload_image",page_key:pk,filename:file.name,content_type:file.type||"image/jpeg",content_base64:b64}));

    else { const G=EN.apGal[pk]=EN.apGal[pk]||[]; G.push(up.url); const p=EN.ap.pages.find(x=>x.page_key===pk); p.candidates.push({url:up.url,display:up.url,kinds:["uploaded"],codes:[],role:"uploaded"}); $("#enbody").innerHTML=enApprove(); toast("Uploaded — tick Save choice to record your gallery"); } }
  catch(e){ toast("Not uploaded: "+e.message); }
}
/* ── RELEASE C — DEALER PREVIEW (approved 2026-10-11). Read-only and staff-only: product-content enrich_preview runs the
   storefront's own merge twice (today; and with the Ready drafts treated as published, in memory) and returns the
   dealer cards, the storefront's price words and the accounting proof for every active SKU. Nothing is written or
   published. The yellow "STAFF ONLY" notes exist only on this screen — they are not part of anything a dealer gets. */

  EN.pvBusy=false; enDraw();
}
function pvImg(u,alt){ return u?`<img class="pvimg" src="${esc(u)}" alt="${esc(alt||'')}" loading="lazy" onerror="this.outerHTML='<div class=&quot;pvph&quot;>No image</div>'">`:'<div class="pvph">No image</div>'; }
function pvCards(){ return (EN.pv&&EN.pv[EN.pvMode==="today"?"today":"proposed"])||[]; }
function enPreview(){
  const l=LINES.find(x=>x.slug===EN.slug)||{}, nm=l.name||EN.slug;
  if(!EN.pv) return `<h3>Dealer Preview</h3><p class="sub">See exactly what a dealer would see if the Ready pages were published <b>with your recorded content &amp; image selections</b> — computed with Partner 360's own catalog merge, picker and price words. Held-back products are shown on the card dealers have today. <b>Read-only and staff-only: nothing is published, saved, copied or selected.</b></p>
    <button class="btn" id="pvgo" onclick="enPreviewRun()" ${EN.pvBusy?'disabled':''}>${EN.pvBusy?'Building the preview…':'Preview '+esc(nm)+' as Dealer'}</button>`;
  const V=EN.pv, s=V.summary, cards=pvCards();
  const tile=(n,lbl,good)=>`<div class="pvtile ${good===true?'good':(good===false?'bad':'')}"><b>${esc(n)}</b><span>${esc(lbl)}</span></div>`;
  const tiles=tile(s.enriched_pages_ready,"enriched pages shown with your selections")+tile(s.held_back,"products/pages held back")+(s.waiting_for_approval?tile(s.waiting_for_approval,"pages waiting for your approval (current cards)"):"")+tile(s.accounted+" / "+s.active_skus,"active SKUs accounted for",s.accounted===s.active_skus)
    +tile(s.missing,"missing",s.missing===0)+tile(s.duplicates,"duplicates",s.duplicates===0)+tile(s.commercial_changes,"commercial changes",s.commercial_changes===0);
  const checks=V.checks.map(c=>`<div style="display:flex;gap:8px;align-items:flex-start;margin:3px 0">${pill(c.pass?'p-pass':'p-fail',c.pass?'Pass':'Fail')}<span style="font-size:12.5px">${esc(c.label)}${!c.pass&&c.detail?`<div class="needtxt">${esc(JSON.stringify(c.detail).slice(0,400))}</div>`:''}</span></div>`).join('');
  const grid=cards.map((k,ix)=>{ const o=k.options[0]||{};
    return `<button class="pvcard" onclick="pvOpen(${ix})">${pvImg(k.image,k.name)}<div class="t">${esc(k.name)}</div>${o.price_html||''}
      ${k.options.length>1?`<div class="pnote">${k.options.length} options</div>`:''}${k.staff_note?`<div class="pvstaff"><b>STAFF ONLY</b> · ${esc(k.staff_note)}</div>`:''}</button>`; }).join('');
  const acc=V.skus.map(x=>`<tr><td><code>${esc(x.code)}</code></td><td>${esc(x.page||'—')}</td><td style="font-size:12px">${esc(x.path)}</td><td style="font-size:12px">${esc(x.today_card.join(' / ')||'—')}</td><td style="font-size:12px">${esc(x.proposed_card.join(' / ')||'—')}</td><td>${esc(x.unit||'—')}</td><td style="font-size:12px">${esc(x.price_proposed||'—')} ${x.commercial_same?pill('p-pass','unchanged'):pill('p-fail','changed')}</td><td>${x.orderable_proposed?'✓':'<span class="needtxt">no</span>'}</td></tr>`).join('');
  return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3 style="margin:0">${esc(nm)} as a dealer would see it</h3>${pill(V.pass?'p-pass':'p-fail',V.pass?'All checks pass':'Checks failing')}<span style="flex:1"></span>
      <span class="pvtog"><button class="${EN.pvMode==='today'?'on':''}" onclick="pvMode('today')">Current Dealer View</button><button class="${EN.pvMode==='proposed'?'on':''}" onclick="pvMode('proposed')">Approved New Dealer View</button></span>
      <button class="btn ghost" onclick="enPreviewRun()">Rebuild</button></div>
    <div class="apnote"><b>Preview only — switching views does not select content or images.</b> Your selections are made and recorded in <a href="#" onclick="enGo('approve');return false">5 · Approve Content &amp; Images</a>.</div>
    <p class="mut" style="font-size:12px;margin:4px 0">Read-only, staff-only. ${EN.pvMode==='proposed'?'Approved New Dealer View: each Ready page built from your <b>recorded selections only</b> — an area you have not decided shows today\'s content and photos; a suggested photo you did not pick never appears. Held-back products stay on the card dealers have today.':'Current Dealer View: exactly what dealers see now.'} ${s.cards_today} cards today → ${s.cards_proposed} with your selections. Nothing is published.</p>
    ${V.approval?`<div class="apcheck">${Object.keys(V.approval).map(k=>{ const a=V.approval[k], pg=(EN.plan.pages.find(p=>p.page_key===k)||{}).name||k; return `<span class="apchip ${a.status==='approved'?'ok':'wait'}">${esc(pg)}: ${esc(a.status==='approved'?'approved':(a.status==='kept_as_today'?'kept as today':'waiting for your approval — '+a.waiting.join(', ')))}</span>`; }).join('')}</div>`:''}
    <div class="pvtiles">${tiles}</div>
    <div class="pvgrid">${grid}</div><div id="pvdetail">${EN.pvCard!=null?pvDetail():''}</div>
    <details style="margin-top:10px" ${V.pass?'':'open'}><summary><b>Proof checks (${V.checks.filter(c=>c.pass).length}/${V.checks.length} pass)</b></summary><div style="margin-top:6px">${checks}</div></details>
    <details style="margin-top:8px"><summary><b>Accounting — all ${s.active_skus} active SKUs</b> (retired, kept off: ${esc(s.retired_excluded.join(', ')||'none')})</summary>
      <div style="overflow-x:auto"><table style="margin-top:6px"><thead><tr><th>SKU</th><th>Product page</th><th>Shown through</th><th>Today's card</th><th>Proposed card</th><th>Order unit</th><th>Price words</th><th>Orderable</th></tr></thead><tbody>${acc}</tbody></table></div></details>`;
}
function pvMode(m){ EN.pvMode=m; EN.pvCard=null; EN.pvCart=null; enDraw(); }
function pvOpen(ix){ EN.pvCard=ix; EN.pvOpt=0; EN.pvMain=null; EN.pvCart=null; enDraw(); const d=$("#pvdetail"); if(d&&d.scrollIntoView) d.scrollIntoView({behavior:"smooth",block:"start"}); }
function pvPick(v){ EN.pvOpt=+v; EN.pvMain=null; EN.pvCart=null; $("#pvdetail").innerHTML=pvDetail(); }
function pvShow(u){ EN.pvMain=u; $("#pvdetail").innerHTML=pvDetail(); }
function pvAdd(){ EN.pvCart=EN.pvOpt; $("#pvdetail").innerHTML=pvDetail(); }
function pvDetail(){
  const k=pvCards()[EN.pvCard]; if(!k) return ""; const o=k.options[EN.pvOpt]||k.options[0];
  const main=EN.pvMain||o.image||k.image, pics=[...new Set([o.image].concat(k.media).filter(Boolean))];
  const heldPg=k.staff_note&&EN.pv.held_pages.find(h=>h.skus.some(c=>k.codes.indexOf(c)>=0));
  const specs=(k.specs||[]).filter(x=>x&&(x.label||x.value)).map(x=>`<tr><td><b>${esc(x.label||'')}</b></td><td>${esc(x.value||'')}</td></tr>`).join('');
  const c=EN.pvCart!=null?(k.options[EN.pvCart]||o).cart:null;
  return `<div class="pvdetail"><div>${pvImg(main,k.name)}${pics.length>1?`<div class="pvthumbs">${pics.map((u,i)=>`<img src="${esc(u)}" alt="" loading="lazy" data-i="${i}" onclick="pvShow(this.src)" onerror="this.remove()">`).join('')}</div>`:''}</div>
    <div style="min-width:0">${k.staff_note?`<div class="pvstaff" style="margin:0 0 8px"><b>STAFF ONLY — dealers never see this</b> · ${esc(k.staff_note)}${heldPg&&heldPg.issues.length?`<div style="margin-top:3px">Held for: ${heldPg.issues.map(esc).join(' · ')}</div>`:''}</div>`:''}
      <h3 style="margin:0 0 4px;overflow-wrap:anywhere">${esc(k.name)}</h3>
      ${k.options.length>1?`<label>Option</label><div><select onchange="pvPick(this.value)" style="max-width:100%">${k.options.map((x,i)=>`<option value="${i}" ${i===(EN.pvOpt||0)?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div>`:''}
      <div style="margin:8px 0">${o.price_html||''}</div>
      <div class="mut" style="font-size:12px">SKU <code>${esc(o.code)}</code> · ${esc(o.case_qty>1?'Case of '+o.case_qty:(o.uom||'Each'))}${o.orderable?'':' · <span class="needtxt">not orderable</span>'}</div>
      <div style="margin-top:8px"><button class="btn" onclick="pvAdd()">Add to cart (preview only)</button></div>
      ${c?`<div class="pvcart"><div class="mut" style="font-size:11px">The cart line a dealer would see — preview only, nothing was added to any cart</div><div><b>${esc(c.title)}</b></div><div class="mut">${esc(c.sub)}</div><div>${esc(c.money)}</div></div>`:''}
      ${k.description?`<p style="font-size:13px;line-height:1.5;margin:10px 0">${esc(k.description)}</p>`:''}
      ${(k.features||[]).length?`<ul style="font-size:12.5px;margin:6px 0 6px 18px">${k.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
      ${specs?`<table style="font-size:12px;margin-top:6px"><tbody>${specs}</tbody></table>`:''}
      ${k.warranty?`<p style="font-size:12px"><b>Warranty:</b> ${esc(k.warranty)}</p>`:''}
      ${(k.documents||[]).length?`<p style="font-size:12px"><b>Documents:</b> ${k.documents.map(d=>`<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.label||'Document')}</a>`).join(' · ')}</p>`:''}
      <p class="mut" style="font-size:11.5px;margin-top:8px">${esc([k.category,k.subcategory].filter(Boolean).join(' › '))}${k.enriched?' · enriched page':' · current catalog content'}</p></div></div>`;
}
/* ── RELEASE D — PUBLISH & VERIFY. The dry run lists exactly what will be published (only Ready pages), every photo that
   moves from the draft folder to the live folder, and the dealer accounting it must produce. "Approve & Publish" records
   the approval for THAT dry run (its plan hash), copies the photos, publishes the pages in one database transaction and
   checks the live result against the approved one — rolling back by itself if anything differs. Making it the new Gold
   Standard (Finalize) is a separate step after the live storefront check. Nothing here touches a price. */
function pubState(){ const P=EN&&EN.plan, d=P&&P.publication, live=P&&P.pages.some(p=>p.status==="published");
  if(!d||(d.used_at&&!live)) return EN&&EN.pub?(EN.pub.publishable?"Dry run ready":"Dry run — see problems"):(d?"Rolled back — dry run first":"Dry run first");
  if(!d.used_at) return "Approved — not carried out"; return P.window?"Published — finalize pending":"Gold Standard"; }
async function pubPlan(){ if(EN.pubBusy) return; EN.pubBusy="Running the publication dry run…"; enDraw();
  try{ EN.pub=await papi({action:"publish_plan",manufacturer:EN.slug}); EN.pubRes=null; }catch(e){ toast("Dry run not built: "+e.message); }
  EN.pubBusy=null; enDraw(); }
function fname(u){ return String(u||"").split("/").pop(); }
function enPublish(){
  const P=EN.plan, l=LINES.find(x=>x.slug===EN.slug)||{}, nm=l.name||EN.slug, d=P.publication;
  const live=P.pages.filter(p=>p.status==="published");
  if(d&&d.used_at&&live.length){
    return `<h3>${esc(nm)} — ${P.window?'published, final verification pending':'published · Gold Standard'}</h3>
      <p class="sub">Approval #${d.id} carried out ${esc(fmtT(d.used_at))}: ${live.map(p=>esc(p.name)).join(' · ')}. ${P.window?'Check the live storefront (desktop and phone), then finalize — or roll back.':'The verification run is the line\'s Gold Standard.'}</p>
      ${EN.pubRes?pubChecks(EN.pubRes):''}
      ${P.window?`<div class="gatebox g-wait"><div class="gh"><span class="gn">Needs you</span> <b>Final verification</b></div>
        <p style="font-size:12.5px;margin:0 0 8px">Finalize runs ${esc(nm)}'s full verification (no baseline — this run becomes the Gold Standard, with the content fingerprint), proves Climbing Steps, Strongback and Ovation still read their Gold Standard fingerprints, then spends enrichment window #${esc(P.window.id)}. Any failure rolls the publication back and records the run.</p>
        <button class="btn" onclick="pubFinalize(${d.id})" ${EN.pubBusy?'disabled':''}>Finalize — make this the Gold Standard</button>
        <input type="text" id="pub_rb_reason" placeholder="Why roll back? (required to roll back)" style="min-width:240px"> <button class="btn ghost" onclick="pubRollback(${d.id})" ${EN.pubBusy?'disabled':''}>Roll back</button>
        ${EN.pubBusy?`<div class="mut" style="margin-top:6px">${esc(EN.pubBusy)}</div>`:''}</div>`:''}`;
  }
  if(!EN.pub) return `<h3>Publish &amp; Verify</h3><p class="sub">First a dry run: exactly which pages go live (only Ready pages whose content &amp; images you approved — everything else stays on its current catalog card), the content and photos <b>you selected</b> (nothing Auto-Enrich merely suggested), every approved photo copied to the live folder, and the dealer result it must produce. Nothing is published by the dry run.</p>
    <button class="btn" id="pubdry" onclick="pubPlan()" ${EN.pubBusy?'disabled':''}>${EN.pubBusy?esc(EN.pubBusy):'Run publication dry run'}</button>`;
  const R=EN.pub, s=R.summary;
  const tile=(n,lbl,good)=>`<div class="pvtile ${good===true?'good':(good===false?'bad':'')}"><b>${esc(n)}</b><span>${esc(lbl)}</span></div>`;
  const tiles=tile(s.cards_today+" → "+s.cards_after,"dealer cards today → after")+tile(s.accounted+" / "+s.active_skus,"active SKUs represented",s.accounted===s.active_skus)
    +tile(s.enriched_pages_live,"enriched pages go live")+tile(s.held_on_current_cards,"held — current catalog cards")+tile(s.missing,"missing SKUs",s.missing===0)
    +tile(s.duplicates,"duplicate SKU cards",s.duplicates===0)+tile(s.commercial_changes,"commercial changes",s.commercial_changes===0)+tile(s.photos_promoted,"photos promoted to live");
  const pages=R.ready.map(p=>`<div class="card sub2" style="margin:8px 0"><b>${esc(p.name)}</b> <span class="mut">· ${p.skus.map(esc).join(', ')} · ${esc(p.changes.status)} · draft window ${esc(p.changes.draft_window)} · ${esc(p.changes.photos)}</span>
      ${p.selections?`<div class="apcheck">${p.selections.map(c=>`<span class="apchip ok">${esc(c.label)} ✓ ${esc(c.no_change?'no change':(c.choice?c.choice.replace(/_/g,' '):'chosen'))}</span>`).join('')}</div>`:''}
      ${p.promote.length?`<div style="overflow-x:auto"><table style="margin-top:6px;font-size:12px"><thead><tr><th>Approved photo</th><th>→ live copy</th><th>Used as</th></tr></thead><tbody>${p.promote.map(x=>`<tr><td><code>${esc(fname(x.from))}</code>${x.kept_current?' <span class="mut">(today\'s photo, kept)</span>':''}</td><td><code>${esc(x.to.replace(/^.*\/product-content\//,''))}</code></td><td>${esc(x.uses.join(', '))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="mut" style="font-size:12px;margin-top:4px">No photo to copy: dealers keep today\'s photos.</div>'}
      ${p.deduped.length?`<div class="mut" style="font-size:12px;margin-top:4px">Same picture, one live copy: ${p.deduped.map(x=>`<code>${esc(fname(x.from))}</code> = <code>${esc(fname(x.same_as))}</code> (${esc(x.why)})`).join('; ')}</div>`:''}
      ${p.after_photos.options.length>1?`<div style="font-size:12px;margin-top:4px">Options: ${p.after_photos.options.map(o=>`${esc(o.option||o.sku)} → <code>${esc(fname(o.image))}</code>`).join(' · ')}</div>`:''}
      ${p.after_photos.card?`<div style="font-size:12px;margin-top:4px">Catalog card image: ${p.after_photos.card==='none'?'<b>No image</b> (placeholder)':`<code>${esc(fname(p.after_photos.card))}</code>`}</div>`:''}</div>`).join('');
  const held=R.held.map(h=>`<li><b>${esc(h.name)}</b> <span class="mut">(${h.skus.map(esc).join(', ')})</span> — stays on its current catalog card; open: ${h.issues.map(esc).join(' · ')||'—'}</li>`).join('');
  return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3 style="margin:0">Publication dry run — ${esc(nm)}</h3>${pill(R.publishable?'p-pass':'p-fail',R.publishable?'Ready to approve':'Cannot be approved')}<span style="flex:1"></span><button class="btn ghost" onclick="pubPlan()">Run again</button></div>
    <p class="mut" style="font-size:12px;margin:4px 0">Plan <code>${esc(R.plan_hash.slice(0,16))}</code> — the approval is tied to exactly this dry run; if anything changes, it becomes invalid and a new dry run is needed. Retired, kept off: ${esc(s.retired_excluded.join(', ')||'none')}. Prices, tiers, UOM/case qty, MSRP/MAP, freight and commercial status are not touched.</p>
    <div class="pvtiles" style="grid-template-columns:repeat(4,1fr)">${tiles}</div>
    ${R.problems.length?`<div class="card err">${R.problems.map(esc).join('<br>')}</div>`:''}
    <h3 style="margin-top:12px">Pages that will be published (${R.ready.length})</h3>${pages}
    ${(R.awaiting||[]).length?`<h3 style="margin-top:12px">Waiting for your content &amp; image approval — not published (${R.awaiting.length})</h3><ul style="font-size:12.5px;margin:4px 0 0 18px">${R.awaiting.map(a=>`<li><b>${esc(a.name)}</b> <span class="mut">(${a.skus.map(esc).join(', ')})</span> — ${a.status==='kept_as_today'?'grouping kept as today: its SKUs stay on their current cards':'stays on its current catalog card until you approve: '+esc((a.waiting||[]).join(', '))} · <a href="#" onclick="enGo('approve');return false">Approve</a></li>`).join('')}</ul>`:''}
    <h3 style="margin-top:12px">Held — not published (${R.held.length})</h3><ul style="font-size:12.5px;margin:4px 0 0 18px">${held}</ul>
    ${EN.pubRes?pubChecks(EN.pubRes):''}
    ${R.publishable?`<div class="gatebox g-wait" style="margin-top:12px"><div class="gh"><span class="gn">Approval</span> <b>Approve &amp; Publish ${esc(nm)}</b></div>
      <p style="font-size:12.5px;margin:0 0 8px">Records your approval of plan <code>${esc(R.plan_hash.slice(0,16))}</code>, copies the ${s.photos_promoted} photos to the live folder, publishes the ${R.ready.length} pages in one database transaction and checks the live dealer view against this dry run — rolling back by itself if anything differs. Final Gold Standard step comes after the live storefront check.</p>
      <input type="text" id="pub_reason" placeholder="Reason (saved with the approval)" style="min-width:280px;width:60%"> <button class="btn" onclick="pubGo()" ${EN.pubBusy?'disabled':''}>Approve &amp; Publish ${esc(nm)}</button>
      ${EN.pubBusy?`<div class="mut" style="margin-top:6px">${esc(EN.pubBusy)}</div>`:''}</div>`:''}`;
}
function pubChecks(r){ const cs=r.checks||[]; return `<div class="card ${r.ok?'':'err'}" style="margin-top:10px"><b>${esc(r.title||'Result')}</b>${cs.map(c=>`<div style="display:flex;gap:8px;margin:3px 0">${pill(c.pass?'p-pass':'p-fail',c.pass?'Pass':'Fail')}<span style="font-size:12.5px">${esc(c.label||c.id)}${!c.pass&&c.detail?`<div class="needtxt">${esc(JSON.stringify(c.detail).slice(0,300))}</div>`:''}</span></div>`).join('')}${r.message?`<p style="font-size:12.5px">${esc(r.message)}</p>`:''}</div>`; }
async function pubGo(){
  const R=EN.pub, reason=(($("#pub_reason")||{}).value||"").trim(); if(!reason){ toast("Give a reason — it is saved with the approval"); return; }
  if(EN.pubBusy) return;
  try{
    EN.pubBusy="Recording your approval of this exact dry run…"; enDraw();
    const a=await papi({action:"publish_approve",manufacturer:EN.slug,plan_hash:R.plan_hash,reason});
    const did=a.decision.id;
    for(let i=0;i<30;i++){ EN.pubBusy="Copying photos to the live folder…"; enDraw(); const p=await papi({action:"publish_promote",manufacturer:EN.slug,decision_id:did}); if(!p.remaining) break; }
    EN.pubBusy="Publishing and checking the live dealer view…"; enDraw();
    const x=await papi({action:"publish_execute",manufacturer:EN.slug,decision_id:did});
    EN.pubRes={ok:true,title:"Published — the live dealer view matches the approved dry run",checks:x.checks}; toast("Published — now check the storefront, then finalize");
  }catch(e){ EN.pubRes={ok:false,title:"Not published",checks:(e.body&&e.body.checks)||[],message:e.message}; toast("Not published: "+e.message); }
  EN.pubBusy=null; await enReload();
}
async function pubFinalize(did){
  if(EN.pubBusy) return; EN.pubBusy="Running the final verification…"; enDraw();
  try{ const r=await api({action:"mc_publish_finalize",manufacturer:EN.slug,decision_id:did}); EN.pubRes={ok:true,title:"Gold Standard saved (run #"+r.run_id+") — enrichment window spent",checks:r.checks.filter(c=>c.severity==="blocking")}; toast("Gold Standard saved"); }
  catch(e){ EN.pubRes={ok:false,title:"Final verification failed — rolled back",checks:(e.body&&e.body.checks)||[],message:e.message}; toast("Rolled back: "+e.message); }
  EN.pubBusy=null; await enReload();
}
async function pubRollback(did){
  const reason=(($("#pub_rb_reason")||{}).value||"").trim(); if(!reason){ toast("Say why — it is recorded"); return; }
  if(EN.pubBusy) return; EN.pubBusy="Rolling back…"; enDraw();
  try{ await api({action:"mc_publish_rollback",manufacturer:EN.slug,decision_id:did,reason}); EN.pubRes={ok:true,title:"Rolled back — the previous dealer view is restored and the run recorded",checks:[]}; EN.pub=null; }
  catch(e){ toast("Not rolled back: "+e.message); }
  EN.pubBusy=null; await enReload();
}
/* masthead provides Lock */
if(TOKEN)boot();else gate();
</script></body></html>
