<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HCPS — Territory Lines</title>
<link rel="stylesheet" href="/admin/admin-shell.css">
<style>
 .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
 .fl{display:block;font-size:12px;font-weight:700;color:var(--gray);margin:0 0 4px}
 select,input{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:#fff}
 .saved{color:#1f9d55;font-size:12.5px;font-weight:700;opacity:0;transition:opacity .2s;align-self:center}.saved.show{opacity:1}
 .mfrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
 .mfr{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;transition:.12s}
 .mfr:hover{border-color:#3B599A}.mfr.on{background:#eef4fb;border-color:#3B599A}
 .mfr input{width:auto}
 .sumtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
 .sumtable th,.sumtable td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
 .sumtable th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray)}
 .chip{display:inline-block;background:#eef2f7;border:1px solid #dfe6ee;border-radius:20px;padding:2px 9px;font-size:11.5px;margin:2px 3px 0 0}
 .stcode{font-weight:800;color:#2B4071}
 .banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
</style>
</head><body>
<header id="ac-head"></header>
<div class="wrap">
  <div class="top"><div><h1 style="margin:0">Territory Lines</h1>
    <div class="sub">Set which manufacturer lines you represent in each state. This drives the map/route filters, the “opportunity” flags on each account, and your target list.</div></div></div>
  <div id="body"><div class="msg">Loading…</div></div>
</div>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
window.addEventListener("hcps-token",e=>{try{TOKEN=e.detail;}catch(_){}});
let TOKEN=HCPS.token(), ME=null; try{ME=HCPS.profile()}catch(e){ME=null;}
const API="/.netlify/functions/territory-api";
let MFRS=[], STATES=[], ASN={}, MNAME={};

async function api(method,body){
  const h={}; if(TOKEN) h["authorization"]="Bearer "+TOKEN; if(body) h["content-type"]="application/json";
  const r=await fetch(API,{method,headers:h,body:body?JSON.stringify(body):undefined});
  return {status:r.status, body:await r.json().catch(()=>({}))};
}
function gate(msg){$("#body").innerHTML=`<div class="gate"><h2>Staff sign-in</h2><p class="hint" style="margin:2px 0 10px">Sign in with your work email and password.</p><input id="lemail" type="email" placeholder="Email" autocomplete="username"><input id="lpass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitTok()"><button class="go" onclick="submitTok()">Sign in</button> <a href="reset.html" style="margin-left:6px;font-size:13px;font-weight:600;color:var(--navy)">Forgot password?</a><div id="lerr" style="color:#b42323;margin-top:8px">${msg||""}</div></div>`;setTimeout(()=>{const t=$("#lemail");if(t)t.focus();},50);}
async function submitTok(){ const email=(($("#lemail")||{}).value||"").trim(), password=(($("#lpass")||{}).value||"");
  const e=$("#lerr"); if(e)e.textContent="Signing in…";
  const r=await fetch("/.netlify/functions/staff-auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email,password})});
  const j=await r.json().catch(()=>({})); if(!j||!j.ok){ gate((j&&j.message)||"Could not sign in."); return; }
  HCPS.setSession(j); TOKEN=j.token; ME=j.profile; load();
}
function lock(){ HCPS.signOut(); TOKEN=null; ME=null; location.reload(); }

async function load(){
  if(!TOKEN){ gate(); return; }
  const {status,body:j}=await api("GET");
  if(status===401){ gate("Your session ended — sign in again."); return; }
  if(status===403){ $("#body").innerHTML=`<div class="card"><h2>Territory setup is admin-only</h2><p class="hint">This configures which manufacturer lines HCPS represents by state. <a class="link" href="/admin/rep-home.html">Go to your workspace →</a></p></div>`; return; }
  const banner = (j&&j.error==="tables_missing") ? `<div class="banner">${esc(j.message||"Run territory.sql in Supabase, then reload.")}</div>` : "";
  MFRS=(j&&j.manufacturers)||[]; STATES=(j&&j.states)||[]; ASN=(j&&j.assignments)||{};
  MNAME={}; MFRS.forEach(m=>MNAME[m.slug]=m.name);
  $("#body").innerHTML=`${banner}
    <div class="card">
      <div class="row">
        <div><label class="fl">State</label><select id="stateSel" onchange="renderState()"></select></div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="go sm" style="background:#fff;color:var(--navy)" onclick="allState(true)">Select all</button>
          <button class="go sm" style="background:#fff;color:var(--navy)" onclick="allState(false)">Clear</button>
          <span class="saved" id="saved">Saved ✓</span>
        </div>
      </div>
      <div class="mfrgrid" id="mfrgrid"></div>
    </div>
    <div class="card"><h2>Your territory at a glance</h2>
      <p class="hint">Every state you've assigned lines to.</p>
      <div id="summary"></div>
    </div>`;
  fillStates(); renderState(); renderSummary();
}

function flashSaved(){ const s=$("#saved"); if(!s)return; s.classList.add("show"); clearTimeout(flashSaved._t); flashSaved._t=setTimeout(()=>s.classList.remove("show"),1200); }
function stateLabel(st){ const n=(ASN[st]||[]).length; return st+(n?` — ${n} line${n>1?"s":""}`:""); }
function fillStates(){ const sel=$("#stateSel"); if(!sel)return; const cur=sel.value||"TN"; sel.innerHTML=STATES.map(st=>`<option value="${st}"${st===cur?" selected":""}>${stateLabel(st)}</option>`).join(""); }
function renderState(){
  const st=$("#stateSel").value; const have=new Set(ASN[st]||[]);
  $("#mfrgrid").innerHTML=MFRS.map(m=>`<label class="mfr ${have.has(m.slug)?"on":""}">
    <input type="checkbox" ${have.has(m.slug)?"checked":""} onchange="toggle('${esc(m.slug)}',this.checked,this)"> ${esc(m.name)}</label>`).join("");
}
async function toggle(slug,on,el){
  const st=$("#stateSel").value;
  el.closest(".mfr").classList.toggle("on",on);
  ASN[st]=ASN[st]||[];
  if(on){ if(!ASN[st].includes(slug))ASN[st].push(slug); } else { ASN[st]=ASN[st].filter(x=>x!==slug); }
  const {body:j}=await api("POST",{action:"set_line",state:st,manufacturer:slug,on});
  if(j&&j.ok){ flashSaved(); fillStates(); renderSummary(); }
}
async function allState(on){
  const st=$("#stateSel").value;
  ASN[st]= on ? MFRS.map(m=>m.slug) : [];
  const {body:j}=await api("POST",{action:"set_state",state:st,manufacturers:ASN[st]});
  if(j&&j.ok){ flashSaved(); renderState(); fillStates(); renderSummary(); }
}
function renderSummary(){
  const sts=Object.keys(ASN).filter(st=>(ASN[st]||[]).length).sort();
  if(!sts.length){ $("#summary").innerHTML=`<p class="hint">No lines assigned yet — pick a state above and check the manufacturers you represent there.</p>`; return; }
  $("#summary").innerHTML=`<table class="sumtable"><thead><tr><th style="width:70px">State</th><th>Lines represented</th></tr></thead><tbody>`+
    sts.map(st=>`<tr><td class="stcode">${st}</td><td>${(ASN[st]||[]).slice().sort((a,b)=>(MNAME[a]||a).localeCompare(MNAME[b]||b)).map(s=>`<span class="chip">${esc(MNAME[s]||s)}</span>`).join("")}</td></tr>`).join("")+
    `</tbody></table>`;
}
load();
</script>
</body></html>
