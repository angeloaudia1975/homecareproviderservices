<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS — Rep Portal</title>
<link rel="stylesheet" href="/admin/admin-shell.css">
<style>
/* The one thing a rep opens from a phone, standing next to their truck. It is the
   largest tap target on the page and it sits above everything else, because a field rep
   should never navigate an admin interface to find out where they are driving today. */
.myroutes{display:flex;align-items:center;gap:14px;margin:16px 0 6px;padding:16px 18px;
  background:linear-gradient(135deg,#F5821F,#e06f0c);color:#fff;border-radius:16px;
  text-decoration:none;box-shadow:0 6px 18px rgba(224,111,12,.28);min-height:64px}
.myroutes:active{transform:translateY(1px)}
.myroutes .mr-ico{font-size:28px;line-height:1}
.myroutes .mr-txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.myroutes .mr-txt b{font-size:19px;font-weight:800;letter-spacing:.2px}
.myroutes .mr-txt i{font-style:normal;font-size:12.5px;opacity:.92}
.myroutes .mr-go{font-size:30px;font-weight:700;opacity:.85;line-height:1}
@media(max-width:640px){
  .myroutes{margin:14px 0 10px;padding:18px;min-height:72px}
  .myroutes .mr-txt b{font-size:21px}
}
</style>
<style>
 .hero{background:linear-gradient(135deg,#1f2b45,#2c3e66);color:#fff;border-radius:16px;padding:22px 24px;margin:12px 0 16px}
 .hero h1{margin:0;color:#fff;font-size:26px}
 .hero .sub{color:#c9d4ea;margin-top:4px;font-size:14px}
 .today{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
 .tpill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:9px 13px;color:#fff;text-decoration:none;font-size:13px;display:flex;align-items:center;gap:8px}
 .tpill:hover{background:rgba(255,255,255,.2)}
 .tpill b{font-size:17px;font-family:'Barlow Condensed',sans-serif}
 .flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
 .fstep{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px}
 .fstep .num{width:24px;height:24px;border-radius:50%;background:var(--orange,#e07b00);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-bottom:7px}
 .fstep .ft{font-weight:700;color:var(--navy);font-size:13.5px;margin-bottom:2px}
 .fstep .fd{color:var(--gray);font-size:12.5px;line-height:1.45}
 .tourbtn{background:#fff;color:#1f2b45;border:0;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:800;cursor:pointer}
 .tourbtn:hover{background:#eef2f6}
 .sec-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
 .sec-h h2{margin:0;font-size:16px;color:var(--navy)}
 .sec-h .hint{margin:0}
 .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px}
 .tile{display:block;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 15px;text-decoration:none;color:inherit;transition:box-shadow .12s,transform .12s,border-color .12s}
 .tile:hover{box-shadow:0 8px 22px rgba(20,30,50,.10);transform:translateY(-1px);border-color:#c9d6e8}
 .tile .ti{font-size:22px}
 .tile .tn{font-weight:800;color:var(--navy);margin:6px 0 3px;font-size:15px}
 .tile .td{color:var(--gray);font-size:12.5px;line-height:1.45}
 .tile .tg{margin-top:9px;font-size:11.5px;font-weight:700;color:var(--orange,#e07b00)}
 .train{display:grid;grid-template-columns:1fr 1fr;gap:14px}
 @media(max-width:820px){.train{grid-template-columns:1fr}}
 .tcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px;scroll-margin-top:120px}
 .tcard h3{margin:0 0 2px;font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px}
 .tcard .tag{color:var(--gray);font-size:12.5px;font-style:italic;margin-bottom:8px}
 .tcard p{margin:0 0 8px;font-size:13px;color:#2b3a4d;line-height:1.5}
 .tcard .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);font-weight:700;margin:8px 0 3px}
 .tcard ul{margin:2px 0 8px;padding-left:17px}
 .tcard li{font-size:12.5px;color:#2b3a4d;line-height:1.5;margin:2px 0}
 .tcard .open{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--orange,#e07b00);text-decoration:none}
</style>
</head><body>
<header id="ac-head"></header>
<div class="wrap">
  <div id="body"><div class="msg">Loading your workspace…</div></div>
</div>
<script src="/admin/staff-session.js"></script>
<script src="/admin/admin-chrome.js"></script>
<script src="/admin/hub-guide.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
window.addEventListener("hcps-token",e=>{try{TOKEN=e.detail;}catch(_){}});
let TOKEN=HCPS.token(), ME=null; try{ME=HCPS.profile()}catch(e){ME=null;}

// The rep's assigned tools. `guide` keys into window.HUB_GUIDE for the training cards below.
const TOOLS=[
  {href:"/admin/dealer.html",              label:"Dealer 360 & CRM",       icon:"📇", desc:"Open any assigned account — timeline, contacts, tasks, notes, sales & email in one place. Sort your book by sales, health or last order.", guide:"Dealer 360 & CRM"},
  {href:"/admin/map.html",                 label:"Territory Map & Routing",icon:"🗺️", desc:"See your dealers on a map, plan the shortest drive route, and log visits.",            guide:"Territory Map"},
  {href:"/admin/call-list.html",           label:"Who to Call Today",      icon:"📞", desc:"Your ranked daily worklist — carts, overdue reorders and dormant accounts.",            guide:"Who to Call"},
  {href:"/admin/health.html",              label:"Dealer Health",          icon:"❤️", desc:"Every account scored on recency, rhythm & trend — spot at-risk dealers early.",          guide:"Dealer Health"},
  {href:"/admin/command-center-360.html",  label:"Command Center 360",     icon:"📊", desc:"Drill your territory's numbers — manufacturer, dealer, product, order.",                 guide:"Command Center 360"},
  {href:"/admin/pipeline.html",            label:"Pipeline",               icon:"🔮", desc:"Track open deals by stage and see your weighted pipeline.",                             guide:"Pipeline"},
  {href:"/admin/tasks.html",               label:"My Tasks",               icon:"✅", desc:"Your follow-up queue — auto-generated from signals plus tasks you add.",                guide:"My Tasks"},
  {href:"/admin/reps.html",                label:"My Performance",         icon:"🏆", desc:"Your sales vs. target, YoY, momentum and account health at a glance.",                 guide:"Rep Performance & Goals"},
  {href:"/admin/my-commissions.html",      label:"My Commissions",         icon:"💰", desc:"Your commissions and sales by month, manufacturer line and dealer.",                    guide:"My Commissions"}
];
const gkey=t=>"g-"+t.href.replace(/[^a-z0-9]+/gi,"-");

function render(){
  const name=(ME&&(ME.name||ME.rep_name||ME.email))||"there";
  const first=String(name).split(/[\s@]/)[0];
  const G=(window.HUB_GUIDE)||{};

  const tiles=TOOLS.map(t=>`<a class="tile" href="${t.href}">
      <div class="ti">${t.icon}</div>
      <div class="tn">${esc(t.label)}</div>
      <div class="td">${esc(t.desc)}</div>
      ${G[t.guide]?`<a class="tg" href="#${gkey(t)}" onclick="event.stopPropagation()">How to use ▸</a>`:""}
    </a>`).join("");

  const cards=TOOLS.map(t=>{
    const g=G[t.guide]; if(!g) return "";
    const feats=(g.features||[]).slice(0,4).map(f=>`<li>${esc(f)}</li>`).join("");
    const acts=(g.actions||[]).slice(0,4).map(a=>`<li>${esc(a)}</li>`).join("");
    return `<div class="tcard" id="${gkey(t)}">
      <h3>${t.icon} ${esc(t.label)}</h3>
      ${g.tagline?`<div class="tag">${esc(g.tagline)}</div>`:""}
      ${g.what?`<p>${esc(g.what)}</p>`:""}
      ${feats?`<div class="lbl">What it gives you</div><ul>${feats}</ul>`:""}
      ${acts?`<div class="lbl">What you can do</div><ul>${acts}</ul>`:""}
      ${g.workflow?`<div class="lbl">How to work it</div><p>${esc(g.workflow)}</p>`:""}
      <a class="open" href="${t.href}">Open ${esc(t.label)} ▸</a>
    </div>`;
  }).join("");

  $("#body").innerHTML=`
    <div class="hero">
      <h1>Welcome back, ${esc(first)}.</h1>
      <div class="sub">This is your sales workspace — everything for your territory in one place. Start with today's calls, then work your accounts in Dealer 360.</div>
      <a class="myroutes" href="/my-routes">
        <span class="mr-ico">🚗</span>
        <span class="mr-txt"><b>My Routes</b><i id="mr-sub">Today's stops, addresses and drive times</i></span>
        <span class="mr-go">›</span>
      </a>
      <div class="today" id="today">
        <a class="tpill" href="/admin/call-list.html">📞 <span>Who to call today</span></a>
        <a class="tpill" href="/admin/tasks.html"><b id="tk">·</b> <span>Open tasks</span></a>
        <a class="tpill" href="/admin/map.html">🗺️ <span>Plan a route</span></a>
        <a class="tpill" href="/admin/health.html">❤️ <span>Review dealer health</span></a>
        <a class="tpill" href="/admin/rep-training.html">🎓 <span>Training center</span></a>
      </div>
      <div style="margin-top:14px"><button class="tourbtn" onclick="startTour()">🧭 Take the 2-minute tour</button></div>
    </div>

    <div class="sec-h"><h2>How it all works</h2><span class="hint">— your day, in the platform</span></div>
    <div class="flow">
      <div class="fstep"><div class="num">1</div><div class="ft">Sign in → land here</div><div class="fd">Your portal opens to everything for your territory — all scoped to your accounts.</div></div>
      <div class="fstep"><div class="num">2</div><div class="ft">Start with Who to Call</div><div class="fd">A ranked list of who needs you today: carts, overdue reorders, dormant and new accounts.</div></div>
      <div class="fstep"><div class="num">3</div><div class="ft">Work accounts in Dealer 360</div><div class="fd">Open each dealer, log the touch, add notes, keep contacts current. Your home base.</div></div>
      <div class="fstep"><div class="num">4</div><div class="ft">Plan your week on the map</div><div class="fd">Territory Map optimizes your drive, saves the trip, and logs visits as you go.</div></div>
      <div class="fstep"><div class="num">5</div><div class="ft">Keep health out of the red</div><div class="fd">Dealer Health flags accounts slipping — reach out before they go cold.</div></div>
      <div class="fstep"><div class="num">6</div><div class="ft">Close the loop &amp; track results</div><div class="fd">Finish tasks, move pipeline deals, and watch your numbers in My Performance &amp; Commissions.</div></div>
    </div>

    <div class="sec-h"><h2>Your tools</h2><span class="hint">— everything below is scoped to your assigned accounts</span></div>
    <div class="tiles">${tiles}</div>

    <div class="sec-h"><h2>Training &amp; how-to</h2><span class="hint">— how each tool helps you grow your territory</span><a href="/admin/rep-training.html" style="margin-left:auto;font-size:12.5px;font-weight:700;color:var(--orange,#e07b00);text-decoration:none">Open full Training Center ▸</a></div>
    <div class="hint" style="margin:-2px 0 12px">New here? Read these top to bottom. The short version: review <b>Who to Call</b> each morning, open accounts in <b>Dealer 360</b> to log touches, add notes and contacts, plan your week in <b>Territory Map</b>, keep <b>Dealer Health</b> out of the red, and close the loop in <b>My Tasks</b>.</div>
    <div class="train">${cards||'<div class="hint">Training content is loading — refresh if this stays empty.</div>'}</div>
  `;
  loadToday();
}

function startTour(){ var n=0; (function t(){ if(window.HCPSTour){ HCPSTour.start("rep-home"); } else if(n++<25){ setTimeout(t,150); } })(); }
function loadToday(){
  if(!TOKEN) return;
  fetch("/.netlify/functions/crm-api",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+TOKEN},body:JSON.stringify({action:"task_count"})})
    .then(r=>r.json()).then(j=>{ const el=$("#tk"); if(el) el.textContent=(j&&j.ok)?String(j.count):"·"; }).catch(()=>{});
}

if(!TOKEN){ location.replace("/admin/rep-login.html"); }
else { render(); }
</script>
</body></html>
